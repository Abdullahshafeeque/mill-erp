// STORE & MATERIALS
// ══════════════════════════════════════════════════════════
function Store(){
  const CATS=['Packaging','Spare Parts','Lubricants / Oils','Chemicals','Electrical','Hardware','Miscellaneous'];
  const [items,setItems]=useState([]);
  const [showForm,setShowForm]=useState(false);
  const [showTxn,setShowTxn]=useState(null);
  const [txnForm,setTxnForm]=useState({type:'Received',qty:'',notes:'',date:today});
  const [saving,setSaving]=useState(false);
  const [loading,setLoading]=useState(true);
  const [filterCat,setFilterCat]=useState('All');
  const blank={item_name:'',category:'Packaging',unit:'Nos',qty:0,min_qty:0,notes:''};
  const [form,setForm]=useState(blank);
  const f=(k,v)=>setForm(p=>({...p,[k]:v}));

  useEffect(()=>{
    sb.from('store_stock').select('*').order('category').then(({data})=>{setItems(data||[]);setLoading(false);});
  },[]);

  const saveItem=async()=>{
    if(!form.item_name) return alert('Item name required.');
    setSaving(true);
    const {data,error}=await sb.from('store_stock').insert(form).select().single();
    if(error){alert(error.message);setSaving(false);return;}
    setItems(p=>[...p,data]); setForm(blank); setShowForm(false); setSaving(false);
    logActivity('Store','create',`New item — ${form.item_name}`);
  };

  const doTxn=async(item)=>{
    if(!txnForm.qty||Number(txnForm.qty)<=0) return alert('Enter quantity.');
    setSaving(true);
    const delta=txnForm.type==='Received'?Number(txnForm.qty):-Number(txnForm.qty);
    const newQty=Math.max(0,item.qty+delta);
    await sb.from('store_stock').update({qty:newQty,updated_at:new Date().toISOString()}).eq('id',item.id);
    await sb.from('store_transactions').insert({item_id:item.id,date:txnForm.date,txn_type:txnForm.type,qty:Number(txnForm.qty),notes:txnForm.notes});
    setItems(p=>p.map(x=>x.id===item.id?{...x,qty:newQty}:x));
    setShowTxn(null); setTxnForm({type:'Received',qty:'',notes:'',date:today}); setSaving(false);
    logActivity('Store','update',`${item.item_name} — ${txnForm.type} ${txnForm.qty}`);
  };

  if(loading) return <Loading/>;
  const cats=['All',...CATS];
  const filtered=filterCat==='All'?items:items.filter(x=>x.category===filterCat);

  return(<div className="page">
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:24,flexWrap:'wrap',gap:12}}>
      <div className="page-header" style={{marginBottom:0}}>
        <div className="page-label">Inventory</div>
        <div className="page-title">Store & materials</div>
      </div>
      <button className="btn btn-amber" onClick={()=>setShowForm(v=>!v)}>+ Add item</button>
    </div>

    {showForm&&(
      <FormCard title="Add store item" col="var(--amber)" onSave={saveItem} onCancel={()=>setShowForm(false)} saving={saving}>
        <div className="form-grid">
          <Field label="Item name ★"><input className="form-input" value={form.item_name} onChange={e=>f('item_name',e.target.value)}/></Field>
          <Field label="Category"><select className="form-input" value={form.category} onChange={e=>f('category',e.target.value)}>{CATS.map(c=><option key={c}>{c}</option>)}</select></Field>
          <Field label="Unit"><input className="form-input" value={form.unit} onChange={e=>f('unit',e.target.value)}/></Field>
          <Field label="Current qty"><input type="number" className="form-input" value={form.qty} onChange={e=>f('qty',Number(e.target.value))}/></Field>
          <Field label="Min. alert qty"><input type="number" className="form-input" value={form.min_qty} onChange={e=>f('min_qty',Number(e.target.value))}/></Field>
          <Field label="Notes"><input className="form-input" value={form.notes} onChange={e=>f('notes',e.target.value)}/></Field>
        </div>
      </FormCard>
    )}

    <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:16}}>
      {cats.map(c=><button key={c} className={`btn btn-sm ${filterCat===c?'btn-amber':'btn-ghost'}`} onClick={()=>setFilterCat(c)}>{c}</button>)}
    </div>

    <TableWrap><table>
      <thead><tr><th>Item</th><th>Category</th><th>Qty</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody>
        {filtered.length===0&&<tr><td colSpan={5}><Empty/></td></tr>}
        {filtered.map(item=>{
          const st=item.qty===0?'Out':item.min_qty>0&&item.qty<=item.min_qty?'Low':'OK';
          const col=st==='Out'?'var(--red)':st==='Low'?'var(--amber)':'var(--green)';
          return(<tr key={item.id}>
            <td><strong>{item.item_name}</strong></td>
            <td><span className="badge badge-muted">{item.category}</span></td>
            <td><strong style={{color:col,fontFamily:'var(--mono)'}}>{item.qty} {item.unit}</strong></td>
            <td><span className="badge" style={{background:col+'20',color:col}}>{st}</span></td>
            <td>
              <button className="btn btn-green btn-sm" onClick={()=>setShowTxn(item.id)}>+ / −</button>
              {showTxn===item.id&&(
                <div style={{marginTop:8,padding:12,background:'var(--surface2)',borderRadius:6,border:'1px solid var(--border)'}}>
                  <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'flex-end'}}>
                    <select style={{width:110}} value={txnForm.type} onChange={e=>setTxnForm(p=>({...p,type:e.target.value}))}>
                      <option>Received</option><option>Used / Issued</option><option>Damaged</option><option>Returned</option>
                    </select>
                    <input type="number" style={{width:80}} value={txnForm.qty} onChange={e=>setTxnForm(p=>({...p,qty:e.target.value}))}/>
                    <input type="date" style={{width:130}} value={txnForm.date} onChange={e=>setTxnForm(p=>({...p,date:e.target.value}))}/>
                    <button className="btn btn-green btn-sm" onClick={()=>doTxn(item)} disabled={saving}>Save</button>
                    <button className="btn btn-ghost btn-sm" onClick={()=>setShowTxn(null)}>Cancel</button>
                  </div>
                </div>
              )}
            </td>
          </tr>);
        })}
      </tbody>
    </table></TableWrap>
  </div>);
}

// DAILY CASH BOOK
// ══════════════════════════════════════════════════════════
function Ledger(){
  const LEDGER_TYPES=['Sales Receipt','Wheat Purchase','Packing Material Purchase','Salary / Wages','Fuel / Transport','Repairs & Maintenance','Electricity','Supplyco Payment Received','Supplier Payment','Daily Expenses','Loan / Advance','Other Income','Other Expense'];

  const [entries,setEntries]=useState([]);
  const [showForm,setShowForm]=useState(false);
  const [saving,setSaving]=useState(false);
  const [loading,setLoading]=useState(true);
  const [filterDate,setFilterDate]=useState(today);
  const blank={date:today,txn_type:'Sales Receipt',amount:'',party_name:'',description:'',payment_mode:'Cash',reference_no:''};
  const [form,setForm]=useState(blank);
  const f=(k,v)=>setForm(p=>({...p,[k]:v}));

  const load=useCallback(async()=>{
    setLoading(true);
    const {data}=await sb.from('daily_ledger').select('*').gte('date',monthStart).order('date',{ascending:false}).order('created_at',{ascending:false});
    setEntries(data||[]); setLoading(false);
  },[]);
  useEffect(()=>{load();},[load]);

  const save=async()=>{
    if(!form.amount||Number(form.amount)<=0) return alert('Enter amount.');
    setSaving(true);
    const isIn=incomeTypes.includes(form.txn_type);
    const row={...form,amount:Number(form.amount),direction:isIn?'in':'out'};
    const {data,error}=await sb.from('daily_ledger').insert(row).select().single();
    if(error){alert(error.message);setSaving(false);return;}
    setEntries(p=>[data,...p]); setForm(blank); setShowForm(false); setSaving(false);
    logActivity('Ledger','create',`${form.txn_type} — ₹${form.amount}`);
  };

  const del=async(id)=>{
    if(!confirm('Delete this entry?')) return;
    await sb.from('daily_ledger').delete().eq('id',id);
    setEntries(p=>p.filter(x=>x.id!==id));
    logActivity('Ledger','delete',`Entry deleted`);
  };

  if(loading) return <Loading/>;

  const dayEntries=entries.filter(e=>e.date===filterDate);
  const dayIn=dayEntries.filter(e=>e.direction==='in').reduce((s,e)=>s+Number(e.amount),0);
  const dayOut=dayEntries.filter(e=>e.direction==='out').reduce((s,e)=>s+Number(e.amount),0);
  const monthIn=entries.filter(e=>e.direction==='in').reduce((s,e)=>s+Number(e.amount),0);
  const monthOut=entries.filter(e=>e.direction==='out').reduce((s,e)=>s+Number(e.amount),0);

  return(<div className="page">
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:24,flexWrap:'wrap',gap:12}}>
      <div className="page-header" style={{marginBottom:0}}>
        <div className="page-label">Finance</div>
        <div className="page-title">Daily cash book</div>
      </div>
      <button className="btn btn-green" onClick={()=>setShowForm(v=>!v)}>+ New entry</button>
    </div>

    <div className="stat-grid" style={{gridTemplateColumns:'repeat(auto-fit,minmax(130px,1fr))'}}>
      <StatCard label="Today in" value={'₹'+fmt(dayIn)} col="var(--green)"/>
      <StatCard label="Today out" value={'₹'+fmt(dayOut)} col="var(--red)"/>
      <StatCard label="Today balance" value={'₹'+fmt(dayIn-dayOut)} col={dayIn-dayOut>=0?'var(--green)':'var(--red)'}/>
      <StatCard label="Month in" value={'₹'+fmt(monthIn)} col="var(--blue)"/>
      <StatCard label="Month out" value={'₹'+fmt(monthOut)} col="var(--amber)"/>
      <StatCard label="Month balance" value={'₹'+fmt(monthIn-monthOut)} col={monthIn-monthOut>=0?'var(--green)':'var(--red)'}/>
    </div>

    {showForm&&(
      <FormCard title="New cash book entry" col="var(--green)" onSave={save} onCancel={()=>setShowForm(false)} saving={saving}>
        <div className="form-grid">
          <Field label="Date"><input type="date" className="form-input" value={form.date} max={today} onChange={e=>f('date',e.target.value)}/></Field>
          <Field label="Transaction type">
            <select className="form-input" value={form.txn_type} onChange={e=>f('txn_type',e.target.value)}>
              <optgroup label="— Money In">{incomeTypes.map(t=><option key={t}>{t}</option>)}</optgroup>
              <optgroup label="— Money Out">{LEDGER_TYPES.filter(t=>!incomeTypes.includes(t)).map(t=><option key={t}>{t}</option>)}</optgroup>
            </select>
          </Field>
          <Field label="Amount (₹) ★"><input type="number" className="form-input" style={{fontWeight:600}} value={form.amount} onChange={e=>f('amount',e.target.value)}/></Field>
          <Field label="Party name"><input className="form-input" value={form.party_name} onChange={e=>f('party_name',e.target.value)}/></Field>
          <Field label="Description"><input className="form-input" value={form.description} onChange={e=>f('description',e.target.value)}/></Field>
          <Field label="Payment mode">
            <select className="form-input" value={form.payment_mode} onChange={e=>f('payment_mode',e.target.value)}>
              <option>Cash</option><option>Bank Transfer</option><option>Cheque</option><option>UPI</option><option>Other</option>
            </select>
          </Field>
          <Field label="Reference no."><input className="form-input" value={form.reference_no} onChange={e=>f('reference_no',e.target.value)}/></Field>
        </div>
      </FormCard>
    )}

    <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16,flexWrap:'wrap'}}>
      <div className="form-label">Filter by date:</div>
      <input type="date" value={filterDate} max={today} onChange={e=>setFilterDate(e.target.value)} style={{width:160}}/>
    </div>

    <TableWrap><table>
      <thead><tr><th>Date</th><th>Type</th><th>Flow</th><th>Amount</th><th>Party</th><th>Mode</th><th></th></tr></thead>
      <tbody>
        {dayEntries.length===0&&<tr><td colSpan={7}><Empty msg="No entries for this date."/></td></tr>}
        {dayEntries.map(e=>{
          const isIn=e.direction==='in';
          return(<tr key={e.id}>
            <td className="mono dim">{e.date}</td>
            <td>{e.txn_type}</td>
            <td><span className={`badge badge-${isIn?'green':'red'}`}>{isIn?'↑ IN':'↓ OUT'}</span></td>
            <td><strong style={{color:isIn?'var(--green)':'var(--red)',fontFamily:'var(--mono)'}}>₹{fmt(e.amount)}</strong></td>
            <td>{e.party_name||'—'}</td>
            <td className="dim">{e.payment_mode}</td>
            <td><button className="btn btn-red btn-sm" onClick={()=>del(e.id)}>✕</button></td>
          </tr>);
        })}
      </tbody>
    </table></TableWrap>
  </div>);
}

// ══════════════════════════════════════════════════════════
// RECONCILIATION
// ══════════════════════════════════════════════════════════
function Reconciliation(){
  const now=new Date();
  const [month,setMonth]=useState(now.getMonth()+1);
  const [year,setYear]=useState(now.getFullYear());
  const [data,setData]=useState(null);
  const [loading,setLoading]=useState(false);
  const [finishedProducts,setFinishedProducts]=useState([]);

  useEffect(()=>{
    sb.from('product_master').select('*').eq('is_raw_material',false).eq('is_active',true).then(({data})=>setFinishedProducts(data||[]));
  },[]);

  const generate=async()=>{
    setLoading(true);
    const ms=String(month).padStart(2,'0');
    const start=`${year}-${ms}-01`;
    const endDt=new Date(year,month,0);
    const end=`${year}-${ms}-${String(endDt.getDate()).padStart(2,'0')}`;
    const [{data:prod},{data:disp},{data:wheat}]=await Promise.all([
      sb.from('production_log').select('*, product:product_id(*)').gte('date',start).lte('date',end),
      sb.from('supplyco_dispatches').select('*, product:product_id(*)').gte('date',start).lte('date',end),
      sb.from('fci_inwards').select('*, material:material_id(*)').gte('date',start).lte('date',end),
    ]);

    const schemes=Array.from(new Set([...(prod||[]).map(p=>schemeFromName(p.product?.product_name)),...(disp||[]).map(d=>d.scheme)].filter(Boolean)));
    const bySchemeStats=schemes.map(scheme=>{
      const prodRows=(prod||[]).filter(p=>schemeFromName(p.product?.product_name)===scheme);
      const prodBags=prodRows.reduce((s,r)=>s+Number(r.qty_produced),0);
      const dispRows=(disp||[]).filter(d=>d.scheme===scheme);
      const dispBags=dispRows.reduce((s,r)=>s+Number(r.qty_bags),0);
      const productName=prodRows[0]?.product?.product_name||dispRows[0]?.product?.product_name||scheme;
      return{scheme,productName,prodBags,dispBags,balanceBags:prodBags-dispBags};
    });

    const wheatRec=(wheat||[]).reduce((s,r)=>s+Number(r.received_kg),0);

    setData({bySchemeStats,wheatRec});
    setLoading(false);
  };

  const monthName=new Date(year,month-1,1).toLocaleString('en-IN',{month:'long',year:'numeric'});

  return(<div className="page">
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:24,flexWrap:'wrap',gap:12}}>
      <div className="page-header" style={{marginBottom:0}}>
        <div className="page-label">Compliance</div>
        <div className="page-title">Monthly reconciliation</div>
      </div>
      <div style={{display:'flex',gap:8,alignItems:'flex-end',flexWrap:'wrap'}}>
        <select style={{width:130}} value={month} onChange={e=>setMonth(Number(e.target.value))}>
          {[...Array(12)].map((_,i)=><option key={i+1} value={i+1}>{new Date(2000,i,1).toLocaleString('en-IN',{month:'long'})}</option>)}
        </select>
        <select style={{width:90}} value={year} onChange={e=>setYear(Number(e.target.value))}>{[2024,2025,2026,2027].map(y=><option key={y}>{y}</option>)}</select>
        <button className="btn btn-blue" onClick={generate} disabled={loading}>{loading?'Calculating…':'Generate'}</button>
      </div>
    </div>

    {!data&&<div className="card" style={{textAlign:'center',padding:40,color:'var(--muted)'}}>Select month and year, then click Generate.</div>}

    {data&&(<>
      <div style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--muted)',marginBottom:16}}>RECONCILIATION — {monthName.toUpperCase()}</div>
      <div className="card" style={{marginBottom:16,borderLeft:'3px solid var(--amber)'}}>
        <div className="section-label">Wheat received this month</div>
        <div style={{fontSize:24,fontWeight:600,color:'var(--blue)'}}>{fmtMT(data.wheatRec)}</div>
      </div>
      {data.bySchemeStats.map(s=>(
        <div key={s.scheme} className="card" style={{marginBottom:14,borderLeft:'3px solid var(--blue)'}}>
          <div style={{display:'flex',justifyContent:'space-between',flexWrap:'wrap',gap:8}}>
            <div className="section-label" style={{marginBottom:0}}>{s.scheme} — {s.productName}</div>
            <div style={{display:'flex',gap:10,fontFamily:'var(--mono)',fontSize:12}}>
              <span>Produced: {fmt(s.prodBags)} bags</span><span>·</span>
              <span style={{color:'var(--green)'}}>Dispatched: {fmt(s.dispBags)} bags</span><span>·</span>
              <span style={{color:s.balanceBags>0?'var(--red)':'var(--green)'}}>Balance: {fmt(s.balanceBags)}</span>
            </div>
          </div>
        </div>
      ))}
      {data.bySchemeStats.length===0&&<Empty msg="No scheme activity this month."/>}
    </>)}
  </div>);
}

// ══════════════════════════════════════════════════════════
// ACTIVITY LOG
// ══════════════════════════════════════════════════════════
function ActivityLog(){
  const [logs,setLogs]=useState([]);
  const [loading,setLoading]=useState(true);
  const [filterSection,setFilterSection]=useState('All');

  useEffect(()=>{
    sb.from('activity_log').select('*').order('created_at',{ascending:false}).limit(500).then(({data})=>{setLogs(data||[]);setLoading(false);});
  },[]);

  if(loading) return <Loading/>;
  const sections=['All',...Array.from(new Set(logs.map(l=>l.section)))];
  const filtered=filterSection==='All'?logs:logs.filter(l=>l.section===filterSection);
  const actionCol=(a)=>a==='create'?'var(--green)':a==='delete'?'var(--red)':'var(--amber)';

  return(<div className="page">
    <div className="page-header"><div className="page-label">System</div><div className="page-title">Activity log</div></div>
    <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:16}}>
      {sections.map(s=><button key={s} className={`btn btn-sm ${filterSection===s?'btn-amber':'btn-ghost'}`} onClick={()=>setFilterSection(s)}>{s}</button>)}
    </div>
    <TableWrap><table>
      <thead><tr><th>Time</th><th>User</th><th>Section</th><th>Action</th><th>Details</th></tr></thead>
      <tbody>
        {filtered.length===0&&<tr><td colSpan={5}><Empty msg="No activity recorded yet."/></td></tr>}
        {filtered.map(l=>(<tr key={l.id}>
          <td className="mono dim">{new Date(l.created_at).toLocaleString('en-IN')}</td>
          <td className="dim">{l.user_email}</td>
          <td><span className="badge badge-blue">{l.section}</span></td>
          <td><span className="badge" style={{background:actionCol(l.action)+'20',color:actionCol(l.action)}}>{l.action}</span></td>
          <td className="dim">{l.details}</td>
        </tr>))}
      </tbody>
    </table></TableWrap>
  </div>);
}

// ══════════════════════════════════════════════════════════
// DASHBOARD
// ══════════════════════════════════════════════════════════
function Dashboard(){
  const [products,setProducts]=useState([]);
  const [currentStock,setCurrentStock]=useState([]);
  const [prod,setProd]=useState([]);
  const [disp,setDisp]=useState([]);
  const [ledger,setLedger]=useState([]);
  const [storeItems,setStoreItems]=useState([]);
  const [loading,setLoading]=useState(true);

  useEffect(()=>{
    Promise.all([
      sb.from('product_master').select('*').eq('is_active',true),
      sb.from('current_stock').select('*'),
      sb.from('production_log').select('*, product:product_id(*)').gte('date',monthStart),
      sb.from('supplyco_dispatches').select('*').gte('date',monthStart),
      sb.from('daily_ledger').select('*').gte('date',monthStart),
      sb.from('store_stock').select('*'),
    ]).then(([{data:p},{data:cs},{data:pr},{data:d},{data:l},{data:st}])=>{
      setProducts(p||[]); setCurrentStock(cs||[]); setProd(pr||[]); setDisp(d||[]); setLedger(l||[]);
      setStoreItems((st||[]).filter(x=>x.min_qty>0 && x.qty<x.min_qty));
      setLoading(false);
    });
  },[]);

  if(loading) return <Loading/>;

  const prodMT=prod.reduce((s,r)=>s+(Number(r.qty_produced)*packSizeOf(r.product)),0)/1000;
  const dispBags=disp.reduce((s,r)=>s+Number(r.qty_bags),0);
  const cashIn=ledger.filter(r=>['Sales Receipt','Supplyco Payment Received','Other Income','Loan / Advance'].includes(r.txn_type)).reduce((s,r)=>s+Number(r.amount),0);
  const cashOut=ledger.filter(r=>!['Sales Receipt','Supplyco Payment Received','Other Income','Loan / Advance'].includes(r.txn_type)).reduce((s,r)=>s+Number(r.amount),0);

  const stockWithLevels=products.filter(p=>!p.is_raw_material).map(p=>{
    const row=currentStock.find(r=>r.product_id===p.id);
    return{product:p,qty:row?.qty_bags||0};
  });
  const stockAlerts=stockWithLevels.filter(r=>r.product.min_stock_alert>0 && r.product.max_stock_alert>0 && r.qty>r.product.min_stock_alert && r.qty<r.product.max_stock_alert);

  return(<div className="page">
    <div className="page-header">
      <div className="page-label">Mill Operations · {today}</div>
      <div className="page-title">Good day — here's your mill</div>
    </div>

    <div className="stat-grid">
      <StatCard label="Produced this month" value={prodMT.toFixed(3)+' MT'} sub="all products" col="var(--amber)"/>
      <StatCard label="Dispatched this month" value={fmt(dispBags)+' bags'} sub="to Supplyco" col="var(--green)"/>
      <StatCard label="Cash in (month)" value={'₹'+fmt(cashIn)} col="var(--green)"/>
      <StatCard label="Cash out (month)" value={'₹'+fmt(cashOut)} col="var(--red)"/>
    </div>

    <div style={{marginBottom:24}}>
      <div className="section-label">Alerts</div>
      {stockAlerts.map(r=>(
        <Alert key={r.product.id} type="amber" icon="⚠" title={`${r.product.product_name} — ${fmt(r.qty)} bags, within watch range`} sub={`Between min (${fmt(r.product.min_stock_alert)}) and max (${fmt(r.product.max_stock_alert)})`}/>
      ))}
      {storeItems.map(r=>(
        <Alert key={r.id} type="amber" icon="⚠" title={`${r.item_name} — only ${r.qty} ${r.unit} left`} sub={`Minimum: ${r.min_qty} ${r.unit}`}/>
      ))}
      {stockAlerts.length===0&&storeItems.length===0&&<Alert type="green" icon="✓" title="No urgent alerts today."/>}
    </div>

    <div className="card">
      <div className="section-label">Finished stock position</div>
      {stockWithLevels.filter(r=>r.qty>0).map(r=>{
        const max=Math.max(...stockWithLevels.map(x=>x.qty),1);
        const col=r.product.min_stock_alert>0&&r.qty<r.product.min_stock_alert?'var(--amber)':'var(--green)';
        return(<div key={r.product.id} style={{marginBottom:12}}>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:13}}>
            <span>{r.product.product_name}</span><span style={{color:col,fontWeight:600}}>{fmt(r.qty)} bags</span>
          </div>
          <div style={{height:4,background:'var(--border)',borderRadius:2,marginTop:4}}>
            <div style={{height:4,width:Math.min(100,(r.qty/max)*100)+'%',background:col,borderRadius:2}}/>
          </div>
        </div>);
      })}
      {stockWithLevels.filter(r=>r.qty>0).length===0&&<Empty msg="No finished-goods stock yet."/>}
    </div>
  </div>);
}

// ══════════════════════════════════════════════════════════
// APP ROOT
// ══════════════════════════════════════════════════════════
function App(){
  const [user,setUser]=useState(null);
  const [tab,setTab]=useState('dashboard');
  const [authLoading,setAuthLoading]=useState(true);

  useEffect(()=>{
    sb.auth.getSession().then(({data:{session}})=>{setUser(session?.user??null);setAuthLoading(false);});
    sb.auth.onAuthStateChange((_,session)=>setUser(session?.user??null));
  },[]);

  if(authLoading) return <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',color:'var(--muted)'}}>loading…</div>;
  if(!user) return <Login onLogin={setUser}/>;

  const VIEWS={
    'dashboard':<Dashboard/>,
    'production':<Production/>,
    'dispatch':<Dispatch/>,
    'private-dispatch':<PrivateDispatch/>,
    'fci-inwards':<FciInwards/>,
    'private-inwards':<PrivateInwards/>,
    'reconciliation':<Reconciliation/>,
    'all-stock':<AllStock/>,
    'store':<Store/>,
    'ledger':<Ledger/>,
    'product-master':<ProductMaster/>,
    'product-recipes':<ProductRecipes/>,
    'activity-log':<ActivityLog/>,
  };

  return(<div className="app">
    <div className="sidebar">
      <div className="sidebar-logo">
        <div className="mill-name">PRFM</div>
        <div className="mill-sub">Mill Operations</div>
      </div>
      {NAV.map((item,i)=>{
        if(item.section) return <div key={i} className="sidebar-section">{item.section}</div>;
        return(<button key={item.id} className={`nav-btn${tab===item.id?' active':''}`} onClick={()=>setTab(item.id)}>
          <span className="icon">{item.icon}</span>{item.label}
        </button>);
      })}
      <div className="sidebar-footer">
        <button className="btn btn-ghost btn-sm" style={{width:'100%',marginBottom:8}} onClick={()=>window.open(HR_APP_URL,'_blank')}>👥 HR Portal ↗</button>
        <button className="btn btn-ghost btn-sm" style={{width:'100%'}} onClick={()=>sb.auth.signOut()}>Sign out</button>
      </div>
    </div>
    <div className="main">{VIEWS[tab]||<Dashboard/>}</div>
  </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
