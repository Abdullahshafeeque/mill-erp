<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PRFM Mill Operations</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:       #F3F4F6;
    --surface:  #FFFFFF;
    --surface2: #F9FAFB;
    --border:   #E5E7EB;
    --border2:  #D1D5DB;
    --text:     #111827;
    --muted:    #6B7280;
    --dim:      #9CA3AF;
    --amber:    #D97706;
    --green:    #059669;
    --red:      #DC2626;
    --blue:     #2563EB;
    --purple:   #7C3AED;
    --mono:     'IBM Plex Mono', monospace;
    --sans:     'IBM Plex Sans', sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root { height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.5; }
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: var(--surface); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
  input, select, textarea { font-family: var(--sans); font-size: 13px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 5px; padding: 7px 10px; outline: none; transition: border-color .15s; }
  input:focus, select:focus, textarea:focus { border-color: var(--blue); }
  select option { background: var(--surface); color: var(--text); }
  button { font-family: var(--sans); cursor: pointer; }
  table { width: 100%; border-collapse: collapse; }
  th { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); font-weight: 500; }
  td { padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface2); }

  /* Layout */
  .app { display: flex; height: 100vh; overflow: hidden; }
  .sidebar { width: 220px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; }
  .main { flex: 1; overflow-y: auto; }

  /* Sidebar */
  .sidebar-logo { padding: 20px 16px 16px; border-bottom: 1px solid var(--border); }
  .sidebar-logo .mill-name { font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .15em; color: var(--amber); text-transform: uppercase; }
  .sidebar-logo .mill-sub  { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .sidebar-section { padding: 16px 10px 4px; font-family: var(--mono); font-size: 9px; letter-spacing: .15em; color: var(--dim); text-transform: uppercase; }
  .nav-btn { display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 12px; border: none; background: transparent; color: var(--muted); font-size: 13px; border-radius: 6px; margin: 1px 4px; width: calc(100% - 8px); text-align: left; transition: all .12s; }
  .nav-btn:hover  { background: var(--surface2); color: var(--text); }
  .nav-btn.active { background: var(--amber)18; color: var(--amber); }
  .nav-btn .icon  { font-size: 15px; width: 18px; text-align: center; }
  .sidebar-footer { margin-top: auto; padding: 12px; border-top: 1px solid var(--border); }
  .hr-link-btn { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 12px; border: 1px solid var(--border2); background: transparent; color: var(--muted); font-size: 12px; border-radius: 6px; transition: all .15s; }
  .hr-link-btn:hover { border-color: var(--purple); color: var(--purple); }

  /* Page */
  .page { padding: 28px 28px 60px; max-width: 1100px; }
  .page-header { margin-bottom: 24px; }
  .page-label { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
  .page-title { font-size: 22px; font-weight: 600; color: var(--text); }

  /* Cards & surfaces */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
  .card.amber-l { border-left: 3px solid var(--amber); }
  .card.green-l { border-left: 3px solid var(--green); }
  .card.red-l   { border-left: 3px solid var(--red); }
  .card.blue-l  { border-left: 3px solid var(--blue); }
  .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .section-label { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; margin-bottom: 12px; }

  /* Stat cards */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px 18px; }
  .stat-label { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 6px; }
  .stat-val   { font-size: 24px; font-weight: 600; line-height: 1; }
  .stat-sub   { font-size: 11px; color: var(--muted); margin-top: 4px; }

  /* Buttons */
  .btn { padding: 7px 16px; border-radius: 6px; font-size: 12px; font-weight: 500; border: 1px solid transparent; letter-spacing: .02em; transition: all .12s; }
  .btn-amber  { background: var(--amber)22; color: var(--amber); border-color: var(--amber)44; }
  .btn-amber:hover { background: var(--amber)33; }
  .btn-green  { background: var(--green)22; color: var(--green); border-color: var(--green)44; }
  .btn-green:hover { background: var(--green)33; }
  .btn-red    { background: var(--red)22; color: var(--red); border-color: var(--red)44; }
  .btn-red:hover { background: var(--red)33; }
  .btn-blue   { background: var(--blue)22; color: var(--blue); border-color: var(--blue)44; }
  .btn-blue:hover { background: var(--blue)33; }
  .btn-ghost  { background: transparent; color: var(--muted); border-color: var(--border); }
  .btn-ghost:hover { border-color: var(--border2); color: var(--text); }
  .btn-sm     { padding: 4px 10px; font-size: 11px; }

  /* Forms */
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .form-field { display: flex; flex-direction: column; gap: 4px; }
  .form-label { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  .form-input { width: 100%; }
  .form-actions { display: flex; gap: 8px; margin-top: 16px; }

  /* Badges */
  .badge { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 500; font-family: var(--mono); }
  .badge-amber  { background: var(--amber)20; color: var(--amber); }
  .badge-green  { background: var(--green)20; color: var(--green); }
  .badge-red    { background: var(--red)20;   color: var(--red); }
  .badge-blue   { background: var(--blue)20;  color: var(--blue); }
  .badge-muted  { background: var(--border);  color: var(--muted); }

  /* Alerts */
  .alert { display: flex; gap: 10px; align-items: flex-start; padding: 12px 16px; border-radius: 7px; margin-bottom: 8px; }
  .alert-red    { background: var(--red)12;   border: 1px solid var(--red)30; }
  .alert-amber  { background: var(--amber)12; border: 1px solid var(--amber)30; }
  .alert-green  { background: var(--green)12; border: 1px solid var(--green)30; }
  .alert-icon   { font-size: 15px; flex-shrink: 0; margin-top: 1px; }
  .alert-body   { flex: 1; }
  .alert-title  { font-weight: 500; font-size: 13px; }
  .alert-sub    { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* Misc */
  .divider { height: 1px; background: var(--border); margin: 20px 0; }
  .mono    { font-family: var(--mono); }
  .dim     { color: var(--muted); }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .bar-track { height: 4px; background: var(--border); border-radius: 2px; margin-top: 4px; }
  .bar-fill  { height: 4px; border-radius: 2px; transition: width .3s; }
  .login-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 40px; width: 360px; }

  @media(max-width:700px){
    .sidebar { display: none; }
    .two-col { grid-template-columns: 1fr; }
    .page { padding: 16px 14px 40px; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// ── CONFIG — paste your Supabase credentials here ──────────
const SUPABASE_URL = 'https://ulkvltoctpjydloonwcw.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVsa3ZsdG9jdHBqeWRsb29ud2N3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1NDExNTEsImV4cCI6MjA5MzExNzE1MX0.mWoQUKYCozIA-rROhhCXVE6JoJZEBQTCh3AtqnztW-E';
const HR_APP_URL   = 'https://facility-app-sigma.vercel.app';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function logActivity(section, action, details){
  const {data:{user}} = await sb.auth.getUser();
  const {error} = await sb.from('activity_log').insert({
    user_email: user?.email || 'unknown',
    action, section, details
  });
  if(error) console.error('logActivity failed:', error.message, {section, action, details});
}

// ── CONSTANTS ───────────────────────────────────────────────
const PRODUCTS  = ['NPS Atta','PHH Atta','AAY Atta','Sooji','Maida','Fine Bran','Dust','Feed','Ragi Powder','PU Atta','Broken Wheat','Puttu Podi'];
const PACK_SIZES= {'NPS Atta':50,'PHH Atta':47.5,'AAY Atta':47.5,'Sooji':50,'Maida':50,'Fine Bran':45,'Dust':50,'Feed':50,'Ragi Powder':30,'PU Atta':50,'Broken Wheat':30,'Puttu Podi':1};
const DISTRICTS = ['KNR','TLY','TPB','KHD','KSD','IRTTY','VLPRAMBA','NLSR','MJSR','VKND','OTHER'];
const SCHEMES   = ['NPS','PHH','AAY'];
const STORE_CATS= ['Packaging','Raw Material','Spare Parts','Lubricants / Oils','Chemicals','Electrical','Hardware','Miscellaneous'];
const LEDGER_TYPES = ['Sales Receipt','Wheat Purchase','Packing Material Purchase','Salary / Wages','Fuel / Transport','Repairs & Maintenance','Electricity','Supplyco Payment Received','Supplier Payment','Daily Expenses','Loan / Advance','Other Income','Other Expense'];

const today = (() => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().split('T')[0]; })();
const fmt   = (n,dec=0) => Number(n).toLocaleString('en-IN',{minimumFractionDigits:dec,maximumFractionDigits:dec});
const fmtMT = (kg) => (Number(kg)/1000).toFixed(3)+' MT';
const monthStart = today.slice(0,7)+'-01';

// ── NAV CONFIG ──────────────────────────────────────────────
const NAV = [
  { section:'Mill Operations' },
  { id:'dashboard',     label:'Dashboard',        icon:'⬡' },
  { id:'production',    label:'Production',       icon:'⚙' },
  { id:'dispatch',      label:'Supplyco Dispatch',icon:'🚛' },
  { id:'wheat',         label:'Wheat Inwards',    icon:'🌾' },
  { id:'reconciliation',label:'Reconciliation',   icon:'📊' },
  { section:'Inventory' },
  { id:'flour-stock',   label:'Flour Stock',      icon:'◫' },
  { id:'store',         label:'Store & Materials', icon:'📦' },
  { section:'Finance' },
  { id:'ledger',        label:'Daily Cash Book',  icon:'₹' },
  { section:'Finance' },
  { id:'ledger',        label:'Daily Cash Book',  icon:'₹' },
  { section:'Settings' },                                    // ADD THIS
  { id:'product-master',label:'Product Master',   icon:'⚙️' }, // ADD THIS
  { id:'activity-log',  label:'Activity Log',      icon:'📜' },
];

// ═══════════════════════════════════════════════════════════
// SHARED COMPONENTS
// ═══════════════════════════════════════════════════════════
function StatCard({label,value,sub,col='var(--amber)'}){
  return(
    <div className="stat-card" style={{borderTop:`2px solid ${col}`}}>
      <div className="stat-label">{label}</div>
      <div className="stat-val" style={{color:col}}>{value}</div>
      {sub&&<div className="stat-sub">{sub}</div>}
    </div>
  );
}
function Alert({type='amber',icon,title,sub}){
  return(
    <div className={`alert alert-${type}`}>
      <span className="alert-icon" style={{color:type==='red'?'var(--red)':type==='green'?'var(--green)':'var(--amber)'}}>{icon}</span>
      <div className="alert-body"><div className="alert-title">{title}</div>{sub&&<div className="alert-sub">{sub}</div>}</div>
    </div>
  );
}
function FormCard({title,col='var(--amber)',children,onSave,onCancel,saving}){
  return(
    <div className="card" style={{marginBottom:20,borderColor:col+'44',borderLeftColor:col,borderLeftWidth:3}}>
      <div className="section-label" style={{marginBottom:16}}>{title}</div>
      {children}
      <div className="form-actions">
        <button className="btn btn-green" onClick={onSave} disabled={saving}>{saving?'Saving…':'Save'}</button>
        <button className="btn btn-ghost" onClick={onCancel}>Cancel</button>
      </div>
    </div>
  );
}
function TableWrap({children}){ return <div className="table-wrap" style={{overflowX:'auto'}}>{children}</div>; }
function Field({label,children}){
  return(
    <div className="form-field">
      <div className="form-label">{label}</div>
      {children}
    </div>
  );
}
function Loading(){ return <div style={{padding:60,textAlign:'center',color:'var(--muted)',fontFamily:'var(--mono)',fontSize:13}}>loading…</div>; }
function Empty({msg}){ return <div style={{padding:40,textAlign:'center',color:'var(--muted)',fontSize:13}}>{msg||'No entries yet.'}</div>; }

// ═══════════════════════════════════════════════════════════
// LOGIN
// ═══════════════════════════════════════════════════════════
function Login({onLogin}){
  const [email,setEmail]=useState('');
  const [pass,setPass]=useState('');
  const [err,setErr]=useState('');
  const [loading,setLoading]=useState(false);
  const submit=async()=>{
    setLoading(true); setErr('');
    const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
    if(error) setErr(error.message);
    else onLogin(data.user);
    setLoading(false);
  };
  return(
    <div className="login-wrap">
      <div className="login-card">
        <div style={{fontFamily:'var(--mono)',fontSize:11,letterSpacing:'.15em',color:'var(--amber)',marginBottom:4}}>PRFM</div>
        <div style={{fontSize:20,fontWeight:600,marginBottom:4}}>Mill Operations</div>
        <div style={{fontSize:13,color:'var(--muted)',marginBottom:28}}>Sign in to continue</div>
        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          <input placeholder="Email" value={email} onChange={e=>setEmail(e.target.value)} style={{width:'100%'}} type="email"/>
          <input placeholder="Password" value={pass} onChange={e=>setPass(e.target.value)} style={{width:'100%'}} type="password"
            onKeyDown={e=>e.key==='Enter'&&submit()}/>
          {err&&<div style={{color:'var(--red)',fontSize:12}}>{err}</div>}
          <button className="btn btn-amber" style={{marginTop:4,padding:'10px'}} onClick={submit} disabled={loading}>
            {loading?'Signing in…':'Sign in'}
          </button>
        </div>
        <div style={{marginTop:20,padding:'10px 14px',background:'var(--surface2)',borderRadius:6,fontSize:12,color:'var(--muted)'}}>
          Uses the same login as your HR system.
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
// DASHBOARD
// ═══════════════════════════════════════════════════════════
function Dashboard(){
  const [stock,setStock]=useState([]);
  const [prod,setProd]=useState([]);
  const [disp,setDisp]=useState([]);
  const [ledger,setLedger]=useState([]);
  const [store,setStore]=useState([]);
  const [loading,setLoading]=useState(true);

  useEffect(()=>{
    Promise.all([
      sb.from('current_stock').select('*'),
      sb.from('production_log').select('*').gte('date',monthStart),
      sb.from('supplyco_dispatches').select('*').gte('date',monthStart),
      sb.from('daily_ledger').select('*').gte('date',monthStart),
      sb.from('store_stock').select('*').lt('qty','min_qty'), // low items
    ]).then(([{data:s},{data:p},{data:d},{data:l},{data:st}])=>{
      setStock(s||[]); setProd(p||[]); setDisp(d||[]); setLedger(l||[]); setStore(st||[]);
      setLoading(false);
    });
  },[]);

  if(loading) return <Loading/>;

  const prodMT   = prod.reduce((s,r)=>s+(r.qty_produced*r.pack_size_kg),0)/1000;
  const dispBags = disp.reduce((s,r)=>s+r.qty_bags,0);
  const cashIn   = ledger.filter(r=>['Sales Receipt','Supplyco Payment Received','Other Income'].includes(r.txn_type)).reduce((s,r)=>s+Number(r.amount),0);
  const cashOut  = ledger.filter(r=>!['Sales Receipt','Supplyco Payment Received','Other Income'].includes(r.txn_type)).reduce((s,r)=>s+Number(r.amount),0);

  const stockAlerts = stock.filter(r=>r.min_threshold>0&&r.max_threshold>0&&r.qty_bags>r.min_threshold&&r.qty_bags<r.max_threshold);
  const lowStoreItems = store; // already filtered

  return(
    <div className="page">
      <div className="page-header">
        <div className="page-label">Mill Operations · {today}</div>
        <div className="page-title">Good day — here's your mill</div>
      </div>

      <div className="stat-grid">
        <StatCard label="NPS Atta" value={fmt(stock.find(r=>r.product_type==='NPS Atta')?.qty_bags||0)+' bags'} sub="50 kg bags" col="var(--blue)"/>
        <StatCard label="PHH Atta" value={fmt(stock.find(r=>r.product_type==='PHH Atta')?.qty_bags||0)+' bags'} sub="47.5 kg bags"
          col={(stock.find(r=>r.product_type==='PHH Atta')?.qty_bags||0)<300?'var(--red)':'var(--green)'}/>
        <StatCard label="Produced this month" value={prodMT.toFixed(2)+' MT'} sub="all products" col="var(--amber)"/>
        <StatCard label="Dispatched this month" value={fmt(dispBags)+' bags'} sub="to Supplyco" col="var(--green)"/>
        <StatCard label="Cash in (month)" value={'₹'+fmt(cashIn)} sub="receipts & income" col="var(--green)"/>
        <StatCard label="Cash out (month)" value={'₹'+fmt(cashOut)} sub="expenses & payments" col="var(--red)"/>
      </div>

      {(stockAlerts.length>0||lowStoreItems.length>0)&&(
        <div style={{marginBottom:24}}>
          <div className="section-label">Alerts</div>
          {stockAlerts.map(r=>(
            <Alert key={r.id} type="amber" icon="⚠"
              title={`${r.product_type} — ${fmt(r.qty_bags)} bags, within watch range`}
              sub={`Between min (${fmt(r.min_threshold)}) and max (${fmt(r.max_threshold)}) alert thresholds.`}/>
          ))}
          {lowStoreItems.map(r=>(
            <Alert key={r.id} type="amber" icon="⚠"
              title={`${r.item_name} — only ${r.qty} ${r.unit} left`}
              sub={`Minimum: ${r.min_qty} ${r.unit}. Category: ${r.category}`}/>
          ))}
        </div>
      )}
      {stockAlerts.length===0&&lowStoreItems.length===0&&(
        <Alert type="green" icon="✓" title="All stock levels are above minimum thresholds." sub="No urgent alerts today."/>
      )}

      <div className="two-col" style={{marginTop:24}}>
        <div className="card">
          <div className="section-label">Flour stock position</div>
          {['NPS Atta','PHH Atta','AAY Atta'].map(p=>{
            const row=stock.find(r=>r.product_type===p);
            const bags=row?.qty_bags||0; const thresh=row?.min_threshold||0;
            const col=bags===0?'var(--red)':bags<thresh?'var(--amber)':'var(--green)';
            const max=Math.max(...stock.filter(r=>['NPS Atta','PHH Atta','AAY Atta'].includes(r.product_type)).map(r=>r.qty_bags),1);
            return(
              <div key={p} style={{marginBottom:12}}>
                <div style={{display:'flex',justifyContent:'space-between',fontSize:13}}>
                  <span>{p}</span><span style={{color:col,fontWeight:600}}>{fmt(bags)} bags</span>
                </div>
                <div className="bar-track"><div className="bar-fill" style={{width:Math.min(100,(bags/max)*100)+'%',background:col}}/></div>
              </div>
            );
          })}
          <div className="divider"/>
          <div className="section-label">Other products</div>
          {stock.filter(r=>!['NPS Atta','PHH Atta','AAY Atta'].includes(r.product_type)&&r.qty_bags>0).map(r=>(
            <div key={r.id} style={{display:'flex',justifyContent:'space-between',padding:'5px 0',borderBottom:'1px solid var(--border)',fontSize:13}}>
              <span className="dim">{r.product_type}</span><span style={{fontFamily:'var(--mono)'}}>{fmt(r.qty_bags)}</span>
            </div>
          ))}
        </div>

        <div className="card">
          <div className="section-label">This month — district dispatches</div>
          {DISTRICTS.map(d=>{
            const bags=disp.filter(r=>r.district===d).reduce((s,r)=>s+r.qty_bags,0);
            if(!bags) return null;
            return(
              <div key={d} style={{display:'flex',justifyContent:'space-between',padding:'6px 0',borderBottom:'1px solid var(--border)',fontSize:13}}>
                <span className="mono dim">{d}</span><strong style={{fontFamily:'var(--mono)'}}>{fmt(bags)} bags</strong>
              </div>
            );
          })}
          {disp.length===0&&<Empty msg="No dispatches this month yet."/>}

          <div className="divider"/>
          <div className="section-label">Cash book — this month</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            <div style={{textAlign:'center',padding:'10px',background:'var(--green)12',borderRadius:6,border:'1px solid var(--green)30'}}>
              <div style={{fontSize:10,color:'var(--muted)',fontFamily:'var(--mono)',marginBottom:4}}>TOTAL IN</div>
              <div style={{fontSize:18,fontWeight:600,color:'var(--green)'}}>₹{fmt(cashIn)}</div>
            </div>
            <div style={{textAlign:'center',padding:'10px',background:'var(--red)12',borderRadius:6,border:'1px solid var(--red)30'}}>
              <div style={{fontSize:10,color:'var(--muted)',fontFamily:'var(--mono)',marginBottom:4}}>TOTAL OUT</div>
              <div style={{fontSize:18,fontWeight:600,color:'var(--red)'}}>₹{fmt(cashOut)}</div>
            </div>
          </div>
          <div style={{marginTop:10,textAlign:'center',padding:'8px',background:'var(--surface2)',borderRadius:6}}>
            <span style={{fontSize:11,color:'var(--muted)'}}>Net balance: </span>
            <strong style={{color:cashIn-cashOut>=0?'var(--green)':'var(--red)'}}> ₹{fmt(cashIn-cashOut)}</strong>
          </div>
        </div>
      </div>
    </div>
  );
}

// PRODUCTION
// ═══════════════════════════════════════════════════════════
function Production(){
  const [entries,setEntries]=useState([]);
  const [batches,setBatches]=useState([]);
  const [showForm,setShowForm]=useState(false);
  const [saving,setSaving]=useState(false);
  const [loading,setLoading]=useState(true);
  const blank={date:today,shift:'Morning',product_type:'NPS Atta',pack_size_kg:50,qty_produced:'',wheat_used_kg:'',qty_repacked:0,qty_refeed:0,batch_id:'',notes:''};
  const [form,setForm]=useState(blank);
  const f=(k,v)=>setForm(p=>({...p,[k]:v}));

  const load=useCallback(async()=>{
    setLoading(true);
    const [{data:e},{data:b}]=await Promise.all([
      sb.from('production_log').select('*').gte('date',monthStart).order('date',{ascending:false}),
      sb.from('wheat_receipts').select('*').order('date',{ascending:false}),
    ]);
    setEntries(e||[]); setBatches(b||[]); setLoading(false);
  },[]);

  useEffect(()=>{load();},[load]);

  const save=async()=>{
    if(!form.qty_produced||Number(form.qty_produced)<=0) return alert('Enter bags produced.');
    setSaving(true);
    const row={date:form.date,shift:form.shift,product_type:form.product_type,pack_size_kg:Number(form.pack_size_kg),
      qty_produced:Number(form.qty_produced),qty_repacked:Number(form.qty_repacked)||0,qty_refeed:Number(form.qty_refeed)||0,
      wheat_used_kg:Number(form.wheat_used_kg)||0,batch_id:form.batch_id||null,notes:form.notes};
    const {data,error}=await sb.from('production_log').insert(row).select().single();
    if(error){alert('Error: '+error.message);setSaving(false);return;}
    // update flour stock
    const {data:s}=await sb.from('current_stock').select('qty_bags').eq('product_type',form.product_type).eq('pack_size_kg',Number(form.pack_size_kg)).single();
    if(s) await sb.from('current_stock').update({qty_bags:s.qty_bags+Number(form.qty_produced),updated_at:new Date().toISOString()}).eq('product_type',form.product_type).eq('pack_size_kg',Number(form.pack_size_kg));
    setEntries(p=>[data,...p]); setForm(blank); setShowForm(false); setSaving(false);
    logActivity('Production','create',`${form.product_type} — ${form.qty_produced} bags on ${form.date}`);
  };

  const del=async(e)=>{
    if(!confirm('Delete entry? Stock will be adjusted.')) return;
    await sb.from('production_log').delete().eq('id',e.id);
    const {data:s}=await sb.from('current_stock').select('qty_bags').eq('product_type',e.product_type).eq('pack_size_kg',e.pack_size_kg).single();
    if(s) await sb.from('current_stock').update({qty_bags:Math.max(0,s.qty_bags-e.qty_produced)}).eq('product_type',e.product_type).eq('pack_size_kg',e.pack_size_kg);
    setEntries(p=>p.filter(x=>x.id!==e.id));
    logActivity('Production','delete',`${e.product_type} — ${e.qty_produced} bags on ${e.date}`);
  };

  if(loading) return <Loading/>;

  const byDate={};
  entries.forEach(e=>{if(!byDate[e.date])byDate[e.date]=[];byDate[e.date].push(e);});

  return(
    <div className="page">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:24,flexWrap:'wrap',gap:12}}>
        <div className="page-header" style={{marginBottom:0}}>
          <div className="page-label">Mill Operations</div>
          <div className="page-title">Daily production log</div>
        </div>
        <button className="btn btn-green" onClick={()=>setShowForm(v=>!v)}>+ New entry</button>
      </div>

      {showForm&&(
        <FormCard title="Log production" col="var(--green)" onSave={save} onCancel={()=>setShowForm(false)} saving={saving}>
          <div className="form-grid">
            <Field label="Date"><input type="date" className="form-input" value={form.date} max={today} onChange={e=>f('date',e.target.value)}/></Field>
            <Field label="Shift">
              <select className="form-input" value={form.shift} onChange={e=>f('shift',e.target.value)}>
                {['Morning','Night','Full Day'].map(s=><option key={s}>{s}</option>)}
              </select>
            </Field>
            <Field label="Product">
              <select className="form-input" value={form.product_type} onChange={e=>{f('product_type',e.target.value);f('pack_size_kg',PACK_SIZES[e.target.value]||50);}}>
                {PRODUCTS.map(p=><option key={p}>{p}</option>)}
              </select>
            </Field>
            <Field label="Pack size (kg)"><input type="number" className="form-input" value={form.pack_size_kg} onChange={e=>f('pack_size_kg',e.target.value)}/></Field>
            <Field label="Bags produced ★"><input type="number" className="form-input" style={{fontWeight:600,fontSize:15}} placeholder="e.g. 850" value={form.qty_produced} onChange={e=>f('qty_produced',e.target.value)}/></Field>
            <Field label="Wheat used (kg)"><input type="number" className="form-input" placeholder="e.g. 42500" value={form.wheat_used_kg} onChange={e=>f('wheat_used_kg',e.target.value)}/></Field>
            <Field label="Re-packed (damage)"><input type="number" className="form-input" value={form.qty_repacked} onChange={e=>f('qty_repacked',e.target.value)}/></Field>
            <Field label="Re-feed bags"><input type="number" className="form-input" value={form.qty_refeed} onChange={e=>f('qty_refeed',e.target.value)}/></Field>
            <Field label="Wheat batch">
              <select className="form-input" value={form.batch_id} onChange={e=>f('batch_id',e.target.value)}>
                <option value="">-- Select batch --</option>
                {batches.map(b=><option key={b.id} value={b.id}>{b.batch_no} · {b.scheme} · {b.date}</option>)}
              </select>
            </Field>
            <Field label="Notes"><input className="form-input" value={form.notes} onChange={e=>f('notes',e.target.value)}/></Field>
          </div>
          {form.qty_produced&&form.wheat_used_kg&&Number(form.wheat_used_kg)>0&&(
            <div style={{marginTop:12,padding:'8px 14px',background:'var(--green)15',borderRadius:6,fontSize:12,color:'var(--green)',fontFamily:'var(--mono)'}}>
              Yield: {((Number(form.qty_produced)*Number(form.pack_size_kg)/Number(form.wheat_used_kg))*100).toFixed(1)}%
              &nbsp;·&nbsp; Output: {((Number(form.qty_produced)*Number(form.pack_size_kg))/1000).toFixed(2)} MT
            </div>
          )}
        </FormCard>
      )}

      {Object.keys(byDate).length===0&&!showForm&&<div className="table-wrap"><Empty msg="No production entries this month. Click '+ New entry' to start."/></div>}

      {Object.keys(byDate).sort().reverse().map(date=>{
        const rows=byDate[date];
        const totalMT=rows.reduce((s,r)=>s+(r.qty_produced*r.pack_size_kg),0)/1000;
        return(
          <div key={date} style={{marginBottom:20}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8,padding:'6px 0',borderBottom:'1px solid var(--border)'}}>
              <div style={{fontFamily:'var(--mono)',fontSize:12,color:'var(--amber)'}}>
                {new Date(date+'T12:00:00').toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})}
              </div>
              <div style={{fontFamily:'var(--mono)',fontSize:12,color:'var(--green)'}}>Total: {totalMT.toFixed(2)} MT</div>
            </div>
            <TableWrap>
              <table>
                <thead><tr><th>Shift</th><th>Product</th><th>Pack</th><th>Bags</th><th>Wheat used</th><th>Yield</th><th>Repacked</th><th>Refeed</th><th>Notes</th><th></th></tr></thead>
                <tbody>
                  {rows.map(e=>{
                    const yp=e.wheat_used_kg>0?((e.qty_produced*e.pack_size_kg/e.wheat_used_kg)*100).toFixed(1):null;
                    const yCol=yp?(Number(yp)>=68?'var(--green)':Number(yp)>=64?'var(--amber)':'var(--red)'):'var(--muted)';
                    return(
                      <tr key={e.id}>
                        <td><span className={`badge badge-${e.shift==='Morning'?'blue':'muted'}`}>{e.shift}</span></td>
                        <td><strong>{e.product_type}</strong></td>
                        <td className="mono dim">{e.pack_size_kg}kg</td>
                        <td><strong style={{color:'var(--green)',fontFamily:'var(--mono)'}}>{fmt(e.qty_produced)}</strong></td>
                        <td className="mono dim">{e.wheat_used_kg?fmtMT(e.wheat_used_kg):'—'}</td>
                        <td style={{color:yCol,fontFamily:'var(--mono)'}}>{yp?yp+'%':'—'}</td>
                        <td className="dim mono">{e.qty_repacked||0}</td>
                        <td className="dim mono">{e.qty_refeed||0}</td>
                        <td className="dim">{e.notes||'—'}</td>
                        <td><button className="btn btn-red btn-sm" onClick={()=>del(e)}>✕</button></td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </TableWrap>
          </div>
        );
      })}
    </div>
  );
}

// SUPPLYCO DISPATCH
// ═══════════════════════════════════════════════════════════
function Dispatch(){
  const [dispatches,setDispatches]=useState([]);
  const [workOrders,setWorkOrders]=useState([]);
  const [showDF,setShowDF]=useState(false);
  const [showWO,setShowWO]=useState(false);
  const [saving,setSaving]=useState(false);
  const [loading,setLoading]=useState(true);
  const blankD={date:today,invoice_no:'',delivery_order_no:'',work_order_id:'',scheme:'NPS',batch_no:'',depot_name:'',district:'KNR',qty_bags:'',vehicle_no:'',notes:''};
  const blankW={work_order_no:'',work_order_date:today,scheme:'NPS',batch_no:'',knr_pkts:0,tly_pkts:0,tpb_pkts:0,khd_pkts:0,ksd_pkts:0,irtty_pkts:0,vlparamba_pkts:0,other_pkts:0};
  const [dForm,setDForm]=useState(blankD);
  const [wForm,setWForm]=useState(blankW);
  const df=(k,v)=>setDForm(p=>({...p,[k]:v}));
  const wf=(k,v)=>setWForm(p=>({...p,[k]:v}));

  const [stockConfig, setStockConfig] = useState([]); // Add this near your other state variables

  const load=useCallback(async()=>{
    setLoading(true);
    const [{data:d},{data:w},{data:s}]=await Promise.all([
      sb.from('supplyco_dispatches').select('*').gte('date',monthStart).order('date',{ascending:false}),
      sb.from('work_orders').select('*').order('work_order_date',{ascending:false}),
      sb.from('current_stock').select('*') // Fetch stock config
    ]);
    setDispatches(d||[]); setWorkOrders(w||[]); setStockConfig(s||[]); setLoading(false);
  },[]);
  useEffect(()=>{load();},[load]);

  const saveDispatch=async()=>{
    if(!dForm.invoice_no||!dForm.depot_name||!dForm.qty_bags) return alert('Invoice, depot and quantity required.');
    setSaving(true);
    const {data,error}=await sb.from('supplyco_dispatches').insert({...dForm,qty_bags:Number(dForm.qty_bags),work_order_id:dForm.work_order_id||null}).select().single();
    if(error){alert(error.message);setSaving(false);return;}
    const packKg=dForm.scheme==='NPS'?50:47.5;
    const prod=dForm.scheme==='NPS'?'NPS Atta':dForm.scheme==='PHH'?'PHH Atta':'AAY Atta';
    const {data:s}=await sb.from('current_stock').select('qty_bags').eq('product_type',prod).eq('pack_size_kg',packKg).single();
    if(s) await sb.from('current_stock').update({qty_bags:Math.max(0,s.qty_bags-Number(dForm.qty_bags))}).eq('product_type',prod).eq('pack_size_kg',packKg);
    setDispatches(p=>[data,...p]); setDForm(blankD); setShowDF(false); setSaving(false);
    logActivity('Dispatch','create',`Invoice ${dForm.invoice_no} — ${dForm.qty_bags} bags to ${dForm.depot_name}`);
  };

  const saveWO=async()=>{
    if(!wForm.work_order_no) return alert('Work order number required.');
    setSaving(true);
    const {data,error}=await sb.from('work_orders').insert(wForm).select().single();
    if(error){alert(error.message);setSaving(false);return;}
    setWorkOrders(p=>[data,...p]); setWForm(blankW); setShowWO(false); setSaving(false);
    logActivity('Dispatch','create',`Work order ${wForm.work_order_no} registered`);
  };

  const delD=async(d)=>{
    if(!confirm('Delete dispatch? Stock will be restored.')) return;
    await sb.from('supplyco_dispatches').delete().eq('id',d.id);
    const packKg=d.scheme==='NPS'?50:47.5;
    const prod=d.scheme==='NPS'?'NPS Atta':d.scheme==='PHH'?'PHH Atta':'AAY Atta';
    const {data:s}=await sb.from('current_stock').select('qty_bags').eq('product_type',prod).eq('pack_size_kg',packKg).single();
    if(s) await sb.from('current_stock').update({qty_bags:s.qty_bags+d.qty_bags}).eq('product_type',prod).eq('pack_size_kg',packKg);
    setDispatches(p=>p.filter(x=>x.id!==d.id));
    logActivity('Dispatch','delete',`Invoice ${d.invoice_no} — ${d.qty_bags} bags deleted`);
  };

  if(loading) return <Loading/>;

  const woBalances=workOrders.map(wo=>{
    // Map scheme to product type to find the right conversion factor
    const productMap = {'NPS':'NPS Atta', 'PHH':'PHH Atta', 'AAY':'AAY Atta'};
    const stockItem = stockConfig.find(s => s.product_type === productMap[wo.scheme]);
    const pktsPerBag = stockItem?.packets_per_bag || 50; // Fallback to 50 if empty

    const sentBags = dispatches.filter(d=>d.work_order_id===wo.id).reduce((s,d)=>s+d.qty_bags,0);
    const sentPkts = sentBags * pktsPerBag; // Do the conversion!

    return{...wo, sentBags, sentPkts, balance: wo.total_pkts - sentPkts};
  });

  return(
    <div className="page">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:24,flexWrap:'wrap',gap:12}}>
        <div className="page-header" style={{marginBottom:0}}>
          <div className="page-label">Supplyco Operations</div>
          <div className="page-title">Dispatch & work orders</div>
        </div>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-amber" onClick={()=>setShowWO(v=>!v)}>+ Work order</button>
          <button className="btn btn-green" onClick={()=>setShowDF(v=>!v)}>+ Log dispatch</button>
        </div>
      </div>

      {showWO&&(
        <FormCard title="Register work order" col="var(--amber)" onSave={saveWO} onCancel={()=>setShowWO(false)} saving={saving}>
          <div className="form-grid">
            <Field label="Work order no. ★"><input className="form-input" value={wForm.work_order_no} onChange={e=>wf('work_order_no',e.target.value)}/></Field>
            <Field label="Date"><input type="date" className="form-input" value={wForm.work_order_date} onChange={e=>wf('work_order_date',e.target.value)}/></Field>
            <Field label="Scheme"><select className="form-input" value={wForm.scheme} onChange={e=>wf('scheme',e.target.value)}>{SCHEMES.map(s=><option key={s}>{s}</option>)}</select></Field>
            <Field label="Batch no."><input className="form-input" value={wForm.batch_no} onChange={e=>wf('batch_no',e.target.value.toUpperCase())}/></Field>
          </div>
          <div style={{marginTop:12}}>
            <div className="section-label" style={{marginBottom:8}}>District allotments (packets)</div>
            <div className="form-grid">
              {[['KNR','knr_pkts'],['TLY','tly_pkts'],['TPB','tpb_pkts'],['KHD','khd_pkts'],['KSD','ksd_pkts'],['IRTTY','irtty_pkts'],['V.Paramba','vlparamba_pkts'],['Other','other_pkts']].map(([l,k])=>(
                <Field key={k} label={l}><input type="number" className="form-input" value={wForm[k]} onChange={e=>wf(k,Number(e.target.value))}/></Field>
              ))}
            </div>
            <div style={{marginTop:8,fontFamily:'var(--mono)',fontSize:12,color:'var(--green)'}}>
              Total: {fmt(Object.entries(wForm).filter(([k])=>k.endsWith('_pkts')).reduce((s,[,v])=>s+Number(v),0))} packets
            </div>
          </div>
        </FormCard>
      )}

      {showDF&&(
        <FormCard title="Log Supplyco dispatch" col="var(--green)" onSave={saveDispatch} onCancel={()=>setShowDF(false)} saving={saving}>
          <div className="form-grid">
            <Field label="Date"><input type="date" className="form-input" value={dForm.date} max={today} onChange={e=>df('date',e.target.value)}/></Field>
            <Field label="Scheme"><select className="form-input" value={dForm.scheme} onChange={e=>df('scheme',e.target.value)}>{SCHEMES.map(s=><option key={s}>{s}</option>)}</select></Field>
            <Field label="Invoice no. ★"><input className="form-input" placeholder="e.g. NPS/42" value={dForm.invoice_no} onChange={e=>df('invoice_no',e.target.value)}/></Field>
            <Field label="Delivery order no."><input className="form-input" value={dForm.delivery_order_no} onChange={e=>df('delivery_order_no',e.target.value)}/></Field>
            <Field label="Work order">
              <select className="form-input" value={dForm.work_order_id} onChange={e=>df('work_order_id',e.target.value)}>
                <option value="">-- Select --</option>
                {workOrders.map(w=><option key={w.id} value={w.id}>{w.work_order_no} · {w.scheme}</option>)}
              </select>
            </Field>
            <Field label="Depot name ★"><input className="form-input" value={dForm.depot_name} onChange={e=>df('depot_name',e.target.value)}/></Field>
            <Field label="District"><select className="form-input" value={dForm.district} onChange={e=>df('district',e.target.value)}>{DISTRICTS.map(d=><option key={d}>{d}</option>)}</select></Field>
            <Field label="Bags dispatched ★"><input type="number" className="form-input" style={{fontWeight:600,fontSize:15}} value={dForm.qty_bags} onChange={e=>df('qty_bags',e.target.value)}/></Field>
            <Field label="Vehicle no."><input className="form-input" value={dForm.vehicle_no} onChange={e=>df('vehicle_no',e.target.value)}/></Field>
            <Field label="Batch no."><input className="form-input" value={dForm.batch_no} placeholder="PU-220" onChange={e=>df('batch_no',e.target.value)}/></Field>
          </div>
        </FormCard>
      )}

      {woBalances.length>0&&(
        <>
          <div className="section-label">Work order balances</div>
          <TableWrap>
            <table>
              <thead><tr><th>Work order</th><th>Date</th><th>Scheme</th><th>Allotted</th><th>Dispatched</th><th>Balance</th><th>Status</th></tr></thead>
              <tbody>
                {woBalances.map(wo=>{
                  const pct=wo.total_pkts>0?Math.round((wo.sentPkts/wo.total_pkts)*100):0;
                  const col=pct>=100?'var(--green)':pct>50?'var(--amber)':'var(--red)';
                  return(
                    <tr key={wo.id}>
                      <td><strong className="mono">{wo.work_order_no}</strong></td>
                      <td className="dim">{wo.work_order_date}</td>
                      <td><span className="badge badge-blue">{wo.scheme}</span></td>
                      <td className="mono">{fmt(wo.total_pkts)} pkts</td>
                      <td className="mono" style={{color:'var(--green)'}}>
                        {fmt(wo.sentPkts)} pkts <span style={{fontSize:10, color:'var(--muted)'}}>({fmt(wo.sentBags)} bags)</span>
                      </td>
                      <td className="mono" style={{color:wo.balance>0?'var(--red)':'var(--green)',fontWeight:600}}>{fmt(wo.balance)} pkts</td>
                      <td><span className="badge" style={{background:col+'20',color:col}}>{pct}% done</span></td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </TableWrap>
          <div style={{marginBottom:24}}/>
        </>
      )}

      <div className="section-label">This month's dispatch log</div>
      <TableWrap>
        <table>
          <thead><tr><th>Date</th><th>Invoice</th><th>D.O. No.</th><th>Scheme</th><th>Depot</th><th>District</th><th>Bags</th><th>Vehicle</th><th></th></tr></thead>
          <tbody>
            {dispatches.length===0&&<tr><td colSpan={9}><Empty msg="No dispatches this month."/></td></tr>}
            {dispatches.map(d=>(
              <tr key={d.id}>
                <td className="mono dim">{d.date}</td>
                <td><strong>{d.invoice_no}</strong></td>
                <td className="dim">{d.delivery_order_no||'—'}</td>
                <td><span className="badge badge-blue">{d.scheme}</span></td>
                <td>{d.depot_name}</td>
                <td className="mono">{d.district}</td>
                <td><strong style={{color:'var(--green)',fontFamily:'var(--mono)'}}>{fmt(d.qty_bags)}</strong></td>
                <td className="dim">{d.vehicle_no||'—'}</td>
                <td><button className="btn btn-red btn-sm" onClick={()=>delD(d)}>✕</button></td>
              </tr>
            ))}
          </tbody>
          {dispatches.length>0&&(
            <tfoot><tr style={{borderTop:'2px solid var(--border2)'}}>
              <td colSpan={6} style={{textAlign:'right',fontWeight:600,color:'var(--muted)',fontSize:11,fontFamily:'var(--mono)',textTransform:'uppercase',letterSpacing:'.05em'}}>Month total</td>
              <td style={{fontFamily:'var(--mono)',fontWeight:700,color:'var(--green)'}}>{fmt(dispatches.reduce((s,d)=>s+d.qty_bags,0))}</td>
              <td colSpan={2}/>
            </tr></tfoot>
          )}
        </table>
      </TableWrap>
    </div>
  );
}
