// FLOUR STOCK
// ═══════════════════════════════════════════════════════════
function FlourStock(){
  const [stock,setStock]=useState([]);
  const [loading,setLoading]=useState(true);
  const [editId,setEditId]=useState(null);
  const [editVal,setEditVal]=useState({});

  useEffect(()=>{
    sb.from('current_stock').select('*').order('product_type').then(({data})=>{setStock(data||[]);setLoading(false);});
  },[]);

  const saveEdit=async(row)=>{
    const nq=Number(editVal.qty_bags??row.qty_bags);
    const nt=Number(editVal.min_threshold??row.min_threshold);
    const nmx=Number(editVal.max_threshold??row.max_threshold??0);
    const npb=Number(editVal.packets_per_bag??row.packets_per_bag??50); // New conversion factor
    await sb.from('current_stock').update({qty_bags:nq, min_threshold:nt, max_threshold:nmx, packets_per_bag:npb, updated_at:new Date().toISOString()}).eq('id',row.id);
    setStock(p=>p.map(s=>s.id===row.id?{...s, qty_bags:nq, min_threshold:nt, max_threshold:nmx, packets_per_bag:npb}:s));
    setEditId(null); setEditVal({});
    logActivity('Flour Stock','update',`${row.product_type} stock set to ${nq} bags`);
  };

  if(loading) return <Loading/>;

  return(
    <div className="page">
      <div className="page-header">
        <div className="page-label">Inventory</div>
        <div className="page-title">Flour stock position</div>
      </div>
      <div style={{marginBottom:16,padding:'10px 16px',background:'var(--blue)10',border:'1px solid var(--blue)30',borderRadius:6,fontSize:12,color:'var(--muted)'}}>
        Adjust stock physically and set the <strong>Packets per Bag</strong> conversion factor for Work Orders.
      </div>
      <TableWrap>
        <table>
          <thead><tr><th>Product</th><th>Pack size</th><th>Current stock</th><th>Packets / Bag</th><th>Min. alert</th><th>Max. alert</th><th>Status</th><th>Edit</th></tr></thead>
          <tbody>
            {stock.map(row=>{
              const st=row.qty_bags===0?'Out of stock':row.min_threshold>0&&row.qty_bags<row.min_threshold?'Low':'OK';
              const col=st==='Out of stock'?'var(--red)':st==='Low'?'var(--amber)':'var(--green)';
              const isE=editId===row.id;
              return(
                <tr key={row.id}>
                  <td><strong>{row.product_type}</strong></td>
                  <td className="mono dim">{row.pack_size_kg}kg</td>
                  <td>{isE?<input type="number" style={{width:80}} value={editVal.qty_bags??row.qty_bags} onChange={e=>setEditVal(v=>({...v,qty_bags:e.target.value}))}/>
                    :<strong style={{color:col,fontFamily:'var(--mono)',fontSize:15}}>{fmt(row.qty_bags)}</strong>}</td>
                  
                  {/* NEW PACKETS PER BAG COLUMN */}
                  <td>{isE?<input type="number" style={{width:80}} value={editVal.packets_per_bag??row.packets_per_bag??50} onChange={e=>setEditVal(v=>({...v,packets_per_bag:e.target.value}))}/>
                    :<span className="mono dim">{fmt(row.packets_per_bag||50)}</span>}</td>
                  
                  <td>{isE?<input type="number" style={{width:80}} value={editVal.min_threshold??row.min_threshold} onChange={e=>setEditVal(v=>({...v,min_threshold:e.target.value}))}/>
                    :<span className="dim mono">{fmt(row.min_threshold)}</span>}</td>
                  <td>{isE?<input type="number" style={{width:80}} value={editVal.max_threshold??row.max_threshold??0} onChange={e=>setEditVal(v=>({...v,max_threshold:e.target.value}))}/>
                    :<span className="dim mono">{fmt(row.max_threshold||0)}</span>}</td>
                  <td><span className="badge" style={{background:col+'20',color:col}}>{st}</span></td>
                  <td>{isE
                    ?<div style={{display:'flex',gap:6}}><button className="btn btn-green btn-sm" onClick={()=>saveEdit(row)}>Save</button><button className="btn btn-ghost btn-sm" onClick={()=>{setEditId(null);setEditVal({});}}>Cancel</button></div>
                    :<button className="btn btn-ghost btn-sm" onClick={()=>setEditId(row.id)}>Edit</button>}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </TableWrap>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
// STORE & MATERIALS (consumables, spares, packaging)
// ═══════════════════════════════════════════════════════════
function Store(){
  const [items,setItems]=useState([]);
  const [showForm,setShowForm]=useState(false);
  const [showTxn,setShowTxn]=useState(null); // item id for transaction
  const [txnForm,setTxnForm]=useState({type:'Received',qty:'',notes:'',date:today});
  const [saving,setSaving]=useState(false);
  const [loading,setLoading]=useState(true);
  const [filterCat,setFilterCat]=useState('All');
  const blank={item_name:'',category:'Packaging',unit:'Nos',qty:0,min_qty:0,notes:''};
  const [form,setForm]=useState(blank);
  const f=(k,v)=>setForm(p=>({...p,[k]:v}));

  useEffect(()=>{
    sb.from('store_stock').select('*').order('category').then(({data})=>{setItems(data||[]);setLoading(false);});
  },[]);

  const saveItem=async()=>{
    if(!form.item_name) return alert('Item name required.');
    setSaving(true);
    const {data,error}=await sb.from('store_stock').insert(form).select().single();
    if(error){alert(error.message);setSaving(false);return;}
    setItems(p=>[...p,data]); setForm(blank); setShowForm(false); setSaving(false);
    logActivity('Store','create',`New item added — ${form.item_name}`);
  };

  const doTxn=async(item)=>{
    if(!txnForm.qty||Number(txnForm.qty)<=0) return alert('Enter quantity.');
    setSaving(true);
    const delta=txnForm.type==='Received'?Number(txnForm.qty):-Number(txnForm.qty);
    const newQty=Math.max(0,item.qty+delta);
    await sb.from('store_stock').update({qty:newQty,updated_at:new Date().toISOString()}).eq('id',item.id);
    await sb.from('store_transactions').insert({item_id:item.id,date:txnForm.date,txn_type:txnForm.type,qty:Number(txnForm.qty),notes:txnForm.notes});
    setItems(p=>p.map(x=>x.id===item.id?{...x,qty:newQty}:x));
    setShowTxn(null); setTxnForm({type:'Received',qty:'',notes:'',date:today}); setSaving(false);
    logActivity('Store',txnForm.type==='Received'?'create':'update',`${item.item_name} — ${txnForm.type} ${txnForm.qty}`);
  };

  if(loading) return <Loading/>;

  const cats=['All',...STORE_CATS];
  const filtered=filterCat==='All'?items:items.filter(x=>x.category===filterCat);

  return(
    <div className="page">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:24,flexWrap:'wrap',gap:12}}>
        <div className="page-header" style={{marginBottom:0}}>
          <div className="page-label">Inventory</div>
          <div className="page-title">Store & materials</div>
        </div>
        <button className="btn btn-amber" onClick={()=>setShowForm(v=>!v)}>+ Add item</button>
      </div>

      {showForm&&(
        <FormCard title="Add store item" col="var(--amber)" onSave={saveItem} onCancel={()=>setShowForm(false)} saving={saving}>
          <div className="form-grid">
            <Field label="Item name ★"><input className="form-input" placeholder="e.g. PP Woven Bag 50kg" value={form.item_name} onChange={e=>f('item_name',e.target.value)}/></Field>
            <Field label="Category">
              <select className="form-input" value={form.category} onChange={e=>f('category',e.target.value)}>
                {STORE_CATS.map(c=><option key={c}>{c}</option>)}
              </select>
            </Field>
            <Field label="Unit (Nos / kg / litre / roll / etc.)"><input className="form-input" value={form.unit} onChange={e=>f('unit',e.target.value)}/></Field>
            <Field label="Current qty"><input type="number" className="form-input" value={form.qty} onChange={e=>f('qty',Number(e.target.value))}/></Field>
            <Field label="Min. alert qty"><input type="number" className="form-input" value={form.min_qty} onChange={e=>f('min_qty',Number(e.target.value))}/></Field>
            <Field label="Notes"><input className="form-input" value={form.notes} onChange={e=>f('notes',e.target.value)}/></Field>
          </div>
        </FormCard>
      )}

      <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:16}}>
        {cats.map(c=>(
          <button key={c} className={`btn btn-sm ${filterCat===c?'btn-amber':'btn-ghost'}`} onClick={()=>setFilterCat(c)}>{c}</button>
        ))}
      </div>

      <TableWrap>
        <table>
          <thead><tr><th>Item</th><th>Category</th><th>Qty</th><th>Unit</th><th>Min. alert</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody>
            {filtered.length===0&&<tr><td colSpan={7}><Empty/></td></tr>}
            {filtered.map(item=>{
              const st=item.qty===0?'Out':item.min_qty>0&&item.qty<=item.min_qty?'Low':'OK';
              const col=st==='Out'?'var(--red)':st==='Low'?'var(--amber)':'var(--green)';
              return(
                <tr key={item.id}>
                  <td><strong>{item.item_name}</strong>{item.notes&&<div style={{fontSize:11,color:'var(--muted)'}}>{item.notes}</div>}</td>
                  <td><span className="badge badge-muted">{item.category}</span></td>
                  <td><strong style={{color:col,fontFamily:'var(--mono)',fontSize:15}}>{item.qty}</strong></td>
                  <td className="dim">{item.unit}</td>
                  <td className="mono dim">{item.min_qty}</td>
                  <td><span className="badge" style={{background:col+'20',color:col}}>{st}</span></td>
                  <td>
                    <div style={{display:'flex',gap:6}}>
                      <button className="btn btn-green btn-sm" onClick={()=>setShowTxn(item.id)}>+ / −</button>
                    </div>
                    {showTxn===item.id&&(
                      <div style={{marginTop:8,padding:'12px',background:'var(--surface2)',borderRadius:6,border:'1px solid var(--border)'}}>
                        <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'flex-end'}}>
                          <div>
                            <div className="form-label" style={{marginBottom:4}}>Type</div>
                            <select style={{width:110}} value={txnForm.type} onChange={e=>setTxnForm(p=>({...p,type:e.target.value}))}>
                              <option>Received</option><option>Used / Issued</option><option>Damaged</option><option>Returned</option>
                            </select>
                          </div>
                          <div>
                            <div className="form-label" style={{marginBottom:4}}>Qty</div>
                            <input type="number" style={{width:80}} value={txnForm.qty} onChange={e=>setTxnForm(p=>({...p,qty:e.target.value}))}/>
                          </div>
                          <div>
                            <div className="form-label" style={{marginBottom:4}}>Date</div>
                            <input type="date" style={{width:130}} value={txnForm.date} onChange={e=>setTxnForm(p=>({...p,date:e.target.value}))}/>
                          </div>
                          <div style={{flex:1,minWidth:120}}>
                            <div className="form-label" style={{marginBottom:4}}>Notes</div>
                            <input style={{width:'100%'}} value={txnForm.notes} onChange={e=>setTxnForm(p=>({...p,notes:e.target.value}))}/>
                          </div>
                          <button className="btn btn-green btn-sm" onClick={()=>doTxn(item)} disabled={saving}>Save</button>
                          <button className="btn btn-ghost btn-sm" onClick={()=>setShowTxn(null)}>Cancel</button>
                        </div>
                      </div>
                    )}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </TableWrap>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
// DAILY CASH BOOK / LEDGER
// ═══════════════════════════════════════════════════════════
function Ledger(){
  const [entries,setEntries]=useState([]);
  const [showForm,setShowForm]=useState(false);
  const [saving,setSaving]=useState(false);
  const [loading,setLoading]=useState(true);
  const [filterDate,setFilterDate]=useState(today);
  const blank={date:today,txn_type:'Sales Receipt',direction:'in',amount:'',party_name:'',description:'',payment_mode:'Cash',reference_no:''};
  const [form,setForm]=useState(blank);
  const f=(k,v)=>setForm(p=>({...p,[k]:v}));

  const load=useCallback(async()=>{
    setLoading(true);
    const {data}=await sb.from('daily_ledger').select('*').gte('date',monthStart).order('date',{ascending:false}).order('created_at',{ascending:false});
    setEntries(data||[]); setLoading(false);
  },[]);
  useEffect(()=>{load();},[load]);

  const save=async()=>{
    if(!form.amount||Number(form.amount)<=0) return alert('Enter amount.');
    setSaving(true);
    const isIn=['Sales Receipt','Supplyco Payment Received','Other Income','Loan / Advance'].includes(form.txn_type);
    const row={...form,amount:Number(form.amount),direction:isIn?'in':'out'};
    const {data,error}=await sb.from('daily_ledger').insert(row).select().single();
    if(error){alert(error.message);setSaving(false);return;}
    setEntries(p=>[data,...p]); setForm(blank); setShowForm(false); setSaving(false);
    logActivity('Ledger','create',`${form.txn_type} — ₹${form.amount}`);
  };

  const del=async(id)=>{
    if(!confirm('Delete this entry?')) return;
    await sb.from('daily_ledger').delete().eq('id',id);
    setEntries(p=>p.filter(x=>x.id!==id));
    logActivity('Ledger','delete',`Entry ${id} deleted`);
  };

  if(loading) return <Loading/>;

  const dayEntries=entries.filter(e=>e.date===filterDate);
  const dayIn=dayEntries.filter(e=>e.direction==='in').reduce((s,e)=>s+Number(e.amount),0);
  const dayOut=dayEntries.filter(e=>e.direction==='out').reduce((s,e)=>s+Number(e.amount),0);
  const monthIn=entries.filter(e=>e.direction==='in').reduce((s,e)=>s+Number(e.amount),0);
  const monthOut=entries.filter(e=>e.direction==='out').reduce((s,e)=>s+Number(e.amount),0);

  const incomeTypes=['Sales Receipt','Supplyco Payment Received','Other Income','Loan / Advance'];

  return(
    <div className="page">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:24,flexWrap:'wrap',gap:12}}>
        <div className="page-header" style={{marginBottom:0}}>
          <div className="page-label">Finance</div>
          <div className="page-title">Daily cash book</div>
        </div>
        <button className="btn btn-green" onClick={()=>setShowForm(v=>!v)}>+ New entry</button>
      </div>

      <div className="stat-grid" style={{gridTemplateColumns:'repeat(auto-fit,minmax(130px,1fr))'}}>
        <StatCard label="Today in" value={'₹'+fmt(dayIn)} col="var(--green)"/>
        <StatCard label="Today out" value={'₹'+fmt(dayOut)} col="var(--red)"/>
        <StatCard label="Today balance" value={'₹'+fmt(dayIn-dayOut)} col={dayIn-dayOut>=0?'var(--green)':'var(--red)'}/>
        <StatCard label="Month in" value={'₹'+fmt(monthIn)} col="var(--blue)"/>
        <StatCard label="Month out" value={'₹'+fmt(monthOut)} col="var(--amber)"/>
        <StatCard label="Month balance" value={'₹'+fmt(monthIn-monthOut)} col={monthIn-monthOut>=0?'var(--green)':'var(--red)'}/>
      </div>

      {showForm&&(
        <FormCard title="New cash book entry" col="var(--green)" onSave={save} onCancel={()=>setShowForm(false)} saving={saving}>
          <div className="form-grid">
            <Field label="Date"><input type="date" className="form-input" value={form.date} max={today} onChange={e=>f('date',e.target.value)}/></Field>
            <Field label="Transaction type">
              <select className="form-input" value={form.txn_type} onChange={e=>f('txn_type',e.target.value)}>
                <optgroup label="— Money In">{incomeTypes.map(t=><option key={t}>{t}</option>)}</optgroup>
                <optgroup label="— Money Out">{LEDGER_TYPES.filter(t=>!incomeTypes.includes(t)).map(t=><option key={t}>{t}</option>)}</optgroup>
              </select>
            </Field>
            <Field label="Amount (₹) ★"><input type="number" className="form-input" style={{fontWeight:600,fontSize:15}} value={form.amount} onChange={e=>f('amount',e.target.value)}/></Field>
            <Field label="Party name"><input className="form-input" placeholder="Supplier / customer name" value={form.party_name} onChange={e=>f('party_name',e.target.value)}/></Field>
            <Field label="Description"><input className="form-input" placeholder="What is this for?" value={form.description} onChange={e=>f('description',e.target.value)}/></Field>
            <Field label="Payment mode">
              <select className="form-input" value={form.payment_mode} onChange={e=>f('payment_mode',e.target.value)}>
                <option>Cash</option><option>Bank Transfer</option><option>Cheque</option><option>UPI</option><option>Other</option>
              </select>
            </Field>
            <Field label="Reference / Cheque no."><input className="form-input" value={form.reference_no} onChange={e=>f('reference_no',e.target.value)}/></Field>
          </div>
          <div style={{marginTop:10,fontSize:12,color:incomeTypes.includes(form.txn_type)?'var(--green)':'var(--red)',fontFamily:'var(--mono)'}}>
            This will be recorded as: {incomeTypes.includes(form.txn_type)?'↑ MONEY IN':'↓ MONEY OUT'}
          </div>
        </FormCard>
      )}

      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16,flexWrap:'wrap'}}>
        <div className="form-label">Filter by date:</div>
        <input type="date" value={filterDate} max={today} onChange={e=>setFilterDate(e.target.value)} style={{width:160}}/>
        {dayEntries.length>0&&(
          <span style={{fontSize:12,color:'var(--muted)',fontFamily:'var(--mono)'}}>
            {dayEntries.length} entries · In: ₹{fmt(dayIn)} · Out: ₹{fmt(dayOut)} · Balance: <span style={{color:dayIn-dayOut>=0?'var(--green)':'var(--red)'}}>₹{fmt(dayIn-dayOut)}</span>
          </span>
        )}
      </div>

      <TableWrap>
        <table>
          <thead><tr><th>Date</th><th>Type</th><th>Flow</th><th>Amount</th><th>Party</th><th>Description</th><th>Mode</th><th>Ref.</th><th></th></tr></thead>
          <tbody>
            {dayEntries.length===0&&<tr><td colSpan={9}><Empty msg="No entries for this date."/></td></tr>}
            {dayEntries.map(e=>{
              const isIn=e.direction==='in';
              return(
                <tr key={e.id}>
                  <td className="mono dim">{e.date}</td>
                  <td>{e.txn_type}</td>
                  <td><span className={`badge badge-${isIn?'green':'red'}`}>{isIn?'↑ IN':'↓ OUT'}</span></td>
                  <td><strong style={{color:isIn?'var(--green)':'var(--red)',fontFamily:'var(--mono)',fontSize:14}}>₹{fmt(e.amount)}</strong></td>
                  <td>{e.party_name||<span className="dim">—</span>}</td>
                  <td className="dim">{e.description||'—'}</td>
                  <td className="dim">{e.payment_mode}</td>
                  <td className="mono dim">{e.reference_no||'—'}</td>
                  <td><button className="btn btn-red btn-sm" onClick={()=>del(e.id)}>✕</button></td>
                </tr>
              );
            })}
          </tbody>
          {dayEntries.length>0&&(
            <tfoot><tr style={{borderTop:'2px solid var(--border2)'}}>
              <td colSpan={3} style={{textAlign:'right',fontFamily:'var(--mono)',fontSize:10,color:'var(--muted)',letterSpacing:'.05em',textTransform:'uppercase'}}>Day total</td>
              <td style={{fontFamily:'var(--mono)',fontWeight:700,color:dayIn-dayOut>=0?'var(--green)':'var(--red)'}}>₹{fmt(dayIn-dayOut)}</td>
              <td colSpan={5}/>
            </tr></tfoot>
          )}
        </table>
      </TableWrap>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
// WHEAT RECEIPTS
// ═══════════════════════════════════════════════════════════
function Wheat(){
  const [receipts,setReceipts]=useState([]);
  const [showForm,setShowForm]=useState(false);
  const [saving,setSaving]=useState(false);
  const [loading,setLoading]=useState(true);
  const blank={date:today,batch_no:'',scheme:'NPS',received_kg:'',allotment_kg:'',vehicle_no:'',lorry_receipt_no:'',supplier_name:'Supplyco',notes:''};
  const [form,setForm]=useState(blank);
  const f=(k,v)=>setForm(p=>({...p,[k]:v}));

  useEffect(()=>{
    sb.from('wheat_receipts').select('*').gte('date',monthStart).order('date',{ascending:false}).then(({data})=>{setReceipts(data||[]);setLoading(false);});
  },[]);

  const save=async()=>{
    if(!form.batch_no||!form.received_kg) return alert('Batch no. and received KG required.');
    setSaving(true);
    const {data,error}=await sb.from('wheat_receipts').insert({...form,received_kg:Number(form.received_kg),allotment_kg:Number(form.allotment_kg)||0}).select().single();
    if(error){alert(error.message);setSaving(false);return;}
    setReceipts(p=>[data,...p]); setForm(blank); setShowForm(false); setSaving(false);
    logActivity('Wheat','create',`Batch ${form.batch_no} — ${form.received_kg} kg received`);
  };

  if(loading) return <Loading/>;
  const total=receipts.reduce((s,r)=>s+r.received_kg,0);

  return(
    <div className="page">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:24,flexWrap:'wrap',gap:12}}>
        <div className="page-header" style={{marginBottom:0}}>
          <div className="page-label">Raw Materials</div>
          <div className="page-title">Wheat receipts — this month: {fmtMT(total)}</div>
        </div>
        <button className="btn btn-amber" onClick={()=>setShowForm(v=>!v)}>+ Log receipt</button>
      </div>

      {showForm&&(
        <FormCard title="New wheat receipt" col="var(--amber)" onSave={save} onCancel={()=>setShowForm(false)} saving={saving}>
          <div className="form-grid">
            <Field label="Date"><input type="date" className="form-input" value={form.date} max={today} onChange={e=>f('date',e.target.value)}/></Field>
            <Field label="Batch no. ★"><input className="form-input" placeholder="PU-220" value={form.batch_no} onChange={e=>f('batch_no',e.target.value.toUpperCase())}/></Field>
            <Field label="Scheme"><select className="form-input" value={form.scheme} onChange={e=>f('scheme',e.target.value)}>{SCHEMES.map(s=><option key={s}>{s}</option>)}</select></Field>
            <Field label="Received (kg) ★"><input type="number" className="form-input" style={{fontWeight:600,fontSize:15}} placeholder="48000" value={form.received_kg} onChange={e=>f('received_kg',e.target.value)}/></Field>
            <Field label="Allotment (kg)"><input type="number" className="form-input" value={form.allotment_kg} onChange={e=>f('allotment_kg',e.target.value)}/></Field>
            <Field label="Vehicle no."><input className="form-input" placeholder="KL-XX-XXXX" value={form.vehicle_no} onChange={e=>f('vehicle_no',e.target.value)}/></Field>
            <Field label="Lorry receipt no."><input className="form-input" value={form.lorry_receipt_no} onChange={e=>f('lorry_receipt_no',e.target.value)}/></Field>
            <Field label="Supplier"><input className="form-input" value={form.supplier_name} onChange={e=>f('supplier_name',e.target.value)}/></Field>
            <Field label="Notes"><input className="form-input" value={form.notes} onChange={e=>f('notes',e.target.value)}/></Field>
          </div>
        </FormCard>
      )}

      <TableWrap>
        <table>
          <thead><tr><th>Date</th><th>Batch no.</th><th>Scheme</th><th>Received</th><th>Allotment</th><th>Vehicle</th><th>Lorry receipt</th><th>Supplier</th></tr></thead>
          <tbody>
            {receipts.length===0&&<tr><td colSpan={8}><Empty/></td></tr>}
            {receipts.map(r=>(
              <tr key={r.id}>
                <td className="mono dim">{r.date}</td>
                <td><strong style={{color:'var(--amber)',fontFamily:'var(--mono)'}}>{r.batch_no}</strong></td>
                <td><span className="badge badge-blue">{r.scheme}</span></td>
                <td><strong style={{color:'var(--green)',fontFamily:'var(--mono)'}}>{fmtMT(r.received_kg)}</strong></td>
                <td className="mono dim">{r.allotment_kg?fmtMT(r.allotment_kg):'—'}</td>
                <td className="dim">{r.vehicle_no||'—'}</td>
                <td className="dim">{r.lorry_receipt_no||'—'}</td>
                <td className="dim">{r.supplier_name||'—'}</td>
              </tr>
            ))}
          </tbody>
          {receipts.length>0&&<tfoot><tr style={{borderTop:'2px solid var(--border2)'}}>
            <td colSpan={3} style={{textAlign:'right',fontFamily:'var(--mono)',fontSize:10,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.05em'}}>Month total</td>
            <td style={{fontFamily:'var(--mono)',fontWeight:700,color:'var(--green)'}}>{fmtMT(total)}</td>
            <td colSpan={4}/>
          </tr></tfoot>}
        </table>
      </TableWrap>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
// RECONCILIATION
// ═══════════════════════════════════════════════════════════
function Reconciliation(){
  const now=new Date();
  const [month,setMonth]=useState(now.getMonth()+1);
  const [year,setYear]=useState(now.getFullYear());
  const [data,setData]=useState(null);
  const [loading,setLoading]=useState(false);

  const generate=async()=>{
    setLoading(true);
    const ms=String(month).padStart(2,'0');
    const start=`${year}-${ms}-01`;
    const endDt=new Date(year,month,0);
    const end=`${year}-${ms}-${String(endDt.getDate()).padStart(2,'0')}`;
    const [{data:prod},{data:disp},{data:wheat}]=await Promise.all([
      sb.from('production_log').select('*').gte('date',start).lte('date',end),
      sb.from('supplyco_dispatches').select('*').gte('date',start).lte('date',end),
      sb.from('wheat_receipts').select('*').gte('date',start).lte('date',end),
    ]);
    const rec=(scheme,product,packKg)=>{
      const prodBags=(prod||[]).filter(r=>r.product_type===product).reduce((s,r)=>s+r.qty_produced,0);
      const dispBags=(disp||[]).filter(r=>r.scheme===scheme).reduce((s,r)=>s+r.qty_bags,0);
      const byDist={};
      DISTRICTS.forEach(d=>{byDist[d]=(disp||[]).filter(r=>r.scheme===scheme&&r.district===d).reduce((s,r)=>s+r.qty_bags,0);});
      return{prodBags,dispBags,balanceBags:prodBags-dispBags,byDist,prodKg:prodBags*packKg,dispKg:dispBags*packKg};
    };
    const wheatRec=(wheat||[]).reduce((s,r)=>s+r.received_kg,0);
    const wheatUsed=(prod||[]).reduce((s,r)=>s+(r.wheat_used_kg||0),0);
    const totalOut=(prod||[]).reduce((s,r)=>s+(r.qty_produced*r.pack_size_kg),0);
    setData({nps:rec('NPS','NPS Atta',50),phh:rec('PHH','PHH Atta',47.5),aay:rec('AAY','AAY Atta',47.5),
      wheatRec,wheatUsed,wheatBalance:wheatRec-wheatUsed,totalOut,
      yieldPct:wheatUsed>0?((totalOut/wheatUsed)*100).toFixed(2):'—'});
    setLoading(false);
  };

  const monthName=new Date(year,month-1,1).toLocaleString('en-IN',{month:'long',year:'numeric'});

  return(
    <div className="page">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:24,flexWrap:'wrap',gap:12}}>
        <div className="page-header" style={{marginBottom:0}}>
          <div className="page-label">Compliance</div>
          <div className="page-title">Monthly reconciliation</div>
        </div>
        <div style={{display:'flex',gap:8,alignItems:'flex-end',flexWrap:'wrap'}}>
          <div><div className="form-label" style={{marginBottom:4}}>Month</div>
            <select style={{width:130}} value={month} onChange={e=>setMonth(Number(e.target.value))}>
              {[...Array(12)].map((_,i)=><option key={i+1} value={i+1}>{new Date(2000,i,1).toLocaleString('en-IN',{month:'long'})}</option>)}
            </select>
          </div>
          <div><div className="form-label" style={{marginBottom:4}}>Year</div>
            <select style={{width:90}} value={year} onChange={e=>setYear(Number(e.target.value))}>
              {[2024,2025,2026,2027].map(y=><option key={y}>{y}</option>)}
            </select>
          </div>
          <button className="btn btn-blue" onClick={generate} disabled={loading}>{loading?'Calculating…':'Generate'}</button>
        </div>
      </div>

      {!data&&<div className="card" style={{textAlign:'center',padding:40,color:'var(--muted)'}}>Select month and year, then click Generate.</div>}

      {data&&(
        <>
          <div style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--muted)',marginBottom:16,letterSpacing:'.05em'}}>
            RECONCILIATION STATEMENT — {monthName.toUpperCase()}
          </div>

          <div className="card amber-l" style={{marginBottom:16}}>
            <div className="section-label">Wheat</div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(140px,1fr))',gap:12}}>
              {[['Received',fmtMT(data.wheatRec),'var(--blue)'],['Used in production',fmtMT(data.wheatUsed),'var(--amber)'],
                ['Closing stock',fmtMT(data.wheatBalance),data.wheatBalance>=0?'var(--green)':'var(--red)'],
                ['Overall yield',data.yieldPct!=='—'?data.yieldPct+'%':'—',Number(data.yieldPct)>=68?'var(--green)':'var(--amber)']
              ].map(([l,v,c])=>(
                <div key={l} style={{textAlign:'center'}}>
                  <div style={{fontSize:10,color:'var(--muted)',fontFamily:'var(--mono)',marginBottom:4}}>{l}</div>
                  <div style={{fontSize:20,fontWeight:600,color:c}}>{v}</div>
                </div>
              ))}
            </div>
          </div>

          {[['NPS','NPS Atta',50,'var(--blue)'],['PHH','PHH Atta',47.5,'var(--green)'],['AAY','AAY Atta',47.5,'var(--amber)']].map(([scheme,product,packKg,col])=>{
            const r=data[scheme.toLowerCase()];
            return(
              <div key={scheme} className="card" style={{marginBottom:14,borderLeft:`3px solid ${col}`}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12,flexWrap:'wrap',gap:8}}>
                  <div className="section-label" style={{marginBottom:0}}>{scheme} — {product}</div>
                  <div style={{display:'flex',gap:10,fontFamily:'var(--mono)',fontSize:12}}>
                    <span style={{color:col}}>Produced: {fmt(r.prodBags)} bags</span>
                    <span style={{color:'var(--muted)'}}>·</span>
                    <span style={{color:'var(--green)'}}>Dispatched: {fmt(r.dispBags)} bags</span>
                    <span style={{color:'var(--muted)'}}>·</span>
                    <span style={{color:r.balanceBags>0?'var(--red)':'var(--green)'}}>Balance: {fmt(r.balanceBags)}</span>
                  </div>
                </div>
                <TableWrap>
                  <table>
                    <thead><tr><th>District</th><th>Bags dispatched</th><th>In KG</th><th>In MT</th></tr></thead>
                    <tbody>
                      {DISTRICTS.filter(d=>r.byDist[d]>0).map(d=>(
                        <tr key={d}>
                          <td className="mono">{d}</td>
                          <td><strong style={{color:col,fontFamily:'var(--mono)'}}>{fmt(r.byDist[d])}</strong></td>
                          <td className="mono dim">{fmt(r.byDist[d]*packKg)}</td>
                          <td className="mono dim">{fmtMT(r.byDist[d]*packKg)}</td>
                        </tr>
                      ))}
                      {Object.values(r.byDist).every(v=>v===0)&&<tr><td colSpan={4}><Empty msg={`No ${scheme} dispatches this month.`}/></td></tr>}
                    </tbody>
                    <tfoot><tr style={{borderTop:'2px solid var(--border2)'}}>
                      <td style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.05em'}}>Total</td>
                      <td style={{fontFamily:'var(--mono)',fontWeight:700,color:col}}>{fmt(r.dispBags)}</td>
                      <td className="mono dim">{fmt(r.dispKg)}</td>
                      <td className="mono dim">{fmtMT(r.dispKg)}</td>
                    </tr></tfoot>
                  </table>
                </TableWrap>
              </div>
            );
          })}
        </>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
// SETTINGS / PRODUCT MASTER
// ═══════════════════════════════════════════════════════════
function ProductSettings() {
  const [products, setProducts] = useState([]);
  const [showForm, setShowForm] = useState(false);
  const [saving, setSaving] = useState(false);
  const [loading, setLoading] = useState(true);

  const blank = { 
    product_code: '', product_name: '', category: 'Finished Goods', 
    packet_weight_kg: '', packets_per_bag: 50, base_price_per_unit: '', 
    gst_percent: 0, hsn_code: '', min_stock_alert: 0 
  };
  const [form, setForm] = useState(blank);
  const f = (k, v) => setForm(p => ({ ...p, [k]: v }));

  useEffect(() => {
    sb.from('product_master').select('*').order('product_name').then(({ data }) => {
      setProducts(data || []);
      setLoading(false);
    });
  }, []);

  const saveProduct = async () => {
    if (!form.product_name || !form.packet_weight_kg) return alert('Product Name and Packet Weight are required.');
    setSaving(true);
    
    // 1. Save to Product Master
    const { data, error } = await sb.from('product_master').insert({
      ...form,
      packet_weight_kg: Number(form.packet_weight_kg),
      packets_per_bag: Number(form.packets_per_bag),
      base_price_per_unit: Number(form.base_price_per_unit),
      gst_percent: Number(form.gst_percent),
      min_stock_alert: Number(form.min_stock_alert)
    }).select().single();
    
    if (error) { alert(error.message); setSaving(false); return; }

    // 2. Automatically initialize this product in your current_stock table with 0 stock
    // This ensures it instantly shows up on the "Flour Stock" page!
    const totalBagWeight = Number(form.packet_weight_kg) * Number(form.packets_per_bag);
    await sb.from('current_stock').insert({
      product_type: form.product_name,
      pack_size_kg: totalBagWeight,
      min_threshold: Number(form.min_stock_alert),
      packets_per_bag: Number(form.packets_per_bag),
      qty_bags: 0
    });

    setProducts(p => [data, ...p]);
    setForm(blank);
    setShowForm(false);
    setSaving(false);
    logActivity('Product Master','create',`New product — ${form.product_name}`);
  };

  const toggleActive = async (id, currentStatus) => {
    await sb.from('product_master').update({ is_active: !currentStatus }).eq('id', id);
    setProducts(p => p.map(x => x.id === id ? { ...x, is_active: !currentStatus } : x));
    logActivity('Product Master','update',`Product ${id} set to ${!currentStatus?'Active':'Archived'}`);
  };

  if (loading) return <Loading />;

  return (
    <div className="page">
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', marginBottom: 24, flexWrap: 'wrap', gap: 12 }}>
        <div className="page-header" style={{ marginBottom: 0 }}>
          <div className="page-label">System Settings</div>
          <div className="page-title">Product Master List</div>
        </div>
        <button className="btn btn-amber" onClick={() => setShowForm(v => !v)}>+ Add New Product</button>
      </div>

      {showForm && (
        <FormCard title="Register New Product" col="var(--amber)" onSave={saveProduct} onCancel={() => setShowForm(false)} saving={saving}>
          <div className="form-grid">
            <Field label="Product Code / SKU"><input className="form-input" placeholder="e.g. AAY-47" value={form.product_code} onChange={e => f('product_code', e.target.value)} /></Field>
            <Field label="Product Name ★"><input className="form-input" placeholder="e.g. Premium Maida" value={form.product_name} onChange={e => f('product_name', e.target.value)} /></Field>
            <Field label="Category">
              <select className="form-input" value={form.category} onChange={e => f('category', e.target.value)}>
                <option>Finished Goods</option><option>By-Products</option><option>Trading Goods</option>
              </select>
            </Field>
            <Field label="HSN Code"><input className="form-input" placeholder="11010000" value={form.hsn_code} onChange={e => f('hsn_code', e.target.value)} /></Field>
            
            <div style={{gridColumn: '1 / -1', height: 1, background: 'var(--border)', margin: '8px 0'}} />
            
            <Field label="Single Packet Weight (kg) ★"><input type="number" className="form-input" placeholder="e.g. 1" value={form.packet_weight_kg} onChange={e => f('packet_weight_kg', e.target.value)} /></Field>
            <Field label="Packets per Master Bag"><input type="number" className="form-input" value={form.packets_per_bag} onChange={e => f('packets_per_bag', e.target.value)} /></Field>
            <Field label="Min. Alert (Bags)"><input type="number" className="form-input" value={form.min_stock_alert} onChange={e => f('min_stock_alert', e.target.value)} /></Field>
            
            <div style={{gridColumn: '1 / -1', height: 1, background: 'var(--border)', margin: '8px 0'}} />

            <Field label="Base Price / Packet (₹)"><input type="number" className="form-input" value={form.base_price_per_unit} onChange={e => f('base_price_per_unit', e.target.value)} /></Field>
            <Field label="GST (%)">
              <select className="form-input" value={form.gst_percent} onChange={e => f('gst_percent', e.target.value)}>
                <option value="0">0% (Exempt)</option><option value="5">5%</option><option value="12">12%</option><option value="18">18%</option>
              </select>
            </Field>
          </div>
          
          {/* Helpful summary calculator for the user */}
          {form.packet_weight_kg && form.packets_per_bag && (
            <div style={{ marginTop: 16, padding: '12px 16px', background: 'var(--surface2)', borderRadius: 6, fontSize: 12, border: '1px solid var(--border)' }}>
              <strong>Configuration Summary:</strong> Master bag will weigh <strong>{Number(form.packet_weight_kg) * Number(form.packets_per_bag)} kg</strong>. 
              {form.base_price_per_unit && (
                <span> Final price to customer (incl. GST): <strong>₹{(Number(form.base_price_per_unit) * (1 + Number(form.gst_percent)/100)).toFixed(2)}</strong> per packet.</span>
              )}
            </div>
          )}
        </FormCard>
      )}

      <TableWrap>
        <table>
          <thead>
            <tr>
              <th>Code / HSN</th>
              <th>Product Details</th>
              <th>Packaging</th>
              <th>Pricing (₹)</th>
              <th>Min Alert</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            {products.length === 0 && <tr><td colSpan={6}><Empty msg="No products configured yet." /></td></tr>}
            {products.map(p => {
              const finalPrice = p.base_price_per_unit * (1 + p.gst_percent / 100);
              const totalBagKg = p.packet_weight_kg * p.packets_per_bag;
              return (
                <tr key={p.id} style={{ opacity: p.is_active ? 1 : 0.5 }}>
                  <td>
                    <div style={{ fontWeight: 600 }}>{p.product_code || '—'}</div>
                    <div style={{ fontSize: 11, color: 'var(--muted)', fontFamily: 'var(--mono)' }}>HSN: {p.hsn_code || '—'}</div>
                  </td>
                  <td>
                    <div style={{ fontWeight: 600, fontSize: 14 }}>{p.product_name}</div>
                    <div style={{ fontSize: 11, color: 'var(--muted)' }}>{p.category}</div>
                  </td>
                  <td>
                    <div><strong className="mono">{p.packet_weight_kg}kg</strong> pkt</div>
                    <div style={{ fontSize: 11, color: 'var(--muted)' }}>{p.packets_per_bag} pkts / bag ({totalBagKg}kg total)</div>
                  </td>
                  <td>
                    <div className="mono">₹{fmt(p.base_price_per_unit, 2)} base</div>
                    <div style={{ fontSize: 11, color: 'var(--green)' }}>₹{fmt(finalPrice, 2)} incl. {p.gst_percent}% GST</div>
                  </td>
                  <td className="mono dim">{p.min_stock_alert} bags</td>
                  <td>
                    <button 
                      className={`btn btn-sm ${p.is_active ? 'btn-green' : 'btn-ghost'}`} 
                      onClick={() => toggleActive(p.id, p.is_active)}>
                      {p.is_active ? 'Active' : 'Archived'}
                    </button>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </TableWrap>
    </div>
  );
}
// ═══════════════════════════════════════════════════════════
// ACTIVITY LOG
// ═══════════════════════════════════════════════════════════
function ActivityLog(){
  const [logs,setLogs]=useState([]);
  const [loading,setLoading]=useState(true);
  const [filterSection,setFilterSection]=useState('All');

  useEffect(()=>{
    sb.from('activity_log').select('*').order('created_at',{ascending:false}).limit(500).then(({data})=>{
      setLogs(data||[]); setLoading(false);
    });
  },[]);

  if(loading) return <Loading/>;

  const sections=['All',...Array.from(new Set(logs.map(l=>l.section)))];
  const filtered=filterSection==='All'?logs:logs.filter(l=>l.section===filterSection);

  const actionCol=(a)=>a==='create'?'var(--green)':a==='delete'?'var(--red)':'var(--amber)';

  return(
    <div className="page">
      <div className="page-header">
        <div className="page-label">System</div>
        <div className="page-title">Activity log</div>
      </div>

      <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:16}}>
        {sections.map(s=>(
          <button key={s} className={`btn btn-sm ${filterSection===s?'btn-amber':'btn-ghost'}`} onClick={()=>setFilterSection(s)}>{s}</button>
        ))}
      </div>

      <TableWrap>
        <table>
          <thead><tr><th>Time</th><th>User</th><th>Section</th><th>Action</th><th>Details</th></tr></thead>
          <tbody>
            {filtered.length===0&&<tr><td colSpan={5}><Empty msg="No activity recorded yet."/></td></tr>}
            {filtered.map(l=>(
              <tr key={l.id}>
                <td className="mono dim">{new Date(l.created_at).toLocaleString('en-IN')}</td>
                <td className="dim">{l.user_email}</td>
                <td><span className="badge badge-blue">{l.section}</span></td>
                <td><span className="badge" style={{background:actionCol(l.action)+'20',color:actionCol(l.action)}}>{l.action}</span></td>
                <td className="dim">{l.details}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </TableWrap>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
// APP ROOT
// ═══════════════════════════════════════════════════════════
function App(){
  const [user,setUser]=useState(null);
  const [tab,setTab]=useState('dashboard');
  const [authLoading,setAuthLoading]=useState(true);

  useEffect(()=>{
    sb.auth.getSession().then(({data:{session}})=>{setUser(session?.user??null);setAuthLoading(false);});
    sb.auth.onAuthStateChange((_,session)=>setUser(session?.user??null));
  },[]);

  if(authLoading) return <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',color:'var(--muted)',fontFamily:'var(--mono)',fontSize:13}}>loading…</div>;
  if(!user) return <Login onLogin={setUser}/>;

  const VIEWS={
    'dashboard':<Dashboard/>,
    'production':<Production/>,
    'dispatch':<Dispatch/>,
    'wheat':<Wheat/>,
    'reconciliation':<Reconciliation/>,
    'flour-stock':<FlourStock/>,
    'store':<Store/>,
    'ledger':<Ledger/>,
    'product-master':<ProductSettings/>, // ADD THIS
    'activity-log':<ActivityLog/>,
  };

  return(
    <div className="app">
      <div className="sidebar">
        <div className="sidebar-logo">
          <div className="mill-name">PRFM</div>
          <div className="mill-sub">Mill Operations</div>
        </div>
        {NAV.map((item,i)=>{
          if(item.section) return <div key={i} className="sidebar-section">{item.section}</div>;
          return(
            <button key={item.id} className={`nav-btn${tab===item.id?' active':''}`} onClick={()=>setTab(item.id)}>
              <span className="icon">{item.icon}</span>{item.label}
            </button>
          );
        })}
        <div className="sidebar-footer">
          <button className="hr-link-btn" onClick={()=>window.open(HR_APP_URL,'_blank')}>
            <span style={{fontSize:14}}>👥</span>
            <div>
              <div style={{fontSize:12,fontWeight:500}}>HR Portal</div>
              <div style={{fontSize:10,color:'var(--dim)'}}>Open in new tab →</div>
            </div>
          </button>
          <button className="btn btn-ghost btn-sm" style={{width:'100%',marginTop:8}} onClick={()=>sb.auth.signOut()}>Sign out</button>
        </div>
      </div>
      <div className="main">
        {VIEWS[tab]||<Dashboard/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
