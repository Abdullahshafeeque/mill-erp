const LIFT_SETTING_KEY='lifting_alert_settings';
const LIFT_DEFAULTS={
  enabled:true,
  default_deadline_days:30, require_deadline:false,
  remind_days:15, manager_days:5, director_days:5,
  person_id:'', manager_id:'', notify_director:true,
  extra_ids:[], extra_from_stage:2,
  min_balance_kg:0, tolerance_pct:1,
  alert_overdue:true, overdue_to_director:true,
  pace_enabled:true, pace_lag_pct:15,
  buffer_days:2, off_days:[0],
  truck_kg:10000, daily_capacity_kg:0, risk_alert:true,
  show_dashboard:true, show_tasks:true
};
const LIFT_STAGE_LABEL=['No alert','Person in charge alerted','Escalated to manager','Escalated to Director'];
const LIFT_STAGE_COL=['var(--green)','var(--amber)','#EA580C','var(--red)'];
const LIFT_WEEKDAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

async function loadLiftSettings(){
  const {data}=await sb.from('erp_settings').select('value').eq('key',LIFT_SETTING_KEY).maybeSingle();
  let saved={};
  try{ saved=data&&data.value?JSON.parse(data.value):{}; }catch(e){ saved={}; }
  return {...LIFT_DEFAULTS,...saved};
}

// Counts days from fromStr to toStr (inclusive) that are not weekly off days.
const liftWorkingDays=(fromStr,toStr,off)=>{
  if(!fromStr||!toStr||toStr<fromStr) return 0;
  const [y1,m1,d1]=fromStr.split('-').map(Number);
  const [y2,m2,d2]=toStr.split('-').map(Number);
  const c=new Date(y1,m1-1,d1); const e=new Date(y2,m2-1,d2);
  let n=0;
  while(c<=e){ if(!(off||[]).includes(c.getDay())) n++; c.setDate(c.getDate()+1); }
  return n;
};

// Everything is worked out live from the order + settings. Nothing about alert state is stored.
const liftInfo=(o,S)=>{
  const allotted=Number(o.allotted_kg)||0, lifted=Number(o.lifted_kg)||0;
  const balance=Math.max(0,allotted-lifted);
  const info={balance,pct:allotted>0?lifted/allotted*100:0,daysLeft:null,stage:0,reasons:[],complete:false,reqPerDay:0,trucksPerDay:0,workDays:0,atRisk:false};
  if(allotted>0&&balance<=allotted*(Number(S.tolerance_pct)||0)/100){ info.complete=true; return info; }
  if(!o.deadline) return info;
  const daysLeft=daysUntil(o.deadline);
  info.daysLeft=daysLeft;
  const target=licShift(o.deadline,-(Number(S.buffer_days)||0));
  info.workDays=liftWorkingDays(today,target,S.off_days);
  info.reqPerDay=balance/Math.max(1,info.workDays);
  info.trucksPerDay=Number(S.truck_kg)>0?Math.ceil(info.reqPerDay/Number(S.truck_kg)):0;
  if(Number(S.daily_capacity_kg)>0&&info.reqPerDay>Number(S.daily_capacity_kg)) info.atRisk=true;
  if(!S.enabled) return info;
  if(balance<(Number(S.min_balance_kg)||0)) return info;

  const r=Number(S.remind_days)||0, m=Number(S.manager_days)||0, d=Number(S.director_days)||0;
  let stage=0;
  if(daysLeft<=r){ stage=1; info.reasons.push(`Within ${r} days of the deadline`); }
  if(daysLeft<=r-m) stage=2;
  if(daysLeft<=r-m-d) stage=3;
  if(daysLeft<0){
    if(S.alert_overdue){ stage=Math.max(stage,S.overdue_to_director?3:2); info.reasons.push('Deadline has passed'); }
    else stage=0;
  }
  if(S.pace_enabled&&o.order_date&&o.deadline>o.order_date&&daysLeft>=0){
    const total=daysUntil(o.deadline)-daysUntil(o.order_date);
    const elapsed=-daysUntil(o.order_date);
    const timePct=total>0?Math.min(100,Math.max(0,elapsed/total*100)):0;
    if(info.pct<timePct-(Number(S.pace_lag_pct)||0)){
      stage=Math.max(stage,1);
      info.reasons.push(`Behind pace: ${info.pct.toFixed(0)}% lifted, ${timePct.toFixed(0)}% of time used`);
    }
  }
  if(S.risk_alert&&info.atRisk&&daysLeft>=0){
    stage=Math.max(stage,1);
    info.reasons.push(`Needs ${(info.reqPerDay/1000).toFixed(2)} MT/day, above capacity`);
  }
  info.stage=stage;
  return info;
};

// Which lifting orders should this person see in My Tasks?
const liftAlertsFor=(orders,S,employeeId,role)=>{
  if(!S.enabled||!S.show_tasks) return [];
  const me=(employeeId===null||employeeId===undefined)?'':String(employeeId);
  const extras=(S.extra_ids||[]).map(String);
  const out=[];
  orders.forEach(o=>{
    const x=liftInfo(o,S);
    if(x.stage<1) return;
    let as=null;
    if(me&&String(S.person_id||'')===me) as='assignee';
    else if(x.stage>=2&&me&&String(S.manager_id||'')===me) as='manager';
    else if(me&&extras.includes(me)&&x.stage>=Number(S.extra_from_stage||1)) as='extra';
    else if(x.stage>=3&&S.notify_director&&role==='director') as='director';
    if(as) out.push({o,...x,as});
  });
  return out.sort((a,b)=>a.daysLeft-b.daysLeft);
};

      sb.from('lifting_orders').select('*, material:material_id(*)'),
    ]);
    setS(cfg);
    setEmps((e||[]).filter(empIsActive).sort((a,b)=>empName(a).localeCompare(empName(b))));
    setOrders(o||[]);
    setLoading(false);
  })();},[]);

  const save=async()=>{
    const r=Number(S.remind_days), m=Number(S.manager_days), d=Number(S.director_days);
    if(!Number.isInteger(r)||r<1) return alert('"Alert person in charge" must be a whole number of days, at least 1.');
    if(!Number.isInteger(m)||m<0||!Number.isInteger(d)||d<0) return alert('Escalation days must be whole numbers (0 or more).');
    if(m+d>r&&!confirm(`Manager and Director days add up to more than ${r}, so the Director alert would only start AFTER the deadline. Continue?`)) return;
    if(S.enabled&&!S.person_id&&!confirm('No person in charge is selected, so only the manager, extra people and Director will be alerted. Continue?')) return;
    const num=(v)=>Number(v)||0;
    const clean={...S,
      default_deadline_days:num(S.default_deadline_days),remind_days:r,manager_days:m,director_days:d,
      extra_from_stage:num(S.extra_from_stage)||1,min_balance_kg:num(S.min_balance_kg),tolerance_pct:num(S.tolerance_pct),
      pace_lag_pct:num(S.pace_lag_pct),buffer_days:num(S.buffer_days),truck_kg:num(S.truck_kg),daily_capacity_kg:num(S.daily_capacity_kg)};
    setSaving(true);
    const {error}=await sb.from('erp_settings').upsert({key:LIFT_SETTING_KEY,value:JSON.stringify(clean)},{onConflict:'key'});
    setSaving(false);
    if(error) return alert(error.message);
    setS(clean);
    logActivity('Settings','update','Lifting order alert settings updated');
    setMsg('Saved.'); setTimeout(()=>setMsg(''),3000);
  };

  const reset=()=>{ if(confirm('Reset every field on this page to the defaults? (Nothing is saved until you press Save.)')) setS(LIFT_DEFAULTS); };

  const num=(k,label,props)=>(<Field label={label}><input type="number" className="form-input" value={S[k]} onChange={e=>s(k,e.target.value)} {...(props||{})}/></Field>);
  const chk=(k,label)=>(<label style={{display:'flex',alignItems:'center',gap:8,fontSize:13,marginBottom:8}}><input type="checkbox" checked={!!S[k]} onChange={e=>s(k,e.target.checked)}/>{label}</label>);
  const empSel=(k,label)=>(<Field label={label}>
    <select className="form-input" value={S[k]||''} onChange={e=>s(k,e.target.value)}>
      <option value="">-- Select person --</option>
      {emps.map(e=><option key={e.id} value={String(e.id)}>{empLabel(e)}</option>)}
    </select>
  </Field>);
  const toggleOff=(i)=>s('off_days',(S.off_days||[]).includes(i)?(S.off_days||[]).filter(x=>x!==i):[...(S.off_days||[]),i]);

  if(loading) return <Loading/>;

  const r=Number(S.remind_days)||0, m=Number(S.manager_days)||0, d=Number(S.director_days)||0;
  const preview=orders.map(o=>({o,...liftInfo(o,S)})).filter(x=>x.o.deadline&&!x.complete).sort((a,b)=>a.daysLeft-b.daysLeft);
  const previewRows=preview.map(x=>[
    <strong>{x.o.order_no}</strong>,
    x.o.scheme,
    repMt(x.balance),
    x.o.deadline,
    licDaysText(x.daysLeft),
    `${repMt(x.reqPerDay)} /day`,
    <span style={{color:LIFT_STAGE_COL[x.stage],fontWeight:600}}>{LIFT_STAGE_LABEL[x.stage]}</span>,
    x.reasons.join('; ')||'—',
  ]);

  return(<div className="page">
    <div className="page-header">
      <div className="page-label">System Settings</div>
      <div className="page-title">Lifting order alerts</div>
    </div>

    <div className="card" style={{marginBottom:16,borderLeft:`3px solid ${S.enabled?'var(--green)':'var(--red)'}`}}>
      {chk('enabled','Lifting deadline alerts are ON (untick to switch every alert off; deadlines and planning figures still show)')}
    </div>

    <div className="card" style={{marginBottom:16}}>
      <div className="section-label">1. Deadline entry</div>
      <div className="form-grid">
        {num('default_deadline_days','Default deadline (days after order date)',{min:0})}
      </div>
      <div style={{marginTop:10}}>{chk('require_deadline','Deadline is compulsory when creating a lifting order')}</div>
      <div className="dim" style={{fontSize:12}}>The default is pre-filled when a new lifting order form is opened. Set 0 for no pre-fill. The deadline can still be changed in the order.</div>
    </div>

    <div className="card" style={{marginBottom:16}}>
      <div className="section-label">2. When to alert (days before the deadline)</div>
      <div className="form-grid">
        {num('remind_days','Alert person in charge (days before deadline)',{min:1})}
        {num('manager_days','Escalate to manager after (more days)',{min:0})}
        {num('director_days','Escalate to Director after (more days)',{min:0})}
      </div>
      <div style={{marginTop:10,fontSize:12,color:'var(--blue)'}}>
        Person in charge from {r} days left · manager from {r-m} days left · Director from {r-m-d} days left (a negative number means after the deadline).
      </div>
      <div style={{marginTop:10}}>
        {chk('alert_overdue','Keep alerting after the deadline passes, until the order is fully lifted')}
        {chk('overdue_to_director','Once overdue, go straight to the Director')}
      </div>
    </div>

    <div className="card" style={{marginBottom:16}}>
      <div className="section-label">3. Who gets alerted</div>
      <div className="form-grid">
        {empSel('person_id','Person in charge of lifting')}
        {empSel('manager_id','Manager (escalation)')}
      </div>
      <div style={{marginTop:10}}>{chk('notify_director','Alert every Director when escalation reaches the Director stage')}</div>
      <div className="form-grid" style={{marginTop:10}}>
        <Field label="Additional people to alert (Ctrl/Cmd-click to pick several)">
          <select multiple size={6} className="form-input" value={(S.extra_ids||[]).map(String)} onChange={e=>s('extra_ids',Array.from(e.target.selectedOptions).map(o=>o.value))}>
            {emps.map(e=><option key={e.id} value={String(e.id)}>{empLabel(e)}</option>)}
          </select>
        </Field>
        <Field label="Additional people start getting alerts from">
          <select className="form-input" value={S.extra_from_stage} onChange={e=>s('extra_from_stage',Number(e.target.value))}>
            <option value={1}>First alert (same time as person in charge)</option>
            <option value={2}>Manager stage</option>
            <option value={3}>Director stage</option>
          </select>
        </Field>
      </div>
      <div className="dim" style={{fontSize:12,marginTop:8}}>A person only sees alerts if their login is linked to their employee profile in the HR portal.</div>
    </div>

    <div className="card" style={{marginBottom:16}}>
      <div className="section-label">4. Quantity rules</div>
      <div className="form-grid">
        {num('min_balance_kg','Only alert if balance is at least (kg)',{min:0})}
        {num('tolerance_pct','Treat order as complete when balance is within (% of allotted)',{min:0,step:'0.1'})}
      </div>
      <div className="dim" style={{fontSize:12,marginTop:8}}>Example: tolerance 1% means a 100 MT order with 0.9 MT left is treated as done and stops alerting. The minimum balance stops alerts for small leftover quantities.</div>
      <div className="form-grid" style={{marginTop:12}}>
        {num('pace_lag_pct','Early warning if lifted % is behind time used by more than (% points)',{min:0})}
      </div>
      <div style={{marginTop:10}}>{chk('pace_enabled','Behind-pace early warning: alert before the normal window if lifting is slower than the time used since the order date')}</div>
    </div>

    <div className="card" style={{marginBottom:16}}>
      <div className="section-label">5. Planning and capacity</div>
      <div className="form-grid">
        {num('buffer_days','Safety buffer (finish lifting this many days before the deadline)',{min:0})}
        {num('truck_kg','Average truck load (kg)',{min:0})}
        {num('daily_capacity_kg','Maximum you can lift per day (kg, 0 = no limit)',{min:0})}
      </div>
      <div style={{marginTop:12}}>
        <div className="form-label" style={{marginBottom:6}}>Weekly off days (not counted as lifting days)</div>
        <div style={{display:'flex',gap:14,flexWrap:'wrap'}}>
          {LIFT_WEEKDAYS.map((n,i)=>(<label key={i} style={{display:'flex',alignItems:'center',gap:6,fontSize:13}}>
            <input type="checkbox" checked={(S.off_days||[]).includes(i)} onChange={()=>toggleOff(i)}/>{n}
          </label>))}
        </div>
      </div>
      <div style={{marginTop:12}}>{chk('risk_alert','Alert the person in charge early if the required daily lifting is above your daily capacity')}</div>
      <div className="dim" style={{fontSize:12}}>Each order then shows: balance ÷ working days left (up to the buffer date) = MT needed per day, and trucks per day.</div>
    </div>

    <div className="card" style={{marginBottom:16}}>
      <div className="section-label">6. Where alerts appear</div>
      {chk('show_tasks','In My Tasks and the red/green badge on the sidebar')}
      {chk('show_dashboard','On the Dashboard alerts list (visible to everyone who opens the Dashboard)')}
    </div>

    <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:24,flexWrap:'wrap'}}>
      <button className="btn btn-green" onClick={save} disabled={saving}>{saving?'Saving…':'Save settings'}</button>
      <button className="btn btn-ghost" onClick={reset}>Reset to defaults</button>
      {msg&&<span style={{fontSize:12,color:'var(--green)'}}>{msg}</span>}
    </div>

    <div className="section-label">Live preview — your current orders under these settings (unsaved changes included)</div>
    <RTable head={['Order','Scheme','Balance (MT)','Deadline','Time left','Needed','Alert stage','Why']} rows={previewRows} empty="No open lifting orders with a deadline yet."/>
  </div>);
}

function LiftingOrders(){
  const [orders,setOrders]=useState([]);
  const [rawMaterials,setRawMaterials]=useState([]);
  const [showForm,setShowForm]=useState(false);
  const [saving,setSaving]=useState(false);
  const [loading,setLoading]=useState(true);
  const blank={order_no:'',order_date:today,material_id:'',scheme:'',allotted_kg:'',deadline:'',notes:''};
  const [editingId,setEditingId]=useState(null);
  const [editLocked,setEditLocked]=useState(0);
  const [S,setS]=useState(LIFT_DEFAULTS);
  const [form,setForm]=useState(blank);
  const f=(k,v)=>setForm(p=>({...p,[k]:v}));

  const load=useCallback(async()=>{
    setLoading(true);
    const [{data:o},{data:rm}]=await Promise.all([
      sb.from('lifting_orders').select('*, material:material_id(*)').order('order_date',{ascending:false}),
      sb.from('product_master').select('*').eq('is_raw_material',true).eq('available_for_supplyco',true).eq('is_active',true),
    ]);
    setS(await loadLiftSettings());
    setOrders(o||[]); setRawMaterials(rm||[]); setLoading(false);
  },[]);
  useEffect(()=>{load();},[load]);

  const selectedMaterial=rawMaterials.find(m=>m.id===form.material_id);
const schemeOptions=selectedMaterial?.scheme_list?selectedMaterial.scheme_list.split(',').map(s=>s.trim()).filter(s=>s.toLowerCase()!=='private'):[];

  const save=async()=>{
    if(!form.order_no||!form.material_id||!form.scheme||!form.allotted_kg) return alert('Order no., material, scheme and allotted quantity required.');
    if(S.require_deadline&&!form.deadline) return alert('Deadline is required.');
    if(form.deadline&&form.deadline<form.order_date) return alert('The deadline cannot be before the order date.');
    if(Number(form.allotted_kg)<=0) return alert('Allotted quantity must be above 0.');

    if(editingId){
      const orig=orders.find(x=>x.id===editingId);
      if(!orig) return alert('This order could not be found. Reload the page and try again.');
      if(Number(form.allotted_kg)<Number(orig.lifted_kg)) return alert(`Allotted quantity cannot be below the quantity already lifted (${fmtMT(orig.lifted_kg)}).`);
      if(editLocked>0&&(form.material_id!==orig.material_id||form.scheme!==orig.scheme)) return alert('Material and scheme cannot be changed after stock has been received against this order.');
      if(orders.some(x=>x.id!==editingId&&x.order_no===form.order_no)&&!confirm(`Another lifting order already uses the number "${form.order_no}". Save anyway?`)) return;
      setSaving(true);
      const upd={order_no:form.order_no,order_date:form.order_date,material_id:form.material_id,scheme:form.scheme,allotted_kg:Number(form.allotted_kg),deadline:form.deadline||null,notes:form.notes};
      const {data,error}=await sb.from('lifting_orders').update(upd).eq('id',editingId).select('*, material:material_id(*)').single();
      if(error){alert(error.message);setSaving(false);return;}
      setOrders(p=>p.map(x=>x.id===editingId?data:x));
      logActivity('Lifting Orders','update',`Edited ${form.order_no} — ${form.allotted_kg}kg, deadline ${form.deadline||'none'}`);
      setSaving(false); closeForm();
      return;
    }

    setSaving(true);
    const row={order_no:form.order_no,order_date:form.order_date,material_id:form.material_id,scheme:form.scheme,allotted_kg:Number(form.allotted_kg),lifted_kg:0,deadline:form.deadline||null,notes:form.notes};
    const {data,error}=await sb.from('lifting_orders').insert(row).select('*, material:material_id(*)').single();
    if(error){alert(error.message);setSaving(false);return;}
    setOrders(p=>[data,...p]); closeForm(); setSaving(false);
    logActivity('Lifting Orders','create',`${form.order_no} — ${form.allotted_kg}kg ${selectedMaterial?.product_name} (${form.scheme})`);
  };

  const closeForm=()=>{ setForm(blank); setEditingId(null); setEditLocked(0); setShowForm(false); };

  const startEdit=async(o)=>{
    const {count}=await sb.from('fci_inwards').select('id',{count:'exact',head:true}).eq('lifting_order_id',o.id);
    setEditLocked(Math.max(count||0,Number(o.lifted_kg)>0?1:0));
    setEditingId(o.id);
    setForm({order_no:o.order_no||'',order_date:o.order_date||today,material_id:o.material_id||'',scheme:o.scheme||'',allotted_kg:String(o.allotted_kg??''),deadline:o.deadline||'',notes:o.notes||''});
    setShowForm(true);
  };

  const setDeadline=async(o)=>{
    const v=prompt('Deadline for '+o.order_no+' (YYYY-MM-DD). Leave empty to clear:',o.deadline||'');
    if(v===null) return;
    const dd=v.trim();
    if(dd&&!/^\d{4}-\d{2}-\d{2}$/.test(dd)) return alert('Use the format YYYY-MM-DD, for example 2026-11-30.');
    const {error}=await sb.from('lifting_orders').update({deadline:dd||null}).eq('id',o.id);
    if(error) return alert(error.message);
    setOrders(p=>p.map(x=>x.id===o.id?{...x,deadline:dd||null}:x));
    logActivity('Lifting Orders','update',`${o.order_no} deadline → ${dd||'cleared'}`);
  };

  const del=async(o)=>{
    if(!confirm('Delete this lifting order? This cannot be undone.')) return;
    const {error}=await sb.from('lifting_orders').delete().eq('id',o.id);
    if(error){alert('Could not delete: '+error.message);return;}
    setOrders(p=>p.filter(x=>x.id!==o.id));
    logActivity('Lifting Orders','delete',`${o.order_no} deleted`);
  };

  if(loading) return <Loading/>;

  return(<div className="page">
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:24,flexWrap:'wrap',gap:12}}>
      <div className="page-header" style={{marginBottom:0}}>
        <div className="page-label">Raw Materials</div>
        <div className="page-title">Lifting orders</div>
      </div>
      <button className="btn btn-amber" onClick={()=>{ if(showForm){ closeForm(); return; } setEditingId(null); setEditLocked(0); setForm({...blank,deadline:Number(S.default_deadline_days)>0?licShift(today,Number(S.default_deadline_days)):''}); setShowForm(true); }}>+ New lifting order</button>
    </div>

    {showForm&&(
      <FormCard title={editingId?'Edit lifting order':'Register lifting order'} col="var(--amber)" onSave={save} onCancel={closeForm} saving={saving}>
        <div className="form-grid">
          <Field label="Order no. ★"><input className="form-input" value={form.order_no} onChange={e=>f('order_no',e.target.value)}/></Field>
          <Field label="Date"><input type="date" className="form-input" value={form.order_date} onChange={e=>f('order_date',e.target.value)}/></Field>
          <Field label="Raw Material">
            <select className="form-input" value={form.material_id} disabled={editLocked>0} onChange={e=>{f('material_id',e.target.value);f('scheme','');}}>
              <option value="">-- Select material --</option>
              {rawMaterials.map(m=><option key={m.id} value={m.id}>{m.product_name}</option>)}
            </select>
          </Field>
          <Field label="Scheme">
  <select className="form-input" value={form.scheme} onChange={e=>f('scheme',e.target.value)} disabled={!selectedMaterial||editLocked>0}>
    <option value="">{selectedMaterial?'-- Select scheme --':'-- Select material first --'}</option>
    {schemeOptions.map(s=><option key={s}>{s}</option>)}
  </select>
</Field>
          <Field label="Allotted quantity (kg) ★"><input type="number" className="form-input" style={{fontWeight:600}} value={form.allotted_kg} onChange={e=>f('allotted_kg',e.target.value)}/></Field>
          <Field label={S.require_deadline?'Lifting deadline ★':'Lifting deadline'}><input type="date" className="form-input" min={form.order_date} value={form.deadline} onChange={e=>f('deadline',e.target.value)}/></Field>
          {editingId&&<div style={{gridColumn:'1 / -1',fontSize:12,color:editLocked>0?'var(--blue)':'var(--muted)'}}>
            Already lifted: <strong>{fmtMT((orders.find(x=>x.id===editingId)||{}).lifted_kg)}</strong> (from FCI Inwards, not editable here).{editLocked>0?' Material and scheme are locked because stock has been received against this order.':''}
          </div>}
          <Field label="Notes"><input className="form-input" value={form.notes} onChange={e=>f('notes',e.target.value)}/></Field>
        </div>
      </FormCard>
    )}

    <TableWrap><table>
      <thead><tr><th>Order no.</th><th>Date</th><th>Material</th><th>Scheme</th><th>Allotted</th><th>Lifted</th><th>Balance</th><th>Deadline</th><th>Status</th><th>Needed</th><th></th></tr></thead>
      <tbody>
        {orders.length===0&&<tr><td colSpan={11}><Empty msg="No lifting orders yet."/></td></tr>}
        {orders.map(o=>{
          const balance=Number(o.allotted_kg)-Number(o.lifted_kg);
          const li=liftInfo(o,S);
          const lcol=li.daysLeft!==null&&li.daysLeft<0?'var(--red)':LIFT_STAGE_COL[li.stage];
          return(<tr key={o.id}>
            <td><strong className="mono">{o.order_no}</strong></td>
            <td className="mono dim">{o.order_date}</td>
            <td>{o.material?.product_name||'—'}</td>
            <td><span className="badge badge-blue">{o.scheme}</span></td>
            <td className="mono">{fmtMT(o.allotted_kg)}</td>
            <td className="mono" style={{color:'var(--green)'}}>{fmtMT(o.lifted_kg)}</td>
            <td className="mono" style={{color:balance>0?'var(--amber)':'var(--green)',fontWeight:600}}>{fmtMT(balance)}</td>
            <td className="mono dim">{o.deadline||'—'} <button className="btn btn-ghost btn-sm" onClick={()=>setDeadline(o)}>✎</button></td>
            <td>
              {li.complete?<span className="badge badge-green">Complete</span>
                :!o.deadline?<span className="dim">No deadline</span>
                :<span className="badge" style={{background:`color-mix(in srgb, ${lcol} 18%, transparent)`,color:lcol}}>{licDaysText(li.daysLeft)}</span>}
              {li.atRisk&&!li.complete&&<div style={{fontSize:11,color:'var(--red)'}}>⚠ above daily capacity</div>}
            </td>
            <td className="mono dim">{o.deadline&&!li.complete?`${fmtMT(li.reqPerDay)}/day${li.trucksPerDay?` · ${li.trucksPerDay} truck${li.trucksPerDay===1?'':'s'}`:''}`:'—'}</td>
            <td><div style={{display:'flex',gap:6}}>
              <button className="btn btn-blue btn-sm" onClick={()=>startEdit(o)}>Edit</button>
              <button className="btn btn-red btn-sm" onClick={()=>del(o)}>✕</button>
            </div></td>
          </tr>);
        })}
      </tbody>
    </table></TableWrap>
  </div>);
}

function Returns(){
  const [returns,setReturns]=useState([]);
  const [products,setProducts]=useState([]);
  const [depots,setDepots]=useState([]);
  const [showForm,setShowForm]=useState(false);
  const [saving,setSaving]=useState(false);
  const [loading,setLoading]=useState(true);
  const REASONS=['Depot Rejection','Damaged/Spoiled','Excess Sent','Quality Issue','Other'];
  const blank={date:today,product_id:'',qty_bags:'',source_name:'',reason:'Depot Rejection',notes:''};
  const [form,setForm]=useState(blank);
  const f=(k,v)=>setForm(p=>({...p,[k]:v}));

  const load=useCallback(async()=>{
    setLoading(true);
    const [{data:r},{data:p},{data:dep}]=await Promise.all([
      sb.from('product_returns').select('*, product:product_id(*)').gte('date',monthStart).order('date',{ascending:false}),
      sb.from('product_master').select('*').eq('is_raw_material',false).eq('is_active',true).order('product_name'),
      sb.from('depots').select('*').order('name'),
    ]);
    setReturns(r||[]); setProducts(p||[]); setDepots(dep||[]); setLoading(false);
  },[]);
  useEffect(()=>{load();},[load]);

  const save=async()=>{
    if(!form.product_id||!form.qty_bags) return alert('Product and quantity required.');
    setSaving(true);
    const row={date:form.date,product_id:form.product_id,qty_bags:Number(form.qty_bags),source_name:form.source_name,reason:form.reason,notes:form.notes};
    const {data,error}=await sb.from('product_returns').insert(row).select('*, product:product_id(*)').single();
    if(error){alert(error.message);setSaving(false);return;}
    const {data:s}=await sb.from('current_stock').select('*').eq('product_id',form.product_id).maybeSingle();
    if(s) await sb.from('current_stock').update({qty_bags:Number(s.qty_bags)+Number(form.qty_bags),updated_at:new Date().toISOString()}).eq('id',s.id);
    else await sb.from('current_stock').insert({product_id:form.product_id,qty_bags:Number(form.qty_bags)});
    setReturns(p=>[data,...p]); setForm(blank); setShowForm(false); setSaving(false);
    logActivity('Returns','create',`${form.qty_bags} bags of ${data.product?.product_name} returned from ${form.source_name||'—'}`);
  };

  const del=async(r)=>{
    if(!allow('record.delete')) return alert('Your role cannot delete records.');
    if(!confirm('Delete this return entry? Stock will be reversed (deducted back).')) return;
    await sb.from('product_returns').delete().eq('id',r.id);
    const {data:s}=await sb.from('current_stock').select('*').eq('product_id',r.product_id).maybeSingle();
    if(s) await sb.from('current_stock').update({qty_bags:Math.max(0,Number(s.qty_bags)-Number(r.qty_bags)),updated_at:new Date().toISOString()}).eq('id',s.id);
    setReturns(p=>p.filter(x=>x.id!==r.id));
    logActivity('Returns','delete',`Return of ${r.qty_bags} bags reversed`);
  };

  if(loading) return <Loading/>;
  const totalBags=returns.reduce((s,r)=>s+Number(r.qty_bags),0);

  return(<div className="page">
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:24,flexWrap:'wrap',gap:12}}>
      <div className="page-header" style={{marginBottom:0}}>
        <div className="page-label">Mill Operations</div>
        <div className="page-title">Returns — this month: {fmt(totalBags)} bags</div>
      </div>
      <button className="btn btn-blue" onClick={()=>setShowForm(v=>!v)}>+ Log return</button>

    {showForm&&(
      <FormCard title="Log product return" col="var(--blue)" onSave={save} onCancel={()=>setShowForm(false)} saving={saving}>
        <div className="form-grid">
          <Field label="Date"><input type="date" className="form-input" value={form.date} max={today} onChange={e=>f('date',e.target.value)}/></Field>
          <Field label="Product">
            <select className="form-input" value={form.product_id} onChange={e=>f('product_id',e.target.value)}>
              <option value="">-- Select product --</option>
              {products.map(p=><option key={p.id} value={p.id}>{p.product_name}</option>)}
            </select>
          </Field>
          <Field label="Bags returned ★"><input type="number" className="form-input" style={{fontWeight:600}} value={form.qty_bags} onChange={e=>f('qty_bags',e.target.value)}/></Field>
          <Field label="Returned from (depot)">
            <select className="form-input" value={form.source_name} onChange={e=>f('source_name',e.target.value)}>
              <option value="">-- Select depot --</option>
              {depots.map(d=><option key={d.id} value={d.name}>{d.name}</option>)}
            </select>
          </Field>
          <Field label="Reason">
            <select className="form-input" value={form.reason} onChange={e=>f('reason',e.target.value)}>
              {REASONS.map(r=><option key={r}>{r}</option>)}
            </select>
          </Field>
          <Field label="Notes"><input className="form-input" value={form.notes} onChange={e=>f('notes',e.target.value)}/></Field>
        </div>
      </FormCard>
    )}

    <TableWrap><table>
      <thead><tr><th>Date</th><th>Product</th><th>Bags</th><th>From</th><th>Reason</th><th></th></tr></thead>
      <tbody>
        {returns.length===0&&<tr><td colSpan={6}><Empty msg="No returns logged this month."/></td></tr>}
        {returns.map(r=>(<tr key={r.id}>
          <td className="mono dim">{r.date}</td>
          <td><strong>{r.product?.product_name||'—'}</strong></td>
          <td><strong style={{color:'var(--blue)',fontFamily:'var(--mono)'}}>+{fmt(r.qty_bags)}</strong></td>
          <td className="dim">{r.source_name||'—'}</td>
          <td><span className="badge badge-amber">{r.reason}</span></td>
          <td><button className="btn btn-red btn-sm" onClick={()=>del(r)}>✕</button></td>
        </tr>))}
      </tbody>
    </table></TableWrap>
  </div>);
}

// ══════════════════════════════════════════════════════════
// FCI INWARDS
// ══════════════════════════════════════════════════════════
function FciInwards(){
  const [receipts,setReceipts]=useState([]);
  const [liftingOrders,setLiftingOrders]=useState([]);
  const [suppliers,setSuppliers]=useState([]);
  const [showForm,setShowForm]=useState(false);
  const [saving,setSaving]=useState(false);
  const [loading,setLoading]=useState(true);
  const [month,setMonth]=useState(new Date().getMonth()+1);
  const [year,setYear]=useState(new Date().getFullYear());
  const {start:periodStart,end:periodEnd}=monthRange(month,year);
  const periodLabel=`${MONTH_NAMES[month-1]} ${year}`;
  const blank={date:today,lifting_order_id:'',received_kg:'',vehicle_no:'',supplier_id:'',notes:''};
const [form,setForm]=useState(()=>({...blank, supplier_id: localStorage.getItem('lastFciSupplierId')||''}));
  const f=(k,v)=>setForm(p=>({...p,[k]:v}));

  const load=useCallback(async()=>{
    setLoading(true);
    const [{data:r},{data:lo},{data:sup}]=await Promise.all([
      sb.from('fci_inwards').select('*, material:material_id(*), lifting_order:lifting_order_id(*), supplier:supplier_id(*)').gte('date',periodStart).lte('date',periodEnd).order('date',{ascending:false}),
      sb.from('lifting_orders').select('*, material:material_id(*)').order('order_date',{ascending:false}),
      sb.from('suppliers').select('*').order('name'),
    ]);
    setReceipts(r||[]); setLiftingOrders(lo||[]); setSuppliers(sup||[]); setLoading(false);
  },[periodStart,periodEnd]);
  useEffect(()=>{load();},[load]);

  const ordersWithBalance=liftingOrders.filter(o=>Number(o.allotted_kg)-Number(o.lifted_kg)>0);
  const selectedOrder=liftingOrders.find(o=>o.id===form.lifting_order_id);

  const save=async()=>{
    if(!form.lifting_order_id||!form.received_kg||!form.supplier_id) return alert('Lifting order, received quantity and supplier required.');
    setSaving(true);
    const row={
      date:form.date,
      material_id:selectedOrder.material_id,
      scheme:selectedOrder.scheme,
      lifting_order_id:form.lifting_order_id,
      received_kg:Number(form.received_kg),
      vehicle_no:form.vehicle_no,
      supplier_id:form.supplier_id,
      notes:form.notes
    };
    const {data,error}=await sb.from('fci_inwards').insert(row).select('*, material:material_id(*), lifting_order:lifting_order_id(*), supplier:supplier_id(*)').single();
    if(error){alert(error.message);setSaving(false);return;}

    const {data:bucket}=await sb.from('raw_material_scheme_stock').select('*').eq('product_id',selectedOrder.material_id).eq('scheme',selectedOrder.scheme).maybeSingle();
    if(bucket){
      await sb.from('raw_material_scheme_stock').update({qty_kg:Number(bucket.qty_kg)+Number(form.received_kg),updated_at:new Date().toISOString()}).eq('id',bucket.id);
    } else {
      await sb.from('raw_material_scheme_stock').insert({product_id:selectedOrder.material_id,scheme:selectedOrder.scheme,qty_kg:Number(form.received_kg)});
    }

    await sb.from('lifting_orders').update({lifted_kg:Number(selectedOrder.lifted_kg)+Number(form.received_kg)}).eq('id',form.lifting_order_id);

    setReceipts(p=>[data,...p]);
    setLiftingOrders(p=>p.map(o=>o.id===form.lifting_order_id?{...o,lifted_kg:Number(o.lifted_kg)+Number(form.received_kg)}:o));
    localStorage.setItem('lastFciSupplierId', form.supplier_id);
    setForm({...blank, supplier_id: form.supplier_id}); setShowForm(false); setSaving(false);
    logActivity('FCI Inwards','create',`${form.received_kg}kg ${selectedOrder.material?.product_name} against ${selectedOrder.order_no}`);
  };

  const del=async(r)=>{
    if(!allow('record.delete')) return alert('Your role cannot delete records.');
    if(!confirm('Delete this receipt? Stock and lifting order balance will be reversed.')) return;
    await sb.from('fci_inwards').delete().eq('id',r.id);
    const {data:bucket}=await sb.from('raw_material_scheme_stock').select('*').eq('product_id',r.material_id).eq('scheme',r.scheme).maybeSingle();
    if(bucket) await sb.from('raw_material_scheme_stock').update({qty_kg:Number(bucket.qty_kg)-Number(r.received_kg),updated_at:new Date().toISOString()}).eq('id',bucket.id);
    if(r.lifting_order_id){
      const {data:lo}=await sb.from('lifting_orders').select('*').eq('id',r.lifting_order_id).maybeSingle();
      if(lo) await sb.from('lifting_orders').update({lifted_kg:Math.max(0,Number(lo.lifted_kg)-Number(r.received_kg))}).eq('id',r.lifting_order_id);
    }
    setReceipts(p=>p.filter(x=>x.id!==r.id));
    logActivity('FCI Inwards','delete',`Receipt deleted`);
  };

  if(loading) return <Loading/>;
  const total=receipts.reduce((s,r)=>s+Number(r.received_kg),0);

  return(<div className="page">
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:24,flexWrap:'wrap',gap:12}}>
      <div className="page-header" style={{marginBottom:0}}>
        <div className="page-label">Raw Materials</div>
        <div className="page-title">FCI Inwards — {periodLabel}: {fmtMT(total)}</div>
        <MonthYearPicker month={month} year={year} setMonth={setMonth} setYear={setYear}/>
      </div>
      <button className="btn btn-amber" onClick={()=>setShowForm(v=>!v)}>+ Log receipt</button>
    </div>

    {showForm&&(
      <FormCard title="New FCI receipt" col="var(--amber)" onSave={save} onCancel={()=>setShowForm(false)} saving={saving}>
        <div className="form-grid">
          <Field label="Date"><input type="date" className="form-input" value={form.date} max={today} onChange={e=>f('date',e.target.value)}/></Field>
          <Field label="Lifting order">
            <select className="form-input" value={form.lifting_order_id} onChange={e=>f('lifting_order_id',e.target.value)}>
              <option value="">-- Select lifting order --</option>
              {ordersWithBalance.map(o=><option key={o.id} value={o.id}>{o.order_no} · {o.material?.product_name} · Balance: {fmtMT(Number(o.allotted_kg)-Number(o.lifted_kg))}</option>)}
            </select>
          </Field>
          <Field label="Scheme">
            <select className="form-input" value={selectedOrder?.scheme||''} disabled style={{opacity:0.6}}>
              <option>{selectedOrder?.scheme||'-- auto from lifting order --'}</option>
            </select>
          </Field>
          <Field label="Received (kg) ★"><input type="number" className="form-input" style={{fontWeight:600}} value={form.received_kg} onChange={e=>f('received_kg',e.target.value)}/></Field>
          <Field label="Vehicle no. ★"><input className="form-input" value={form.vehicle_no} onChange={e=>f('vehicle_no',e.target.value.toUpperCase())}/></Field>
          <Field label="Supplier">
            <select className="form-input" value={form.supplier_id} onChange={e=>{
              if(e.target.value==='__new__'){
                const name=prompt('New supplier name:');
                if(name&&name.trim()){
                  sb.from('suppliers').insert({name:name.trim()}).select().single().then(({data,error})=>{
                    if(error) return alert(error.message);
                    setSuppliers(p=>[...p,data]); f('supplier_id',data.id);
                  });
                }
              } else f('supplier_id',e.target.value);
            }}>
              <option value="">-- Select supplier --</option>
              {suppliers.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
              <option value="__new__">+ Add new supplier…</option>
            </select>
          </Field>
          <Field label="Notes"><input className="form-input" value={form.notes} onChange={e=>f('notes',e.target.value)}/></Field>
        </div>
      </FormCard>
    )}

    <TableWrap><table>
      <thead><tr><th>Date</th><th>Order</th><th>Material</th><th>Scheme</th><th>Received</th><th>Vehicle</th><th>Supplier</th><th></th></tr></thead>
      <tbody>
        {receipts.length===0&&<tr><td colSpan={8}><Empty/></td></tr>}
        {receipts.map(r=>(<tr key={r.id}>
          <td className="mono dim">{r.date}</td>
          <td><strong style={{color:'var(--amber)',fontFamily:'var(--mono)'}}>{r.lifting_order?.order_no||'—'}</strong></td>
          <td>{r.material?.product_name||'—'}</td>
          <td><span className="badge badge-blue">{r.scheme}</span></td>
          <td><strong style={{color:'var(--green)',fontFamily:'var(--mono)'}}>{fmtMT(r.received_kg)}</strong></td>
          <td className="dim">{r.vehicle_no||'—'}</td>
          <td className="dim">{r.supplier?.name||'—'}</td>
          <td><button className="btn btn-red btn-sm" onClick={()=>del(r)}>✕</button></td>
        </tr>))}
      </tbody>
    </table></TableWrap>
  </div>);
}

// PRIVATE INWARDS
// ══════════════════════════════════════════════════════════
function PrivateInwards(){
  const [entries,setEntries]=useState([]);
  const [rawMaterials,setRawMaterials]=useState([]);
  const [showForm,setShowForm]=useState(false);
  const [saving,setSaving]=useState(false);
  const [loading,setLoading]=useState(true);
  const [month,setMonth]=useState(new Date().getMonth()+1);
  const [year,setYear]=useState(new Date().getFullYear());
  const {start:periodStart,end:periodEnd}=monthRange(month,year);
  const periodLabel=`${MONTH_NAMES[month-1]} ${year}`;
  const blank={date:today,party_name:'',material_id:'',entry_mode:'weight',qty_bags_input:'',qty_kg:'',vehicle_no:'',lorry_receipt_no:'',notes:''};
  const [form,setForm]=useState(blank);
  const f=(k,v)=>setForm(p=>({...p,[k]:v}));

  const load=useCallback(async()=>{
    setLoading(true);
    const [{data:e},{data:rm}]=await Promise.all([
  sb.from('private_inwards').select('*, material:material_id(*)').gte('date',periodStart).lte('date',periodEnd).order('date',{ascending:false}),
  sb.from('product_master').select('*').eq('is_active',true).order('product_name'),
]);
setEntries(e||[]); setRawMaterials(rm||[]); setLoading(false);
  },[periodStart,periodEnd]);
  useEffect(()=>{load();},[load]);

  const selectedMaterial=rawMaterials.find(m=>m.id===form.material_id);

  const creditStock=async(materialId, kg)=>{
    const material=rawMaterials.find(m=>m.id===materialId);
    if(!material) return;

    if(material.is_raw_material){
      if(material.has_schemes){
        const {data:bucket}=await sb.from('raw_material_scheme_stock').select('*').eq('product_id',materialId).eq('scheme','Private').maybeSingle();
        if(bucket){
          await sb.from('raw_material_scheme_stock').update({qty_kg:Number(bucket.qty_kg)+kg,updated_at:new Date().toISOString()}).eq('id',bucket.id);
        } else {
          await sb.from('raw_material_scheme_stock').insert({product_id:materialId,scheme:'Private',qty_kg:kg});
        }
      } else {
        const {data:bucket}=await sb.from('raw_material_stock').select('*').eq('product_id',materialId).maybeSingle();
        if(bucket){
          await sb.from('raw_material_stock').update({qty_kg:Number(bucket.qty_kg)+kg,updated_at:new Date().toISOString()}).eq('id',bucket.id);
        } else {
          await sb.from('raw_material_stock').insert({product_id:materialId,qty_kg:kg});
        }
      }
    } else {
      const bagSize=packSizeOf(material);
      if(bagSize>0){
        const bagsDelta=kg/bagSize;
        const {data:stockRow}=await sb.from('current_stock').select('*').eq('product_id',materialId).maybeSingle();
        if(stockRow){
          await sb.from('current_stock').update({qty_bags:Number(stockRow.qty_bags)+bagsDelta,updated_at:new Date().toISOString()}).eq('id',stockRow.id);
        } else {
          await sb.from('current_stock').insert({product_id:materialId,qty_bags:bagsDelta});
        }
      } else {
        const {data:kgRow}=await sb.from('raw_material_stock').select('*').eq('product_id',materialId).maybeSingle();
        if(kgRow){
          await sb.from('raw_material_stock').update({qty_kg:Number(kgRow.qty_kg)+kg,updated_at:new Date().toISOString()}).eq('id',kgRow.id);
        } else {
          await sb.from('raw_material_stock').insert({product_id:materialId,qty_kg:kg});
        }
      }
    }
  };

  const save=async()=>{
    if(!form.party_name||!form.material_id) return alert('Party name and material required.');
    let finalKg;
    if(form.entry_mode==='bags'&&selectedMaterial?.has_standard_weight){
      if(!form.qty_bags_input) return alert('Enter bag count.');
      finalKg=Number(form.qty_bags_input)*Number(selectedMaterial.bag_weight);
    } else {
      if(!form.qty_kg) return alert('Enter weight received.');
      finalKg=Number(form.qty_kg);
    }
    setSaving(true);
    const row={date:form.date,party_name:form.party_name,material_id:form.material_id,qty_kg:finalKg,vehicle_no:form.vehicle_no,lorry_receipt_no:form.lorry_receipt_no,notes:form.notes};
    const {data,error}=await sb.from('private_inwards').insert(row).select('*, material:material_id(*)').single();
    if(error){alert(error.message);setSaving(false);return;}
    await creditStock(form.material_id, finalKg);
    setEntries(p=>[data,...p]); setForm(blank); setShowForm(false); setSaving(false);
    logActivity('Private Inwards','create',`${form.party_name} — ${finalKg}kg of ${selectedMaterial?.product_name}`);
  };

  const del=async(e)=>{
    if(!allow('record.delete')) return alert('Your role cannot delete records.');
    if(!confirm('Delete entry? Stock will be reversed.')) return;
    await sb.from('private_inwards').delete().eq('id',e.id);
    await creditStock(e.material_id, -Number(e.qty_kg));
    setEntries(p=>p.filter(x=>x.id!==e.id));
    logActivity('Private Inwards','delete',`${e.party_name} — ${e.qty_kg}kg deleted`);
  };

  if(loading) return <Loading/>;
  const total=entries.reduce((s,e)=>s+Number(e.qty_kg),0);

  return(<div className="page">
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:24,flexWrap:'wrap',gap:12}}>
      <div className="page-header" style={{marginBottom:0}}>
        <div className="page-label">Raw Materials</div>
        <div className="page-title">Private inwards — {periodLabel}: {fmtMT(total)}</div>
        <MonthYearPicker month={month} year={year} setMonth={setMonth} setYear={setYear}/>
      </div>
      <button className="btn btn-amber" onClick={()=>setShowForm(v=>!v)}>+ Log receipt</button>
    </div>

    {showForm&&(
      <FormCard title="Log private inward" col="var(--amber)" onSave={save} onCancel={()=>setShowForm(false)} saving={saving}>
        <div className="form-grid">
          <Field label="Date"><input type="date" className="form-input" value={form.date} max={today} onChange={e=>f('date',e.target.value)}/></Field>
          <Field label="Party name ★"><input className="form-input" value={form.party_name} onChange={e=>f('party_name',e.target.value)}/></Field>
          <Field label="Item">
  <select className="form-input" value={form.material_id} onChange={e=>f('material_id',e.target.value)}>
    <option value="">-- Select item --</option>
    {rawMaterials.map(m=><option key={m.id} value={m.id}>{m.product_name}{m.is_raw_material?'':' (finished/by-product)'}</option>)}
  </select>
</Field>
          {selectedMaterial?.has_standard_weight&&(
            <Field label="Entry mode">
              <select className="form-input" value={form.entry_mode} onChange={e=>f('entry_mode',e.target.value)}>
                <option value="weight">Enter weight directly</option>
                <option value="bags">Enter bag count</option>
              </select>
            </Field>
          )}
          {(form.entry_mode==='bags'&&selectedMaterial?.has_standard_weight)?(
            <Field label={`Bags received ★ (${selectedMaterial.bag_weight}${selectedMaterial.unit}/bag)`}><input type="number" className="form-input" style={{fontWeight:600}} value={form.qty_bags_input} onChange={e=>f('qty_bags_input',e.target.value)}/></Field>
          ):(
            <Field label="Received (kg) ★"><input type="number" className="form-input" style={{fontWeight:600}} value={form.qty_kg} onChange={e=>f('qty_kg',e.target.value)}/></Field>
          )}
          <Field label="Vehicle no."><input className="form-input" value={form.vehicle_no} onChange={e=>f('vehicle_no',e.target.value)}/></Field>
          <Field label="Lorry receipt no."><input className="form-input" value={form.lorry_receipt_no} onChange={e=>f('lorry_receipt_no',e.target.value)}/></Field>
          <Field label="Notes"><input className="form-input" value={form.notes} onChange={e=>f('notes',e.target.value)}/></Field>
        </div>
      </FormCard>
    )}

    <TableWrap><table>
      <thead><tr><th>Date</th><th>Party</th><th>Material</th><th>Received</th><th>Vehicle</th><th></th></tr></thead>
      <tbody>
        {entries.length===0&&<tr><td colSpan={6}><Empty/></td></tr>}
        {entries.map(e=>(<tr key={e.id}>
          <td className="mono dim">{e.date}</td>
          <td><strong>{e.party_name}</strong></td>
          <td>{e.material?.product_name||'—'}</td>
          <td><strong style={{color:'var(--green)',fontFamily:'var(--mono)'}}>{fmtMT(e.qty_kg)}</strong></td>
          <td className="dim">{e.vehicle_no||'—'}</td>
          <td><button className="btn btn-red btn-sm" onClick={()=>del(e)}>✕</button></td>
        </tr>))}
      </tbody>
    </table></TableWrap>
  </div>);
}

// ══════════════════════════════════════════════════════════
// SUPPLYCO DISPATCH
// ══════════════════════════════════════════════════════════
function Dispatch(){
  const [dispatches,setDispatches]=useState([]);
  const [workOrders,setWorkOrders]=useState([]);
  const [finishedProducts,setFinishedProducts]=useState([]);
  const [wheatMaterial,setWheatMaterial]=useState(null);
  const [showDF,setShowDF]=useState(false);
  const [saving,setSaving]=useState(false);
  const [loading,setLoading]=useState(true);
  const [month,setMonth]=useState(new Date().getMonth()+1);
  const [year,setYear]=useState(new Date().getFullYear());
  const {start:periodStart,end:periodEnd}=monthRange(month,year);
  const periodLabel=`${MONTH_NAMES[month-1]} ${year}`;
  const blankD={date:today,invoice_no:'',delivery_order_no:'',work_order_id:'',scheme:'',product_id:'',batch_no:'',depot_name:'',district:'KNR',qty_bags:'',vehicle_no:'',notes:''};
  const [dForm,setDForm]=useState(blankD);
  const [depots,setDepots]=useState([]);
  const [depotAllotments,setDepotAllotments]=useState({});
  const [woAllotments,setWoAllotments]=useState({});
  const df=(k,v)=>setDForm(p=>({...p,[k]:v}));
  const load=useCallback(async()=>{
    setLoading(true);
    const [{data:d},{data:w},{data:fp},{data:wm},{data:dep},{data:woa}]=await Promise.all([
      sb.from('supplyco_dispatches').select('*, product:product_id(*)').gte('date',periodStart).lte('date',periodEnd).order('date',{ascending:false}),
      sb.from('work_orders').select('*').order('work_order_date',{ascending:false}),
      sb.from('product_master').select('*').eq('is_raw_material',false).eq('is_active',true).eq('available_for_supplyco_dispatch',true).order('product_name'),
      sb.from('product_master').select('*').eq('is_raw_material',true).eq('has_schemes',true).limit(1),
      sb.from('depots').select('*').order('name'),
      sb.from('work_order_allotments').select('*, depot:depot_id(*)'),
    ]);
    setDispatches(d||[]); setWorkOrders(w||[]); setFinishedProducts(fp||[]); setWheatMaterial((wm&&wm[0])||null);
    setDepots(dep||[]); setWoAllotments(woa||[]); setLoading(false);
  },[periodStart,periodEnd]);
  useEffect(()=>{load();},[load]);

  const schemeOptions=(wheatMaterial?.scheme_list?wheatMaterial.scheme_list.split(',').map(s=>s.trim()):['NPS','PHH','AAY']).filter(s=>s.toLowerCase()!=='private');
  const productForScheme=(scheme)=>finishedProducts.find(p=>p.product_name.toUpperCase().includes(scheme));

  const saveDispatch=async()=>{
    if(!dForm.invoice_no||!dForm.depot_name||!dForm.qty_bags||!dForm.scheme) return alert('Scheme, invoice, depot and quantity required.');
    const prod=productForScheme(dForm.scheme);
    if(!prod) return alert(`No finished product found matching scheme "${dForm.scheme}" — check Product Master.`);
    setSaving(true);
    const row={date:dForm.date,invoice_no:dForm.invoice_no,delivery_order_no:dForm.delivery_order_no,work_order_id:dForm.work_order_id||null,scheme:dForm.scheme,product_id:prod.id,batch_no:dForm.batch_no,depot_name:dForm.depot_name,district:dForm.district,qty_bags:Number(dForm.qty_bags),vehicle_no:dForm.vehicle_no,notes:dForm.notes};
    const {data,error}=await sb.from('supplyco_dispatches').insert(row).select('*, product:product_id(*)').single();
    if(error){alert(error.message);setSaving(false);return;}
    const {data:s}=await sb.from('current_stock').select('*').eq('product_id',prod.id).maybeSingle();
    if(s) await sb.from('current_stock').update({qty_bags:Math.max(0,Number(s.qty_bags)-Number(dForm.qty_bags)),updated_at:new Date().toISOString()}).eq('id',s.id);
    setDispatches(p=>[data,...p]); setDForm(blankD); setShowDF(false); setSaving(false);
    logActivity('Dispatch','create',`Invoice ${dForm.invoice_no} — ${dForm.qty_bags} bags to ${dForm.depot_name}`);
  };

  const delD=async(d)=>{
    if(!allow('record.delete')) return alert('Your role cannot delete records.');
    if(!confirm('Delete dispatch? Stock will be restored.')) return;
    await sb.from('supplyco_dispatches').delete().eq('id',d.id);
    const {data:s}=await sb.from('current_stock').select('*').eq('product_id',d.product_id).maybeSingle();
    if(s) await sb.from('current_stock').update({qty_bags:Number(s.qty_bags)+Number(d.qty_bags),updated_at:new Date().toISOString()}).eq('id',s.id);
    setDispatches(p=>p.filter(x=>x.id!==d.id));
    logActivity('Dispatch','delete',`Invoice ${d.invoice_no} deleted`);
  };

  if(loading) return <Loading/>;

  const woBalances=workOrders.map(wo=>{
    const prod=productForScheme(wo.scheme);
    const pktsPerBag=prod?.packets_per_bag||1;
    const sentBags=dispatches.filter(d=>d.work_order_id===wo.id).reduce((s,d)=>s+Number(d.qty_bags),0);
    const sentPkts=sentBags*pktsPerBag;
    const allots=woAllotments.filter(a=>a.work_order_id===wo.id);
    return{...wo, sentBags, sentPkts, balance: wo.total_pkts - sentPkts, allots};
  });

  return(<div className="page">
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:24,flexWrap:'wrap',gap:12}}>
      <div className="page-header" style={{marginBottom:0}}>
        <div className="page-label">Supplyco Operations</div>
        <div className="page-title">Dispatch & work orders</div>
        <MonthYearPicker month={month} year={year} setMonth={setMonth} setYear={setYear}/>
      </div>
      <div style={{display:'flex',gap:8}}>
        <button className="btn btn-green" onClick={()=>setShowDF(v=>!v)}>+ Log dispatch</button>
      </div>
    </div>

    {showDF&&(
      <FormCard title="Log Supplyco dispatch" col="var(--green)" onSave={saveDispatch} onCancel={()=>setShowDF(false)} saving={saving}>
        <div className="form-grid">
          <Field label="Date"><input type="date" className="form-input" value={dForm.date} max={today} onChange={e=>df('date',e.target.value)}/></Field>
          <Field label="Scheme"><select className="form-input" value={dForm.scheme} onChange={e=>df('scheme',e.target.value)}><option value="">-- Select --</option>{schemeOptions.map(s=><option key={s}>{s}</option>)}</select></Field>
          <Field label="Invoice no. ★"><input className="form-input" value={dForm.invoice_no} onChange={e=>df('invoice_no',e.target.value)}/></Field>
          <Field label="Delivery order no."><input className="form-input" value={dForm.delivery_order_no} onChange={e=>df('delivery_order_no',e.target.value)}/></Field>
          <Field label="Work order">
            <select className="form-input" value={dForm.work_order_id} onChange={e=>df('work_order_id',e.target.value)}>
              <option value="">-- Select --</option>
              {workOrders.map(w=><option key={w.id} value={w.id}>{w.work_order_no} · {w.scheme}</option>)}
            </select>
          </Field>
          <Field label="Depot ★">
  <select className="form-input" value={dForm.depot_name} onChange={e=>{
  const dep=depots.find(x=>x.name===e.target.value);
  df('depot_name',e.target.value);
  if(dep?.district) df('district',dep.district);
}}>
    <option value="">-- Select depot --</option>
    {depots.map(d=><option key={d.id} value={d.name}>{d.name}</option>)}
  </select>
</Field>
          <Field label="District"><input className="form-input" value={dForm.district} onChange={e=>df('district',e.target.value)} placeholder="Auto-fills from depot, editable"/></Field>
          <Field label="Bags dispatched ★"><input type="number" className="form-input" style={{fontWeight:600}} value={dForm.qty_bags} onChange={e=>df('qty_bags',e.target.value)}/></Field>
          <Field label="Vehicle no."><input className="form-input" value={dForm.vehicle_no} onChange={e=>df('vehicle_no',e.target.value)}/></Field>
          <Field label="Batch no."><input className="form-input" value={dForm.batch_no} onChange={e=>df('batch_no',e.target.value)}/></Field>
        </div>
        {dForm.scheme&&<div style={{marginTop:10,fontSize:12,color:'var(--muted)'}}>Will dispatch from: <strong>{productForScheme(dForm.scheme)?.product_name||'no matching product found'}</strong></div>}
      </FormCard>
    )}

    <div className="section-label">{periodLabel} dispatch log</div>
    <TableWrap><table>
      <thead><tr><th>Date</th><th>Invoice</th><th>Scheme</th><th>Product</th><th>Depot</th><th>District</th><th>Bags</th><th></th></tr></thead>
      <tbody>
        {dispatches.length===0&&<tr><td colSpan={8}><Empty msg={`No dispatches in ${periodLabel}.`}/></td></tr>}
        {dispatches.map(d=>(<tr key={d.id}>
          <td className="mono dim">{d.date}</td>
          <td><strong>{d.invoice_no}</strong></td>
          <td><span className="badge badge-blue">{d.scheme}</span></td>
          <td>{d.product?.product_name||'—'}</td>
          <td>{d.depot_name}</td>
          <td className="mono">{d.district}</td>
          <td><strong style={{color:'var(--green)',fontFamily:'var(--mono)'}}>{fmt(d.qty_bags)}</strong></td>
          <td><button className="btn btn-red btn-sm" onClick={()=>delD(d)}>✕</button></td>
        </tr>))}
      </tbody>
    </table></TableWrap>
  </div>);
}

// ══════════════════════════════════════════════════════════
// PRIVATE DISPATCH
// ══════════════════════════════════════════════════════════
function PrivateDispatch(){
  const [entries,setEntries]=useState([]);
  const [products,setProducts]=useState([]);
  const [showForm,setShowForm]=useState(false);
  const [saving,setSaving]=useState(false);
  const [showCreate,setShowCreate]=useState(false);
  const [depots,setDepots]=useState([]);
  const [depotAllotments,setDepotAllotments]=useState({});
  const [loading,setLoading]=useState(true);
  const [month,setMonth]=useState(new Date().getMonth()+1);
  const [year,setYear]=useState(new Date().getFullYear());
  const {start:periodStart,end:periodEnd}=monthRange(month,year);
  const periodLabel=`${MONTH_NAMES[month-1]} ${year}`;
  const blank={date:today,party_name:'',product_id:'',qty:'',vehicle_no:'',invoice_no:'',notes:''};
  const [form,setForm]=useState(blank);
  const f=(k,v)=>setForm(p=>({...p,[k]:v}));

  const load=useCallback(async()=>{
    setLoading(true);
    const [{data:e},{data:p}]=await Promise.all([
      sb.from('private_dispatches').select('*, product:product_id(*)').gte('date',periodStart).lte('date',periodEnd).order('date',{ascending:false}),
      sb.from('product_master').select('*').eq('is_active',true).eq('available_for_private_dispatch',true).order('product_name'),
    ]);
    setEntries(e||[]); setProducts(p||[]); setLoading(false);
  },[periodStart,periodEnd]);
  useEffect(()=>{load();},[load]);

  const selectedProduct=products.find(p=>p.id===form.product_id);
  const isRaw=selectedProduct?.is_raw_material;

  const debitStock=async(product, qty, sign)=>{
    // sign = -1 to deduct on dispatch, +1 to restore on delete
    if(product.is_raw_material){
      if(product.has_schemes){
        const scheme='Private';
        const {data:bucket}=await sb.from('raw_material_scheme_stock').select('*').eq('product_id',product.id).eq('scheme',scheme).maybeSingle();
        if(bucket) await sb.from('raw_material_scheme_stock').update({qty_kg:Number(bucket.qty_kg)+sign*qty,updated_at:new Date().toISOString()}).eq('id',bucket.id);
      } else {
        const {data:bucket}=await sb.from('raw_material_stock').select('*').eq('product_id',product.id).maybeSingle();
        if(bucket) await sb.from('raw_material_stock').update({qty_kg:Number(bucket.qty_kg)+sign*qty,updated_at:new Date().toISOString()}).eq('id',bucket.id);
      }
    } else {
      const bagSize=packSizeOf(product);
      if(bagSize>0){
        const {data:s}=await sb.from('current_stock').select('*').eq('product_id',product.id).maybeSingle();
        if(s) await sb.from('current_stock').update({qty_bags:Math.max(0,Number(s.qty_bags)+sign*qty),updated_at:new Date().toISOString()}).eq('id',s.id);
      } else {
        const {data:kgRow}=await sb.from('raw_material_stock').select('*').eq('product_id',product.id).maybeSingle();
        if(kgRow) await sb.from('raw_material_stock').update({qty_kg:Number(kgRow.qty_kg)+sign*qty,updated_at:new Date().toISOString()}).eq('id',kgRow.id);
      }
    }
  };

  const save=async()=>{
    if(!form.party_name||!form.product_id||!form.qty) return alert('Party name, product and quantity required.');
    setSaving(true);
    const row={date:form.date,party_name:form.party_name,product_id:form.product_id,qty_bags:isRaw?null:Number(form.qty),qty_kg:isRaw?Number(form.qty):null,vehicle_no:form.vehicle_no,invoice_no:form.invoice_no,notes:form.notes};
    const {data,error}=await sb.from('private_dispatches').insert(row).select('*, product:product_id(*)').single();
    if(error){alert(error.message);setSaving(false);return;}
    await debitStock(selectedProduct, Number(form.qty), -1);
    setEntries(p=>[data,...p]); setForm(blank); setShowForm(false); setSaving(false);
    logActivity('Private Dispatch','create',`${form.party_name} — ${form.qty}${isRaw?'kg':' bags'} of ${selectedProduct.product_name}`);
  };

  const del=async(e)=>{
    if(!allow('record.delete')) return alert('Your role cannot delete records.');
    if(!confirm('Delete entry? Stock will be restored.')) return;
    await sb.from('private_dispatches').delete().eq('id',e.id);
    const qty=e.product?.is_raw_material?Number(e.qty_kg):Number(e.qty_bags);
    if(e.product) await debitStock(e.product, qty, 1);
    setEntries(p=>p.filter(x=>x.id!==e.id));
    logActivity('Private Dispatch','delete',`${e.party_name} deleted`);
  };

  if(loading) return <Loading/>;
  const totalBags=entries.filter(e=>!e.product?.is_raw_material).reduce((s,e)=>s+Number(e.qty_bags||0),0);
  const totalKg=entries.filter(e=>e.product?.is_raw_material).reduce((s,e)=>s+Number(e.qty_kg||0),0);

  return(<div className="page">
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:24,flexWrap:'wrap',gap:12}}>
      <div className="page-header" style={{marginBottom:0}}>
        <div className="page-label">Sales</div>
        <div className="page-title">Private dispatch — {periodLabel}: {fmt(totalBags)} bags, {fmtMT(totalKg)}</div>
        <MonthYearPicker month={month} year={year} setMonth={setMonth} setYear={setYear}/>
      </div>
      <button className="btn btn-green" onClick={()=>setShowForm(v=>!v)}>+ Log dispatch</button>
    </div>

    {showForm&&(
      <FormCard title="Log private dispatch" col="var(--green)" onSave={save} onCancel={()=>setShowForm(false)} saving={saving}>
        <div className="form-grid">
          <Field label="Date"><input type="date" className="form-input" value={form.date} max={today} onChange={e=>f('date',e.target.value)}/></Field>
          <Field label="Party name ★"><input className="form-input" value={form.party_name} onChange={e=>f('party_name',e.target.value)}/></Field>
          <Field label="Product">
            <select className="form-input" value={form.product_id} onChange={e=>f('product_id',e.target.value)}>
              <option value="">-- Select product --</option>
              {products.map(p=><option key={p.id} value={p.id}>{p.product_name}{p.is_raw_material?' (raw material)':''}</option>)}
            </select>
          </Field>
          <Field label={isRaw?'Quantity (kg) ★':'Bags dispatched ★'}><input type="number" className="form-input" style={{fontWeight:600}} value={form.qty} onChange={e=>f('qty',e.target.value)}/></Field>
          <Field label="Vehicle no."><input className="form-input" value={form.vehicle_no} onChange={e=>f('vehicle_no',e.target.value)}/></Field>
          <Field label="Invoice no."><input className="form-input" value={form.invoice_no} onChange={e=>f('invoice_no',e.target.value)}/></Field>
          <Field label="Notes"><input className="form-input" value={form.notes} onChange={e=>f('notes',e.target.value)}/></Field>
        </div>
      </FormCard>
    )}

    <TableWrap><table>
      <thead><tr><th>Date</th><th>Party</th><th>Product</th><th>Qty</th><th>Vehicle</th><th></th></tr></thead>
      <tbody>
        {entries.length===0&&<tr><td colSpan={6}><Empty msg={`No private dispatches in ${periodLabel}.`}/></td></tr>}
        {entries.map(e=>(<tr key={e.id}>
          <td className="mono dim">{e.date}</td>
          <td><strong>{e.party_name}</strong></td>
          <td>{e.product?.product_name||'—'}</td>
          <td><strong style={{color:'var(--green)',fontFamily:'var(--mono)'}}>{e.product?.is_raw_material?fmtMT(e.qty_kg):fmt(e.qty_bags)+' bags'}</strong></td>
          <td className="dim">{e.vehicle_no||'—'}</td>
          <td><button className="btn btn-red btn-sm" onClick={()=>del(e)}>✕</button></td>
        </tr>))}
      </tbody>
    </table></TableWrap>
  </div>);
}

// ALL STOCK (unified)
// ══════════════════════════════════════════════════════════
function AllStock(){
  const [products,setProducts]=useState([]);
  const [currentStock,setCurrentStock]=useState([]);
  const [rawStock,setRawStock]=useState([]);
  const [schemeStock,setSchemeStock]=useState([]);
  const [loading,setLoading]=useState(true);
  const [filterCat,setFilterCat]=useState('All');

  useEffect(()=>{
    Promise.all([
      sb.from('product_master').select('*').eq('is_active',true),
      sb.from('current_stock').select('*'),
      sb.from('raw_material_stock').select('*'),
      sb.from('raw_material_scheme_stock').select('*'),
    ]).then(([{data:p},{data:cs},{data:rs},{data:sss}])=>{
      setProducts(p||[]); setCurrentStock(cs||[]); setRawStock(rs||[]); setSchemeStock(sss||[]); setLoading(false);
    });
  },[]);

  if(loading) return <Loading/>;

  const rows=products.map(p=>{
    if(p.is_raw_material){
      if(p.has_schemes){
        const rows=schemeStock.filter(s=>s.product_id===p.id);
        const total=rows.reduce((s,r)=>s+Number(r.qty_kg),0);
        return{product:p,qtyLabel:fmtMT(total),detail:rows,statusVal:total};
      } else {
        const row=rawStock.find(r=>r.product_id===p.id);
        return{product:p,qtyLabel:fmtMT(row?.qty_kg||0),statusVal:row?.qty_kg||0};
      }
    } else {
      const bagSize=packSizeOf(p);
      if(bagSize>0){
        const row=currentStock.find(r=>r.product_id===p.id);
        const isLow=p.min_stock_alert>0&&(row?.qty_bags||0)<p.min_stock_alert;
        return{product:p,qtyLabel:fmt(row?.qty_bags||0)+' bags',statusVal:row?.qty_bags||0,isLow,minAlert:p.min_stock_alert};
      } else {
        const row=rawStock.find(r=>r.product_id===p.id);
        return{product:p,qtyLabel:fmtMT(row?.qty_kg||0),statusVal:row?.qty_kg||0};
      }
    }
  });

  const categories=['All',...Array.from(new Set(products.map(p=>p.category)))];
  const filtered=filterCat==='All'?rows:rows.filter(r=>r.product.category===filterCat);

  return(<div className="page">
    <div className="page-header">
      <div className="page-label">Inventory</div>
      <div className="page-title">All stock — unified view</div>
    </div>

    <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:16}}>
      {categories.map(c=><button key={c} className={`btn btn-sm ${filterCat===c?'btn-amber':'btn-ghost'}`} onClick={()=>setFilterCat(c)}>{c}</button>)}
    </div>

    <TableWrap><table>
      <thead><tr><th>Product</th><th>Category</th><th>Current Stock</th><th>Details</th></tr></thead>
      <tbody>
        {filtered.length===0&&<tr><td colSpan={4}><Empty msg="No products yet."/></td></tr>}
        {filtered.map((r,i)=>{
          const col=r.isLow?'var(--red)':r.statusVal<0?'var(--red)':'var(--green)';
          return(<tr key={i}>
            <td><strong>{r.product.product_name}</strong></td>
            <td><span className="badge badge-blue">{r.product.category}</span></td>
            <td><strong style={{color:col,fontFamily:'var(--mono)',fontSize:14}}>{r.qtyLabel}</strong></td>
            <td>
              {r.detail?(
                <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                  {r.detail.map(s=>(
                    <span key={s.id} className="badge" style={{background:Number(s.qty_kg)<0?'var(--red)15':'var(--border)',color:Number(s.qty_kg)<0?'var(--red)':'var(--muted)'}}>{s.scheme}: {fmtMT(s.qty_kg)}</span>
                  ))}
                </div>
              ):r.isLow?(<span style={{color:'var(--red)'}}>Below min. alert ({fmt(r.minAlert)})</span>):(<span className="dim">—</span>)}
            </td>
          </tr>);
        })}
      </tbody>
    </table></TableWrap>
  </div>);
}

// ══════════════════════════════════════════════════════════
// STORE & MATERIALS
// ══════════════════════════════════════════════════════════
function Store(){
  const CATS=['Packaging','Spare Parts','Lubricants / Oils','Chemicals','Electrical','Hardware','Miscellaneous'];
  const [items,setItems]=useState([]);
  const [showForm,setShowForm]=useState(false);
  const [showTxn,setShowTxn]=useState(null);
  const [txnForm,setTxnForm]=useState({type:'Received',qty:'',notes:'',date:today});
  const [saving,setSaving]=useState(false);
  const [loading,setLoading]=useState(true);
  const [filterCat,setFilterCat]=useState('All');
  const blank={item_name:'',category:'Packaging',unit:'Nos',qty:0,min_qty:0,notes:''};
  const [form,setForm]=useState(blank);
  const f=(k,v)=>setForm(p=>({...p,[k]:v}));

  useEffect(()=>{
    sb.from('store_stock').select('*').order('category').then(({data})=>{setItems(data||[]);setLoading(false);});
  },[]);

  const saveItem=async()=>{
    if(!form.item_name) return alert('Item name required.');
    setSaving(true);
    const {data,error}=await sb.from('store_stock').insert(form).select().single();
    if(error){alert(error.message);setSaving(false);return;}
    setItems(p=>[...p,data]); setForm(blank); setShowForm(false); setSaving(false);
    logActivity('Store','create',`New item — ${form.item_name}`);
  };

  const doTxn=async(item)=>{
    if(!txnForm.qty||Number(txnForm.qty)<=0) return alert('Enter quantity.');
    setSaving(true);
    const delta=txnForm.type==='Received'?Number(txnForm.qty):-Number(txnForm.qty);
    const newQty=Math.max(0,item.qty+delta);
    await sb.from('store_stock').update({qty:newQty,updated_at:new Date().toISOString()}).eq('id',item.id);
    await sb.from('store_transactions').insert({item_id:item.id,date:txnForm.date,txn_type:txnForm.type,qty:Number(txnForm.qty),notes:txnForm.notes});
    setItems(p=>p.map(x=>x.id===item.id?{...x,qty:newQty}:x));
    setShowTxn(null); setTxnForm({type:'Received',qty:'',notes:'',date:today}); setSaving(false);
    logActivity('Store','update',`${item.item_name} — ${txnForm.type} ${txnForm.qty}`);
  };

  if(loading) return <Loading/>;
  const cats=['All',...CATS];
  const filtered=filterCat==='All'?items:items.filter(x=>x.category===filterCat);

  return(<div className="page">
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:24,flexWrap:'wrap',gap:12}}>
      <div className="page-header" style={{marginBottom:0}}>
        <div className="page-label">Inventory</div>
        <div className="page-title">Store & materials</div>
      </div>
      <button className="btn btn-amber" onClick={()=>setShowForm(v=>!v)}>+ Add item</button>
    </div>

    {showForm&&(
      <FormCard title="Add store item" col="var(--amber)" onSave={saveItem} onCancel={()=>setShowForm(false)} saving={saving}>
        <div className="form-grid">
          <Field label="Item name ★"><input className="form-input" value={form.item_name} onChange={e=>f('item_name',e.target.value)}/></Field>
          <Field label="Category"><select className="form-input" value={form.category} onChange={e=>f('category',e.target.value)}>{CATS.map(c=><option key={c}>{c}</option>)}</select></Field>
          <Field label="Unit"><input className="form-input" value={form.unit} onChange={e=>f('unit',e.target.value)}/></Field>
          <Field label="Current qty"><input type="number" className="form-input" value={form.qty} onChange={e=>f('qty',Number(e.target.value))}/></Field>
          <Field label="Min. alert qty"><input type="number" className="form-input" value={form.min_qty} onChange={e=>f('min_qty',Number(e.target.value))}/></Field>
          <Field label="Notes"><input className="form-input" value={form.notes} onChange={e=>f('notes',e.target.value)}/></Field>
        </div>
      </FormCard>
    )}

    <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:16}}>
      {cats.map(c=><button key={c} className={`btn btn-sm ${filterCat===c?'btn-amber':'btn-ghost'}`} onClick={()=>setFilterCat(c)}>{c}</button>)}
    </div>

    <TableWrap><table>
      <thead><tr><th>Item</th><th>Category</th><th>Qty</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody>
        {filtered.length===0&&<tr><td colSpan={5}><Empty/></td></tr>}
        {filtered.map(item=>{
          const st=item.qty<=0?'Out':item.min_qty>0&&item.qty<=item.min_qty?'Low':'OK';
          const col=st==='Out'?'var(--red)':st==='Low'?'var(--amber)':'var(--green)';
          return(<tr key={item.id}>
            <td><strong>{item.item_name}</strong></td>
            <td><span className="badge badge-muted">{item.category}</span></td>
            <td><strong style={{color:col,fontFamily:'var(--mono)'}}>{item.qty} {item.unit}</strong></td>
            <td><span className="badge" style={{background:col+'20',color:col}}>{st}</span></td>
            <td>
              <button className="btn btn-green btn-sm" onClick={()=>setShowTxn(item.id)}>+ / −</button>
              {showTxn===item.id&&(
                <div style={{marginTop:8,padding:12,background:'var(--surface2)',borderRadius:6,border:'1px solid var(--border)'}}>
                  <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'flex-end'}}>
                    <select style={{width:110}} value={txnForm.type} onChange={e=>setTxnForm(p=>({...p,type:e.target.value}))}>
                      <option>Received</option><option>Used / Issued</option><option>Damaged</option><option>Returned</option>
                    </select>
                    <input type="number" style={{width:80}} value={txnForm.qty} onChange={e=>setTxnForm(p=>({...p,qty:e.target.value}))}/>
                    <input type="date" style={{width:130}} value={txnForm.date} onChange={e=>setTxnForm(p=>({...p,date:e.target.value}))}/>
                    <button className="btn btn-green btn-sm" onClick={()=>doTxn(item)} disabled={saving}>Save</button>
                    <button className="btn btn-ghost btn-sm" onClick={()=>setShowTxn(null)}>Cancel</button>
                  </div>
                </div>
              )}
            </td>
          </tr>);
        })}
      </tbody>
    </table></TableWrap>
  </div>);
}
