<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PRFM Mill Operations</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:#F3F4F6; --surface:#FFFFFF; --surface2:#F9FAFB; --border:#E5E7EB; --border2:#D1D5DB;
    --text:#111827; --muted:#6B7280; --dim:#9CA3AF;
    --amber:#D97706; --green:#059669; --red:#DC2626; --blue:#2563EB; --purple:#7C3AED;
    --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html,body,#root{height:100%;}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;}
  ::-webkit-scrollbar{width:4px;height:4px;}
  ::-webkit-scrollbar-track{background:var(--surface);}
  ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
  input,select,textarea{font-family:var(--sans);font-size:13px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:5px;padding:7px 10px;outline:none;transition:border-color .15s;}
  input:focus,select:focus,textarea:focus{border-color:var(--blue);}
  select option{background:var(--surface);color:var(--text);}
  button{font-family:var(--sans);cursor:pointer;}
  table{width:100%;border-collapse:collapse;}
  th{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:10px 14px;text-align:left;border-bottom:1px solid var(--border);font-weight:500;}
  td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:var(--surface2);}
  .app{display:flex;height:100vh;overflow:hidden;}
  .sidebar{width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;}
  .main{flex:1;overflow-y:auto;}
  .sidebar-logo{padding:20px 16px 16px;border-bottom:1px solid var(--border);}
  .sidebar-logo .mill-name{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.15em;color:var(--amber);text-transform:uppercase;}
  .sidebar-logo .mill-sub{font-size:11px;color:var(--muted);margin-top:2px;}
  .sidebar-section{padding:16px 10px 4px;font-family:var(--mono);font-size:9px;letter-spacing:.15em;color:var(--dim);text-transform:uppercase;}
  .nav-btn{display:flex;align-items:center;gap:9px;padding:8px 12px;border:none;background:transparent;color:var(--muted);font-size:13px;border-radius:6px;margin:1px 4px;width:calc(100% - 8px);text-align:left;transition:all .12s;}
  .nav-btn:hover{background:var(--surface2);color:var(--text);}
  .nav-btn.active{background:color-mix(in srgb, var(--amber) 18%, transparent);color:var(--amber);}
  .nav-btn .icon{font-size:15px;width:18px;text-align:center;}
  .sidebar-footer{margin-top:auto;padding:12px;border-top:1px solid var(--border);}
  .page{padding:28px 28px 60px;max-width:1150px;}
  .page-header{margin-bottom:24px;}
  .page-label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:4px;}
  .page-title{font-size:22px;font-weight:600;color:var(--text);}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px;}
  .table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;overflow-x:auto;}
  .section-label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:12px;}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px;}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px 18px;}
  .stat-label{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;}
  .stat-val{font-size:24px;font-weight:600;line-height:1;}
  .stat-sub{font-size:11px;color:var(--muted);margin-top:4px;}
  .btn{padding:7px 16px;border-radius:6px;font-size:12px;font-weight:500;border:1px solid transparent;letter-spacing:.02em;transition:all .12s;}
  .btn-amber{background:color-mix(in srgb, var(--amber) 15%, transparent);color:var(--amber);border-color:color-mix(in srgb, var(--amber) 30%, transparent);}
  .btn-green{background:color-mix(in srgb, var(--green) 15%, transparent);color:var(--green);border-color:color-mix(in srgb, var(--green) 30%, transparent);}
  .btn-red{background:color-mix(in srgb, var(--red) 15%, transparent);color:var(--red);border-color:color-mix(in srgb, var(--red) 30%, transparent);}
  .btn-blue{background:color-mix(in srgb, var(--blue) 15%, transparent);color:var(--blue);border-color:color-mix(in srgb, var(--blue) 30%, transparent);}
  .btn-ghost{background:transparent;color:var(--muted);border-color:var(--border);}
  .btn-ghost:hover{border-color:var(--border2);color:var(--text);}
  .btn-sm{padding:4px 10px;font-size:11px;}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;}
  .form-field{display:flex;flex-direction:column;gap:4px;}
  .form-label{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;}
  .form-input{width:100%;}
  .form-actions{display:flex;gap:8px;margin-top:16px;}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:500;font-family:var(--mono);}
  .badge-amber{background:color-mix(in srgb, var(--amber) 18%, transparent);color:var(--amber);}
  .badge-green{background:color-mix(in srgb, var(--green) 18%, transparent);color:var(--green);}
  .badge-red{background:color-mix(in srgb, var(--red) 18%, transparent);color:var(--red);}
  .badge-blue{background:color-mix(in srgb, var(--blue) 18%, transparent);color:var(--blue);}
  .badge-muted{background:var(--border);color:var(--muted);}
  .alert{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-radius:7px;margin-bottom:8px;}
  .alert-red{background:color-mix(in srgb, var(--red) 10%, transparent);border:1px solid color-mix(in srgb, var(--red) 25%, transparent);}
  .alert-amber{background:color-mix(in srgb, var(--amber) 10%, transparent);border:1px solid color-mix(in srgb, var(--amber) 25%, transparent);}
  .alert-green{background:color-mix(in srgb, var(--green) 10%, transparent);border:1px solid color-mix(in srgb, var(--green) 25%, transparent);}
  .alert-title{font-weight:500;font-size:13px;}
  .alert-sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .divider{height:1px;background:var(--border);margin:20px 0;}
  .mono{font-family:var(--mono);}
  .dim{color:var(--muted);}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;}
  .login-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:40px;width:360px;}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;}
  @media(max-width:700px){ .sidebar{display:none;} .two-col{grid-template-columns:1fr;} .page{padding:16px 14px 40px;} }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;

// ══════════════════════════════════════════════════════════
// CONFIG
// ══════════════════════════════════════════════════════════
const SUPABASE_URL = 'https://ulkvltoctpjydloonwcw.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVsa3ZsdG9jdHBqeWRsb29ud2N3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1NDExNTEsImV4cCI6MjA5MzExNzE1MX0.mWoQUKYCozIA-rROhhCXVE6JoJZEBQTCh3AtqnztW-E';
const HR_APP_URL = 'https://facility-app-sigma.vercel.app';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function logActivity(section, action, details){
  const {data:{user}} = await sb.auth.getUser();
  const {error} = await sb.from('activity_log').insert({ user_email: user?.email || 'unknown', action, section, details });
  if(error) console.error('logActivity failed:', error.message, {section, action, details});
}

// Only real fixed lists — delivery districts (not products)
const DISTRICTS = ['KNR','TLY','TPB','KHD','KSD','IRTTY','VLPRAMBA','NLSR','MJSR','VKND','OTHER'];

const today = (() => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().split('T')[0]; })();
const fmt = (n,dec=0) => Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:dec,maximumFractionDigits:dec});
const fmtMT = (kg) => (Number(kg||0)/1000).toFixed(3)+' MT';
const monthStart = today.slice(0,7)+'-01';

// Infer scheme from a product's own name — the one deliberate naming convention
const schemeFromName = (name) => {
  const n=(name||'').toUpperCase();
  if(n.includes('NPS')) return 'NPS';
  if(n.includes('PHH')) return 'PHH';
  if(n.includes('AAY')) return 'AAY';
  return null;
};

// A product's pack size in kg, however it's configured
const packSizeOf = (prod) => {
  if(!prod) return 0;
  if(prod.packing_type==='loose') return prod.has_standard_weight ? Number(prod.bag_weight)||0 : 0;
  return (Number(prod.packet_weight_kg)||0) * (Number(prod.packets_per_bag)||0);
};

const NAV = [
  { section:'Mill Operations' },
  { id:'dashboard', label:'Dashboard', icon:'⬡' },
  { id:'production', label:'Production', icon:'⚙' },
  { id:'dispatch', label:'Supplyco Dispatch', icon:'🚛' },
  { id:'private-dispatch', label:'Private Dispatch', icon:'🚚' },
  { id:'lifting-orders', label:'Lifting Orders', icon:'📋' },
{ id:'fci-inwards', label:'FCI Inwards', icon:'🌾' },
  { id:'private-inwards', label:'Private Inwards', icon:'🌿' },
  { id:'reconciliation', label:'Reconciliation', icon:'📊' },
  { section:'Inventory' },
  { id:'all-stock', label:'All Stock', icon:'📦' },
  { id:'store', label:'Store & Materials', icon:'🧰' },
  { section:'Finance' },
  { id:'ledger', label:'Daily Cash Book', icon:'₹' },
  { section:'Settings' },
  { id:'product-master', label:'Product Master', icon:'⚙️' },
  { id:'production-settings', label:'Production Settings', icon:'🗓️' },
  { id:'depot-settings', label:'Depots', icon:'🏢' },
  { id:'product-recipes', label:'Product Recipes', icon:'🧮' },
  { id:'activity-log', label:'Activity Log', icon:'📜' },
];

// ══════════════════════════════════════════════════════════
// SHARED COMPONENTS
// ══════════════════════════════════════════════════════════
function StatCard({label,value,sub,col='var(--amber)'}){
  return(<div className="stat-card" style={{borderTop:`2px solid ${col}`}}>
    <div className="stat-label">{label}</div>
    <div className="stat-val" style={{color:col}}>{value}</div>
    {sub&&<div className="stat-sub">{sub}</div>}
  </div>);
}
function Alert({type='amber',icon,title,sub}){
  return(<div className={`alert alert-${type}`}>
    <span style={{fontSize:15,color:type==='red'?'var(--red)':type==='green'?'var(--green)':'var(--amber)'}}>{icon}</span>
    <div><div className="alert-title">{title}</div>{sub&&<div className="alert-sub">{sub}</div>}</div>
  </div>);
}
function FormCard({title,col='var(--amber)',children,onSave,onCancel,saving}){
  return(<div className="card" style={{marginBottom:20,borderColor:col,borderLeftColor:col,borderLeftWidth:3}}>
    <div className="section-label" style={{marginBottom:16}}>{title}</div>
    {children}
    <div className="form-actions">
      <button className="btn btn-green" onClick={onSave} disabled={saving}>{saving?'Saving…':'Save'}</button>
      <button className="btn btn-ghost" onClick={onCancel}>Cancel</button>
    </div>
  </div>);
}
function TableWrap({children}){ return <div className="table-wrap">{children}</div>; }
function Field({label,children}){ return(<div className="form-field"><div className="form-label">{label}</div>{children}</div>); }
function Loading(){ return <div style={{padding:60,textAlign:'center',color:'var(--muted)',fontFamily:'var(--mono)',fontSize:13}}>loading…</div>; }
function Empty({msg}){ return <div style={{padding:40,textAlign:'center',color:'var(--muted)',fontSize:13}}>{msg||'No entries yet.'}</div>; }

// ══════════════════════════════════════════════════════════
// LOGIN
// ══════════════════════════════════════════════════════════
function Login({onLogin}){
  const [email,setEmail]=useState(''); const [pass,setPass]=useState('');
  const [err,setErr]=useState(''); const [loading,setLoading]=useState(false);
  const submit=async()=>{
    setLoading(true); setErr('');
    const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
    if(error) setErr(error.message); else onLogin(data.user);
    setLoading(false);
  };
  return(<div className="login-wrap"><div className="login-card">
    <div style={{fontFamily:'var(--mono)',fontSize:11,letterSpacing:'.15em',color:'var(--amber)',marginBottom:4}}>PRFM</div>
    <div style={{fontSize:20,fontWeight:600,marginBottom:4}}>Mill Operations</div>
    <div style={{fontSize:13,color:'var(--muted)',marginBottom:28}}>Sign in to continue</div>
    <div style={{display:'flex',flexDirection:'column',gap:10}}>
      <input placeholder="Email" value={email} onChange={e=>setEmail(e.target.value)} type="email"/>
      <input placeholder="Password" value={pass} onChange={e=>setPass(e.target.value)} type="password" onKeyDown={e=>e.key==='Enter'&&submit()}/>
      {err&&<div style={{color:'var(--red)',fontSize:12}}>{err}</div>}
      <button className="btn btn-amber" style={{marginTop:4,padding:'10px'}} onClick={submit} disabled={loading}>{loading?'Signing in…':'Sign in'}</button>
    </div>
    <div style={{marginTop:20,padding:'10px 14px',background:'var(--surface2)',borderRadius:6,fontSize:12,color:'var(--muted)'}}>Uses the same login as your HR system.</div>
  </div></div>);
}

// ══════════════════════════════════════════════════════════
// PRODUCT MASTER
// ══════════════════════════════════════════════════════════
function ProductMaster(){
  const blank = {
    product_code:'', product_name:'', category:'Finished Goods', hsn_code:'',
    is_raw_material:false, available_for_supplyco:false,
    packing_type:'packeted', packet_weight_kg:'', packets_per_bag:50,
    has_standard_weight:false, bag_weight:'', unit:'kg',
    has_schemes:false, scheme_list:'NPS,PHH,AAY,Private',
    min_stock_alert:0, max_stock_alert:0,
    available_for_private_dispatch:true, available_for_supplyco_dispatch:true
  };
  const [products,setProducts]=useState([]);
  const [showForm,setShowForm]=useState(false);
  const [editingId,setEditingId]=useState(null);
  const [form,setForm]=useState(blank);
  const [saving,setSaving]=useState(false);
  const [loading,setLoading]=useState(true);
  const f=(k,v)=>setForm(p=>({...p,[k]:v}));

  const load=useCallback(()=>{
    setLoading(true);
    sb.from('product_master').select('*').order('product_name').then(({data})=>{setProducts(data||[]);setLoading(false);});
  },[]);
  useEffect(()=>{load();},[load]);

  const validate=()=>{
    if(!form.product_name.trim()) return 'Product Name is required.';
    if(form.is_raw_material && form.has_standard_weight && !form.bag_weight) return 'Enter the standard bag weight, or uncheck "Has standard bag weight".';
    if(!form.is_raw_material && form.packing_type==='packeted' && !form.packet_weight_kg) return 'Packet weight is required.';
    if(!form.is_raw_material && form.packing_type==='loose' && form.has_standard_weight && !form.bag_weight) return 'Enter the standard bag weight, or uncheck it.';
    return null;
  };

  const buildPayload=()=>({
    product_code: form.product_code, product_name: form.product_name.trim(), category: form.category, hsn_code: form.hsn_code,
    is_raw_material: !!form.is_raw_material,
    available_for_supplyco: form.is_raw_material ? !!form.available_for_supplyco : false,
    available_for_private_dispatch: !!form.available_for_private_dispatch,
    available_for_supplyco_dispatch: !form.is_raw_material ? !!form.available_for_supplyco_dispatch : false,
    packing_type: form.is_raw_material ? null : form.packing_type,
    packet_weight_kg: (!form.is_raw_material && form.packing_type==='packeted') ? Number(form.packet_weight_kg) : null,
    packets_per_bag: (!form.is_raw_material && form.packing_type==='packeted') ? Number(form.packets_per_bag) : null,
    has_standard_weight: (form.is_raw_material || form.packing_type==='loose') ? !!form.has_standard_weight : false,
    bag_weight: ((form.is_raw_material || form.packing_type==='loose') && form.has_standard_weight) ? Number(form.bag_weight) : null,
    unit: (form.is_raw_material || form.packing_type==='loose') ? form.unit : null,
    has_schemes: form.is_raw_material ? !!form.has_schemes : false,
    scheme_list: (form.is_raw_material && form.has_schemes) ? form.scheme_list : null,
    min_stock_alert: Number(form.min_stock_alert)||0,
    max_stock_alert: Number(form.max_stock_alert)||0,
  });

  const save=async()=>{
    const err=validate(); if(err) return alert(err);
    setSaving(true);
    const payload=buildPayload();

    if(editingId){
      const {error}=await sb.from('product_master').update(payload).eq('id',editingId);
      if(error){alert(error.message);setSaving(false);return;}
      logActivity('Product Master','update',`Edited ${payload.product_name}`);
    } else {
      const {data,error}=await sb.from('product_master').insert(payload).select().single();
      if(error){alert(error.message);setSaving(false);return;}
      // Initialize the right stock table
      if(!data.is_raw_material){
        await sb.from('current_stock').insert({product_id:data.id, qty_bags:0});
      } else if(data.has_schemes){
        const schemes=(data.scheme_list||'').split(',').map(s=>s.trim()).filter(Boolean);
        for(const s of schemes) await sb.from('raw_material_scheme_stock').insert({product_id:data.id, scheme:s, qty_kg:0});
      } else {
        await sb.from('raw_material_stock').insert({product_id:data.id, qty_kg:0});
      }
      logActivity('Product Master','create',`New product — ${payload.product_name}`);
    }
    setForm(blank); setShowForm(false); setEditingId(null); setSaving(false);
    load();
  };

  const startEdit=(p)=>{
    setEditingId(p.id);
    setForm({
      product_code:p.product_code||'', product_name:p.product_name||'', category:p.category||'Finished Goods', hsn_code:p.hsn_code||'',
      is_raw_material:!!p.is_raw_material, available_for_supplyco:!!p.available_for_supplyco,
      packing_type:p.packing_type||'packeted', packet_weight_kg:p.packet_weight_kg||'', packets_per_bag:p.packets_per_bag||50,
      has_standard_weight:!!p.has_standard_weight, bag_weight:p.bag_weight||'', unit:p.unit||'kg',
      has_schemes:!!p.has_schemes, scheme_list:p.scheme_list||'NPS,PHH,AAY,Private',
      min_stock_alert:p.min_stock_alert||0, max_stock_alert:p.max_stock_alert||0,
      available_for_private_dispatch: p.available_for_private_dispatch!==false,
      available_for_supplyco_dispatch: p.available_for_supplyco_dispatch!==false
    });
    setShowForm(true);
  };

  const toggleActive=async(p)=>{
    await sb.from('product_master').update({is_active:!p.is_active}).eq('id',p.id);
    logActivity('Product Master','update',`${p.product_name} set to ${!p.is_active?'Active':'Archived'}`);
    load();
  };

  const deleteProduct=async(p)=>{
    if(!confirm(`Delete "${p.product_name}"? This removes its stock records and recipe too. Cannot be undone.`)) return;
    await sb.from('current_stock').delete().eq('product_id',p.id);
    await sb.from('raw_material_stock').delete().eq('product_id',p.id);
    await sb.from('raw_material_scheme_stock').delete().eq('product_id',p.id);
    await sb.from('product_recipes').delete().eq('product_id',p.id);
    const {error}=await sb.from('product_master').delete().eq('id',p.id);
    if(error){alert('Could not delete: '+error.message);return;}
    logActivity('Product Master','delete',`Deleted ${p.product_name}`);
    load();
  };

  if(loading) return <Loading/>;

  return(<div className="page">
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:24,flexWrap:'wrap',gap:12}}>
      <div className="page-header" style={{marginBottom:0}}>
        <div className="page-label">System Settings</div>
        <div className="page-title">Product Master</div>
      </div>
      <button className="btn btn-amber" onClick={()=>{setEditingId(null);setForm(blank);setShowForm(v=>!v);}}>+ Add Product</button>
    </div>

    {showForm&&(
      <FormCard title={editingId?'Edit Product':'Register New Product'} col="var(--amber)" onSave={save} onCancel={()=>{setShowForm(false);setEditingId(null);setForm(blank);}} saving={saving}>
        <div className="form-grid">
          <Field label="Product Code / SKU"><input className="form-input" value={form.product_code} onChange={e=>f('product_code',e.target.value)}/></Field>
          <Field label="Product Name ★"><input className="form-input" value={form.product_name} onChange={e=>f('product_name',e.target.value)}/></Field>
          <Field label="Category">
            <select className="form-input" value={form.category} onChange={e=>f('category',e.target.value)}>
              <option>Finished Goods</option><option>By-Products</option><option>Trading Goods</option><option>Raw Material</option>
            </select>
          </Field>

              <span style={{fontSize:13}}>Yes</span>

                <input type="checkbox" checked={form.available_for_supplyco_dispatch} onChange={e=>f('available_for_supplyco_dispatch',e.target.checked)}/>
                <span style={{fontSize:13}}>Yes</span>

            <Field label="Unit">

                <option value="kg">kg</option><option value="quintal">Quintal</option><option value="bag">Bag</option><option value="litre">Litre</option><option value="ton">Ton</option>

            <Field label="Has standard bag weight?">
              <label style={{display:'flex',alignItems:'center',gap:8}}>
                <input type="checkbox" checked={form.has_standard_weight} onChange={e=>f('has_standard_weight',e.target.checked)}/>

            <Field label="Bag / Unit Weight">
              <input type="number" className="form-input" disabled={!form.has_standard_weight} style={!form.has_standard_weight?{opacity:0.5}:{}} value={form.bag_weight} onChange={e=>f('bag_weight',e.target.value)}/>
            </Field>
            <Field label="Divided into schemes?">
              <label style={{display:'flex',alignItems:'center',gap:8}}>
                <input type="checkbox" checked={form.has_schemes} onChange={e=>f('has_schemes',e.target.checked)}/>
                <span style={{fontSize:13}}>Yes</span>
              </label>
            </Field>
            {form.has_schemes&&<Field label="Scheme names (comma-separated)"><input className="form-input" value={form.scheme_list} onChange={e=>f('scheme_list',e.target.value)}/></Field>}
            <Field label="Min. Alert"><input type="number" className="form-input" value={form.min_stock_alert} onChange={e=>f('min_stock_alert',e.target.value)}/></Field>
            <Field label="Max. Alert (optional)"><input type="number" className="form-input" value={form.max_stock_alert} onChange={e=>f('max_stock_alert',e.target.value)}/></Field>

                <option value="kg">kg</option><option value="quintal">Quintal</option><option value="bag">Bag</option><option value="litre">Litre</option><option value="ton">Ton</option>
              </select>

            <Field label="Has standard bag weight?">
              <label style={{display:'flex',alignItems:'center',gap:8}}>

              </label>
            </Field>
            <Field label="Bag / Unit Weight">
              <input type="number" className="form-input" disabled={!form.has_standard_weight} style={!form.has_standard_weight?{opacity:0.5}:{}} value={form.bag_weight} onChange={e=>f('bag_weight',e.target.value)}/>

            <Field label="Max. Alert (bags, optional)"><input type="number" className="form-input" value={form.max_stock_alert} onChange={e=>f('max_stock_alert',e.target.value)}/></Field>

    <TableWrap>

              <td><span className="badge badge-blue">{p.category}</span></td>

                 p.packing_type==='loose' ? (p.has_standard_weight? <span className="mono">{fmt(p.bag_weight)} {p.unit}/bag</span> : <span className="dim">Variable ({p.unit})</span>) :
                 <span className="mono">{p.packet_weight_kg}kg × {p.packets_per_bag} = {p.packet_weight_kg*p.packets_per_bag}kg/bag</span>}
              </td>

    </TableWrap>
  </div>);
}

// PRODUCT RECIPES
// ══════════════════════════════════════════════════════════
function ProductRecipes(){
  const [products,setProducts]=useState([]);
  const [recipes,setRecipes]=useState([]);
  const [lines,setLines]=useState([]);
  const [loading,setLoading]=useState(true);
  const [editingId,setEditingId]=useState(null);
  const [editLines,setEditLines]=useState([]);
  const [confirmProd,setConfirmProd]=useState(null);

  const load=useCallback(async()=>{
    setLoading(true);
    const [{data:p},{data:r},{data:l}]=await Promise.all([
      sb.from('product_master').select('*').eq('is_active',true),
      sb.from('product_recipes').select('*'),
      sb.from('recipe_lines').select('*'),
    ]);
    setProducts(p||[]); setRecipes(r||[]); setLines(l||[]); setLoading(false);
  },[]);
  useEffect(()=>{load();},[load]);

  const name=(id)=>products.find(p=>p.id===id)?.product_name||'—';
  const finishedProducts=products.filter(p=>!p.is_raw_material);

  const startEdit=(prod)=>{
    setEditingId(prod.id);
    const recipe=recipes.find(r=>r.product_id===prod.id);
    const ex=recipe?lines.filter(l=>l.recipe_id===recipe.id):[];
    setEditLines(ex.length?ex.map(l=>({...l})):[{line_type:'consumes',material_id:'',qty_per_unit:'',scheme:'',fallback_material_id:''}]);
  };
  const addLine=(t)=>setEditLines(p=>[...p,{line_type:t,material_id:'',qty_per_unit:'',scheme:'',fallback_material_id:''}]);
  const removeLine=(i)=>setEditLines(p=>p.filter((_,idx)=>idx!==i));
  const updateLine=(i,k,v)=>setEditLines(p=>p.map((l,idx)=>idx===i?{...l,[k]:v}:l));

  const attemptSave=(prod)=>{
    if(editLines.length===0) return alert('Add at least one line.');
    if(editLines.some(l=>!l.material_id||!l.qty_per_unit)) return alert('Every line needs a material and quantity.');
if(editLines.some(l=>{const m=products.find(p=>p.id===l.material_id);return m?.has_schemes && !l.scheme;})) return alert('Select a scheme for every material that has schemes.');
    setConfirmProd(prod);
  };

  const confirmSave=async()=>{
    const prod=confirmProd;
    const scheme=schemeFromName(prod.product_name);
    let recipe=recipes.find(r=>r.product_id===prod.id);
    if(!recipe){
      const {data}=await sb.from('product_recipes').insert({product_id:prod.id,scheme}).select().single();
      recipe=data;
    } else {
      await sb.from('product_recipes').update({scheme,updated_at:new Date().toISOString()}).eq('id',recipe.id);
    }
    await sb.from('recipe_lines').delete().eq('recipe_id',recipe.id);
    const toInsert=editLines.map(l=>({recipe_id:recipe.id,line_type:l.line_type,material_id:l.material_id,qty_per_unit:Number(l.qty_per_unit),scheme:l.scheme||null,fallback_material_id:l.fallback_material_id||null}));
    await sb.from('recipe_lines').insert(toInsert);
    logActivity('Product Recipes','update',`${prod.product_name} recipe updated`);
    setConfirmProd(null); setEditingId(null); setEditLines([]);
    load();
  };

  if(loading) return <Loading/>;

  return(<div className="page">
    <div className="page-header">
      <div className="page-label">System Settings</div>
      <div className="page-title">Product Recipes</div>
    </div>
    <div style={{marginBottom:16,padding:'10px 16px',background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:6,fontSize:12,color:'var(--muted)'}}>
      For each finished product, define what it consumes and produces per 1kg made. A product's scheme (NPS/PHH/AAY) is inferred from its name.
    </div>

    <TableWrap>
      <table>
        <thead><tr><th>Product</th><th>Scheme</th><th>Recipe (per 1kg)</th><th>Edit</th></tr></thead>
        <tbody>
          {finishedProducts.map(prod=>{
            const scheme=schemeFromName(prod.product_name);
            const isE=editingId===prod.id;
            const recipe=recipes.find(r=>r.product_id===prod.id);
            const recipeLines=recipe?lines.filter(l=>l.recipe_id===recipe.id):[];
            return(<tr key={prod.id}>
              <td><strong>{prod.product_name}</strong></td>
              <td>{scheme?<span className="badge badge-blue">{scheme}</span>:<span className="dim">—</span>}</td>
              <td>
                {isE?(
                  <div style={{display:'flex',flexDirection:'column',gap:8}}>
                    {editLines.map((l,i)=>(
                      <div key={i} style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
                        <select className="form-input" style={{width:100}} value={l.line_type} onChange={e=>updateLine(i,'line_type',e.target.value)}>
                          <option value="consumes">Consumes</option><option value="produces">Produces</option>
                        </select>
                        <select className="form-input" style={{width:160}} value={l.material_id} onChange={e=>updateLine(i,'material_id',e.target.value)}>
                          <option value="">-- Select material --</option>
                          {products.filter(p=>p.id!==prod.id).map(p=><option key={p.id} value={p.id}>{p.product_name}</option>)}
                        </select>
                        <input type="number" step="0.0001" className="form-input" style={{width:110}} placeholder="kg per 1kg" value={l.qty_per_unit} onChange={e=>updateLine(i,'qty_per_unit',e.target.value)}/>
                        {(()=>{const mat=products.find(p=>p.id===l.material_id);
  if(!mat?.has_schemes) return null;
  const opts=(mat.scheme_list||'').split(',').map(s=>s.trim()).filter(Boolean);
  return(<select className="form-input" style={{width:110}} value={l.scheme} onChange={e=>updateLine(i,'scheme',e.target.value)}>
    <option value="">-- Scheme --</option>
    {opts.map(s=><option key={s} value={s}>{s}</option>)}
  </select>);
})()}
                        {l.line_type==='consumes'&&(
                          <select className="form-input" style={{width:170}} value={l.fallback_material_id} onChange={e=>updateLine(i,'fallback_material_id',e.target.value)}>
                            <option value="">-- No fallback source --</option>
                            {products.filter(p=>p.id!==l.material_id&&p.id!==prod.id).map(p=><option key={p.id} value={p.id}>Use up {p.product_name} first</option>)}
                          </select>
                        )}
                        <button className="btn btn-red btn-sm" onClick={()=>removeLine(i)}>✕</button>
                      </div>
                    ))}
                    <div style={{display:'flex',gap:8}}>
                      <button className="btn btn-ghost btn-sm" onClick={()=>addLine('consumes')}>+ Consumes</button>
                      <button className="btn btn-ghost btn-sm" onClick={()=>addLine('produces')}>+ Produces</button>
                    </div>
                    <button className="btn btn-green btn-sm" style={{width:'fit-content'}} onClick={()=>attemptSave(prod)}>Review & Save</button>
                  </div>
                ):(
                  <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                    {recipeLines.length===0&&<span className="dim">Not configured</span>}
                    {recipeLines.map(l=>{
  const col=l.line_type==='consumes'?'var(--red)':'var(--green)';
  return(
    <span key={l.id} className="badge" style={{background:`color-mix(in srgb, ${col} 15%, transparent)`,color:col}}>
      {l.line_type==='consumes'?'−':'+'} {name(l.material_id)}{l.scheme?` (${l.scheme})`:''} {l.qty_per_unit}kg{l.fallback_material_id?` [uses ${name(l.fallback_material_id)} first]`:''}
    </span>
  );
})}
                  </div>
                )}
              </td>
              <td>
                {!isE&&<button className="btn btn-ghost btn-sm" onClick={()=>startEdit(prod)}>Edit</button>}
                {isE&&<button className="btn btn-ghost btn-sm" onClick={()=>{setEditingId(null);setEditLines([]);}}>Cancel</button>}
              </td>
            </tr>);
          })}
          {finishedProducts.length===0&&<tr><td colSpan={4}><Empty msg="No finished products yet. Add them in Product Master first."/></td></tr>}
        </tbody>
      </table>
    </TableWrap>

    {confirmProd&&(
      <div className="modal-overlay">
        <div className="card" style={{maxWidth:480,width:'100%'}}>
          <div className="section-label">Confirm Recipe</div>
          <div style={{fontSize:14,marginBottom:12}}>To produce <strong>1kg of {confirmProd.product_name}</strong>, this recipe will:</div>
          <ul style={{marginBottom:16,paddingLeft:20}}>
            {editLines.map((l,i)=>(
  <li key={i} style={{fontSize:13,marginBottom:4,color:l.line_type==='consumes'?'var(--red)':'var(--green)'}}>
    {l.line_type==='consumes'?'Consume':'Produce'} <strong>{l.qty_per_unit}kg</strong> of {name(l.material_id)}{l.scheme?` — ${l.scheme}`:''}{l.fallback_material_id?` (draws from ${name(l.fallback_material_id)} first)`:''}
  </li>
))}
          </ul>
          <div style={{fontSize:12,color:'var(--muted)',marginBottom:16}}>This applies to every future production entry for {confirmProd.product_name}. Past entries are unaffected.</div>
          <div className="form-actions">
            <button className="btn btn-green" onClick={confirmSave}>Confirm & Save</button>
            <button className="btn btn-ghost" onClick={()=>setConfirmProd(null)}>Go Back</button>
          </div>
        </div>
      </div>
    )}
  </div>);
}

// PRODUCTION
// ══════════════════════════════════════════════════════════
function Production(){
  const [finishedProducts,setFinishedProducts]=useState([]);
  const [allProducts,setAllProducts]=useState([]);
  const [logs,setLogs]=useState([]);
  const [loading,setLoading]=useState(true);
  const [saving,setSaving]=useState(false);
  const [entryDate,setEntryDate]=useState(null);
  const [rows,setRows]=useState({});

  const load=useCallback(async()=>{
    setLoading(true);
    const [{data:fp},{data:ap},{data:lg}]=await Promise.all([
      sb.from('product_master').select('*').eq('is_raw_material',false).eq('is_active',true).order('product_name'),
      sb.from('product_master').select('*'),
      sb.from('daily_production_log').select('*, product:product_id(*)').order('date',{ascending:false}),
    ]);
    setFinishedProducts(fp||[]); setAllProducts(ap||[]); setLogs(lg||[]); setLoading(false);
  },[]);
  useEffect(()=>{load();},[load]);

  const lastLoggedDate=logs.length?logs[0].date:null;
  const addDays=(dateStr,n)=>{
    const [y,m,d]=dateStr.split('-').map(Number);
    const dt=new Date(y,m-1,d);
    dt.setDate(dt.getDate()+n);
    const yy=dt.getFullYear();
    const mm=String(dt.getMonth()+1).padStart(2,'0');
    const dd=String(dt.getDate()).padStart(2,'0');
    return `${yy}-${mm}-${dd}`;
  };
  const nextEntryDate=(()=>{
    if(!lastLoggedDate) return localStorage.getItem('productionFirstEntryDate')||today;
    const nd=addDays(lastLoggedDate,1);
    return nd<=today?nd:null;
  })();

  const openingFor=(productId)=>{
    const prior=logs.filter(l=>l.product_id===productId).sort((a,b)=>b.date.localeCompare(a.date))[0];
    return prior?Number(prior.closing_bags):0;
  };

  const startEntry=()=>{
    if(!nextEntryDate) return;
    const init={};
    finishedProducts.forEach(p=>{
      const opening=openingFor(p.id);
      init[p.id]={opening, production:'', closing:''};
    });
    setRows(init); setEntryDate(nextEntryDate);
  };

  const updateProduction=(productId,val)=>{
    setRows(prev=>{
      const r=prev[productId]; const opening=r.opening;
      const production=val===''?'':Number(val);
      const closing=val===''?'':opening+Number(val);
      return {...prev,[productId]:{...r,production:val,closing:closing===''?'':String(closing)}};
    });
  };

  const updateClosing=(productId,val)=>{
    setRows(prev=>{
      const r=prev[productId]; const opening=r.opening;
      const closing=val===''?'':Number(val);
      const production=val===''?'':closing-opening;
      return {...prev,[productId]:{...r,closing:val,production:production===''?'':String(production)}};
    });
  };

  const applyRecipe=async(product, qtyProducedKg, sign)=>{
    const {data:recipe}=await sb.from('product_recipes').select('*').eq('product_id',product.id).maybeSingle();
    if(!recipe) return;
    const {data:recipeLines}=await sb.from('recipe_lines').select('*').eq('recipe_id',recipe.id);

    for(const line of (recipeLines||[])){
      const qtyKg=qtyProducedKg*Number(line.qty_per_unit)*sign;
      const material=allProducts.find(p=>String(p.id)===String(line.material_id));
      if(!material) continue;
      const delta = line.line_type==='consumes' ? -qtyKg : qtyKg;
      const lineScheme = line.scheme || schemeFromName(product.product_name);

      if(line.line_type==='consumes' && line.fallback_material_id){
        let remainingKg=Math.abs(delta);
        const {data:fbRow}=await sb.from('raw_material_stock').select('*').eq('product_id',line.fallback_material_id).maybeSingle();
        const available=Number(fbRow?.qty_kg||0);
        if(available>0){
          const takeFromFallback=Math.min(available,remainingKg);
          await sb.from('raw_material_stock').update({qty_kg:available-takeFromFallback,updated_at:new Date().toISOString()}).eq('id',fbRow.id);
          remainingKg-=takeFromFallback;
        }
        if(remainingKg>0){
          if(material.has_schemes && lineScheme){
            const {data:bucket}=await sb.from('raw_material_scheme_stock').select('*').eq('product_id',material.id).eq('scheme',lineScheme).maybeSingle();
            if(bucket) await sb.from('raw_material_scheme_stock').update({qty_kg:Number(bucket.qty_kg)-remainingKg,updated_at:new Date().toISOString()}).eq('id',bucket.id);
            else await sb.from('raw_material_scheme_stock').insert({product_id:material.id,scheme:lineScheme,qty_kg:-remainingKg});
          } else {
            const {data:bucket}=await sb.from('raw_material_stock').select('*').eq('product_id',material.id).maybeSingle();
            if(bucket) await sb.from('raw_material_stock').update({qty_kg:Number(bucket.qty_kg)-remainingKg,updated_at:new Date().toISOString()}).eq('id',bucket.id);
            else await sb.from('raw_material_stock').insert({product_id:material.id,qty_kg:-remainingKg});
          }
        }
      } else if(material.is_raw_material){
        if(material.has_schemes && lineScheme){
          const {data:bucket}=await sb.from('raw_material_scheme_stock').select('*').eq('product_id',material.id).eq('scheme',lineScheme).maybeSingle();
          if(bucket) await sb.from('raw_material_scheme_stock').update({qty_kg:Number(bucket.qty_kg)+delta,updated_at:new Date().toISOString()}).eq('id',bucket.id);
          else await sb.from('raw_material_scheme_stock').insert({product_id:material.id,scheme:lineScheme,qty_kg:delta});
        } else {
          const {data:bucket}=await sb.from('raw_material_stock').select('*').eq('product_id',material.id).maybeSingle();
          if(bucket) await sb.from('raw_material_stock').update({qty_kg:Number(bucket.qty_kg)+delta,updated_at:new Date().toISOString()}).eq('id',bucket.id);
          else await sb.from('raw_material_stock').insert({product_id:material.id,qty_kg:delta});
        }
      } else {
        const bagSize=packSizeOf(material);
        if(bagSize>0){
          const {data:stockRow}=await sb.from('current_stock').select('*').eq('product_id',material.id).maybeSingle();
          const bagsDelta=delta/bagSize;
          if(stockRow) await sb.from('current_stock').update({qty_bags:Number(stockRow.qty_bags)+bagsDelta,updated_at:new Date().toISOString()}).eq('id',stockRow.id);
          else await sb.from('current_stock').insert({product_id:material.id,qty_bags:bagsDelta});
        } else {
          const {data:kgRow}=await sb.from('raw_material_stock').select('*').eq('product_id',material.id).maybeSingle();
          if(kgRow) await sb.from('raw_material_stock').update({qty_kg:Number(kgRow.qty_kg)+delta,updated_at:new Date().toISOString()}).eq('id',kgRow.id);
          else await sb.from('raw_material_stock').insert({product_id:material.id,qty_kg:delta});
        }
      }
    }
  };

  const reverseDay=async(dayRows)=>{
    for(const r of dayRows){
      const p=r.product;
      if(!p) continue;
      const {data:stockRow}=await sb.from('current_stock').select('*').eq('product_id',p.id).maybeSingle();
      if(stockRow) await sb.from('current_stock').update({qty_bags:Number(r.opening_bags),updated_at:new Date().toISOString()}).eq('id',stockRow.id);
      if(Number(r.production_bags)!==0){
        const bagSize=packSizeOf(p);
        if(bagSize>0) await applyRecipe(p, Number(r.production_bags)*bagSize, -1);
      }
      await sb.from('daily_production_log').delete().eq('id',r.id);
    }
  };

  const deleteDay=async(date,dayRows)=>{
    if(!confirm(`Delete the production log for ${date}? Stock and recipe effects will be reversed. This must be the most recent day.`)) return;
    setSaving(true);
    await reverseDay(dayRows);
    logActivity('Production','delete',`Daily log for ${date} deleted`);
    setSaving(false);
    load();
  };

  const editDay=async(date,dayRows)=>{
    if(!confirm(`Edit the production log for ${date}? Current entries for this day will be reversed and reopened for editing.`)) return;
    setSaving(true);
    const init={};
    finishedProducts.forEach(p=>{
      const existing=dayRows.find(r=>r.product_id===p.id);
      const opening=existing?Number(existing.opening_bags):openingFor(p.id);
      init[p.id]={opening, production: existing?String(existing.production_bags):'', closing: existing?String(existing.closing_bags):''};
    });
    await reverseDay(dayRows);
    setRows(init); setEntryDate(date); setSaving(false);
    load();
  };

  const saveDay=async()=>{
    setSaving(true);
    for(const p of finishedProducts){
      const r=rows[p.id];
      if(!r || r.production===''){ continue; }
      const productionBags=Number(r.production);
      const closingBags=Number(r.closing);

      const {error}=await sb.from('daily_production_log').insert({
        date:entryDate, product_id:p.id, opening_bags:r.opening, production_bags:productionBags, closing_bags:closingBags
      });
      if(error){ alert(`Error saving ${p.product_name}: `+error.message); setSaving(false); return; }

      const {data:stockRow}=await sb.from('current_stock').select('*').eq('product_id',p.id).maybeSingle();
      if(stockRow) await sb.from('current_stock').update({qty_bags:closingBags,updated_at:new Date().toISOString()}).eq('id',stockRow.id);
      else await sb.from('current_stock').insert({product_id:p.id,qty_bags:closingBags});

      if(productionBags!==0){
        const bagSize=packSizeOf(p);
        if(bagSize>0) await applyRecipe(p, productionBags*bagSize, 1);
      }
    }
    logActivity('Production','create',`Daily log submitted for ${entryDate}`);
    setEntryDate(null); setRows({}); setSaving(false);
    load();
  };

  if(loading) return <Loading/>;

  const loggedDates=Array.from(new Set(logs.map(l=>l.date))).sort().reverse();

  return(<div className="page">
    <div className="page-header">
      <div className="page-label">Mill Operations</div>
      <div className="page-title">Daily production log</div>
    </div>

    {!entryDate && (
      <div className="card" style={{marginBottom:24}}>
        {nextEntryDate ? (
          <>
            <div style={{marginBottom:12,fontSize:13,color:'var(--muted)'}}>
              {lastLoggedDate ? `Last entry logged: ${lastLoggedDate}. Next day to enter:` : 'No entries yet. Start with:'} <strong>{nextEntryDate}</strong>
            </div>
            <button className="btn btn-green" onClick={startEntry}>+ Enter {nextEntryDate}</button>
          </>
        ) : (
          <div style={{color:'var(--muted)',fontSize:13}}>All days up to today ({today}) are already logged.</div>
        )}
      </div>
    )}

    {entryDate && (
      <div className="card" style={{marginBottom:24,borderLeft:'3px solid var(--green)'}}>
        <div className="section-label" style={{marginBottom:16}}>Entry for {entryDate}</div>
        <TableWrap><table>
          <thead><tr><th>Product</th><th>Opening (bags)</th><th>Production (bags)</th><th>Closing (bags)</th></tr></thead>
          <tbody>
            {finishedProducts.map(p=>{
              const r=rows[p.id]||{opening:0,production:'',closing:''};
              return(<tr key={p.id}>
                <td><strong>{p.product_name}</strong></td>
                <td className="mono dim">{fmt(r.opening)}</td>
                <td><input type="number" className="form-input" style={{width:120}} value={r.production} onChange={e=>updateProduction(p.id,e.target.value)}/></td>
                <td><input type="number" className="form-input" style={{width:120}} value={r.closing} onChange={e=>updateClosing(p.id,e.target.value)}/></td>
              </tr>);
            })}
          </tbody>
        </table></TableWrap>
        <div className="form-actions">
          <button className="btn btn-green" onClick={saveDay} disabled={saving}>{saving?'Saving…':'Submit day'}</button>
          <button className="btn btn-ghost" onClick={()=>{setEntryDate(null);setRows({});}}>Cancel</button>
        </div>
      </div>
    )}

    {loggedDates.length===0 ? <Empty msg="No production days logged yet."/> : loggedDates.map((date,idx)=>{
      const dayRows=logs.filter(l=>l.date===date);
      const totalMT=dayRows.reduce((s,r)=>s+Number(r.production_bags)*packSizeOf(r.product),0)/1000;
      const isLatest=idx===0;
      return(<div key={date} style={{marginBottom:20}}>
        <div style={{display:'flex',justifyContent:'space-between',marginBottom:8,padding:'6px 0',borderBottom:'1px solid var(--border)'}}>
          <div style={{fontFamily:'var(--mono)',fontSize:12,color:'var(--amber)'}}>{date}</div>
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <div style={{fontFamily:'var(--mono)',fontSize:12,color:'var(--green)'}}>Total production: {totalMT.toFixed(3)} MT</div>
            {isLatest && !entryDate && (
              <div style={{display:'flex',gap:6}}>
                <button className="btn btn-blue btn-sm" onClick={()=>editDay(date,dayRows)}>Edit</button>
                <button className="btn btn-red btn-sm" onClick={()=>deleteDay(date,dayRows)}>Delete</button>
              </div>
            )}
          </div>
        </div>
        <TableWrap><table>
          <thead><tr><th>Product</th><th>Opening</th><th>Production</th><th>Closing</th></tr></thead>
          <tbody>
            {dayRows.map(r=>(<tr key={r.id}>
              <td><strong>{r.product?.product_name||'—'}</strong></td>
              <td className="mono dim">{fmt(r.opening_bags)}</td>
              <td className="mono" style={{color:'var(--green)'}}>{fmt(r.production_bags)}</td>
              <td className="mono">{fmt(r.closing_bags)}</td>
            </tr>))}
          </tbody>
        </table></TableWrap>
      </div>);
    })}
  </div>);
}

function LiftingOrders(){
  const [orders,setOrders]=useState([]);
  const [rawMaterials,setRawMaterials]=useState([]);
  const [showForm,setShowForm]=useState(false);
  const [saving,setSaving]=useState(false);
  const [loading,setLoading]=useState(true);
  const blank={order_no:'',order_date:today,material_id:'',scheme:'',allotted_kg:'',notes:''};
  const [form,setForm]=useState(blank);
  const f=(k,v)=>setForm(p=>({...p,[k]:v}));

  const load=useCallback(async()=>{
    setLoading(true);
    const [{data:o},{data:rm}]=await Promise.all([
      sb.from('lifting_orders').select('*, material:material_id(*)').order('order_date',{ascending:false}),
      sb.from('product_master').select('*').eq('is_raw_material',true).eq('available_for_supplyco',true).eq('is_active',true),
    ]);
    setOrders(o||[]); setRawMaterials(rm||[]); setLoading(false);
  },[]);
  useEffect(()=>{load();},[load]);

  const selectedMaterial=rawMaterials.find(m=>m.id===form.material_id);
const schemeOptions=selectedMaterial?.scheme_list?selectedMaterial.scheme_list.split(',').map(s=>s.trim()).filter(s=>s.toLowerCase()!=='private'):[];

  const save=async()=>{
    if(!form.order_no||!form.material_id||!form.scheme||!form.allotted_kg) return alert('Order no., material, scheme and allotted quantity required.');
    setSaving(true);
    const row={order_no:form.order_no,order_date:form.order_date,material_id:form.material_id,scheme:form.scheme,allotted_kg:Number(form.allotted_kg),lifted_kg:0,notes:form.notes};
    const {data,error}=await sb.from('lifting_orders').insert(row).select('*, material:material_id(*)').single();
    if(error){alert(error.message);setSaving(false);return;}
    setOrders(p=>[data,...p]); setForm(blank); setShowForm(false); setSaving(false);
    logActivity('Lifting Orders','create',`${form.order_no} — ${form.allotted_kg}kg ${selectedMaterial?.product_name} (${form.scheme})`);

  const del=async(o)=>{
    if(!confirm('Delete this lifting order? This cannot be undone.')) return;
    const {error}=await sb.from('lifting_orders').delete().eq('id',o.id);
    if(error){alert('Could not delete: '+error.message);return;}
    setOrders(p=>p.filter(x=>x.id!==o.id));
    logActivity('Lifting Orders','delete',`${o.order_no} deleted`);
  };

  if(loading) return <Loading/>;

  return(<div className="page">
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:24,flexWrap:'wrap',gap:12}}>
      <div className="page-header" style={{marginBottom:0}}>
        <div className="page-label">Raw Materials</div>
        <div className="page-title">Lifting orders</div>
      </div>
      <button className="btn btn-amber" onClick={()=>setShowForm(v=>!v)}>+ New lifting order</button>
    </div>

    {showForm&&(
      <FormCard title="Register lifting order" col="var(--amber)" onSave={save} onCancel={()=>setShowForm(false)} saving={saving}>
        <div className="form-grid">
          <Field label="Order no. ★"><input className="form-input" value={form.order_no} onChange={e=>f('order_no',e.target.value)}/></Field>
          <Field label="Date"><input type="date" className="form-input" value={form.order_date} onChange={e=>f('order_date',e.target.value)}/></Field>
          <Field label="Raw Material">
            <select className="form-input" value={form.material_id} onChange={e=>{f('material_id',e.target.value);f('scheme','');}}>
              <option value="">-- Select material --</option>
              {rawMaterials.map(m=><option key={m.id} value={m.id}>{m.product_name}</option>)}
            </select>
          </Field>
          <Field label="Scheme">
  <select className="form-input" value={form.scheme} onChange={e=>f('scheme',e.target.value)} disabled={!selectedMaterial}>

  </select>
</Field>
          <Field label="Allotted quantity (kg) ★"><input type="number" className="form-input" style={{fontWeight:600}} value={form.allotted_kg} onChange={e=>f('allotted_kg',e.target.value)}/></Field>

        </div>
      </FormCard>
    )}

    <TableWrap><table>
      <thead><tr><th>Order no.</th><th>Date</th><th>Material</th><th>Scheme</th><th>Allotted</th><th>Lifted</th><th>Balance</th><th></th></tr></thead>
      <tbody>
        {orders.length===0&&<tr><td colSpan={8}><Empty msg="No lifting orders yet."/></td></tr>}
        {orders.map(o=>{
          const balance=Number(o.allotted_kg)-Number(o.lifted_kg);
          return(<tr key={o.id}>
            <td><strong className="mono">{o.order_no}</strong></td>
            <td className="mono dim">{o.order_date}</td>

            <td><button className="btn btn-red btn-sm" onClick={()=>del(o)}>✕</button></td>
          </tr>);
        })}
      </tbody>
    </table></TableWrap>
  </div>);
}

// FCI INWARDS
// ══════════════════════════════════════════════════════════
function FciInwards(){
  const [receipts,setReceipts]=useState([]);
  const [liftingOrders,setLiftingOrders]=useState([]);
  const [suppliers,setSuppliers]=useState([]);
  const [showForm,setShowForm]=useState(false);
  const [saving,setSaving]=useState(false);
  const [loading,setLoading]=useState(true);
  const blank={date:today,lifting_order_id:'',received_kg:'',vehicle_no:'',supplier_id:'',notes:''};
const [form,setForm]=useState(()=>({...blank, supplier_id: localStorage.getItem('lastFciSupplierId')||''}));
  const f=(k,v)=>setForm(p=>({...p,[k]:v}));

  const load=useCallback(async()=>{
    setLoading(true);
    const [{data:r},{data:lo},{data:sup}]=await Promise.all([
      sb.from('fci_inwards').select('*, material:material_id(*), lifting_order:lifting_order_id(*), supplier:supplier_id(*)').gte('date',monthStart).order('date',{ascending:false}),
      sb.from('lifting_orders').select('*, material:material_id(*)').order('order_date',{ascending:false}),
      sb.from('suppliers').select('*').order('name'),
    ]);
    setReceipts(r||[]); setLiftingOrders(lo||[]); setSuppliers(sup||[]); setLoading(false);
  },[]);
  useEffect(()=>{load();},[load]);

  const ordersWithBalance=liftingOrders.filter(o=>Number(o.allotted_kg)-Number(o.lifted_kg)>0);
  const selectedOrder=liftingOrders.find(o=>o.id===form.lifting_order_id);

  const save=async()=>{
    if(!form.lifting_order_id||!form.received_kg||!form.supplier_id) return alert('Lifting order, received quantity and supplier required.');
    setSaving(true);
    const row={
      date:form.date,
      material_id:selectedOrder.material_id,
      scheme:selectedOrder.scheme,
      lifting_order_id:form.lifting_order_id,
      received_kg:Number(form.received_kg),
      vehicle_no:form.vehicle_no,
      supplier_id:form.supplier_id,
      notes:form.notes
    };
    const {data,error}=await sb.from('fci_inwards').insert(row).select('*, material:material_id(*), lifting_order:lifting_order_id(*), supplier:supplier_id(*)').single();
    if(error){alert(error.message);setSaving(false);return;}

    const {data:bucket}=await sb.from('raw_material_scheme_stock').select('*').eq('product_id',selectedOrder.material_id).eq('scheme',selectedOrder.scheme).maybeSingle();
    if(bucket){
      await sb.from('raw_material_scheme_stock').update({qty_kg:Number(bucket.qty_kg)+Number(form.received_kg),updated_at:new Date().toISOString()}).eq('id',bucket.id);
    } else {
      await sb.from('raw_material_scheme_stock').insert({product_id:selectedOrder.material_id,scheme:selectedOrder.scheme,qty_kg:Number(form.received_kg)});
    }

    await sb.from('lifting_orders').update({lifted_kg:Number(selectedOrder.lifted_kg)+Number(form.received_kg)}).eq('id',form.lifting_order_id);

    setReceipts(p=>[data,...p]);
    setLiftingOrders(p=>p.map(o=>o.id===form.lifting_order_id?{...o,lifted_kg:Number(o.lifted_kg)+Number(form.received_kg)}:o));
    localStorage.setItem('lastFciSupplierId', form.supplier_id);
    setForm({...blank, supplier_id: form.supplier_id}); setShowForm(false); setSaving(false);
    logActivity('FCI Inwards','create',`${form.received_kg}kg ${selectedOrder.material?.product_name} against ${selectedOrder.order_no}`);
  };

  const del=async(r)=>{
    if(!confirm('Delete this receipt? Stock and lifting order balance will be reversed.')) return;
    await sb.from('fci_inwards').delete().eq('id',r.id);
    const {data:bucket}=await sb.from('raw_material_scheme_stock').select('*').eq('product_id',r.material_id).eq('scheme',r.scheme).maybeSingle();
    if(bucket) await sb.from('raw_material_scheme_stock').update({qty_kg:Number(bucket.qty_kg)-Number(r.received_kg),updated_at:new Date().toISOString()}).eq('id',bucket.id);
    if(r.lifting_order_id){
      const {data:lo}=await sb.from('lifting_orders').select('*').eq('id',r.lifting_order_id).maybeSingle();
      if(lo) await sb.from('lifting_orders').update({lifted_kg:Math.max(0,Number(lo.lifted_kg)-Number(r.received_kg))}).eq('id',r.lifting_order_id);
    }
    setReceipts(p=>p.filter(x=>x.id!==r.id));
    logActivity('FCI Inwards','delete',`Receipt deleted`);
  };

  if(loading) return <Loading/>;
  const total=receipts.reduce((s,r)=>s+Number(r.received_kg),0);

  return(<div className="page">
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:24,flexWrap:'wrap',gap:12}}>
      <div className="page-header" style={{marginBottom:0}}>
        <div className="page-label">Raw Materials</div>
        <div className="page-title">FCI Inwards — this month: {fmtMT(total)}</div>
      </div>
      <button className="btn btn-amber" onClick={()=>setShowForm(v=>!v)}>+ Log receipt</button>
    </div>

    {showForm&&(
      <FormCard title="New FCI receipt" col="var(--amber)" onSave={save} onCancel={()=>setShowForm(false)} saving={saving}>
        <div className="form-grid">
          <Field label="Date"><input type="date" className="form-input" value={form.date} max={today} onChange={e=>f('date',e.target.value)}/></Field>
          <Field label="Lifting order">
            <select className="form-input" value={form.lifting_order_id} onChange={e=>f('lifting_order_id',e.target.value)}>
              <option value="">-- Select lifting order --</option>
              {ordersWithBalance.map(o=><option key={o.id} value={o.id}>{o.order_no} · {o.material?.product_name} · Balance: {fmtMT(Number(o.allotted_kg)-Number(o.lifted_kg))}</option>)}
            </select>
          </Field>
          <Field label="Scheme">
            <select className="form-input" value={selectedOrder?.scheme||''} disabled style={{opacity:0.6}}>
              <option>{selectedOrder?.scheme||'-- auto from lifting order --'}</option>
            </select>
          </Field>
          <Field label="Received (kg) ★"><input type="number" className="form-input" style={{fontWeight:600}} value={form.received_kg} onChange={e=>f('received_kg',e.target.value)}/></Field>
          <Field label="Vehicle no. ★"><input className="form-input" value={form.vehicle_no} onChange={e=>f('vehicle_no',e.target.value.toUpperCase())}/></Field>
          <Field label="Supplier">
            <select className="form-input" value={form.supplier_id} onChange={e=>{
              if(e.target.value==='__new__'){
                const name=prompt('New supplier name:');
                if(name&&name.trim()){
                  sb.from('suppliers').insert({name:name.trim()}).select().single().then(({data,error})=>{
                    if(error) return alert(error.message);
                    setSuppliers(p=>[...p,data]); f('supplier_id',data.id);
                  });
                }
              } else f('supplier_id',e.target.value);
            }}>
              <option value="">-- Select supplier --</option>
              {suppliers.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
              <option value="__new__">+ Add new supplier…</option>
            </select>
          </Field>
          <Field label="Notes"><input className="form-input" value={form.notes} onChange={e=>f('notes',e.target.value)}/></Field>
        </div>
      </FormCard>
    )}

    <TableWrap><table>
      <thead><tr><th>Date</th><th>Order</th><th>Material</th><th>Scheme</th><th>Received</th><th>Vehicle</th><th>Supplier</th><th></th></tr></thead>
      <tbody>
        {receipts.length===0&&<tr><td colSpan={8}><Empty/></td></tr>}
        {receipts.map(r=>(<tr key={r.id}>
          <td className="mono dim">{r.date}</td>
          <td><strong style={{color:'var(--amber)',fontFamily:'var(--mono)'}}>{r.lifting_order?.order_no||'—'}</strong></td>
          <td>{r.material?.product_name||'—'}</td>
          <td><span className="badge badge-blue">{r.scheme}</span></td>
          <td><strong style={{color:'var(--green)',fontFamily:'var(--mono)'}}>{fmtMT(r.received_kg)}</strong></td>
          <td className="dim">{r.vehicle_no||'—'}</td>
          <td className="dim">{r.supplier?.name||'—'}</td>
          <td><button className="btn btn-red btn-sm" onClick={()=>del(r)}>✕</button></td>
        </tr>))}
      </tbody>
    </table></TableWrap>
  </div>);
}
