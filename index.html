// STOCK COUNT (physical vs book adjustment, Director approves)
// ══════════════════════════════════════════════════════════
const STOCK_REASONS=['Wastage / spillage','Moisture / weighing loss','Damaged','Pilferage / shortage','Counting error','Unrecorded entry','Other'];
const COUNT_STATUS_BADGE={Pending:'badge-amber',Approved:'badge-green',Rejected:'badge-red',Reversed:'badge-muted'};
const r3=(n)=>Math.round((Number(n)||0)*1000)/1000;
const qtyFmt=(n)=>Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:3});
const variancePct=(book,diff)=>book===0?(diff===0?0:100):Math.abs(diff)/Math.abs(book)*100;

async function loadBookStock(category){
  const rows=[];
  if(category==='Store & Materials'){
    const {data}=await sb.from('store_stock').select('*').order('item_name');
    (data||[]).forEach(s=>rows.push({key:'store:'+s.id,item_type:'store',item_id:String(s.id),scheme:null,item_name:s.item_name,unit:s.unit||'Nos',book:r3(s.qty)}));
    return rows;
  }
  const [{data:prods},{data:cs},{data:rs},{data:ss}]=await Promise.all([
    sb.from('product_master').select('*').eq('is_active',true).eq('category',category).order('product_name'),
    sb.from('current_stock').select('*'),
    sb.from('raw_material_stock').select('*'),
    sb.from('raw_material_scheme_stock').select('*'),
  ]);
  (prods||[]).forEach(p=>{
    if(p.is_raw_material&&p.has_schemes){
      const names=Array.from(new Set([...(p.scheme_list||'').split(',').map(s=>s.trim()).filter(Boolean),...(ss||[]).filter(r=>r.product_id===p.id).map(r=>r.scheme)]));
      names.forEach(sch=>{
        const r=(ss||[]).find(x=>x.product_id===p.id&&x.scheme===sch);
        rows.push({key:`scheme:${p.id}:${sch}`,item_type:'scheme',item_id:String(p.id),scheme:sch,item_name:`${p.product_name} — ${sch}`,unit:'kg',book:r3(r?.qty_kg)});
      });
    } else if(!p.is_raw_material&&packSizeOf(p)>0){
      const r=(cs||[]).find(x=>x.product_id===p.id);
      rows.push({key:'finished:'+p.id,item_type:'finished',item_id:String(p.id),scheme:null,item_name:p.product_name,unit:'bags',book:r3(r?.qty_bags)});
    } else {
      const r=(rs||[]).find(x=>x.product_id===p.id);
      rows.push({key:'raw:'+p.id,item_type:'raw',item_id:String(p.id),scheme:null,item_name:p.product_name,unit:'kg',book:r3(r?.qty_kg)});
    }
  });
  return rows;
}

async function adjustStockRow(l,delta){
  const now=new Date().toISOString();
  if(l.item_type==='finished'){
    const {data:s}=await sb.from('current_stock').select('*').eq('product_id',l.item_id).maybeSingle();
    const {error}=s
      ?await sb.from('current_stock').update({qty_bags:Number(s.qty_bags)+delta,updated_at:now}).eq('id',s.id)
      :await sb.from('current_stock').insert({product_id:l.item_id,qty_bags:delta});
    return error?error.message:null;
  }
  if(l.item_type==='raw'){
    const {data:s}=await sb.from('raw_material_stock').select('*').eq('product_id',l.item_id).maybeSingle();
    const {error}=s
      ?await sb.from('raw_material_stock').update({qty_kg:Number(s.qty_kg)+delta,updated_at:now}).eq('id',s.id)
      :await sb.from('raw_material_stock').insert({product_id:l.item_id,qty_kg:delta});
    return error?error.message:null;
  }
  if(l.item_type==='scheme'){
    const {data:s}=await sb.from('raw_material_scheme_stock').select('*').eq('product_id',l.item_id).eq('scheme',l.scheme).maybeSingle();
    const {error}=s
      ?await sb.from('raw_material_scheme_stock').update({qty_kg:Number(s.qty_kg)+delta,updated_at:now}).eq('id',s.id)
      :await sb.from('raw_material_scheme_stock').insert({product_id:l.item_id,scheme:l.scheme,qty_kg:delta});
    return error?error.message:null;
  }
  if(l.item_type==='store'){
    const {data:s}=await sb.from('store_stock').select('*').eq('id',l.item_id).maybeSingle();
    if(!s) return 'Store item not found';
    const {error}=await sb.from('store_stock').update({qty:Number(s.qty)+delta,updated_at:now}).eq('id',s.id);
    return error?error.message:null;
  }
  return 'Unknown item type';
}

// Finished-goods counts must not be dated before the last logged production day,
// otherwise the daily production chain would no longer match the corrected stock.
async function finishedDateProblem(countDate,lines){
  const packOn=await packingActive();
  if(!lines.some(l=>(l.item_type!=='store'||packOn)&&Number(l.diff)!==0)) return '';
  const {data:lastRow}=await sb.from('daily_production_log').select('date').order('date',{ascending:false}).limit(1).maybeSingle();
  if(lastRow&&countDate!==lastRow.date) return countDate>lastRow.date
    ? `Production is logged only up to ${lastRow.date}. Enter production (or "No production") for every day up to ${countDate} first, otherwise stock would be counted twice when you enter it.`
    : `Production is already logged up to ${lastRow.date}, which is after the count date (${countDate}). Reject this count and submit a fresh one dated ${lastRow.date}.`;
  const finIds=lines.filter(l=>l.item_type==='finished'&&Number(l.diff)!==0).map(l=>l.item_id);
  if(finIds.length){
    const [{data:a},{data:b},{data:c}]=await Promise.all([
      sb.from('supplyco_dispatches').select('product_id').in('product_id',finIds).gt('date',countDate).limit(1),
      sb.from('private_dispatches').select('product_id').in('product_id',finIds).gt('date',countDate).limit(1),
      sb.from('product_returns').select('product_id').in('product_id',finIds).gt('date',countDate).limit(1),
    ]);
    if((a&&a.length)||(b&&b.length)||(c&&c.length)) return `Dispatches or returns are already entered after ${countDate}. Enter production for those days first, then count on the latest logged day.`;
  }
  return '';
}

async function applyStockLines(lines){
  const todo=lines.filter(l=>!l.applied&&!l.reversed&&Number(l.diff)!==0);
  for(const l of todo){
    const err=await adjustStockRow(l,Number(l.diff));
    if(err) return {ok:false,msg:`Could not apply "${l.item_name}": ${err}. Lines already applied are saved — use "Finish applying" on this count to retry.`};
    const {error}=await sb.from('stock_count_lines').update({applied:true,applied_at:new Date().toISOString()}).eq('id',l.id);
    if(error) return {ok:false,msg:`Stock for "${l.item_name}" was changed but could not be marked as applied (${error.message}). Do NOT retry this count — check that item's stock manually.`};
  }
  return {ok:true};
}

function StockCount({role,userEmail,onPending}){
  const isDirector=role==='director';
  const [tab,setTab]=useState('new');
  const [threshold,setThreshold]=useState(1);
  const [thresholdInput,setThresholdInput]=useState('1');
  const [categories,setCategories]=useState([]);
  const [category,setCategory]=useState('');
  const [countDate,setCountDate]=useState(today);
  const [book,setBook]=useState([]);
  const [entries,setEntries]=useState({});
  const [sheetNote,setSheetNote]=useState('');
  const [saving,setSaving]=useState(false);
  const [counts,setCounts]=useState([]);
  const [linesByCount,setLinesByCount]=useState({});
  const [loading,setLoading]=useState(true);
  const [expanded,setExpanded]=useState(null);
  const [month,setMonth]=useState(new Date().getMonth()+1);
  const [year,setYear]=useState(new Date().getFullYear());
  const [report,setReport]=useState(null);
  const [lastProd,setLastProd]=useState(undefined);
  const [packOn,setPackOn]=useState(false);

  const loadAll=useCallback(async()=>{
    setLoading(true);
    const [{data:st},{data:pc},{data:c}]=await Promise.all([
      sb.from('erp_settings').select('*').eq('key','variance_threshold_pct').maybeSingle(),
      sb.from('product_master').select('category').eq('is_active',true),
      sb.from('stock_counts').select('*').order('submitted_at',{ascending:false}).limit(100),
    ]);
    const {data:lp}=await sb.from('daily_production_log').select('date').order('date',{ascending:false}).limit(1).maybeSingle();
    setLastProd(lp?lp.date:null);
    setPackOn(await packingActive());
    const t=st?Number(st.value):1;
    const tt=isNaN(t)?1:t;
    setThreshold(tt); setThresholdInput(String(tt));
    setCategories([...Array.from(new Set((pc||[]).map(p=>p.category).filter(Boolean))).sort(),'Store & Materials']);
    const ids=(c||[]).map(x=>x.id);
    const by={};
    if(ids.length){
      const {data:l}=await sb.from('stock_count_lines').select('*').in('count_id',ids);
      (l||[]).forEach(x=>{ (by[x.count_id]=by[x.count_id]||[]).push(x); });
    }
    setCounts(c||[]); setLinesByCount(by);
    if(onPending) onPending((c||[]).filter(x=>x.status==='Pending').length);
    setLoading(false);
  },[]);
  useEffect(()=>{loadAll();},[loadAll]);

  useEffect(()=>{
    if(tab!=='report') return;
    let cancelled=false;
    (async()=>{
      const {start,end}=monthRange(month,year);
      const {data:cs}=await sb.from('stock_counts').select('id,count_date').eq('status','Approved').gte('count_date',start).lte('count_date',end);
      const ids=(cs||[]).map(x=>x.id);
      let ls=[];
      if(ids.length){
        const {data}=await sb.from('stock_count_lines').select('*').in('count_id',ids).eq('reversed',false);
        ls=(data||[]).filter(l=>Number(l.diff)!==0);
      }
      if(!cancelled) setReport({counts:cs||[],lines:ls});
    })();
    return ()=>{cancelled=true;};
  },[tab,month,year]);

  const saveThreshold=async()=>{
    const v=Number(thresholdInput);
    if(isNaN(v)||v<0) return alert('Enter a valid percentage (0 or more).');
    const {error}=await sb.from('erp_settings').upsert({key:'variance_threshold_pct',value:String(v)},{onConflict:'key'});
    if(error) return alert(error.message);
    setThreshold(v);
    logActivity('Stock Count','update',`Variance threshold set to ${v}%`);
    alert('Threshold saved.');
  };

  const startCount=async()=>{
    if(!category) return alert('Select a category first.');
    setSaving(true);
    const rows=await loadBookStock(category);
    setBook(rows); setEntries({}); setSheetNote(''); setSaving(false);
    if(rows.length===0) alert('No items found in this category.');
  };

  const setE=(key,k,v)=>setEntries(p=>({...p,[key]:{counted:'',reason:'',note:'',...(p[key]||{}),[k]:v}}));

  const buildLines=(rows)=>rows.map(r=>{
    const e=entries[r.key];
    const counted=Number(e.counted);
    const diff=r3(counted-r.book);
    return {item_type:r.item_type,item_id:r.item_id,scheme:r.scheme,item_name:r.item_name,unit:r.unit,book_qty:r.book,counted_qty:counted,diff,reason:diff===0?null:e.reason,note:(e.note||'').trim()||null};
  });

  const submitCount=async(applyNow)=>{
    if(!category) return;
    if(countDate>today) return alert('Count date cannot be in the future.');
    const entered=book.filter(r=>{const e=entries[r.key]; return e&&e.counted!==''&&e.counted!==undefined;});
    if(entered.length===0) return alert('Enter at least one counted quantity.');
    for(const r of entered){
      const e=entries[r.key]; const counted=Number(e.counted);
      if(isNaN(counted)||counted<0) return alert(`Invalid count for ${r.item_name}.`);
      const diff=r3(counted-r.book);
      if(diff!==0){
        if(!e.reason) return alert(`Select a reason for ${r.item_name}.`);
        if(variancePct(r.book,diff)>threshold&&!(e.note||'').trim()) return alert(`${r.item_name}: the difference is above the ${threshold}% threshold — a written note is required.`);
      }
    }
    setSaving(true);
    const fresh=await loadBookStock(category);
    const changed=entered.filter(r=>{const f=fresh.find(x=>x.key===r.key); return !f||Math.abs(f.book-r.book)>0.0005;});
    if(changed.length){
      setBook(fresh); setSaving(false);
      return alert('Book stock changed while you were counting: '+changed.map(c=>c.item_name).join(', ')+'.\n\nThe sheet has been refreshed. Please review the differences and submit again.');
    }
    const lines=buildLines(entered);
    const problem=await finishedDateProblem(countDate,lines);
    if(problem){ setSaving(false); return alert(problem); }
    const direct=applyNow&&isDirector;
    const nowIso=new Date().toISOString();
    const {data:c,error}=await sb.from('stock_counts').insert({count_date:countDate,category,notes:sheetNote.trim()||null,status:direct?'Approved':'Pending',submitted_by:userEmail,reviewed_by:direct?userEmail:null,reviewed_at:direct?nowIso:null}).select().single();
    if(error){ setSaving(false); return alert(error.message); }
    const {data:ins,error:le}=await sb.from('stock_count_lines').insert(lines.map(l=>({...l,count_id:c.id}))).select();
    if(le){
      await sb.from('stock_counts').update({status:'Rejected',review_note:'System: lines failed to save — '+le.message}).eq('id',c.id);
      setSaving(false); return alert('Could not save the count lines: '+le.message);
    }
    if(direct){
      const res=await applyStockLines(ins||[]);
      if(!res.ok) alert(res.msg);
    }
    logActivity('Stock Count','create',`${direct?'Applied':'Submitted'} count — ${category} (${lines.length} items, ${lines.filter(l=>l.diff!==0).length} differences) dated ${countDate}`);
    setSaving(false); setBook([]); setEntries({}); setSheetNote('');
    await loadAll(); setTab('history');
    if(!direct) alert('Count submitted. Stock will change only after the Director approves it.');
  };

  const approve=async(c)=>{
    const ls=linesByCount[c.id]||[];
    const diffs=ls.filter(l=>Number(l.diff)!==0).length;
    const problem=await finishedDateProblem(c.count_date,ls);
    if(problem) return alert(problem+'\n\nReject this count and submit a fresh one.');
    if(!window.confirm(`Approve and apply this count? ${diffs} stock adjustment${diffs===1?'':'s'} will change live stock now.`)) return;
    setSaving(true);
    const {data:upd,error}=await sb.from('stock_counts').update({status:'Approved',reviewed_by:userEmail,reviewed_at:new Date().toISOString()}).eq('id',c.id).eq('status','Pending').select();
    if(error||!upd||upd.length===0){ alert(error?error.message:'This count was already processed.'); setSaving(false); loadAll(); return; }
    const res=await applyStockLines(ls);
    if(!res.ok) alert(res.msg);
    logActivity('Stock Count','update',`Approved count — ${c.category} dated ${c.count_date}`);
    setSaving(false); loadAll();
  };

  const reject=async(c)=>{
    const why=window.prompt('Reason for rejecting this count (required):');
    if(!why||!why.trim()) return;
    setSaving(true);
    const {data:upd,error}=await sb.from('stock_counts').update({status:'Rejected',reviewed_by:userEmail,reviewed_at:new Date().toISOString(),review_note:why.trim()}).eq('id',c.id).eq('status','Pending').select();
    if(error||!upd||upd.length===0) alert(error?error.message:'This count was already processed.');
    else logActivity('Stock Count','update',`Rejected count — ${c.category} dated ${c.count_date}: ${why.trim()}`);
    setSaving(false); loadAll();
  };

  const finishApplying=async(c)=>{
    const ls=linesByCount[c.id]||[];
    const problem=await finishedDateProblem(c.count_date,ls.filter(l=>!l.applied));
    if(problem) return alert(problem);
    setSaving(true);
    const res=await applyStockLines(ls);
    if(!res.ok) alert(res.msg);
    setSaving(false); loadAll();
  };

  const reverse=async(c)=>{
    const ls=(linesByCount[c.id]||[]).filter(l=>l.applied&&!l.reversed&&Number(l.diff)!==0);
    for(const l of ls.filter(x=>x.item_type==='finished')){
      const {data:later}=await sb.from('daily_production_log').select('date').eq('product_id',l.item_id).gt('date',c.count_date).limit(1);
      if(later&&later.length) return alert(`Cannot reverse: production for "${l.item_name}" has been logged after ${c.count_date}. Submit a new corrective count instead.`);
    }
    const why=window.prompt('Reason for reversing this adjustment (required):');
    if(!why||!why.trim()) return;
    setSaving(true);
    for(const l of ls){
      const err=await adjustStockRow(l,-Number(l.diff));
      if(err){ alert(`Could not reverse "${l.item_name}": ${err}. Reversal stopped; lines already reversed are saved.`); setSaving(false); loadAll(); return; }
      await sb.from('stock_count_lines').update({reversed:true}).eq('id',l.id);
    }
    await sb.from('stock_counts').update({status:'Reversed',review_note:`Reversed by ${userEmail}: ${why.trim()}`}).eq('id',c.id);
    logActivity('Stock Count','update',`Reversed count — ${c.category} dated ${c.count_date}: ${why.trim()}`);
    setSaving(false); loadAll();
  };

  if(loading) return <Loading/>;

  const pendingN=counts.filter(c=>c.status==='Pending').length;
  const chainCat=!!category&&(category!=='Store & Materials'||packOn);
  const prodBehind=chainCat&&!!lastProd&&lastProd<today;
  const enteredRows=book.filter(r=>{const e=entries[r.key]; return e&&e.counted!==''&&e.counted!==undefined;});
  const diffRows=enteredRows.filter(r=>r3(Number(entries[r.key].counted)-r.book)!==0);
  const overRows=diffRows.filter(r=>variancePct(r.book,r3(Number(entries[r.key].counted)-r.book))>threshold);

  const byItem={}; const byReason={};
  ((report&&report.lines)||[]).forEach(l=>{
    const k=`${l.item_name}|${l.unit}`;
    const o=byItem[k]=byItem[k]||{name:l.item_name,unit:l.unit,n:0,plus:0,minus:0};
    o.n++; const d=Number(l.diff); if(d>0) o.plus+=d; else o.minus+=d;
    const rk=l.reason||'—'; byReason[rk]=(byReason[rk]||0)+1;

  return(<div className="page">

      <div className="page-label">Inventory</div>

        <span className="dim" style={{fontSize:12}}>Differences above this need a written note.</span>
      </>):(
        <span style={{fontSize:13}}>Differences above <strong>{threshold}%</strong> need a written note. Your count is sent to the Director for approval — stock changes only after approval.</span>
      )}
    </div>

    <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:16}}>
      {[['new','New count'],['history','Approvals & history'],['report','Variance report']].map(([id,l])=>(
        <button key={id} className={`btn btn-sm ${tab===id?'btn-amber':'btn-ghost'}`} onClick={()=>setTab(id)}>{l}{id==='history'&&pendingN>0?` (${pendingN} pending)`:''}</button>
      ))}
    </div>

    {tab==='new'&&(<>
      <div className="card" style={{marginBottom:16}}>
        <div className="form-grid">
          <Field label="Category">
            <select className="form-input" value={category} onChange={e=>{const v=e.target.value;setCategory(v);setBook([]);setEntries({});setCountDate(v&&(v!=='Store & Materials'||packOn)&&lastProd?lastProd:today);}}>
              <option value="">-- Select category --</option>
              {categories.map(c=><option key={c}>{c}</option>)}
            </select>
          </Field>
          <Field label="Count date"><input type="date" className="form-input" value={countDate} max={today} disabled={chainCat&&!!lastProd} style={chainCat&&lastProd?{opacity:0.7}:{}} onChange={e=>setCountDate(e.target.value)}/></Field>
          <div className="form-field" style={{justifyContent:'flex-end'}}>
            <button className="btn btn-blue" onClick={startCount} disabled={saving||!category||prodBehind}>Load book stock</button>
          </div>
        </div>
        {chainCat&&(
          <div style={{marginTop:12,padding:'10px 12px',borderRadius:6,fontSize:12,background:prodBehind?'color-mix(in srgb, var(--red) 10%, transparent)':'color-mix(in srgb, var(--green) 10%, transparent)',border:`1px solid ${prodBehind?'color-mix(in srgb, var(--red) 30%, transparent)':'color-mix(in srgb, var(--green) 30%, transparent)'}`}}>
            {!lastProd?'No production has been logged yet, so you can count on any date.':prodBehind?`Production is logged only up to ${lastProd}, but today is ${today}. Enter production (or "No production") for the missing days first. Otherwise this count would include stock that production has not recorded yet, and it would be counted twice when you enter it.`:`✓ Production is logged up to ${lastProd}. The count date is fixed to that day.`}
          </div>

      {book.length>0&&(<>
        <TableWrap><table>

          <tbody>
            {book.map(r=>{

              {isDirector&&c.status==='Approved'&&<button className="btn btn-ghost btn-sm" onClick={()=>reverse(c)} disabled={saving}>Reverse</button>}

          {expanded===c.id&&(<div style={{marginTop:12}}><TableWrap><table>
            <thead><tr><th>Item</th><th>Book</th><th>Counted</th><th>Difference</th><th>Reason</th><th>Note</th><th>Applied</th></tr></thead>
            <tbody>
              {ls.map(l=>{

        <TableWrap><table>

          {Object.entries(byReason).sort((a,b)=>b[1]-a[1]).map(([r,n])=><span key={r} className="badge badge-blue">{r}: {n}</span>)}
        </div>
      </>)}
    </>)}
  </div>);
}

const LIC_CATEGORIES=['License','Certificate','Registration','Permit','Insurance','Compliance filing','Other'];
const LIC_FREQUENCIES=['Monthly','Quarterly','Half-yearly','Annual','Every 2 years'];
const LIC_N_YEARS='Every N years';
const LIC_BUCKET='license-docs';
const LIC_STAGE_LABEL=['Not due yet','Person in charge alerted','Escalated to manager','Escalated to Director'];
const LIC_STAGE_COL=['var(--green)','var(--amber)','#EA580C','var(--red)'];

const licShift=(dateStr,n)=>{
  const [y,m,d]=dateStr.split('-').map(Number);
  const dt=new Date(y,m-1,d);
  dt.setDate(dt.getDate()+n);
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
};

// Stage is worked out live from the dates every time — nothing about "alert state" is stored, so it can never go stale.
const licInfo=(l)=>{
  const daysLeft=daysUntil(l.expiry_date);
  const r=Number(l.remind_days)||0, m=Number(l.manager_days)||0, d=Number(l.director_days)||0;
  let stage=0;
  if(daysLeft!==null){
    if(daysLeft<=r-m-d) stage=3;
    else if(daysLeft<=r-m) stage=2;
    else if(daysLeft<=r) stage=1;
  }
  return {daysLeft,stage};
};

const licDaysText=(d)=>d===null?'—':d<0?`Expired ${-d} day${-d===1?'':'s'} ago`:d===0?'Expires today':`${d} day${d===1?'':'s'} left`;

// Which licences should this person see in My Tasks?
const licAlertsFor=(list,employeeId,role)=>{
  const me=(employeeId===null||employeeId===undefined)?'':String(employeeId);
  const out=[];
  list.forEach(l=>{
    if(l.status!=='Active') return;
    const {daysLeft,stage}=licInfo(l);
    if(stage<1) return;
    let as=null;
    if(me&&String(l.assigned_to_id||'')===me) as='assignee';
    else if(stage>=2&&me&&String(l.manager_id||'')===me) as='manager';
    else if(stage>=3&&role==='director') as='director';
    if(as) out.push({lic:l,daysLeft,stage,as});
  });
  return out.sort((a,b)=>a.daysLeft-b.daysLeft);
};

async function uploadLicenseFiles(licenseId,renewalId,files){
  let ok=0; const failed=[];
  for(const file of files){
    try{
      const isPdf=file.type==='application/pdf'||/\.pdf$/i.test(file.name);
      const isImg=(file.type||'').startsWith('image/');
      if(!isPdf&&!isImg){ failed.push(`${file.name} (not an image or PDF)`); continue; }
      if(isPdf&&file.size>10*1024*1024){ failed.push(`${file.name} (PDF is over 10 MB)`); continue; }
      const body=isPdf?file:await compressImage(file,2000,0.85);
      const path=`${licenseId}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${isPdf?'pdf':'jpg'}`;
      const {error}=await sb.storage.from(LIC_BUCKET).upload(path,body,{contentType:isPdf?'application/pdf':'image/jpeg'});
      if(error){ failed.push(`${file.name} (${error.message})`); continue; }
      const {error:e2}=await sb.from('license_docs').insert({license_id:licenseId,renewal_id:renewalId||null,storage_path:path,file_name:file.name,kind:isPdf?'pdf':'image'});
      if(e2){ await sb.storage.from(LIC_BUCKET).remove([path]); failed.push(`${file.name} (${e2.message})`); continue; }
      ok++;
    }catch(e){ failed.push(`${file.name} (${e.message})`); }
  }
  return {ok,failed};
}

// Shared "Renew" popup — used on the Licenses page and inside My Tasks.
function RenewModal({lic,onClose,onDone}){
  const [newExpiry,setNewExpiry]=useState('');
  const [notes,setNotes]=useState('');
  const [cost,setCost]=useState('');
  const [files,setFiles]=useState([]);
  const [saving,setSaving]=useState(false);

  const submit=async()=>{
    if(!newExpiry) return alert('Enter the new expiry date exactly as printed on the renewed document.');
    if(newExpiry<=today) return alert('The new expiry date must be in the future.');
    if(lic.expiry_date&&newExpiry<=lic.expiry_date&&!confirm(`The new expiry (${newExpiry}) is not later than the current expiry (${lic.expiry_date}). Continue anyway?`)) return;
    if(files.length===0) return alert('Upload the renewed certificate (photo or PDF) before saving.');
    setSaving(true);
    const {data:{user}}=await sb.auth.getUser();
    const {data:ren,error}=await sb.from('license_renewals').insert({license_id:lic.id,previous_expiry:lic.expiry_date,new_expiry:newExpiry,renewed_by:user?.email||null,notes:notes.trim()||null,cost:cost===''?null:Number(cost)}).select().single();
    if(error){ alert(error.message); setSaving(false); return; }
    const {ok,failed}=await uploadLicenseFiles(lic.id,ren.id,files);
    if(ok===0){
      await sb.from('license_renewals').delete().eq('id',ren.id);
      alert('No document could be uploaded, so the renewal was NOT saved.\n'+failed.join('\n'));
      setSaving(false); return;
    }
    const {error:ue}=await sb.from('licenses').update({expiry_date:newExpiry}).eq('id',lic.id);
    if(ue){ alert('The document was saved, but the expiry date could not be updated: '+ue.message+'\nPlease try again.'); setSaving(false); return; }
    if(failed.length) alert('Renewed, but these files failed to upload:\n'+failed.join('\n'));
    logActivity('Licenses','update',`Renewed — ${lic.name}: new expiry ${newExpiry}`);
    setSaving(false); onDone();
  };

  return(<div className="modal-overlay">
    <div className="card" style={{maxWidth:480,width:'100%',maxHeight:'90vh',overflowY:'auto'}}>
      <div className="section-label">Renew — {lic.name}</div>
      <div style={{fontSize:12,color:'var(--muted)',marginBottom:12}}>Current expiry: <strong>{lic.expiry_date}</strong>. The expiry date only changes after the new document has been uploaded.</div>
      <div style={{display:'flex',flexDirection:'column',gap:12}}>
        <Field label="New expiry date ★ (as printed on the new document)"><input type="date" className="form-input" min={today} value={newExpiry} onChange={e=>setNewExpiry(e.target.value)}/></Field>
        <Field label="Renewed certificate ★ (photos or PDF)"><input type="file" accept="image/*,application/pdf" multiple className="form-input" onChange={e=>setFiles(Array.from(e.target.files||[]))}/></Field>
        {files.length>0&&<div style={{fontSize:12,color:'var(--muted)'}}>{files.length} file{files.length===1?'':'s'} selected.</div>}
        <Field label="Renewal cost (₹) — optional"><input type="number" className="form-input" value={cost} onChange={e=>setCost(e.target.value)}/></Field>
        <Field label="Notes — optional"><input className="form-input" value={notes} onChange={e=>setNotes(e.target.value)}/></Field>
      </div>
      <div className="form-actions">
        <button className="btn btn-green" onClick={submit} disabled={saving}>{saving?'Saving…':'Save renewal'}</button>
        <button className="btn btn-ghost" onClick={onClose} disabled={saving}>Cancel</button>
      </div>
    </div>
  </div>);
}

// Shown at the top of My Tasks.
function RenewalAlerts({employeeId,role,onRenewed}){
  const [list,setList]=useState([]);
  const [loaded,setLoaded]=useState(false);
  const [renewing,setRenewing]=useState(null);
  const load=useCallback(async()=>{
    const {data}=await sb.from('licenses').select('*').eq('status','Active');
    setList(licAlertsFor(data||[],employeeId,role)); setLoaded(true);
  },[employeeId,role]);
  useEffect(()=>{load();},[load]);
  if(!loaded||list.length===0) return null;
  return(<div style={{marginBottom:24}}>
    <div className="section-label">Renewals needing action ({list.length})</div>
    {list.map(a=>{
      const l=a.lic;
      const col=LIC_STAGE_COL[a.stage];
      const who=a.as==='assignee'
        ?'You are the person in charge of this renewal.'
        :a.as==='manager'
          ?`Escalated to you as manager — ${l.assigned_to_name||'the person in charge'} has not renewed it yet.`
          :`Escalated to the Director — ${l.assigned_to_name||'the person in charge'} and ${l.manager_name||'the manager'} have not renewed it yet.`;
      return(<div key={l.id} className="card" style={{marginBottom:12,borderLeft:`4px solid ${col}`}}>
        <div style={{display:'flex',justifyContent:'space-between',gap:12,flexWrap:'wrap'}}>
          <div style={{flex:1,minWidth:200}}>
            <div style={{fontSize:15,fontWeight:600}}>🔔 Renew: {l.name}</div>
            <div style={{fontSize:12,color:'var(--muted)',marginTop:2}}>{[l.category,l.license_no,l.issuing_authority].filter(Boolean).join(' · ')}</div>
            <div style={{fontSize:13,marginTop:6,color:col,fontWeight:500}}>{licDaysText(a.daysLeft)} (expiry {l.expiry_date})</div>
            <div style={{fontSize:12,marginTop:4}}>{who}</div>
          </div>
          <div><button className="btn btn-green btn-sm" onClick={()=>setRenewing(l)}>Renew &amp; upload</button></div>
        </div>
      </div>);
    })}
    {renewing&&<RenewModal lic={renewing} onClose={()=>setRenewing(null)} onDone={()=>{ setRenewing(null); load(); if(onRenewed) onRenewed(); }}/>}
  </div>);
}

function Licenses({role,userEmail,onChanged}){

  const [licenses,setLicenses]=useState([]);
  const [docs,setDocs]=useState([]);

  const [saving,setSaving]=useState(false);
  const [newFiles,setNewFiles]=useState([]);
  const [fileKey,setFileKey]=useState(0);
  const [renewing,setRenewing]=useState(null);
  const [history,setHistory]=useState(null);
  const [viewerUrl,setViewerUrl]=useState(null);
  const blank={name:'',category:'License',license_no:'',issuing_authority:'',frequency:'Annual',freq_years:3,issue_date:'',expiry_date:'',assigned_to_id:'',manager_id:'',remind_days:30,manager_days:10,director_days:10,notes:''};
  const [form,setForm]=useState(blank);
  const f=(k,v)=>setForm(p=>({...p,[k]:v}));
  const changed=()=>{ if(onChanged) onChanged(); };

  const load=useCallback(async()=>{
    setLoading(true);
    const [{data:emps},{data:au},{data:l},{data:d},{data:r}]=await Promise.all([
      sb.from(EMP_TABLE).select('*').range(0,4999),
      sb.from('app_users').select('*'),
      sb.from('licenses').select('*').order('expiry_date'),
      sb.from('license_docs').select('*').order('created_at'),
      sb.from('license_renewals').select('*').order('created_at',{ascending:false}),
    ]);
    setEmployees(emps||[]); setAppUsers(au||[]); setLicenses(l||[]); setDocs(d||[]); setRenewals(r||[]); setLoading(false);
  },[]);
  useEffect(()=>{load();},[load]);

  const resetForm=()=>{ setForm(blank); setEditingId(null); setShowForm(false); setNewFiles([]); setFileKey(k=>k+1); };
  const startAdd=()=>{ setEditingId(null); setForm(blank); setNewFiles([]); setFileKey(k=>k+1); setShowForm(true); };
  const startEdit=(l)=>{
    setEditingId(l.id);
    setForm({name:l.name||'',category:l.category||'License',license_no:l.license_no||'',issuing_authority:l.issuing_authority||'',...(()=>{const m=/^Every (\d+) years?$/.exec(l.frequency||''); return m&&Number(m[1])>=3?{frequency:LIC_N_YEARS,freq_years:Number(m[1])}:{frequency:l.frequency||'Annual',freq_years:3};})(),issue_date:l.issue_date||'',expiry_date:l.expiry_date||'',assigned_to_id:l.assigned_to_id||'',manager_id:l.manager_id||'',remind_days:l.remind_days,manager_days:l.manager_days,director_days:l.director_days,notes:l.notes||''});
    setNewFiles([]); setFileKey(k=>k+1); setShowForm(true);
  };

  const empNameById=(id)=>{ const e=employees.find(x=>String(x.id)===String(id)); return e?empName(e):''; };
  const linked=new Set(appUsers.filter(u=>u.employee_id!==null&&u.employee_id!==undefined).map(u=>String(u.employee_id)));
  const noLogin=(id)=>!!id&&!linked.has(String(id));

  const save=async()=>{
    if(!form.name.trim()) return alert('Name is required.');
    if(form.frequency===LIC_N_YEARS&&(!Number.isInteger(Number(form.freq_years))||Number(form.freq_years)<1)) return alert('Enter the number of years as a whole number, 1 or more.');
    if(!form.expiry_date) return alert('Expiry date is required.');
    if(!form.assigned_to_id) return alert('Select the person in charge of renewing.');
    if(!form.manager_id) return alert('Select the manager the alert escalates to.');
    const r=Number(form.remind_days), m=Number(form.manager_days), d=Number(form.director_days);
    if(!Number.isInteger(r)||r<1) return alert('"Alert before expiry" must be a whole number of days, at least 1.');
    if(!Number.isInteger(m)||m<0||!Number.isInteger(d)||d<0) return alert('Escalation days must be whole numbers (0 or more).');
    if(m+d>r&&!confirm(`The manager and Director days add up to more than ${r}, so the Director alert would only start AFTER the expiry date. Continue anyway?`)) return;
    if(form.assigned_to_id===form.manager_id&&!confirm('The person in charge and the manager are the same person, so escalation adds nobody new until it reaches the Director. Continue anyway?')) return;
    const unl=[form.assigned_to_id,form.manager_id].filter(id=>noLogin(id)).map(id=>empNameById(id)||'Unknown');
    if(unl.length&&!confirm(`No login is linked to: ${unl.join(', ')}.\n\nThey will NOT see any alert in My Tasks until the Director links their login in the HR portal. Save anyway?`)) return;
    const orig=editingId?licenses.find(x=>x.id===editingId):null;
    if(orig&&isDirector&&orig.expiry_date!==form.expiry_date&&!confirm(`You are changing the expiry date from ${orig.expiry_date} to ${form.expiry_date} directly, without a renewal document. Use "Renew" for real renewals; edit the date only to correct a typing mistake. Continue?`)) return;
    setSaving(true);
    const {data:{user}}=await sb.auth.getUser();
    const payload={name:form.name.trim(),category:form.category,license_no:form.license_no.trim()||null,issuing_authority:form.issuing_authority.trim()||null,frequency:form.frequency===LIC_N_YEARS?(Number(form.freq_years)===1?'Annual':`Every ${Number(form.freq_years)} years`):form.frequency,issue_date:form.issue_date||null,assigned_to_id:String(form.assigned_to_id),assigned_to_name:empNameById(form.assigned_to_id)||null,manager_id:String(form.manager_id),manager_name:empNameById(form.manager_id)||null,remind_days:r,manager_days:m,director_days:d,notes:form.notes.trim()||null};
    if(!editingId||isDirector) payload.expiry_date=form.expiry_date;
    if(editingId){
      const {error}=await sb.from('licenses').update(payload).eq('id',editingId);
      if(error){ alert(error.message); setSaving(false); return; }
      logActivity('Licenses','update',`Edited — ${payload.name}${orig&&orig.expiry_date!==payload.expiry_date&&payload.expiry_date?` (expiry ${orig.expiry_date} → ${payload.expiry_date})`:''}${orig&&String(orig.assigned_to_id||'')!==payload.assigned_to_id?` (person in charge → ${payload.assigned_to_name})`:''}`);
    } else {
      const {data:ins,error}=await sb.from('licenses').insert({...payload,status:'Active',created_by:user?.email||userEmail||null}).select().single();
      if(error){ alert(error.message); setSaving(false); return; }
      if(newFiles.length){
        const res=await uploadLicenseFiles(ins.id,null,newFiles);
        if(res.failed.length) alert('Saved, but these files failed to upload:\n'+res.failed.join('\n'));
      }
      logActivity('Licenses','create',`New — ${payload.name}, expires ${payload.expiry_date}`);
    }
    setSaving(false); resetForm(); load(); changed();
  };

  const openDoc=async(d)=>{
    const w=d.kind==='pdf'?window.open('','_blank'):null;
    const {data,error}=await sb.storage.from(LIC_BUCKET).createSignedUrl(d.storage_path,300);
    if(error||!data||!data.signedUrl){ if(w) w.close(); return alert('Could not open the file: '+(error?error.message:'unknown error')); }
    if(d.kind==='pdf'){ if(w) w.location.href=data.signedUrl; else window.open(data.signedUrl,'_blank'); }
    else setViewerUrl(data.signedUrl);
  };

  const addFiles=async(l,fileList)=>{
    const files=Array.from(fileList||[]);
    if(!files.length) return;
    const latest=renewals.find(r=>r.license_id===l.id);
    const {ok,failed}=await uploadLicenseFiles(l.id,latest?latest.id:null,files);
    if(failed.length) alert('These files failed to upload:\n'+failed.join('\n'));
    if(ok) logActivity('Licenses','update',`${ok} file${ok===1?'':'s'} added — ${l.name}`);
    load();
  };

  const delDoc=async(d,l)=>{
    if(!isDirector) return alert('Only a Director can delete documents.');
    if(!confirm(`Delete "${d.file_name||'this file'}" from ${l.name}? This cannot be undone.`)) return;
    const {error:se}=await sb.storage.from(LIC_BUCKET).remove([d.storage_path]);
    if(se) return alert('Could not delete the file: '+se.message);
    await sb.from('license_docs').delete().eq('id',d.id);
    logActivity('Licenses','delete',`File deleted — ${d.file_name||''} from ${l.name}`);
    load();
  };

  const setArchived=async(l,archive)=>{
    if(!isDirector) return alert('Only a Director can archive or restore a record.');
    if(archive&&!confirm(`Archive "${l.name}"? All alerts for it will stop.`)) return;
    const {error}=await sb.from('licenses').update({status:archive?'Archived':'Active'}).eq('id',l.id);
    if(error) return alert(error.message);
    logActivity('Licenses','update',`${archive?'Archived':'Restored'} — ${l.name}`);
    load(); changed();
  };

  const deleteLicense=async(l)=>{
    if(!isDirector) return alert('Only a Director can delete a record.');
    if(!confirm(`Permanently delete "${l.name}", its renewal history and ALL its uploaded documents?\n\nThis cannot be undone. If it is simply no longer needed, use Archive instead.`)) return;
    const paths=docs.filter(d=>d.license_id===l.id).map(d=>d.storage_path);
    if(paths.length){
      const {error:se}=await sb.storage.from(LIC_BUCKET).remove(paths);
      if(se) return alert('Could not delete the files: '+se.message);
    }
    const {error}=await sb.from('licenses').delete().eq('id',l.id);
    if(error) return alert('Could not delete: '+error.message);
    logActivity('Licenses','delete',`Deleted — ${l.name}`);
    load(); changed();
  };

  if(loading) return <Loading/>;

  const activeEmps=employees.filter(empIsActive).sort((a,b)=>empName(a).localeCompare(empName(b)));
  const rows=licenses.map(l=>({l,...licInfo(l)}));
  const activeRows=rows.filter(x=>x.l.status==='Active');
  const dueSoonN=activeRows.filter(x=>x.stage>=1&&x.daysLeft>=0).length;
  const expiredN=activeRows.filter(x=>x.daysLeft<0).length;
  const escalatedN=activeRows.filter(x=>x.stage>=2).length;
  const q=search.trim().toLowerCase();
  const visible=rows.filter(x=>{
    const l=x.l;
    if(filter==='Active'&&l.status!=='Active') return false;
    if(filter==='Archived'&&l.status!=='Archived') return false;
    if(filter==='Due soon'&&!(l.status==='Active'&&x.stage>=1&&x.daysLeft>=0)) return false;
    if(filter==='Expired'&&!(l.status==='Active'&&x.daysLeft<0)) return false;
    if(q&&!`${l.name} ${l.license_no||''} ${l.issuing_authority||''} ${l.category||''} ${l.assigned_to_name||''}`.toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b)=>(a.l.expiry_date||'9999').localeCompare(b.l.expiry_date||'9999'));

  const empSelect=(key,label)=>(
    <Field label={label}>
      <select className="form-input" value={form[key]} onChange={e=>f(key,e.target.value)}>
        <option value="">-- Select person --</option>
        {form[key]&&!activeEmps.some(e=>String(e.id)===String(form[key]))&&<option value={form[key]}>{empNameById(form[key])||'Unknown'} (inactive)</option>}
        {activeEmps.map(e=><option key={e.id} value={String(e.id)}>{empLabel(e)}</option>)}
      </select>
      {noLogin(form[key])&&<div style={{fontSize:11,color:'var(--red)',marginTop:4}}>⚠ No login is linked to this employee — they will not see the alert.</div>}
    </Field>
  );

  const pr=Number(form.remind_days)||0, pm=Number(form.manager_days)||0, pd=Number(form.director_days)||0;
  const preview=form.expiry_date?`Alerts will start: person in charge ${licShift(form.expiry_date,-pr)} · manager ${licShift(form.expiry_date,-(pr-pm))} · Director ${licShift(form.expiry_date,-(pr-pm-pd))}`:'';

  const docChip=(d,l)=>(
    <span key={d.id} style={{display:'inline-flex',gap:2,marginRight:6,marginBottom:6}}>
      <button className="btn btn-ghost btn-sm" style={{maxWidth:200,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} onClick={()=>openDoc(d)}>{d.kind==='pdf'?'📄':'🖼️'} {d.file_name||'file'}</button>
      {isDirector&&<button className="btn btn-red btn-sm" onClick={()=>delDoc(d,l)}>✕</button>}
    </span>
  );

  return(<div className="page">
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:24,flexWrap:'wrap',gap:12}}>
      <div className="page-header" style={{marginBottom:0}}>
        <div className="page-label">Compliance</div>
        <div className="page-title">Licenses &amp; renewals</div>
      </div>
      <button className="btn btn-amber" onClick={startAdd}>+ New license / certificate</button>
    </div>

    <div className="stat-grid">
      <StatCard label="Active" value={activeRows.length} col="var(--blue)"/>
      <StatCard label="Due soon" value={dueSoonN} col={dueSoonN>0?'var(--amber)':'var(--green)'}/>
      <StatCard label="Expired" value={expiredN} col={expiredN>0?'var(--red)':'var(--green)'}/>
      <StatCard label="Escalated" value={escalatedN} col={escalatedN>0?'var(--red)':'var(--green)'}/>
    </div>

    <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center',marginBottom:12}}>
      {['Active','Due soon','Expired','Archived','All'].map(s=><button key={s} className={`btn btn-sm ${filter===s?'btn-amber':'btn-ghost'}`} onClick={()=>setFilter(s)}>{s}</button>)}
      <input style={{width:220}} placeholder="Search name, number, authority…" value={search} onChange={e=>setSearch(e.target.value)}/>
    </div>

    {visible.length===0&&<div className="card"><Empty msg="Nothing to show in this view."/></div>}

    {visible.map(x=>{
      const l=x.l;
      const isActive=l.status==='Active';
      const latest=renewals.find(r=>r.license_id===l.id);
      const rens=renewals.filter(r=>r.license_id===l.id);
      const curDocs=docs.filter(d=>d.license_id===l.id&&(latest?d.renewal_id===latest.id:!d.renewal_id));
      const col=LIC_STAGE_COL[x.stage];
      const asg=employees.find(e=>String(e.id)===String(l.assigned_to_id));
      const mgr=employees.find(e=>String(e.id)===String(l.manager_id));
      const r=Number(l.remind_days)||0, m=Number(l.manager_days)||0, d=Number(l.director_days)||0;
      return(<div key={l.id} className="card" style={{marginBottom:14,borderLeft:`4px solid ${isActive?col:'var(--border2)'}`,opacity:isActive?1:0.7}}>
        <div style={{display:'flex',justifyContent:'space-between',gap:12,flexWrap:'wrap'}}>
          <div style={{flex:1,minWidth:220}}>
            <div style={{fontSize:16,fontWeight:600}}>{l.name}</div>
            <div style={{display:'flex',gap:6,flexWrap:'wrap',marginTop:6}}>
              <span className="badge badge-blue">{l.category}</span>
              {l.frequency&&<span className="badge badge-muted">{l.frequency}</span>}
              {!isActive&&<span className="badge badge-muted">Archived</span>}
              {isActive&&x.daysLeft<0&&<span className="badge badge-red">Expired</span>}
              {isActive&&x.daysLeft>=0&&x.stage>=1&&<span className="badge" style={{background:`color-mix(in srgb, ${col} 18%, transparent)`,color:col}}>{LIC_STAGE_LABEL[x.stage]}</span>}
            </div>
          </div>
          <div style={{display:'flex',gap:6,flexWrap:'wrap',alignItems:'flex-start'}}>
            {isActive&&<button className="btn btn-green btn-sm" onClick={()=>setRenewing(l)}>Renew</button>}
            <button className="btn btn-blue btn-sm" onClick={()=>startEdit(l)}>Edit</button>
            <button className="btn btn-ghost btn-sm" onClick={()=>setHistory(history===l.id?null:l.id)}>{history===l.id?'Hide history':'History'}</button>
            {isDirector&&(isActive
              ?<button className="btn btn-ghost btn-sm" onClick={()=>setArchived(l,true)}>Archive</button>
              :<button className="btn btn-ghost btn-sm" onClick={()=>setArchived(l,false)}>Restore</button>)}
            {isDirector&&<button className="btn btn-red btn-sm" onClick={()=>deleteLicense(l)}>✕</button>}
          </div>
        </div>

        <div style={{display:'flex',gap:16,flexWrap:'wrap',marginTop:10,fontSize:12,color:'var(--muted)'}}>
          {l.license_no&&<span>No. {l.license_no}</span>}
          {l.issuing_authority&&<span>🏛 {l.issuing_authority}</span>}
          {l.issue_date&&<span>Issued {l.issue_date}</span>}
          <span style={{color:isActive?(x.daysLeft<0?'var(--red)':x.stage>=1?col:'var(--muted)'):'var(--muted)',fontWeight:500}}>⏰ Expires {l.expiry_date} · {licDaysText(x.daysLeft)}</span>
          <span>👤 {l.assigned_to_name||'—'}{asg&&!empIsActive(asg)&&<strong style={{color:'var(--red)'}}> (no longer active — reassign!)</strong>}</span>
          <span>🧑‍💼 Manager: {l.manager_name||'—'}{mgr&&!empIsActive(mgr)&&<strong style={{color:'var(--red)'}}> (no longer active — reassign!)</strong>}</span>
        </div>
        {isActive&&<div style={{fontSize:11,color:'var(--dim)',marginTop:6}}>Alerts: person in charge from {licShift(l.expiry_date,-r)} · manager from {licShift(l.expiry_date,-(r-m))} · Director from {licShift(l.expiry_date,-(r-m-d))}</div>}
        {l.notes&&<div style={{fontSize:13,marginTop:8,whiteSpace:'pre-wrap'}}>{l.notes}</div>}

        <div style={{marginTop:10}}>
          <div className="form-label" style={{marginBottom:6}}>Current document{curDocs.length===1?'':'s'}</div>
          {curDocs.length===0&&<div style={{fontSize:12,color:'var(--red)',marginBottom:6}}>⚠ No document on file</div>}
          <div>
            {curDocs.map(dd=>docChip(dd,l))}
            <label className="btn btn-ghost btn-sm" style={{display:'inline-block',marginBottom:6,cursor:'pointer'}}>
              + Add file
              <input type="file" accept="image/*,application/pdf" multiple style={{display:'none'}} onChange={e=>{ addFiles(l,e.target.files); e.target.value=''; }}/>
            </label>
          </div>
        </div>

        {history===l.id&&(<div style={{marginTop:12,paddingTop:10,borderTop:'1px solid var(--border)'}}>
          <div className="form-label" style={{marginBottom:6}}>Renewal history</div>
          {rens.length===0&&<div className="dim" style={{fontSize:12}}>Not renewed through the app yet.</div>}
          {rens.map(rn=>(<div key={rn.id} style={{fontSize:12,marginBottom:8}}>
            <strong>{(rn.created_at||'').slice(0,10)}</strong> — expiry {rn.previous_expiry||'—'} → <strong>{rn.new_expiry}</strong> · by {rn.renewed_by||'—'}{rn.cost!==null&&rn.cost!==undefined?` · ₹${fmt(rn.cost)}`:''}{rn.notes?` · ${rn.notes}`:''}
            <div style={{marginTop:4}}>{docs.filter(dd=>dd.renewal_id===rn.id).map(dd=>docChip(dd,l))}</div>
          </div>))}
          {docs.some(dd=>dd.license_id===l.id&&!dd.renewal_id)&&(<div style={{fontSize:12,marginBottom:8}}>
            <strong>Original document{docs.filter(dd=>dd.license_id===l.id&&!dd.renewal_id).length===1?'':'s'}</strong>
            <div style={{marginTop:4}}>{docs.filter(dd=>dd.license_id===l.id&&!dd.renewal_id).map(dd=>docChip(dd,l))}</div>
          </div>)}
          <div style={{fontSize:11,color:'var(--dim)'}}>Created {(l.created_at||'').slice(0,10)}{l.created_by?` by ${l.created_by}`:''}</div>
        </div>)}
      </div>);
    })}

    {showForm&&(
      <div className="modal-overlay">
        <div style={{maxWidth:720,width:'100%',maxHeight:'92vh',overflowY:'auto'}}>
          <FormCard title={editingId?'Edit license / certificate':'New license / certificate'} col="var(--amber)" onSave={save} onCancel={resetForm} saving={saving}>
            <div className="form-grid">
              <Field label="Name ★"><input className="form-input" value={form.name} onChange={e=>f('name',e.target.value)} placeholder="e.g. FSSAI License"/></Field>
              <Field label="Category"><select className="form-input" value={form.category} onChange={e=>f('category',e.target.value)}>{LIC_CATEGORIES.map(c=><option key={c}>{c}</option>)}</select></Field>
              <Field label="License / certificate no."><input className="form-input" value={form.license_no} onChange={e=>f('license_no',e.target.value)}/></Field>
              <Field label="Issuing authority"><input className="form-input" value={form.issuing_authority} onChange={e=>f('issuing_authority',e.target.value)}/></Field>
              <Field label="Renews"><select className="form-input" value={form.frequency} onChange={e=>f('frequency',e.target.value)}>{LIC_FREQUENCIES.map(c=><option key={c}>{c}</option>)}<option value={LIC_N_YEARS}>Every N years (enter number)</option></select></Field>
{form.frequency===LIC_N_YEARS&&<Field label="Number of years ★"><input type="number" min="1" step="1" className="form-input" value={form.freq_years} onChange={e=>f('freq_years',e.target.value)}/></Field>}
              <Field label="Issue date"><input type="date" className="form-input" value={form.issue_date} onChange={e=>f('issue_date',e.target.value)}/></Field>
              <Field label={editingId&&!isDirector?'Expiry date (use Renew to change)':'Expiry date ★'}><input type="date" className="form-input" value={form.expiry_date} disabled={!!editingId&&!isDirector} onChange={e=>f('expiry_date',e.target.value)}/></Field>
            </div>
            <div className="divider"/>
            <div className="section-label">Who gets the alerts</div>
            <div className="form-grid">
              {empSelect('assigned_to_id','Person in charge ★')}
              {empSelect('manager_id','Manager (escalation) ★')}
              <Field label="Alert person in charge ★ (days before expiry)"><input type="number" min="1" className="form-input" value={form.remind_days} onChange={e=>f('remind_days',e.target.value)}/></Field>
              <Field label="Escalate to manager after (more days)"><input type="number" min="0" className="form-input" value={form.manager_days} onChange={e=>f('manager_days',e.target.value)}/></Field>
              <Field label="Escalate to Director after (more days)"><input type="number" min="0" className="form-input" value={form.director_days} onChange={e=>f('director_days',e.target.value)}/></Field>
            </div>
            {preview&&<div style={{marginTop:10,fontSize:12,color:'var(--blue)'}}>{preview}</div>}
            <div style={{marginTop:4,fontSize:11,color:'var(--muted)'}}>Director alerts go to every user with the Director role.</div>
            <div style={{marginTop:12}}>
              <Field label="Notes"><textarea className="form-input" rows={2} value={form.notes} onChange={e=>f('notes',e.target.value)}/></Field>
            </div>
            {!editingId&&(<div style={{marginTop:12}}>
              <Field label="Certificate photos / PDF"><input key={fileKey} type="file" accept="image/*,application/pdf" multiple className="form-input" onChange={e=>setNewFiles(Array.from(e.target.files||[]))}/></Field>
              {newFiles.length>0&&<div style={{fontSize:12,color:'var(--muted)',marginTop:4}}>{newFiles.length} file{newFiles.length===1?'':'s'} selected.</div>}
            </div>)}
          </FormCard>
        </div>
      </div>
    )}

    {renewing&&<RenewModal lic={renewing} onClose={()=>setRenewing(null)} onDone={()=>{ setRenewing(null); load(); changed(); }}/>}

    {viewerUrl&&(
      <div className="modal-overlay" onClick={()=>setViewerUrl(null)} style={{cursor:'zoom-out'}}>
        <img src={viewerUrl} alt="" style={{maxWidth:'100%',maxHeight:'92vh',borderRadius:8,background:'#fff'}}/>
      </div>
    )}
  </div>);
}

// ══════════════════════════════════════════════════════════
// REPORTS
// ══════════════════════════════════════════════════════════
const downloadCSV=(name,head,rows)=>{
  const esc=(v)=>{ const s=String(v===null||v===undefined?'':v); return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const csv=[head,...rows].map(r=>r.map(esc).join(',')).join('\r\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
};

// Supabase returns at most 1000 rows per request, so read in pages.
async function fetchAllRows(build){
  let all=[],from=0;
  for(;;){
    const {data,error}=await build(from,from+999);
    if(error) throw new Error(error.message);
    all=all.concat(data||[]);
    if(!data||data.length<1000) break;
    from+=1000;
  }
  return all;
}
const repMust=(res)=>{ if(res.error) throw new Error(res.error.message); return res.data||[]; };
const repMt=(kg)=>(Number(kg||0)/1000).toLocaleString('en-IN',{minimumFractionDigits:3,maximumFractionDigits:3});
const repSMt=(kg)=>{ const n=Number(kg||0); return (n>0?'+':'')+repMt(n); };
const repPct=(n)=>(n===null||n===undefined||isNaN(n))?'—':n.toFixed(2)+'%';

const reportPresets=()=>{
  const now=new Date();
  let pm=now.getMonth(), py=now.getFullYear();
  if(pm===0){ pm=12; py-=1; }
  const lm=monthRange(pm,py);
  const [ty,tm]=today.split('-').map(Number);
  return [
    {label:'This month',from:`${today.slice(0,7)}-01`,to:today},
    {label:'Last month',from:lm.start,to:lm.end},
    {label:'Financial year to date',from:`${tm>=4?ty:ty-1}-04-01`,to:today},
  ];
};

// Wheat differences found at approved, applied stock counts in the period.
async function fetchWheatAdjustments(from,to){
  const {data:cs,error}=await sb.from('stock_counts').select('id,count_date').eq('status','Approved').gte('count_date',from).lte('count_date',to);
  if(error) throw new Error(error.message);
  const ids=(cs||[]).map(c=>c.id);
  if(!ids.length) return [];
  const {data,error:e2}=await sb.from('stock_count_lines').select('*').in('count_id',ids).eq('item_type','scheme').eq('reversed',false);
  if(e2) throw new Error(e2.message);
  return (data||[]).filter(l=>l.applied&&Number(l.diff)!==0);
}

// Everything is worked out from daily_production_log x the recipes currently saved.
function computeYield(logs,recipes,lines,products){
  const prodById={}; products.forEach(p=>{prodById[String(p.id)]=p;});
  const recipeOf={}; recipes.forEach(r=>{recipeOf[String(r.product_id)]=r;});
  const linesOf={}; lines.forEach(l=>{(linesOf[l.recipe_id]=linesOf[l.recipe_id]||[]).push(l);});
  const T={grain:0,finished:0,finishedCov:0,byp:0,bypCov:0};
  const schemes={},prods={},dates={},bypMap={},otherMap={};
  const noRecipe=new Set(),noSize=new Set();
  const slot=(m,k,init)=>{ if(!m[k]) m[k]=init(); return m[k]; };
  const mk=()=>({grain:0,finished:0,finishedCov:0,byp:0,bypCov:0});
  logs.forEach(r=>{
    const bags=Number(r.production_bags)||0;
    if(bags===0) return;
    const p=r.product||prodById[String(r.product_id)];
    if(!p) return;
    const size=packSizeOf(p);
    if(size<=0){ noSize.add(p.product_name); return; }
    const kg=bags*size;
    const rec=recipeOf[String(p.id)];
    const ls=rec?(linesOf[rec.id]||[]):[];
    const baseScheme=schemeFromName(p.product_name)||'Private';
    let grain=0,byp=0;
    const grainBy={};
    ls.forEach(l=>{
      const mat=prodById[String(l.material_id)];
      const q=kg*Number(l.qty_per_unit);
      if(l.line_type==='consumes'){
        if(mat&&mat.is_raw_material&&mat.has_schemes){ grain+=q; const k=l.scheme||baseScheme; grainBy[k]=(grainBy[k]||0)+q; }
        else { const k=mat?mat.product_name:'(missing item)'; otherMap[k]=(otherMap[k]||0)+q; }
      } else {
        byp+=q; const k=mat?mat.product_name:'(missing item)'; bypMap[k]=(bypMap[k]||0)+q;
      }
    });
    if(grain===0) noRecipe.add(p.product_name);
    const cov=grain>0;
    T.grain+=grain; T.finished+=kg; T.byp+=byp;
    if(cov){ T.finishedCov+=kg; T.bypCov+=byp; }
    const sS=slot(schemes,baseScheme,mk);
    sS.finished+=kg; sS.byp+=byp; if(cov){ sS.finishedCov+=kg; sS.bypCov+=byp; }
    Object.keys(grainBy).forEach(k=>{ slot(schemes,k,mk).grain+=grainBy[k]; });
    const d=slot(dates,r.date,mk);
    d.grain+=grain; d.finished+=kg; d.byp+=byp; if(cov){ d.finishedCov+=kg; d.bypCov+=byp; }
    const pp=slot(prods,String(p.id),()=>({name:p.product_name,bags:0,kg:0,grain:0,byp:0}));
    pp.bags+=bags; pp.kg+=kg; pp.grain+=grain; pp.byp+=byp;
  });
  return {T,schemes,prods:Object.values(prods).sort((a,b)=>b.kg-a.kg),dates:Object.keys(dates).sort().map(k=>({date:k,...dates[k]})),byp:bypMap,other:otherMap,noRecipe:Array.from(noRecipe).sort(),noSize:Array.from(noSize).sort()};
}

function RTable({head,rows,foot,empty}){
  const al=(i)=>i>0?{textAlign:'right'}:undefined;
  return(<TableWrap><table>
    <thead><tr>{head.map((h,i)=><th key={i} style={al(i)}>{h}</th>)}</tr></thead>
    <tbody>
      {rows.length===0&&<tr><td colSpan={head.length}><Empty msg={empty||'No data in this period.'}/></td></tr>}
      {rows.map((r,ri)=>(<tr key={ri}>{r.map((c,i)=><td key={i} className={i>0?'mono':undefined} style={al(i)}>{c}</td>)}</tr>))}
    </tbody>
    {foot&&rows.length>0&&<tfoot><tr style={{borderTop:'2px solid var(--border2)',fontWeight:700}}>{foot.map((c,i)=><td key={i} className={i>0?'mono':undefined} style={al(i)}>{c}</td>)}</tr></tfoot>}
  </table></TableWrap>);
}

function YieldReport({data,from,to}){
  const y=data.y,T=y.T;
  const recovery=T.grain>0?T.finishedCov/T.grain*100:null;
  const lossRaw=T.grain>0?(T.grain-T.finishedCov-T.bypCov)/T.grain*100:null;
  const loss=lossRaw!==null&&Math.abs(lossRaw)<0.005?0:lossRaw;
  const adjNet=data.adj.reduce((s,l)=>s+Number(l.diff),0);
  const adjPct=T.grain>0?(-adjNet)/T.grain*100:null;
  const rec=(o)=>o.grain>0?o.finishedCov/o.grain*100:null;

  const schemeRows=Object.keys(y.schemes).sort().map(k=>{ const s=y.schemes[k]; return [<strong>{k}</strong>,repMt(s.grain),repMt(s.finished),repMt(s.byp),repPct(rec(s))]; });
  const prodRows=y.prods.map(p=>[<strong>{p.name}</strong>,fmt(p.bags),repMt(p.kg),repMt(p.grain),repPct(p.grain>0?p.kg/p.grain*100:null)]);
  const dayRows=y.dates.map(d=>[d.date,repMt(d.grain),repMt(d.finished),repMt(d.byp),repPct(rec(d))]);
  const bypRows=Object.entries(y.byp).sort((a,b)=>b[1]-a[1]).map(([k,v])=>[k,repMt(v)]);
  const otherRows=Object.entries(y.other).sort((a,b)=>b[1]-a[1]).map(([k,v])=>[k,repMt(v)]);

  const csvDaily=()=>downloadCSV(`milling_yield_${from}_to_${to}.csv`,['Date','Wheat used (kg)','Finished goods (kg)','By-products (kg)','Recovery %'],
    y.dates.map(d=>[d.date,r3(d.grain),r3(d.finished),r3(d.byp),d.grain>0?(d.finishedCov/d.grain*100).toFixed(2):'']));

  return(<>
    <div className="stat-grid">
      <StatCard label="Wheat used" value={repMt(T.grain)+' MT'} sub="from recipes" col="var(--amber)"/>
      <StatCard label="Finished goods" value={repMt(T.finished)+' MT'} col="var(--green)"/>
      <StatCard label="By-products" value={repMt(T.byp)+' MT'} sub="from recipes" col="var(--blue)"/>
      <StatCard label="Recovery" value={repPct(recovery)} sub="finished ÷ wheat used" col="var(--green)"/>
      <StatCard label="Process loss" value={repPct(loss)} sub="implied by recipes" col="var(--red)"/>
    </div>

    <div className="card" style={{marginBottom:20,borderLeft:'3px solid var(--purple)'}}>
      <div className="section-label">Physical check — what stock counts actually found</div>
      {data.adj.length===0?(
        <div style={{fontSize:13}}>No wheat differences were applied through approved stock counts in this period, so there is no measured figure yet. Count wheat regularly (Stock Count → Raw Material) to see real shrinkage here.</div>
      ):(<>
        <div style={{fontSize:22,fontWeight:600,color:adjNet<0?'var(--red)':'var(--green)'}}>{repSMt(adjNet)} MT</div>
        <div style={{fontSize:13,marginTop:4}}>{adjNet<0?'Net wheat shortage':'Net wheat excess'} found at counts{adjPct!==null?` — ${Math.abs(adjPct).toFixed(2)}% of the wheat used`:''} · {data.adj.length} adjustment line{data.adj.length===1?'':'s'}.</div>
      </>)}
    </div>

    {(y.noRecipe.length>0||y.noSize.length>0)&&(<div className="card" style={{marginBottom:20,borderLeft:'3px solid var(--amber)'}}>
      <div className="section-label">Check these</div>
      {y.noRecipe.length>0&&<div style={{fontSize:13,marginBottom:6}}>⚠ No wheat recipe set, so these are left out of recovery % (their wheat use is not counted): <strong>{y.noRecipe.join(', ')}</strong>. Set them in Product Recipes.</div>}
      {y.noSize.length>0&&<div style={{fontSize:13}}>⚠ No pack size set, so these are not counted at all: <strong>{y.noSize.join(', ')}</strong>.</div>}
    </div>)}

    <div className="section-label">By scheme (MT)</div>
    <RTable head={['Scheme','Wheat used','Finished','By-products','Recovery']} rows={schemeRows} foot={['Total',repMt(T.grain),repMt(T.finished),repMt(T.byp),repPct(recovery)]}/>

    <div className="section-label" style={{marginTop:24}}>By product</div>
    <RTable head={['Product','Bags','Finished (MT)','Wheat used (MT)','Recovery']} rows={prodRows}/>

    <div className="two-col" style={{marginTop:24,alignItems:'start'}}>
      <div>
        <div className="section-label">By-products produced (MT)</div>
        <RTable head={['By-product','MT']} rows={bypRows} empty="No by-product lines in your recipes."/>
      </div>
      <div>
        <div className="section-label">Other materials consumed (MT)</div>
        <RTable head={['Material','MT']} rows={otherRows} empty="None."/>
      </div>
    </div>

    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',margin:'24px 0 12px',flexWrap:'wrap',gap:8}}>
      <div className="section-label" style={{marginBottom:0}}>By day (MT)</div>
      <button className="btn btn-ghost btn-sm" onClick={csvDaily} disabled={dayRows.length===0}>⬇ Download CSV</button>
    </div>
    <RTable head={['Date','Wheat used','Finished','By-products','Recovery']} rows={dayRows}/>

    <div className="dim" style={{fontSize:12,marginTop:16,maxWidth:760}}>
      How this is worked out: bags produced × pack size gives the finished kg; wheat used and by-products come from the Product Recipes saved today, applied to the whole period. These are standards, not weighed figures. Recipe lines with a "use up first" fallback are counted against the main material.
    </div>
  </>);
}

function WheatReport({data,from,to}){
  const y=data.y;
  const prodById={}; data.products.forEach(p=>{prodById[String(p.id)]=p;});
  const isWheat=(id)=>{ const p=prodById[String(id)]; return !!(p&&p.is_raw_material&&p.has_schemes); };
  const inw={},sold={},adj={},stock={},used={};
  const add=(m,k,v)=>{ m[k]=(m[k]||0)+Number(v||0); };
  data.fci.forEach(r=>add(inw,r.scheme||'—',r.received_kg));
  data.pin.forEach(r=>{ if(isWheat(r.material_id)) add(inw,'Private',r.qty_kg); });
  data.pdisp.forEach(r=>{ if(isWheat(r.product_id)) add(sold,'Private',r.qty_kg); });
  data.adj.forEach(l=>add(adj,l.scheme||'—',l.diff));
  data.stock.forEach(s=>add(stock,s.scheme,s.qty_kg));
  Object.keys(y.schemes).forEach(k=>{ if(y.schemes[k].grain>0) used[k]=y.schemes[k].grain; });
  const keys=Array.from(new Set([...Object.keys(inw),...Object.keys(sold),...Object.keys(adj),...Object.keys(used),...Object.keys(stock)])).sort();
  const atToday=to===today;
  const net=(k)=>(inw[k]||0)-(used[k]||0)-(sold[k]||0)+(adj[k]||0);
  const tot=(m)=>keys.reduce((s,k)=>s+(m[k]||0),0);
  const totNet=keys.reduce((s,k)=>s+net(k),0);

  const rows=keys.map(k=>[<strong>{k}</strong>,repMt(inw[k]),repMt(used[k]),repMt(sold[k]),repSMt(adj[k]),repSMt(net(k)),repMt(stock[k]),atToday?repMt((stock[k]||0)-net(k)):'—']);
  const csv=()=>downloadCSV(`wheat_movement_${from}_to_${to}.csv`,['Scheme','Inwards (kg)','Used in production (kg)','Private sales (kg)','Count adjustments (kg)','Net movement (kg)','Current stock (kg)'],
    keys.map(k=>[k,r3(inw[k]||0),r3(used[k]||0),r3(sold[k]||0),r3(adj[k]||0),r3(net(k)),r3(stock[k]||0)]));

  return(<>
    <div className="stat-grid">
      <StatCard label="Inwards" value={repMt(tot(inw))+' MT'} col="var(--green)"/>
      <StatCard label="Used in production" value={repMt(tot(used))+' MT'} sub="from recipes" col="var(--amber)"/>
      <StatCard label="Private sales" value={repMt(tot(sold))+' MT'} col="var(--blue)"/>
      <StatCard label="Net movement" value={repSMt(totNet)+' MT'} col={totNet<0?'var(--red)':'var(--green)'}/>
    </div>

    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12,flexWrap:'wrap',gap:8}}>
      <div className="section-label" style={{marginBottom:0}}>Wheat by scheme (MT)</div>
      <button className="btn btn-ghost btn-sm" onClick={csv} disabled={keys.length===0}>⬇ Download CSV</button>
    </div>
    <RTable head={['Scheme','Inwards','Used in production','Private sales','Count adj.','Net movement','Current stock','Opening (derived)']} rows={rows}
      foot={['Total',repMt(tot(inw)),repMt(tot(used)),repMt(tot(sold)),repSMt(tot(adj)),repSMt(totNet),repMt(tot(stock)),atToday?repMt(tot(stock)-totNet):'—']}/>

    <div className="dim" style={{fontSize:12,marginTop:16,maxWidth:760}}>
      Net movement = inwards − used in production − private sales + stock-count adjustments. "Used in production" comes from recipes. "Opening (derived)" is current stock minus the net movement, and is only shown when the period ends today.
    </div>
  </>);
}

function DispatchReport({data,from,to}){
  const bySch={},byDist={},byDep={},pProd={},pParty={};
  const inv=new Set();
  let sBags=0,sKg=0,pKg=0;
  const slot=(m,k)=>{ if(!m[k]) m[k]={bags:0,kg:0,n:0}; return m[k]; };
  data.sd.forEach(r=>{
    const bags=Number(r.qty_bags)||0;
    const kg=bags*packSizeOf(r.product);
    sBags+=bags; sKg+=kg; if(r.invoice_no) inv.add(r.invoice_no);
    [[bySch,r.scheme||'—'],[byDist,r.district||'—'],[byDep,r.depot_name||'—']].forEach(([m,k])=>{ const o=slot(m,k); o.bags+=bags; o.kg+=kg; o.n++; });
  });
  data.pd.forEach(r=>{
    const p=r.product; const raw=!!(p&&p.is_raw_material);
    const bags=raw?0:(Number(r.qty_bags)||0);
    const kg=raw?(Number(r.qty_kg)||0):bags*packSizeOf(p);
    pKg+=kg;
    [[pProd,p?p.product_name:'(unknown)'],[pParty,r.party_name||'—']].forEach(([m,k])=>{ const o=slot(m,k); o.bags+=bags; o.kg+=kg; o.n++; });
  });
  const sorted=(m)=>Object.entries(m).sort((a,b)=>b[1].kg-a[1].kg||b[1].bags-a[1].bags);
  const sRows=(m)=>sorted(m).map(([k,o])=>[<strong>{k}</strong>,fmt(o.n),fmt(o.bags),repMt(o.kg)]);
  const csv=()=>downloadCSV(`dispatch_by_depot_${from}_to_${to}.csv`,['Depot','Dispatch lines','Bags','Weight (kg)'],sorted(byDep).map(([k,o])=>[k,o.n,o.bags,r3(o.kg)]));

  return(<>
    <div className="stat-grid">
      <StatCard label="Supplyco bags" value={fmt(sBags)} col="var(--green)"/>
      <StatCard label="Supplyco weight" value={repMt(sKg)+' MT'} col="var(--green)"/>
      <StatCard label="Invoices" value={fmt(inv.size)} sub="distinct invoice numbers" col="var(--amber)"/>
      <StatCard label="Private dispatch" value={repMt(pKg)+' MT'} col="var(--blue)"/>
    </div>

    <div className="section-label">Supplyco — by scheme</div>
    <RTable head={['Scheme','Lines','Bags','MT']} rows={sRows(bySch)} foot={['Total',fmt(data.sd.length),fmt(sBags),repMt(sKg)]}/>

    <div className="section-label" style={{marginTop:24}}>Supplyco — by district</div>
    <RTable head={['District','Lines','Bags','MT']} rows={sRows(byDist)}/>

    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',margin:'24px 0 12px',flexWrap:'wrap',gap:8}}>
      <div className="section-label" style={{marginBottom:0}}>Supplyco — by depot</div>
      <button className="btn btn-ghost btn-sm" onClick={csv} disabled={Object.keys(byDep).length===0}>⬇ Download CSV</button>
    </div>
    <RTable head={['Depot','Lines','Bags','MT']} rows={sRows(byDep)}/>

    <div className="section-label" style={{marginTop:24}}>Private dispatch — by product</div>
    <RTable head={['Product','Lines','Bags','MT']} rows={sRows(pProd)} empty="No private dispatches in this period."/>

    <div className="section-label" style={{marginTop:24}}>Private dispatch — by party</div>
    <RTable head={['Party','Lines','Bags','MT']} rows={sRows(pParty)} empty="No private dispatches in this period."/>
  </>);
}

function Reports(){
  const presets=reportPresets();
  const [tab,setTab]=useState('yield');
  const [from,setFrom]=useState(presets[0].from);
  const [to,setTo]=useState(presets[0].to);
  const [data,setData]=useState(null);
  const [loading,setLoading]=useState(false);
  const [err,setErr]=useState('');

  useEffect(()=>{
    if(!from||!to) return;
    if(from>to){ setData(null); setErr('The "From" date is after the "To" date.'); return; }
    let cancelled=false;
    setLoading(true); setErr(''); setData(null);
    (async()=>{
      try{
        const out={tab};
        if(tab==='dispatch'){
          const [sd,pd]=await Promise.all([
            fetchAllRows((a,b)=>sb.from('supplyco_dispatches').select('*, product:product_id(*)').gte('date',from).lte('date',to).order('date').order('id').range(a,b)),
            fetchAllRows((a,b)=>sb.from('private_dispatches').select('*, product:product_id(*)').gte('date',from).lte('date',to).order('date').order('id').range(a,b)),
          ]);
          out.sd=sd; out.pd=pd;
        } else {
          const [logs,products,recipes,lines,adj]=await Promise.all([
            fetchAllRows((a,b)=>sb.from('daily_production_log').select('*, product:product_id(*)').gte('date',from).lte('date',to).order('date').order('id').range(a,b)),
            sb.from('product_master').select('*').then(repMust),
            sb.from('product_recipes').select('*').then(repMust),
            sb.from('recipe_lines').select('*').then(repMust),
            fetchWheatAdjustments(from,to),
          ]);
          out.y=computeYield(logs,recipes,lines,products);
          out.adj=adj; out.products=products;
          if(tab==='wheat'){
            const [fci,pin,pdisp,stock]=await Promise.all([
              fetchAllRows((a,b)=>sb.from('fci_inwards').select('id,date,scheme,received_kg').gte('date',from).lte('date',to).order('date').order('id').range(a,b)),
              fetchAllRows((a,b)=>sb.from('private_inwards').select('id,date,qty_kg,material_id').gte('date',from).lte('date',to).order('date').order('id').range(a,b)),
              fetchAllRows((a,b)=>sb.from('private_dispatches').select('id,date,qty_kg,product_id').gte('date',from).lte('date',to).order('date').order('id').range(a,b)),
              sb.from('raw_material_scheme_stock').select('*').then(repMust),
            ]);
            out.fci=fci; out.pin=pin; out.pdisp=pdisp; out.stock=stock;
          }
        }
        if(!cancelled){ setData(out); setLoading(false); }
      }catch(e){
        if(!cancelled){ setErr(e.message||String(e)); setLoading(false); }
      }
    })();
    return ()=>{cancelled=true;};
  },[tab,from,to]);

  return(<div className="page">
    <div className="page-header">
      <div className="page-label">Reports</div>
      <div className="page-title">Reports</div>
    </div>

    <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:16}}>
      {[['yield','Milling yield'],['wheat','Wheat movement'],['dispatch','Dispatch summary']].map(([id,l])=>(
        <button key={id} className={`btn btn-sm ${tab===id?'btn-amber':'btn-ghost'}`} onClick={()=>setTab(id)}>{l}</button>
      ))}
    </div>

    <div className="card" style={{marginBottom:20,display:'flex',gap:12,alignItems:'flex-end',flexWrap:'wrap'}}>
      <Field label="From"><input type="date" className="form-input" style={{width:160}} max={today} value={from} onChange={e=>setFrom(e.target.value)}/></Field>
      <Field label="To"><input type="date" className="form-input" style={{width:160}} max={today} value={to} onChange={e=>setTo(e.target.value)}/></Field>
      <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
        {presets.map(p=><button key={p.label} className="btn btn-ghost btn-sm" onClick={()=>{setFrom(p.from);setTo(p.to);}}>{p.label}</button>)}
      </div>
    </div>

    {err&&<Alert type="red" icon="⚠" title="Could not build this report" sub={err}/>}
    {loading&&<Loading/>}
    {!loading&&data&&data.tab===tab&&tab==='yield'&&<YieldReport data={data} from={from} to={to}/>}
    {!loading&&data&&data.tab===tab&&tab==='wheat'&&<WheatReport data={data} from={from} to={to}/>}
    {!loading&&data&&data.tab===tab&&tab==='dispatch'&&<DispatchReport data={data} from={from} to={to}/>}
  </div>);
}

const titleCase=(s)=>String(s||'').toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());

function TaskBadge({n,compact}){
  const cls=n===0?'tb-clear':n===1?'tb-one':n<=4?'tb-few':n<=9?'tb-many':'tb-crit';
  const label=n===0?'✓':n>=10?`⚠ ${n}`:String(n);
  const tip=n===0?'No pending tasks':`${n} pending task${n===1?'':'s'}`;
  return <span className={`task-badge ${cls}${compact?' compact':''}`} title={tip}>{label}</span>;
}

// ══════════════════════════════════════════════════════════
// ROLES & RESPONSIBILITIES (org chart built from HR portal posts)
// ══════════════════════════════════════════════════════════
function OrgChart({role,employeeId,visible,onVisible}){
  const isDirector=role==='director';
  const [posts,setPosts]=useState([]);
  const [emps,setEmps]=useState([]);
  const [rows,setRows]=useState([]);
  const [loading,setLoading]=useState(true);
  const [err,setErr]=useState('');
  const [sel,setSel]=useState(null);
  const [editing,setEditing]=useState(false);
  const [draft,setDraft]=useState({purpose:'',resp:''});
  const [parentPick,setParentPick]=useState('TOP');
  const [saving,setSaving]=useState(false);
  const [hist,setHist]=useState([]);
  const [find,setFind]=useState('');

  const load=useCallback(async()=>{
    const [p,e,o]=await Promise.all([
      sb.from('posts').select('id,name').order('name'),
      sb.from(EMP_TABLE).select('*').range(0,4999),
      sb.from('org_positions').select('*'),
    ]);
    const bad=p.error||e.error||o.error;
    setErr(bad?bad.message+' — have you run the SQL for this section?':'');
    setPosts(p.data||[]);
    setEmps((e.data||[]).filter(empIsActive));
    setRows(o.data||[]);
    setLoading(false);
  },[]);
  useEffect(()=>{load();},[load]);

  useEffect(()=>{
    if(!sel){ setHist([]); return; }
    sb.from('org_history').select('*').eq('post_id',String(sel)).order('changed_at',{ascending:false}).limit(6).then(({data})=>setHist(data||[]));
  },[sel,rows]);
  const [expanded,setExpanded]=useState(null); // null = default (top two levels open)

  if(loading) return <Loading/>;

  const postById={}; posts.forEach(p=>{postById[String(p.id)]=p;});
  const rowById={}; rows.forEach(r=>{rowById[r.post_id]=r;});
  const live=(id)=>!!(id&&postById[id]&&rowById[id]&&rowById[id].placed);
  const parentOf=(id)=>(rowById[id]&&rowById[id].parent_post_id)||null;
  const allIds=posts.map(p=>String(p.id));
  const placedIds=allIds.filter(live);
  const kids=(pid)=>placedIds.filter(id=>parentOf(id)===pid).sort((a,b)=>postById[a].name.localeCompare(postById[b].name));
  const top=kids(null);
  const orphans=placedIds.filter(id=>parentOf(id)&&!live(parentOf(id)));
  const unplaced=allIds.filter(id=>!live(id)).sort((a,b)=>postById[a].name.localeCompare(postById[b].name));
  const holdersOf=(id)=>emps.filter(e=>postById[id]&&e.post===postById[id].name);
  const chainOf=(id)=>{ const out=[]; let cur=parentOf(id),n=0; while(cur&&n<50){ out.push(cur); cur=parentOf(cur); n++; } return out; };
  const descOf=(id,seen=new Set())=>{ kids(id).forEach(k=>{ if(!seen.has(k)){ seen.add(k); descOf(k,seen); } }); return seen; };

  const me=emps.find(e=>String(e.id)===String(employeeId));
  const myPost=me?posts.find(p=>p.name===me.post):null;
  const myPostId=myPost?String(myPost.id):null;
  const canEdit=(id)=>isDirector||(!!myPostId&&chainOf(id).includes(myPostId));

const walk=(fn)=>{ const go=(id,d,seen)=>{ if(seen.has(id)) return; seen.add(id); fn(id,d); kids(id).forEach(k=>go(k,d+1,seen)); }; top.forEach(t=>go(t,1,new Set())); };
const materialize=()=>{ if(expanded) return {...expanded}; const m={}; walk((id,d)=>{ if(d<2) m[id]=true; }); return m; };
const isOpen=(id,d)=>expanded?!!expanded[id]:d<2;
const toggle=(id)=>{ const m=materialize(); m[id]=!m[id]; setExpanded(m); };
const expandAll=()=>{ const m={}; walk(id=>{ m[id]=true; }); setExpanded(m); };
const collapseAll=()=>setExpanded({});
const headcount=(id)=>{ let n=0; const s=descOf(id); s.add(id); s.forEach(x=>{ n+=holdersOf(x).length; }); return n; };
const OC_COLS=['#7C3AED','#2563EB','#0891B2','#059669','#D97706'];

const pick=(id)=>{
  setSel(id); setEditing(false);
  const par=parentOf(id);
  setParentPick(par&&live(par)?par:'TOP');
  const m=materialize(); chainOf(id).forEach(a=>{ m[a]=true; }); setExpanded(m);
};
  const startEdit=(id)=>{ const r=rowById[id]||{}; setDraft({purpose:r.purpose||'',resp:r.responsibilities||''}); setEditing(true); };

  const saveResp=async(id)=>{
    setSaving(true);
    const {error}=await sb.rpc('org_set_responsibilities',{p_post:id,p_purpose:draft.purpose.trim(),p_resp:draft.resp.trim()});
    setSaving(false);
    if(error) return alert(error.message);
    logActivity('Roles & Responsibilities','update',`Responsibilities edited — ${postById[id].name}`);
    setEditing(false); await load();
  };
  const saveParent=async(id,placed)=>{
    setSaving(true);
    const parent=parentPick==='TOP'?null:parentPick;
    const {error}=await sb.rpc('org_set_parent',{p_post:id,p_parent:parent,p_placed:placed});
    setSaving(false);
    if(error) return alert(error.message);
    logActivity('Roles & Responsibilities','update',placed?`${postById[id].name} placed under ${parent?postById[parent].name:'the Director'}`:`${postById[id].name} removed from the chart`);
    await load();
  };

    const toggleVisible=async()=>{
    const next=!visible;
    if(!confirm(next?'Make this section visible to everyone who logs in?':'Hide this section from everyone except Directors?')) return;
    const {error}=await sb.from('erp_settings').upsert({key:'org_chart_visible',value:next?'1':'0'},{onConflict:'key'});
    if(error) return alert(error.message);
    onVisible(next);
    logActivity('Roles & Responsibilities','update',next?'Section made visible to staff':'Section hidden from staff');
  };

  const q=find.trim().toLowerCase();
  const matches=q?emps.filter(e=>`${empName(e)} ${empCode(e)}`.toLowerCase().includes(q)).slice(0,8):[];

const node=(id,depth,seen)=>{
  if(seen.has(id)||depth>12) return null;
  const s2=new Set(seen); s2.add(id);
  const hs=holdersOf(id), ks=kids(id), open=isOpen(id,depth);
  const col=hs.length===0?'#D97706':OC_COLS[depth%OC_COLS.length];
  const below=ks.length>0?headcount(id)-hs.length:0;
  return(<div key={id}>
    <div className={`oc-card${sel===id?' sel':''}`} style={{'--oc':col}} onClick={()=>pick(id)}>
      {ks.length>0
        ?<button className="oc-tog" onClick={e=>{ e.stopPropagation(); toggle(id); }}>{open?'−':'+'}</button>
        :<span className="oc-spacer"/>}
      <span className="oc-name">{postById[id].name}{id===myPostId&&<span className="badge badge-green" style={{marginLeft:6}}>you</span>}</span>
      {ks.length>0&&!open&&<span className="oc-pill more" title="People in positions below this one">+{below} below</span>}
      {hs.length===0?<span className="oc-pill vac">Vacant</span>:<span className="oc-pill">{hs.length} {hs.length===1?'person':'people'}</span>}
    </div>
    {ks.length>0&&open&&<div className="oc-children">
      {ks.map(k=><div key={k} className="oc-child">{node(k,depth+1,s2)}</div>)}
    </div>}
  </div>);
};
