<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PRFM Mill Operations</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:#F3F4F6; --surface:#FFFFFF; --surface2:#F9FAFB; --border:#E5E7EB; --border2:#D1D5DB;
    --text:#111827; --muted:#6B7280; --dim:#9CA3AF;
    --amber:#D97706; --green:#059669; --red:#DC2626; --blue:#2563EB; --purple:#7C3AED;
    --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html,body,#root{height:100%;}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;}
  ::-webkit-scrollbar{width:4px;height:4px;}
  ::-webkit-scrollbar-track{background:var(--surface);}
  ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
  input,select,textarea{font-family:var(--sans);font-size:13px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:5px;padding:7px 10px;outline:none;transition:border-color .15s;}
  input:focus,select:focus,textarea:focus{border-color:var(--blue);}
  select option{background:var(--surface);color:var(--text);}
  button{font-family:var(--sans);cursor:pointer;}
  table{width:100%;border-collapse:collapse;}
  th{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:10px 14px;text-align:left;border-bottom:1px solid var(--border);font-weight:500;}
  td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:var(--surface2);}
  .app{display:flex;height:100vh;overflow:hidden;}
  .sidebar{width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;}
  .main{flex:1;overflow-y:auto;}
  .sidebar-logo{padding:20px 16px 16px;border-bottom:1px solid var(--border);}
  .sidebar-logo .mill-name{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.15em;color:var(--amber);text-transform:uppercase;}
  .sidebar-logo .mill-sub{font-size:11px;color:var(--muted);margin-top:2px;}
  .sidebar-section{padding:16px 10px 4px;font-family:var(--mono);font-size:9px;letter-spacing:.15em;color:var(--dim);text-transform:uppercase;}
  .nav-btn{display:flex;align-items:center;gap:9px;padding:8px 12px;border:none;background:transparent;color:var(--muted);font-size:13px;border-radius:6px;margin:1px 4px;width:calc(100% - 8px);text-align:left;transition:all .12s;}
  .nav-btn:hover{background:var(--surface2);color:var(--text);}
  .nav-btn.active{background:color-mix(in srgb, var(--amber) 18%, transparent);color:var(--amber);}
  .nav-btn .icon{font-size:15px;width:18px;text-align:center;}
  .sidebar-footer{margin-top:auto;padding:12px;border-top:1px solid var(--border);}
  .page{padding:28px 28px 60px;max-width:1150px;}
  .page-header{margin-bottom:24px;}
  .page-label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:4px;}
  .page-title{font-size:22px;font-weight:600;color:var(--text);}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px;}
  .table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;overflow-x:auto;}
  .section-label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:12px;}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px;}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px 18px;}
  .stat-label{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;}
  .stat-val{font-size:24px;font-weight:600;line-height:1;}
  .stat-sub{font-size:11px;color:var(--muted);margin-top:4px;}
  .btn{padding:7px 16px;border-radius:6px;font-size:12px;font-weight:500;border:1px solid transparent;letter-spacing:.02em;transition:all .12s;}
  .btn-amber{background:color-mix(in srgb, var(--amber) 15%, transparent);color:var(--amber);border-color:color-mix(in srgb, var(--amber) 30%, transparent);}
  .btn-green{background:color-mix(in srgb, var(--green) 15%, transparent);color:var(--green);border-color:color-mix(in srgb, var(--green) 30%, transparent);}
  .btn-red{background:color-mix(in srgb, var(--red) 15%, transparent);color:var(--red);border-color:color-mix(in srgb, var(--red) 30%, transparent);}
  .btn-blue{background:color-mix(in srgb, var(--blue) 15%, transparent);color:var(--blue);border-color:color-mix(in srgb, var(--blue) 30%, transparent);}
  .btn-ghost{background:transparent;color:var(--muted);border-color:var(--border);}
  .btn-ghost:hover{border-color:var(--border2);color:var(--text);}
  .btn-sm{padding:4px 10px;font-size:11px;}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;}
  .form-field{display:flex;flex-direction:column;gap:4px;}
  .form-label{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;}
  .form-input{width:100%;}
  .form-actions{display:flex;gap:8px;margin-top:16px;}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:500;font-family:var(--mono);}
  .badge-amber{background:color-mix(in srgb, var(--amber) 18%, transparent);color:var(--amber);}
  .badge-green{background:color-mix(in srgb, var(--green) 18%, transparent);color:var(--green);}
  .badge-red{background:color-mix(in srgb, var(--red) 18%, transparent);color:var(--red);}
  .badge-blue{background:color-mix(in srgb, var(--blue) 18%, transparent);color:var(--blue);}
  .badge-muted{background:var(--border);color:var(--muted);}
  .alert{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-radius:7px;margin-bottom:8px;}
  .alert-red{background:color-mix(in srgb, var(--red) 10%, transparent);border:1px solid color-mix(in srgb, var(--red) 25%, transparent);}
  .alert-amber{background:color-mix(in srgb, var(--amber) 10%, transparent);border:1px solid color-mix(in srgb, var(--amber) 25%, transparent);}
  .alert-green{background:color-mix(in srgb, var(--green) 10%, transparent);border:1px solid color-mix(in srgb, var(--green) 25%, transparent);}
  .alert-title{font-weight:500;font-size:13px;}
  .alert-sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .divider{height:1px;background:var(--border);margin:20px 0;}
  .mono{font-family:var(--mono);}
  .dim{color:var(--muted);}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;}
  .login-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:40px;width:360px;}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;}
  @media(max-width:700px){ .sidebar{display:none;} .two-col{grid-template-columns:1fr;} .page{padding:16px 14px 40px;} }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;

// ══════════════════════════════════════════════════════════
// CONFIG
// ══════════════════════════════════════════════════════════
const SUPABASE_URL = 'https://ulkvltoctpjydloonwcw.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVsa3ZsdG9jdHBqeWRsb29ud2N3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1NDExNTEsImV4cCI6MjA5MzExNzE1MX0.mWoQUKYCozIA-rROhhCXVE6JoJZEBQTCh3AtqnztW-E';
const HR_APP_URL = 'https://facility-app-sigma.vercel.app';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function logActivity(section, action, details){
  const {data:{user}} = await sb.auth.getUser();
  const {error} = await sb.from('activity_log').insert({ user_email: user?.email || 'unknown', action, section, details });
  if(error) console.error('logActivity failed:', error.message, {section, action, details});
}

// Only real fixed lists — delivery districts (not products)
const DISTRICTS = ['KNR','TLY','TPB','KHD','KSD','IRTTY','VLPRAMBA','NLSR','MJSR','VKND','OTHER'];

const today = (() => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().split('T')[0]; })();
const fmt = (n,dec=0) => Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:dec,maximumFractionDigits:dec});
const fmtMT = (kg) => (Number(kg||0)/1000).toFixed(3)+' MT';
const monthStart = today.slice(0,7)+'-01';

// Infer scheme from a product's own name — the one deliberate naming convention
const schemeFromName = (name) => {
  const n=(name||'').toUpperCase();
  if(n.includes('NPS')) return 'NPS';
  if(n.includes('PHH')) return 'PHH';
  if(n.includes('AAY')) return 'AAY';
  return null;
};

// A product's pack size in kg, however it's configured
const packSizeOf = (prod) => {
  if(!prod) return 0;
  if(prod.packing_type==='loose') return prod.has_standard_weight ? Number(prod.bag_weight)||0 : 0;
  return (Number(prod.packet_weight_kg)||0) * (Number(prod.packets_per_bag)||0);
};

const NAV = [
  { section:'Mill Operations' },
  { id:'dashboard', label:'Dashboard', icon:'⬡' },
  { id:'production', label:'Production', icon:'⚙' },
  { id:'dispatch', label:'Supplyco Dispatch', icon:'🚛' },
  { id:'private-dispatch', label:'Private Dispatch', icon:'🚚' },
  { id:'fci-inwards', label:'FCI Inwards', icon:'🌾' },
  { id:'private-inwards', label:'Private Inwards', icon:'🌿' },
  { id:'reconciliation', label:'Reconciliation', icon:'📊' },
  { section:'Inventory' },
  { id:'all-stock', label:'All Stock', icon:'📦' },
  { id:'store', label:'Store & Materials', icon:'🧰' },
  { section:'Finance' },
  { id:'ledger', label:'Daily Cash Book', icon:'₹' },
  { section:'Settings' },
  { id:'product-master', label:'Product Master', icon:'⚙️' },
  { id:'product-recipes', label:'Product Recipes', icon:'🧮' },
  { id:'activity-log', label:'Activity Log', icon:'📜' },
];

// ══════════════════════════════════════════════════════════
// SHARED COMPONENTS
// ══════════════════════════════════════════════════════════
function StatCard({label,value,sub,col='var(--amber)'}){
  return(<div className="stat-card" style={{borderTop:`2px solid ${col}`}}>
    <div className="stat-label">{label}</div>
    <div className="stat-val" style={{color:col}}>{value}</div>
    {sub&&<div className="stat-sub">{sub}</div>}
  </div>);
}
function Alert({type='amber',icon,title,sub}){
  return(<div className={`alert alert-${type}`}>
    <span style={{fontSize:15,color:type==='red'?'var(--red)':type==='green'?'var(--green)':'var(--amber)'}}>{icon}</span>
    <div><div className="alert-title">{title}</div>{sub&&<div className="alert-sub">{sub}</div>}</div>
  </div>);
}
function FormCard({title,col='var(--amber)',children,onSave,onCancel,saving}){
  return(<div className="card" style={{marginBottom:20,borderColor:col,borderLeftColor:col,borderLeftWidth:3}}>
    <div className="section-label" style={{marginBottom:16}}>{title}</div>
    {children}
    <div className="form-actions">
      <button className="btn btn-green" onClick={onSave} disabled={saving}>{saving?'Saving…':'Save'}</button>
      <button className="btn btn-ghost" onClick={onCancel}>Cancel</button>
    </div>
  </div>);
}
function TableWrap({children}){ return <div className="table-wrap">{children}</div>; }
function Field({label,children}){ return(<div className="form-field"><div className="form-label">{label}</div>{children}</div>); }
function Loading(){ return <div style={{padding:60,textAlign:'center',color:'var(--muted)',fontFamily:'var(--mono)',fontSize:13}}>loading…</div>; }
function Empty({msg}){ return <div style={{padding:40,textAlign:'center',color:'var(--muted)',fontSize:13}}>{msg||'No entries yet.'}</div>; }

// ══════════════════════════════════════════════════════════
// LOGIN
// ══════════════════════════════════════════════════════════
function Login({onLogin}){
  const [email,setEmail]=useState(''); const [pass,setPass]=useState('');
  const [err,setErr]=useState(''); const [loading,setLoading]=useState(false);
  const submit=async()=>{
    setLoading(true); setErr('');
    const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
    if(error) setErr(error.message); else onLogin(data.user);
    setLoading(false);
  };
  return(<div className="login-wrap"><div className="login-card">
    <div style={{fontFamily:'var(--mono)',fontSize:11,letterSpacing:'.15em',color:'var(--amber)',marginBottom:4}}>PRFM</div>
    <div style={{fontSize:20,fontWeight:600,marginBottom:4}}>Mill Operations</div>
    <div style={{fontSize:13,color:'var(--muted)',marginBottom:28}}>Sign in to continue</div>
    <div style={{display:'flex',flexDirection:'column',gap:10}}>
      <input placeholder="Email" value={email} onChange={e=>setEmail(e.target.value)} type="email"/>
      <input placeholder="Password" value={pass} onChange={e=>setPass(e.target.value)} type="password" onKeyDown={e=>e.key==='Enter'&&submit()}/>
      {err&&<div style={{color:'var(--red)',fontSize:12}}>{err}</div>}
      <button className="btn btn-amber" style={{marginTop:4,padding:'10px'}} onClick={submit} disabled={loading}>{loading?'Signing in…':'Sign in'}</button>
    </div>
    <div style={{marginTop:20,padding:'10px 14px',background:'var(--surface2)',borderRadius:6,fontSize:12,color:'var(--muted)'}}>Uses the same login as your HR system.</div>
  </div></div>);
}

// ══════════════════════════════════════════════════════════
// PRODUCT MASTER
// ══════════════════════════════════════════════════════════
function ProductMaster(){
  const blank = {
    product_code:'', product_name:'', category:'Finished Goods', hsn_code:'',
    is_raw_material:false, available_for_supplyco:false,
    packing_type:'packeted', packet_weight_kg:'', packets_per_bag:50,
    has_standard_weight:false, bag_weight:'', unit:'kg',
    has_schemes:false, scheme_list:'NPS,PHH,AAY,Private',
    min_stock_alert:0, max_stock_alert:0
  };
  const [products,setProducts]=useState([]);
  const [showForm,setShowForm]=useState(false);
  const [editingId,setEditingId]=useState(null);
  const [form,setForm]=useState(blank);
  const [saving,setSaving]=useState(false);
  const [loading,setLoading]=useState(true);
  const f=(k,v)=>setForm(p=>({...p,[k]:v}));

  const load=useCallback(()=>{
    setLoading(true);
    sb.from('product_master').select('*').order('product_name').then(({data})=>{setProducts(data||[]);setLoading(false);});
  },[]);
  useEffect(()=>{load();},[load]);

  const validate=()=>{
    if(!form.product_name.trim()) return 'Product Name is required.';
    if(form.is_raw_material && form.has_standard_weight && !form.bag_weight) return 'Enter the standard bag weight, or uncheck "Has standard bag weight".';
    if(!form.is_raw_material && form.packing_type==='packeted' && !form.packet_weight_kg) return 'Packet weight is required.';
    if(!form.is_raw_material && form.packing_type==='loose' && form.has_standard_weight && !form.bag_weight) return 'Enter the standard bag weight, or uncheck it.';
    return null;
  };

  const buildPayload=()=>({
    product_code: form.product_code, product_name: form.product_name.trim(), category: form.category, hsn_code: form.hsn_code,
    is_raw_material: !!form.is_raw_material,
    available_for_supplyco: form.is_raw_material ? !!form.available_for_supplyco : false,
    packing_type: form.is_raw_material ? null : form.packing_type,
    packet_weight_kg: (!form.is_raw_material && form.packing_type==='packeted') ? Number(form.packet_weight_kg) : null,
    packets_per_bag: (!form.is_raw_material && form.packing_type==='packeted') ? Number(form.packets_per_bag) : null,
    has_standard_weight: (form.is_raw_material || form.packing_type==='loose') ? !!form.has_standard_weight : false,
    bag_weight: ((form.is_raw_material || form.packing_type==='loose') && form.has_standard_weight) ? Number(form.bag_weight) : null,
    unit: (form.is_raw_material || form.packing_type==='loose') ? form.unit : null,
    has_schemes: form.is_raw_material ? !!form.has_schemes : false,
    scheme_list: (form.is_raw_material && form.has_schemes) ? form.scheme_list : null,
    min_stock_alert: Number(form.min_stock_alert)||0,
    max_stock_alert: Number(form.max_stock_alert)||0,
  });

  const save=async()=>{
    const err=validate(); if(err) return alert(err);
    setSaving(true);
    const payload=buildPayload();

    if(editingId){
      const {error}=await sb.from('product_master').update(payload).eq('id',editingId);
      if(error){alert(error.message);setSaving(false);return;}
      logActivity('Product Master','update',`Edited ${payload.product_name}`);
    } else {
      const {data,error}=await sb.from('product_master').insert(payload).select().single();
      if(error){alert(error.message);setSaving(false);return;}
      // Initialize the right stock table
      if(!data.is_raw_material){
        await sb.from('current_stock').insert({product_id:data.id, qty_bags:0});
      } else if(data.has_schemes){
        const schemes=(data.scheme_list||'').split(',').map(s=>s.trim()).filter(Boolean);
        for(const s of schemes) await sb.from('raw_material_scheme_stock').insert({product_id:data.id, scheme:s, qty_kg:0});
      } else {
        await sb.from('raw_material_stock').insert({product_id:data.id, qty_kg:0});
      }
      logActivity('Product Master','create',`New product — ${payload.product_name}`);
    }
    setForm(blank); setShowForm(false); setEditingId(null); setSaving(false);
    load();
  };

  const startEdit=(p)=>{
    setEditingId(p.id);
    setForm({
      product_code:p.product_code||'', product_name:p.product_name||'', category:p.category||'Finished Goods', hsn_code:p.hsn_code||'',
      is_raw_material:!!p.is_raw_material, available_for_supplyco:!!p.available_for_supplyco,
      packing_type:p.packing_type||'packeted', packet_weight_kg:p.packet_weight_kg||'', packets_per_bag:p.packets_per_bag||50,
      has_standard_weight:!!p.has_standard_weight, bag_weight:p.bag_weight||'', unit:p.unit||'kg',
      has_schemes:!!p.has_schemes, scheme_list:p.scheme_list||'NPS,PHH,AAY,Private',
      min_stock_alert:p.min_stock_alert||0, max_stock_alert:p.max_stock_alert||0
    });
    setShowForm(true);
  };

  const toggleActive=async(p)=>{
    await sb.from('product_master').update({is_active:!p.is_active}).eq('id',p.id);
    logActivity('Product Master','update',`${p.product_name} set to ${!p.is_active?'Active':'Archived'}`);
    load();
  };

  const deleteProduct=async(p)=>{
    if(!confirm(`Delete "${p.product_name}"? This removes its stock records and recipe too. Cannot be undone.`)) return;
    await sb.from('current_stock').delete().eq('product_id',p.id);
    await sb.from('raw_material_stock').delete().eq('product_id',p.id);
    await sb.from('raw_material_scheme_stock').delete().eq('product_id',p.id);
    await sb.from('product_recipes').delete().eq('product_id',p.id);
    const {error}=await sb.from('product_master').delete().eq('id',p.id);
    if(error){alert('Could not delete: '+error.message);return;}
    logActivity('Product Master','delete',`Deleted ${p.product_name}`);
    load();
  };

  if(loading) return <Loading/>;

  return(<div className="page">
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:24,flexWrap:'wrap',gap:12}}>
      <div className="page-header" style={{marginBottom:0}}>
        <div className="page-label">System Settings</div>
        <div className="page-title">Product Master</div>
      </div>
      <button className="btn btn-amber" onClick={()=>{setEditingId(null);setForm(blank);setShowForm(v=>!v);}}>+ Add Product</button>
    </div>

    {showForm&&(
      <FormCard title={editingId?'Edit Product':'Register New Product'} col="var(--amber)" onSave={save} onCancel={()=>{setShowForm(false);setEditingId(null);setForm(blank);}} saving={saving}>
        <div className="form-grid">
          <Field label="Product Code / SKU"><input className="form-input" value={form.product_code} onChange={e=>f('product_code',e.target.value)}/></Field>
          <Field label="Product Name ★"><input className="form-input" value={form.product_name} onChange={e=>f('product_name',e.target.value)}/></Field>
          <Field label="Category">
            <select className="form-input" value={form.category} onChange={e=>f('category',e.target.value)}>
              <option>Finished Goods</option><option>By-Products</option><option>Trading Goods</option><option>Raw Material</option>
            </select>
          </Field>
          <Field label="HSN Code"><input className="form-input" value={form.hsn_code} onChange={e=>f('hsn_code',e.target.value)}/></Field>
        </div>

        <div className="divider"/>
        <Field label="Is this a Raw Material?">
          <label style={{display:'flex',alignItems:'center',gap:8}}>
            <input type="checkbox" checked={form.is_raw_material} onChange={e=>f('is_raw_material',e.target.checked)}/>
            <span style={{fontSize:13}}>Yes, this is a raw material</span>
          </label>
        </Field>
        {form.is_raw_material&&(
          <div style={{marginTop:10}}>
            <Field label="Available for Supplyco (FCI) inward?">
              <label style={{display:'flex',alignItems:'center',gap:8}}>
                <input type="checkbox" checked={form.available_for_supplyco} onChange={e=>f('available_for_supplyco',e.target.checked)}/>
                <span style={{fontSize:13}}>Yes</span>
              </label>
            </Field>
          </div>
        )}

        <div className="divider"/>
        {!form.is_raw_material&&(
          <div className="form-grid" style={{marginBottom:12}}>
            <Field label="How is it packed?">
              <select className="form-input" value={form.packing_type} onChange={e=>f('packing_type',e.target.value)}>
                <option value="packeted">Packeted (packets inside a bag)</option>
                <option value="loose">Loose / Bulk (just bags)</option>
              </select>
            </Field>
          </div>
        )}

        <div className="form-grid">
          {form.is_raw_material ? (<>
            <Field label="Unit">
              <select className="form-input" value={form.unit} onChange={e=>f('unit',e.target.value)}>
                <option value="kg">kg</option><option value="quintal">Quintal</option><option value="bag">Bag</option><option value="litre">Litre</option><option value="ton">Ton</option>
              </select>
            </Field>
            <Field label="Has standard bag weight?">
              <label style={{display:'flex',alignItems:'center',gap:8}}>
                <input type="checkbox" checked={form.has_standard_weight} onChange={e=>f('has_standard_weight',e.target.checked)}/>
                <span style={{fontSize:13}}>Yes, fixed weight</span>
              </label>
            </Field>
            <Field label="Bag / Unit Weight">
              <input type="number" className="form-input" disabled={!form.has_standard_weight} style={!form.has_standard_weight?{opacity:0.5}:{}} value={form.bag_weight} onChange={e=>f('bag_weight',e.target.value)}/>
            </Field>
            <Field label="Divided into schemes?">
              <label style={{display:'flex',alignItems:'center',gap:8}}>
                <input type="checkbox" checked={form.has_schemes} onChange={e=>f('has_schemes',e.target.checked)}/>
                <span style={{fontSize:13}}>Yes</span>
              </label>
            </Field>
            {form.has_schemes&&<Field label="Scheme names (comma-separated)"><input className="form-input" value={form.scheme_list} onChange={e=>f('scheme_list',e.target.value)}/></Field>}
            <Field label="Min. Alert"><input type="number" className="form-input" value={form.min_stock_alert} onChange={e=>f('min_stock_alert',e.target.value)}/></Field>
            <Field label="Max. Alert (optional)"><input type="number" className="form-input" value={form.max_stock_alert} onChange={e=>f('max_stock_alert',e.target.value)}/></Field>
          </>) : form.packing_type==='loose' ? (<>
            <Field label="Unit">
              <select className="form-input" value={form.unit} onChange={e=>f('unit',e.target.value)}>
                <option value="kg">kg</option><option value="quintal">Quintal</option><option value="bag">Bag</option><option value="litre">Litre</option><option value="ton">Ton</option>
              </select>
            </Field>
            <Field label="Has standard bag weight?">
              <label style={{display:'flex',alignItems:'center',gap:8}}>
                <input type="checkbox" checked={form.has_standard_weight} onChange={e=>f('has_standard_weight',e.target.checked)}/>
                <span style={{fontSize:13}}>Yes, fixed weight</span>
              </label>
            </Field>
            <Field label="Bag / Unit Weight">
              <input type="number" className="form-input" disabled={!form.has_standard_weight} style={!form.has_standard_weight?{opacity:0.5}:{}} value={form.bag_weight} onChange={e=>f('bag_weight',e.target.value)}/>
            </Field>
            <Field label="Min. Alert (bags)"><input type="number" className="form-input" value={form.min_stock_alert} onChange={e=>f('min_stock_alert',e.target.value)}/></Field>
            <Field label="Max. Alert (bags, optional)"><input type="number" className="form-input" value={form.max_stock_alert} onChange={e=>f('max_stock_alert',e.target.value)}/></Field>
          </>) : (<>
            <Field label="Single Packet Weight (kg) ★"><input type="number" className="form-input" value={form.packet_weight_kg} onChange={e=>f('packet_weight_kg',e.target.value)}/></Field>
            <Field label="Packets per Bag"><input type="number" className="form-input" value={form.packets_per_bag} onChange={e=>f('packets_per_bag',e.target.value)}/></Field>
            <Field label="Min. Alert (bags)"><input type="number" className="form-input" value={form.min_stock_alert} onChange={e=>f('min_stock_alert',e.target.value)}/></Field>
            <Field label="Max. Alert (bags, optional)"><input type="number" className="form-input" value={form.max_stock_alert} onChange={e=>f('max_stock_alert',e.target.value)}/></Field>
          </>)}
        </div>
      </FormCard>
    )}

    <TableWrap>
      <table>
        <thead><tr><th>Code</th><th>Product</th><th>Category</th><th>Packaging</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>
          {products.length===0&&<tr><td colSpan={6}><Empty msg="No products yet."/></td></tr>}
          {products.map(p=>(
            <tr key={p.id} style={{opacity:p.is_active?1:0.5}}>
              <td className="mono dim">{p.product_code||'—'}</td>
              <td><strong>{p.product_name}</strong></td>
              <td><span className="badge badge-blue">{p.category}</span></td>
              <td>
                {p.is_raw_material ? (p.has_standard_weight? <span className="mono">{fmt(p.bag_weight)} {p.unit}/bag</span> : <span className="dim">Variable ({p.unit})</span>) :
                 p.packing_type==='loose' ? (p.has_standard_weight? <span className="mono">{fmt(p.bag_weight)} {p.unit}/bag</span> : <span className="dim">Variable ({p.unit})</span>) :
                 <span className="mono">{p.packet_weight_kg}kg × {p.packets_per_bag} = {p.packet_weight_kg*p.packets_per_bag}kg/bag</span>}
              </td>
              <td><button className={`btn btn-sm ${p.is_active?'btn-green':'btn-ghost'}`} onClick={()=>toggleActive(p)}>{p.is_active?'Active':'Archived'}</button></td>
              <td><div style={{display:'flex',gap:6}}>
                <button className="btn btn-blue btn-sm" onClick={()=>startEdit(p)}>Edit</button>
                <button className="btn btn-red btn-sm" onClick={()=>deleteProduct(p)}>Delete</button>
              </div></td>
            </tr>
          ))}
        </tbody>
      </table>
    </TableWrap>
  </div>);
}

// PRODUCT RECIPES
// ══════════════════════════════════════════════════════════
function ProductRecipes(){
  const [products,setProducts]=useState([]);
  const [recipes,setRecipes]=useState([]);
  const [lines,setLines]=useState([]);
  const [loading,setLoading]=useState(true);
  const [editingId,setEditingId]=useState(null);
  const [editLines,setEditLines]=useState([]);
  const [confirmProd,setConfirmProd]=useState(null);

  const load=useCallback(async()=>{
    setLoading(true);
    const [{data:p},{data:r},{data:l}]=await Promise.all([
      sb.from('product_master').select('*').eq('is_active',true),
      sb.from('product_recipes').select('*'),
      sb.from('recipe_lines').select('*'),
    ]);
    setProducts(p||[]); setRecipes(r||[]); setLines(l||[]); setLoading(false);
  },[]);
  useEffect(()=>{load();},[load]);

  const name=(id)=>products.find(p=>p.id===id)?.product_name||'—';
  const finishedProducts=products.filter(p=>!p.is_raw_material);

  const startEdit=(prod)=>{
    setEditingId(prod.id);
    const recipe=recipes.find(r=>r.product_id===prod.id);
    const ex=recipe?lines.filter(l=>l.recipe_id===recipe.id):[];
    setEditLines(ex.length?ex.map(l=>({...l})):[{line_type:'consumes',material_id:'',qty_per_unit:'',scheme:''}]);
  };
  const addLine=(t)=>setEditLines(p=>[...p,{line_type:t,material_id:'',qty_per_unit:'',scheme:''}]);
  const removeLine=(i)=>setEditLines(p=>p.filter((_,idx)=>idx!==i));
  const updateLine=(i,k,v)=>setEditLines(p=>p.map((l,idx)=>idx===i?{...l,[k]:v}:l));

  const attemptSave=(prod)=>{
    if(editLines.length===0) return alert('Add at least one line.');
    if(editLines.some(l=>!l.material_id||!l.qty_per_unit)) return alert('Every line needs a material and quantity.');
if(editLines.some(l=>{const m=products.find(p=>p.id===l.material_id);return m?.has_schemes && !l.scheme;})) return alert('Select a scheme for every material that has schemes.');
    setConfirmProd(prod);
  };

  const confirmSave=async()=>{
    const prod=confirmProd;
    const scheme=schemeFromName(prod.product_name);
    let recipe=recipes.find(r=>r.product_id===prod.id);
    if(!recipe){
      const {data}=await sb.from('product_recipes').insert({product_id:prod.id,scheme}).select().single();
      recipe=data;
    } else {
      await sb.from('product_recipes').update({scheme,updated_at:new Date().toISOString()}).eq('id',recipe.id);
    }
    await sb.from('recipe_lines').delete().eq('recipe_id',recipe.id);
    const toInsert=editLines.map(l=>({recipe_id:recipe.id,line_type:l.line_type,material_id:l.material_id,qty_per_unit:Number(l.qty_per_unit),scheme:l.scheme||null}));
    await sb.from('recipe_lines').insert(toInsert);
    logActivity('Product Recipes','update',`${prod.product_name} recipe updated`);
    setConfirmProd(null); setEditingId(null); setEditLines([]);
    load();
  };

  if(loading) return <Loading/>;

  return(<div className="page">
    <div className="page-header">
      <div className="page-label">System Settings</div>
      <div className="page-title">Product Recipes</div>
    </div>
    <div style={{marginBottom:16,padding:'10px 16px',background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:6,fontSize:12,color:'var(--muted)'}}>
      For each finished product, define what it consumes and produces per 1kg made. A product's scheme (NPS/PHH/AAY) is inferred from its name.
    </div>

    <TableWrap>
      <table>
        <thead><tr><th>Product</th><th>Scheme</th><th>Recipe (per 1kg)</th><th>Edit</th></tr></thead>
        <tbody>
          {finishedProducts.map(prod=>{
            const scheme=schemeFromName(prod.product_name);
            const isE=editingId===prod.id;
            const recipe=recipes.find(r=>r.product_id===prod.id);
            const recipeLines=recipe?lines.filter(l=>l.recipe_id===recipe.id):[];
            return(<tr key={prod.id}>
              <td><strong>{prod.product_name}</strong></td>
              <td>{scheme?<span className="badge badge-blue">{scheme}</span>:<span className="dim">—</span>}</td>
              <td>
                {isE?(
                  <div style={{display:'flex',flexDirection:'column',gap:8}}>
                    {editLines.map((l,i)=>(
                      <div key={i} style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
                        <select className="form-input" style={{width:100}} value={l.line_type} onChange={e=>updateLine(i,'line_type',e.target.value)}>
                          <option value="consumes">Consumes</option><option value="produces">Produces</option>
                        </select>
                        <select className="form-input" style={{width:160}} value={l.material_id} onChange={e=>updateLine(i,'material_id',e.target.value)}>
                          <option value="">-- Select material --</option>
                          {products.filter(p=>p.id!==prod.id).map(p=><option key={p.id} value={p.id}>{p.product_name}</option>)}
                        </select>
                        <input type="number" step="0.0001" className="form-input" style={{width:110}} placeholder="kg per 1kg" value={l.qty_per_unit} onChange={e=>updateLine(i,'qty_per_unit',e.target.value)}/>
                        {(()=>{const mat=products.find(p=>p.id===l.material_id);
  if(!mat?.has_schemes) return null;
  const opts=(mat.scheme_list||'').split(',').map(s=>s.trim()).filter(Boolean);
  return(<select className="form-input" style={{width:110}} value={l.scheme} onChange={e=>updateLine(i,'scheme',e.target.value)}>
    <option value="">-- Scheme --</option>
    {opts.map(s=><option key={s} value={s}>{s}</option>)}
  </select>);
})()}
                        <button className="btn btn-red btn-sm" onClick={()=>removeLine(i)}>✕</button>
                      </div>
                    ))}
                    <div style={{display:'flex',gap:8}}>
                      <button className="btn btn-ghost btn-sm" onClick={()=>addLine('consumes')}>+ Consumes</button>
                      <button className="btn btn-ghost btn-sm" onClick={()=>addLine('produces')}>+ Produces</button>
                    </div>
                    <button className="btn btn-green btn-sm" style={{width:'fit-content'}} onClick={()=>attemptSave(prod)}>Review & Save</button>
                  </div>
                ):(
                  <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                    {recipeLines.length===0&&<span className="dim">Not configured</span>}
                    {recipeLines.map(l=>{
  const col=l.line_type==='consumes'?'var(--red)':'var(--green)';
  return(
    <span key={l.id} className="badge" style={{background:`color-mix(in srgb, ${col} 15%, transparent)`,color:col}}>
      {l.line_type==='consumes'?'−':'+'} {name(l.material_id)}{l.scheme?` (${l.scheme})`:''} {l.qty_per_unit}kg
    </span>
  );
})}
                  </div>
                )}
              </td>
              <td>
                {!isE&&<button className="btn btn-ghost btn-sm" onClick={()=>startEdit(prod)}>Edit</button>}
                {isE&&<button className="btn btn-ghost btn-sm" onClick={()=>{setEditingId(null);setEditLines([]);}}>Cancel</button>}
              </td>
            </tr>);
          })}
          {finishedProducts.length===0&&<tr><td colSpan={4}><Empty msg="No finished products yet. Add them in Product Master first."/></td></tr>}
        </tbody>
      </table>
    </TableWrap>

    {confirmProd&&(
      <div className="modal-overlay">
        <div className="card" style={{maxWidth:480,width:'100%'}}>
          <div className="section-label">Confirm Recipe</div>
          <div style={{fontSize:14,marginBottom:12}}>To produce <strong>1kg of {confirmProd.product_name}</strong>, this recipe will:</div>
          <ul style={{marginBottom:16,paddingLeft:20}}>
            {editLines.map((l,i)=>(
  <li key={i} style={{fontSize:13,marginBottom:4,color:l.line_type==='consumes'?'var(--red)':'var(--green)'}}>
    {l.line_type==='consumes'?'Consume':'Produce'} <strong>{l.qty_per_unit}kg</strong> of {name(l.material_id)}{l.scheme?` — ${l.scheme}`:''}
  </li>
))}
          </ul>
          <div style={{fontSize:12,color:'var(--muted)',marginBottom:16}}>This applies to every future production entry for {confirmProd.product_name}. Past entries are unaffected.</div>
          <div className="form-actions">
            <button className="btn btn-green" onClick={confirmSave}>Confirm & Save</button>
            <button className="btn btn-ghost" onClick={()=>setConfirmProd(null)}>Go Back</button>
          </div>
        </div>
      </div>
    )}
  </div>);
}

// ══════════════════════════════════════════════════════════
// PRODUCTION
// ══════════════════════════════════════════════════════════
function Production(){
  const [entries,setEntries]=useState([]);
  const [finishedProducts,setFinishedProducts]=useState([]);
  const [allProducts,setAllProducts]=useState([]);
  const [showForm,setShowForm]=useState(false);
  const [saving,setSaving]=useState(false);
  const [loading,setLoading]=useState(true);
  const blank={date:today,shift:'Morning',product_id:'',qty_produced:'',actual_qty_produced:'',notes:''};
  const [form,setForm]=useState(blank);
  const f=(k,v)=>setForm(p=>({...p,[k]:v}));

  const load=useCallback(async()=>{
    setLoading(true);
    const [{data:e},{data:fp},{data:ap}]=await Promise.all([
      sb.from('production_log').select('*, product:product_id(*)').gte('date',monthStart).order('date',{ascending:false}),
      sb.from('product_master').select('*').eq('is_raw_material',false).eq('is_active',true).order('product_name'),
      sb.from('product_master').select('*'),
    ]);
    setEntries(e||[]); setFinishedProducts(fp||[]); setAllProducts(ap||[]); setLoading(false);
  },[]);
  useEffect(()=>{load();},[load]);

    const applyRecipe=async(product, qtyProducedKg, sign)=>{
    const {data:recipe}=await sb.from('product_recipes').select('*').eq('product_id',product.id).maybeSingle();
    if(!recipe) return [];
const {data:recipeLines,error:linesErr}=await sb.from('recipe_lines').select('*').eq('recipe_id',recipe.id);
console.log('RECIPE LINES FETCHED:', recipeLines, 'ERROR:', linesErr, 'recipe.id used:', recipe.id);
const summary=[];

        for(const line of (recipeLines||[])){
      const qtyKg=qtyProducedKg*Number(line.qty_per_unit)*sign;
      const material=allProducts.find(p=>String(p.id)===String(line.material_id));
      if(!material){ console.error('applyRecipe: material not found for line', line); continue; }
console.log('MATERIAL DEBUG:', material.product_name, JSON.stringify(material));
      const delta = line.line_type==='consumes' ? -qtyKg : qtyKg;
      const lineScheme = line.scheme || schemeFromName(product.product_name);

      if(material.is_raw_material){
        if(material.has_schemes && lineScheme){
          const {data:bucket}=await sb.from('raw_material_scheme_stock').select('*').eq('product_id',material.id).eq('scheme',lineScheme).maybeSingle();
          if(bucket){
            const {error}=await sb.from('raw_material_scheme_stock').update({qty_kg:Number(bucket.qty_kg)+delta,updated_at:new Date().toISOString()}).eq('id',bucket.id);
            if(error) console.error('scheme stock update failed', error);
          } else {
            const {error}=await sb.from('raw_material_scheme_stock').insert({product_id:material.id,scheme:lineScheme,qty_kg:delta});
            if(error) console.error('scheme stock insert failed', error);
          }
        } else {
          const {data:bucket}=await sb.from('raw_material_stock').select('*').eq('product_id',material.id).maybeSingle();
          if(bucket){
            const {error}=await sb.from('raw_material_stock').update({qty_kg:Number(bucket.qty_kg)+delta,updated_at:new Date().toISOString()}).eq('id',bucket.id);
            if(error) console.error('raw stock update failed', error);
          } else {
            const {error}=await sb.from('raw_material_stock').insert({product_id:material.id,qty_kg:delta});
            if(error) console.error('raw stock insert failed', error);
          }
        }
      } else {
        const bagSize=packSizeOf(material);
        if(bagSize>0){
          const {data:stockRow}=await sb.from('current_stock').select('*').eq('product_id',material.id).maybeSingle();
          const bagsDelta=delta/bagSize;
          if(stockRow){
            const {error}=await sb.from('current_stock').update({qty_bags:Number(stockRow.qty_bags)+bagsDelta,updated_at:new Date().toISOString()}).eq('id',stockRow.id);
            if(error) console.error('current_stock update failed', error);
          } else {
            const {error}=await sb.from('current_stock').insert({product_id:material.id,qty_bags:bagsDelta});
            if(error) console.error('current_stock insert failed', error);
          }
        } else {
          const {data:kgRow}=await sb.from('raw_material_stock').select('*').eq('product_id',material.id).maybeSingle();
          if(kgRow){
            const {error}=await sb.from('raw_material_stock').update({qty_kg:Number(kgRow.qty_kg)+delta,updated_at:new Date().toISOString()}).eq('id',kgRow.id);
            if(error) console.error('by-product kg update failed', error, material.product_name);
          } else {
            const {error}=await sb.from('raw_material_stock').insert({product_id:material.id,qty_kg:delta});
            if(error) console.error('by-product kg insert failed', error, material.product_name);
          }
        }
      }
      summary.push(`${delta>=0?'+':''}${Math.abs(qtyKg).toFixed(2)}kg ${material.product_name}`);
    }
    return summary;
  };

  const save=async()=>{
    if(!form.product_id) return alert('Select a product.');
    if(!form.qty_produced||Number(form.qty_produced)<=0) return alert('Enter bags produced.');
    setSaving(true);
    const product=finishedProducts.find(p=>p.id===form.product_id);
    const bagSize=packSizeOf(product);
    if(!bagSize){ setSaving(false); return alert('This product has no configured pack size — set it in Product Master first.'); }

    const row={date:form.date, shift:form.shift, product_id:form.product_id, qty_produced:Number(form.qty_produced), actual_qty_produced: form.actual_qty_produced?Number(form.actual_qty_produced):null, notes:form.notes};
    const {data,error}=await sb.from('production_log').insert(row).select('*, product:product_id(*)').single();
    if(error){alert('Error: '+error.message);setSaving(false);return;}

    // Credit finished-goods stock
    const {data:stockRow}=await sb.from('current_stock').select('*').eq('product_id',form.product_id).maybeSingle();
    if(stockRow) await sb.from('current_stock').update({qty_bags:Number(stockRow.qty_bags)+Number(form.qty_produced),updated_at:new Date().toISOString()}).eq('id',stockRow.id);

    const qtyProducedKg=Number(form.qty_produced)*bagSize;
    const summary=await applyRecipe(product, qtyProducedKg, 1);

    setEntries(p=>[data,...p]); setForm(blank); setShowForm(false); setSaving(false);
    logActivity('Production',data,'create',`${product.product_name} — ${form.qty_produced} bags on ${form.date}. ${summary.join(', ')}`);
  };

  const del=async(e)=>{
    if(!confirm('Delete entry? Stock and recipe effects will be reversed.')) return;
    await sb.from('production_log').delete().eq('id',e.id);
    const {data:stockRow}=await sb.from('current_stock').select('*').eq('product_id',e.product_id).maybeSingle();
    if(stockRow) await sb.from('current_stock').update({qty_bags:Math.max(0,Number(stockRow.qty_bags)-Number(e.qty_produced)),updated_at:new Date().toISOString()}).eq('id',stockRow.id);

    const bagSize=packSizeOf(e.product);
    if(bagSize) await applyRecipe(e.product, Number(e.qty_produced)*bagSize, -1);

    setEntries(p=>p.filter(x=>x.id!==e.id));
    logActivity('Production','delete',`${e.product?.product_name} — ${e.qty_produced} bags on ${e.date} (reversed)`);
  };

  if(loading) return <Loading/>;

  const byDate={};
  entries.forEach(e=>{ if(!byDate[e.date]) byDate[e.date]=[]; byDate[e.date].push(e); });

  return(<div className="page">
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:24,flexWrap:'wrap',gap:12}}>
      <div className="page-header" style={{marginBottom:0}}>
        <div className="page-label">Mill Operations</div>
        <div className="page-title">Daily production log</div>
      </div>
      <button className="btn btn-green" onClick={()=>setShowForm(v=>!v)}>+ New entry</button>
    </div>

    {showForm&&(
      <FormCard title="Log production" col="var(--green)" onSave={save} onCancel={()=>setShowForm(false)} saving={saving}>
        <div className="form-grid">
          <Field label="Date"><input type="date" className="form-input" value={form.date} max={today} onChange={e=>f('date',e.target.value)}/></Field>
          <Field label="Shift">
            <select className="form-input" value={form.shift} onChange={e=>f('shift',e.target.value)}>
              {['Morning','Night','Full Day'].map(s=><option key={s}>{s}</option>)}
            </select>
          </Field>
          <Field label="Product">
            <select className="form-input" value={form.product_id} onChange={e=>f('product_id',e.target.value)}>
              <option value="">-- Select product --</option>
              {finishedProducts.map(p=><option key={p.id} value={p.id}>{p.product_name}</option>)}
            </select>
          </Field>
          <Field label="Bags produced ★"><input type="number" className="form-input" style={{fontWeight:600}} value={form.qty_produced} onChange={e=>f('qty_produced',e.target.value)}/></Field>
          <Field label="Bags produced (actual/physical)"><input type="number" className="form-input" value={form.actual_qty_produced} onChange={e=>f('actual_qty_produced',e.target.value)}/></Field>
          <Field label="Notes"><input className="form-input" value={form.notes} onChange={e=>f('notes',e.target.value)}/></Field>
        </div>
        {form.product_id&&form.qty_produced&&(()=>{
          const prod=finishedProducts.find(p=>p.id===form.product_id);
          const bagSize=packSizeOf(prod);
          return bagSize>0 ? (
            <div style={{marginTop:12,padding:'8px 14px',background:'var(--surface2)',borderRadius:6,fontSize:12,fontFamily:'var(--mono)'}}>
              Output: {((Number(form.qty_produced)*bagSize)/1000).toFixed(3)} MT ({bagSize}kg/bag)
            </div>
          ) : <div style={{marginTop:12,padding:'8px 14px',background:'var(--red)15',color:'var(--red)',borderRadius:6,fontSize:12}}>This product has no pack size configured yet.</div>;
        })()}
      </FormCard>
    )}

    {Object.keys(byDate).length===0&&!showForm&&<div className="table-wrap"><Empty msg="No production entries this month."/></div>}

    {Object.keys(byDate).sort().reverse().map(date=>{
      const rows=byDate[date];
      const totalMT=rows.reduce((s,r)=>s+(Number(r.qty_produced)*packSizeOf(r.product)),0)/1000;
      return(<div key={date} style={{marginBottom:20}}>
        <div style={{display:'flex',justifyContent:'space-between',marginBottom:8,padding:'6px 0',borderBottom:'1px solid var(--border)'}}>
          <div style={{fontFamily:'var(--mono)',fontSize:12,color:'var(--amber)'}}>{new Date(date+'T12:00:00').toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})}</div>
          <div style={{fontFamily:'var(--mono)',fontSize:12,color:'var(--green)'}}>Total: {totalMT.toFixed(3)} MT</div>
        </div>
        <TableWrap><table>
          <thead><tr><th>Shift</th><th>Product</th><th>Bags (Formula)</th><th>Bags (Actual)</th><th>Variance</th><th>Output</th><th>Notes</th><th></th></tr></thead>
          <tbody>
            {rows.map(e=>(<tr key={e.id}>
              <td><span className="badge badge-blue">{e.shift}</span></td>
              <td><strong>{e.product?.product_name||'—'}</strong></td>
              <td><strong style={{color:'var(--green)',fontFamily:'var(--mono)'}}>{fmt(e.qty_produced)}</strong></td>
              <td className="mono">{e.actual_qty_produced!=null?fmt(e.actual_qty_produced):'—'}</td>
<td className="mono" style={{color: e.actual_qty_produced!=null && e.actual_qty_produced!==e.qty_produced ? (e.actual_qty_produced>e.qty_produced?'var(--green)':'var(--red)') : 'var(--muted)'}}>
  {e.actual_qty_produced!=null ? (e.actual_qty_produced-e.qty_produced>0?'+':'')+fmt(e.actual_qty_produced-e.qty_produced) : '—'}
</td>
              <td className="mono dim">{fmtMT(Number(e.qty_produced)*packSizeOf(e.product))}</td>
              <td className="dim">{e.notes||'—'}</td>
              <td><button className="btn btn-red btn-sm" onClick={()=>del(e)}>✕</button></td>
            </tr>))}
          </tbody>
        </table></TableWrap>
      </div>);
    })}
  </div>);
}

// ══════════════════════════════════════════════════════════
// FCI INWARDS
// ══════════════════════════════════════════════════════════
function FciInwards(){
  const [receipts,setReceipts]=useState([]);
  const [rawMaterials,setRawMaterials]=useState([]);
  const [showForm,setShowForm]=useState(false);
  const [saving,setSaving]=useState(false);
  const [loading,setLoading]=useState(true);
  const blank={date:today,batch_no:'',material_id:'',scheme:'',received_kg:'',allotment_kg:'',vehicle_no:'',lorry_receipt_no:'',supplier_name:'Supplyco',notes:''};
  const [form,setForm]=useState(blank);
  const f=(k,v)=>setForm(p=>({...p,[k]:v}));

  const load=useCallback(async()=>{
    setLoading(true);
    const [{data:r},{data:rm}]=await Promise.all([
      sb.from('fci_inwards').select('*, material:material_id(*)').gte('date',monthStart).order('date',{ascending:false}),
      sb.from('product_master').select('*').eq('is_raw_material',true).eq('available_for_supplyco',true).eq('is_active',true),
    ]);
    setReceipts(r||[]); setRawMaterials(rm||[]); setLoading(false);
  },[]);
  useEffect(()=>{load();},[load]);

  const selectedMaterial=rawMaterials.find(m=>m.id===form.material_id);
  const schemeOptions=(selectedMaterial?.scheme_list?selectedMaterial.scheme_list.split(',').map(s=>s.trim()):['NPS','PHH','AAY']).filter(s=>s.toLowerCase()!=='private');

  const save=async()=>{
    if(!form.material_id||!form.scheme||!form.batch_no||!form.received_kg) return alert('Material, scheme, batch no. and received KG required.');
    setSaving(true);
    const row={date:form.date,batch_no:form.batch_no,material_id:form.material_id,scheme:form.scheme,received_kg:Number(form.received_kg),allotment_kg:Number(form.allotment_kg)||0,vehicle_no:form.vehicle_no,lorry_receipt_no:form.lorry_receipt_no,supplier_name:form.supplier_name,notes:form.notes};
    const {data,error}=await sb.from('fci_inwards').insert(row).select('*, material:material_id(*)').single();
    if(error){alert(error.message);setSaving(false);return;}

    const {data:bucket}=await sb.from('raw_material_scheme_stock').select('*').eq('product_id',form.material_id).eq('scheme',form.scheme).maybeSingle();
    if(bucket){
      await sb.from('raw_material_scheme_stock').update({qty_kg:Number(bucket.qty_kg)+Number(form.received_kg),updated_at:new Date().toISOString()}).eq('id',bucket.id);
    } else {
      await sb.from('raw_material_scheme_stock').insert({product_id:form.material_id,scheme:form.scheme,qty_kg:Number(form.received_kg)});
    }

    setReceipts(p=>[data,...p]); setForm(blank); setShowForm(false); setSaving(false);
    logActivity('FCI Inwards','create',`Batch ${form.batch_no} — ${form.received_kg}kg ${selectedMaterial?.product_name} (${form.scheme})`);
  };

  const del=async(r)=>{
    if(!confirm('Delete this receipt? Stock will be reversed.')) return;
    await sb.from('fci_inwards').delete().eq('id',r.id);
    const {data:bucket}=await sb.from('raw_material_scheme_stock').select('*').eq('product_id',r.material_id).eq('scheme',r.scheme).maybeSingle();
    if(bucket) await sb.from('raw_material_scheme_stock').update({qty_kg:Number(bucket.qty_kg)-Number(r.received_kg),updated_at:new Date().toISOString()}).eq('id',bucket.id);
    setReceipts(p=>p.filter(x=>x.id!==r.id));
    logActivity('FCI Inwards','delete',`Batch ${r.batch_no} deleted`);
  };

  if(loading) return <Loading/>;
  const total=receipts.reduce((s,r)=>s+Number(r.received_kg),0);

  return(<div className="page">
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:24,flexWrap:'wrap',gap:12}}>
      <div className="page-header" style={{marginBottom:0}}>
        <div className="page-label">Raw Materials</div>
        <div className="page-title">FCI Inwards — this month: {fmtMT(total)}</div>
      </div>
      <button className="btn btn-amber" onClick={()=>setShowForm(v=>!v)}>+ Log receipt</button>
    </div>

    {showForm&&(
      <FormCard title="New FCI receipt" col="var(--amber)" onSave={save} onCancel={()=>setShowForm(false)} saving={saving}>
        <div className="form-grid">
          <Field label="Date"><input type="date" className="form-input" value={form.date} max={today} onChange={e=>f('date',e.target.value)}/></Field>
          <Field label="Batch no. ★"><input className="form-input" value={form.batch_no} onChange={e=>f('batch_no',e.target.value.toUpperCase())}/></Field>
          <Field label="Raw Material">
            <select className="form-input" value={form.material_id} onChange={e=>{f('material_id',e.target.value);f('scheme','');}}>
              <option value="">-- Select material --</option>
              {rawMaterials.map(m=><option key={m.id} value={m.id}>{m.product_name}</option>)}
            </select>
          </Field>
          <Field label="Scheme">
            <select className="form-input" value={form.scheme} onChange={e=>f('scheme',e.target.value)}>
              <option value="">-- Select scheme --</option>
              {schemeOptions.map(s=><option key={s}>{s}</option>)}
            </select>
          </Field>
          <Field label="Received (kg) ★"><input type="number" className="form-input" style={{fontWeight:600}} value={form.received_kg} onChange={e=>f('received_kg',e.target.value)}/></Field>
          <Field label="Allotment (kg)"><input type="number" className="form-input" value={form.allotment_kg} onChange={e=>f('allotment_kg',e.target.value)}/></Field>
          <Field label="Vehicle no."><input className="form-input" value={form.vehicle_no} onChange={e=>f('vehicle_no',e.target.value)}/></Field>
          <Field label="Lorry receipt no."><input className="form-input" value={form.lorry_receipt_no} onChange={e=>f('lorry_receipt_no',e.target.value)}/></Field>
          <Field label="Supplier"><input className="form-input" value={form.supplier_name} onChange={e=>f('supplier_name',e.target.value)}/></Field>
          <Field label="Notes"><input className="form-input" value={form.notes} onChange={e=>f('notes',e.target.value)}/></Field>
        </div>
      </FormCard>
    )}

    <TableWrap><table>
      <thead><tr><th>Date</th><th>Batch</th><th>Material</th><th>Scheme</th><th>Received</th><th>Vehicle</th><th></th></tr></thead>
      <tbody>
        {receipts.length===0&&<tr><td colSpan={7}><Empty/></td></tr>}
        {receipts.map(r=>(<tr key={r.id}>
          <td className="mono dim">{r.date}</td>
          <td><strong style={{color:'var(--amber)',fontFamily:'var(--mono)'}}>{r.batch_no}</strong></td>
          <td>{r.material?.product_name||'—'}</td>
          <td><span className="badge badge-blue">{r.scheme}</span></td>
          <td><strong style={{color:'var(--green)',fontFamily:'var(--mono)'}}>{fmtMT(r.received_kg)}</strong></td>
          <td className="dim">{r.vehicle_no||'—'}</td>
          <td><button className="btn btn-red btn-sm" onClick={()=>del(r)}>✕</button></td>
        </tr>))}
      </tbody>
    </table></TableWrap>
  </div>);
}

// PRIVATE INWARDS
// ══════════════════════════════════════════════════════════
function PrivateInwards(){
  const [entries,setEntries]=useState([]);
  const [rawMaterials,setRawMaterials]=useState([]);
  const [showForm,setShowForm]=useState(false);
  const [saving,setSaving]=useState(false);
  const [loading,setLoading]=useState(true);
  const blank={date:today,party_name:'',material_id:'',entry_mode:'weight',qty_bags_input:'',qty_kg:'',vehicle_no:'',lorry_receipt_no:'',notes:''};
  const [form,setForm]=useState(blank);
  const f=(k,v)=>setForm(p=>({...p,[k]:v}));

  const load=useCallback(async()=>{
    setLoading(true);
    const [{data:e},{data:rm}]=await Promise.all([
      sb.from('private_inwards').select('*, material:material_id(*)').gte('date',monthStart).order('date',{ascending:false}),
      sb.from('product_master').select('*').eq('is_raw_material',true).eq('is_active',true),
    ]);
    setEntries(e||[]); setRawMaterials(rm||[]); setLoading(false);
  },[]);
  useEffect(()=>{load();},[load]);

  const selectedMaterial=rawMaterials.find(m=>m.id===form.material_id);

  const creditStock=async(materialId, kg)=>{
    const material=rawMaterials.find(m=>m.id===materialId);
    if(!material) return;
    if(material.has_schemes){
      const {data:bucket}=await sb.from('raw_material_scheme_stock').select('*').eq('product_id',materialId).eq('scheme','Private').maybeSingle();
      if(bucket){
        await sb.from('raw_material_scheme_stock').update({qty_kg:Number(bucket.qty_kg)+kg,updated_at:new Date().toISOString()}).eq('id',bucket.id);
      } else {
        await sb.from('raw_material_scheme_stock').insert({product_id:materialId,scheme:'Private',qty_kg:kg});
      }
    } else {
      const {data:bucket}=await sb.from('raw_material_stock').select('*').eq('product_id',materialId).maybeSingle();
      if(bucket){
        await sb.from('raw_material_stock').update({qty_kg:Number(bucket.qty_kg)+kg,updated_at:new Date().toISOString()}).eq('id',bucket.id);
      } else {
        await sb.from('raw_material_stock').insert({product_id:materialId,qty_kg:kg});
      }
    }
  };

  const save=async()=>{
    if(!form.party_name||!form.material_id) return alert('Party name and material required.');
    let finalKg;
    if(form.entry_mode==='bags'&&selectedMaterial?.has_standard_weight){
      if(!form.qty_bags_input) return alert('Enter bag count.');
      finalKg=Number(form.qty_bags_input)*Number(selectedMaterial.bag_weight);
    } else {
      if(!form.qty_kg) return alert('Enter weight received.');
      finalKg=Number(form.qty_kg);
    }
    setSaving(true);
    const row={date:form.date,party_name:form.party_name,material_id:form.material_id,qty_kg:finalKg,vehicle_no:form.vehicle_no,lorry_receipt_no:form.lorry_receipt_no,notes:form.notes};
    const {data,error}=await sb.from('private_inwards').insert(row).select('*, material:material_id(*)').single();
    if(error){alert(error.message);setSaving(false);return;}
    await creditStock(form.material_id, finalKg);
    setEntries(p=>[data,...p]); setForm(blank); setShowForm(false); setSaving(false);
    logActivity('Private Inwards','create',`${form.party_name} — ${finalKg}kg of ${selectedMaterial?.product_name}`);
  };

  const del=async(e)=>{
    if(!confirm('Delete entry? Stock will be reversed.')) return;
    await sb.from('private_inwards').delete().eq('id',e.id);
    await creditStock(e.material_id, -Number(e.qty_kg));
    setEntries(p=>p.filter(x=>x.id!==e.id));
    logActivity('Private Inwards','delete',`${e.party_name} — ${e.qty_kg}kg deleted`);
  };

  if(loading) return <Loading/>;
  const total=entries.reduce((s,e)=>s+Number(e.qty_kg),0);

  return(<div className="page">
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:24,flexWrap:'wrap',gap:12}}>
      <div className="page-header" style={{marginBottom:0}}>
        <div className="page-label">Raw Materials</div>
        <div className="page-title">Private inwards — this month: {fmtMT(total)}</div>
      </div>
      <button className="btn btn-amber" onClick={()=>setShowForm(v=>!v)}>+ Log receipt</button>
    </div>

    {showForm&&(
      <FormCard title="Log private inward" col="var(--amber)" onSave={save} onCancel={()=>setShowForm(false)} saving={saving}>
        <div className="form-grid">
          <Field label="Date"><input type="date" className="form-input" value={form.date} max={today} onChange={e=>f('date',e.target.value)}/></Field>
          <Field label="Party name ★"><input className="form-input" value={form.party_name} onChange={e=>f('party_name',e.target.value)}/></Field>
          <Field label="Material">
            <select className="form-input" value={form.material_id} onChange={e=>f('material_id',e.target.value)}>
              <option value="">-- Select material --</option>
              {rawMaterials.map(m=><option key={m.id} value={m.id}>{m.product_name}</option>)}
            </select>
          </Field>
          {selectedMaterial?.has_standard_weight&&(
            <Field label="Entry mode">
              <select className="form-input" value={form.entry_mode} onChange={e=>f('entry_mode',e.target.value)}>
                <option value="weight">Enter weight directly</option>
                <option value="bags">Enter bag count</option>
              </select>
            </Field>
          )}
          {(form.entry_mode==='bags'&&selectedMaterial?.has_standard_weight)?(
            <Field label={`Bags received ★ (${selectedMaterial.bag_weight}${selectedMaterial.unit}/bag)`}><input type="number" className="form-input" style={{fontWeight:600}} value={form.qty_bags_input} onChange={e=>f('qty_bags_input',e.target.value)}/></Field>
          ):(
            <Field label="Received (kg) ★"><input type="number" className="form-input" style={{fontWeight:600}} value={form.qty_kg} onChange={e=>f('qty_kg',e.target.value)}/></Field>
          )}
          <Field label="Vehicle no."><input className="form-input" value={form.vehicle_no} onChange={e=>f('vehicle_no',e.target.value)}/></Field>
          <Field label="Lorry receipt no."><input className="form-input" value={form.lorry_receipt_no} onChange={e=>f('lorry_receipt_no',e.target.value)}/></Field>
          <Field label="Notes"><input className="form-input" value={form.notes} onChange={e=>f('notes',e.target.value)}/></Field>
        </div>
      </FormCard>
    )}

    <TableWrap><table>
      <thead><tr><th>Date</th><th>Party</th><th>Material</th><th>Received</th><th>Vehicle</th><th></th></tr></thead>
      <tbody>
        {entries.length===0&&<tr><td colSpan={6}><Empty/></td></tr>}
        {entries.map(e=>(<tr key={e.id}>
          <td className="mono dim">{e.date}</td>
          <td><strong>{e.party_name}</strong></td>
          <td>{e.material?.product_name||'—'}</td>
          <td><strong style={{color:'var(--green)',fontFamily:'var(--mono)'}}>{fmtMT(e.qty_kg)}</strong></td>
          <td className="dim">{e.vehicle_no||'—'}</td>
          <td><button className="btn btn-red btn-sm" onClick={()=>del(e)}>✕</button></td>
        </tr>))}
      </tbody>
    </table></TableWrap>
  </div>);
}

// ══════════════════════════════════════════════════════════
// SUPPLYCO DISPATCH
// ══════════════════════════════════════════════════════════
function Dispatch(){
  const [dispatches,setDispatches]=useState([]);
  const [workOrders,setWorkOrders]=useState([]);
  const [finishedProducts,setFinishedProducts]=useState([]);
  const [wheatMaterial,setWheatMaterial]=useState(null);
  const [showDF,setShowDF]=useState(false);
  const [showWO,setShowWO]=useState(false);
  const [saving,setSaving]=useState(false);
  const [loading,setLoading]=useState(true);
  const blankD={date:today,invoice_no:'',delivery_order_no:'',work_order_id:'',scheme:'',product_id:'',batch_no:'',depot_name:'',district:'KNR',qty_bags:'',vehicle_no:'',notes:''};
  const blankW={work_order_no:'',work_order_date:today,scheme:'',batch_no:'',knr_pkts:0,tly_pkts:0,tpb_pkts:0,khd_pkts:0,ksd_pkts:0,irtty_pkts:0,vlparamba_pkts:0,other_pkts:0};
  const [dForm,setDForm]=useState(blankD);
  const [wForm,setWForm]=useState(blankW);
  const df=(k,v)=>setDForm(p=>({...p,[k]:v}));
  const wf=(k,v)=>setWForm(p=>({...p,[k]:v}));

  const load=useCallback(async()=>{
    setLoading(true);
    const [{data:d},{data:w},{data:fp},{data:wm}]=await Promise.all([
      sb.from('supplyco_dispatches').select('*, product:product_id(*)').gte('date',monthStart).order('date',{ascending:false}),
      sb.from('work_orders').select('*').order('work_order_date',{ascending:false}),
      sb.from('product_master').select('*').eq('is_raw_material',false).eq('is_active',true).order('product_name'),
      sb.from('product_master').select('*').eq('is_raw_material',true).eq('has_schemes',true).limit(1),
    ]);
    setDispatches(d||[]); setWorkOrders(w||[]); setFinishedProducts(fp||[]); setWheatMaterial((wm&&wm[0])||null); setLoading(false);
  },[]);
  useEffect(()=>{load();},[load]);

  const schemeOptions=(wheatMaterial?.scheme_list?wheatMaterial.scheme_list.split(',').map(s=>s.trim()):['NPS','PHH','AAY']).filter(s=>s.toLowerCase()!=='private');
  const productForScheme=(scheme)=>finishedProducts.find(p=>p.product_name.toUpperCase().includes(scheme));

  const saveDispatch=async()=>{
    if(!dForm.invoice_no||!dForm.depot_name||!dForm.qty_bags||!dForm.scheme) return alert('Scheme, invoice, depot and quantity required.');
    const prod=productForScheme(dForm.scheme);
    if(!prod) return alert(`No finished product found matching scheme "${dForm.scheme}" — check Product Master.`);
    setSaving(true);
    const row={date:dForm.date,invoice_no:dForm.invoice_no,delivery_order_no:dForm.delivery_order_no,work_order_id:dForm.work_order_id||null,scheme:dForm.scheme,product_id:prod.id,batch_no:dForm.batch_no,depot_name:dForm.depot_name,district:dForm.district,qty_bags:Number(dForm.qty_bags),vehicle_no:dForm.vehicle_no,notes:dForm.notes};
    const {data,error}=await sb.from('supplyco_dispatches').insert(row).select('*, product:product_id(*)').single();
    if(error){alert(error.message);setSaving(false);return;}
    const {data:s}=await sb.from('current_stock').select('*').eq('product_id',prod.id).maybeSingle();
    if(s) await sb.from('current_stock').update({qty_bags:Math.max(0,Number(s.qty_bags)-Number(dForm.qty_bags)),updated_at:new Date().toISOString()}).eq('id',s.id);
    setDispatches(p=>[data,...p]); setDForm(blankD); setShowDF(false); setSaving(false);
    logActivity('Dispatch','create',`Invoice ${dForm.invoice_no} — ${dForm.qty_bags} bags to ${dForm.depot_name}`);
  };

  const saveWO=async()=>{
    if(!wForm.work_order_no) return alert('Work order number required.');
    setSaving(true);
    const {data,error}=await sb.from('work_orders').insert(wForm).select().single();
    if(error){alert(error.message);setSaving(false);return;}
    setWorkOrders(p=>[data,...p]); setWForm(blankW); setShowWO(false); setSaving(false);
    logActivity('Dispatch','create',`Work order ${wForm.work_order_no} registered`);
  };

  const delD=async(d)=>{
    if(!confirm('Delete dispatch? Stock will be restored.')) return;
    await sb.from('supplyco_dispatches').delete().eq('id',d.id);
    const {data:s}=await sb.from('current_stock').select('*').eq('product_id',d.product_id).maybeSingle();
    if(s) await sb.from('current_stock').update({qty_bags:Number(s.qty_bags)+Number(d.qty_bags),updated_at:new Date().toISOString()}).eq('id',s.id);
    setDispatches(p=>p.filter(x=>x.id!==d.id));
    logActivity('Dispatch','delete',`Invoice ${d.invoice_no} deleted`);
  };

  if(loading) return <Loading/>;

  const woBalances=workOrders.map(wo=>{
    const prod=productForScheme(wo.scheme);
    const pktsPerBag=prod?.packets_per_bag||1;
    const sentBags=dispatches.filter(d=>d.work_order_id===wo.id).reduce((s,d)=>s+Number(d.qty_bags),0);
    const sentPkts=sentBags*pktsPerBag;
    return{...wo, sentBags, sentPkts, balance: wo.total_pkts - sentPkts};
  });

  return(<div className="page">
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:24,flexWrap:'wrap',gap:12}}>
      <div className="page-header" style={{marginBottom:0}}>
        <div className="page-label">Supplyco Operations</div>

// ══════════════════════════════════════════════════════════
// PRIVATE DISPATCH
// ══════════════════════════════════════════════════════════
function PrivateDispatch(){
  const [entries,setEntries]=useState([]);
  const [finishedProducts,setFinishedProducts]=useState([]);
  const [showForm,setShowForm]=useState(false);
  const [saving,setSaving]=useState(false);
  const [loading,setLoading]=useState(true);
  const blank={date:today,party_name:'',product_id:'',qty_bags:'',vehicle_no:'',invoice_no:'',notes:''};
  const [form,setForm]=useState(blank);
  const f=(k,v)=>setForm(p=>({...p,[k]:v}));

  const load=useCallback(async()=>{
    setLoading(true);
    const [{data:e},{data:fp}]=await Promise.all([
      sb.from('private_dispatches').select('*, product:product_id(*)').gte('date',monthStart).order('date',{ascending:false}),
      sb.from('product_master').select('*').eq('is_raw_material',false).eq('is_active',true).order('product_name'),
    ]);
    setEntries(e||[]); setFinishedProducts(fp||[]); setLoading(false);
  },[]);
  useEffect(()=>{load();},[load]);

  const save=async()=>{
    if(!form.party_name||!form.product_id||!form.qty_bags) return alert('Party name, product and quantity required.');
    setSaving(true);
    const row={date:form.date,party_name:form.party_name,product_id:form.product_id,qty_bags:Number(form.qty_bags),vehicle_no:form.vehicle_no,invoice_no:form.invoice_no,notes:form.notes};
    const {data,error}=await sb.from('private_dispatches').insert(row).select('*, product:product_id(*)').single();
    if(error){alert(error.message);setSaving(false);return;}
    const {data:s}=await sb.from('current_stock').select('*').eq('product_id',form.product_id).maybeSingle();
    if(s) await sb.from('current_stock').update({qty_bags:Math.max(0,Number(s.qty_bags)-Number(form.qty_bags)),updated_at:new Date().toISOString()}).eq('id',s.id);
    setEntries(p=>[data,...p]); setForm(blank); setShowForm(false); setSaving(false);
    logActivity('Private Dispatch','create',`${form.party_name} — ${form.qty_bags} bags`);
  };

  const del=async(e)=>{
    if(!confirm('Delete entry? Stock will be restored.')) return;
    await sb.from('private_dispatches').delete().eq('id',e.id);
    const {data:s}=await sb.from('current_stock').select('*').eq('product_id',e.product_id).maybeSingle();
    if(s) await sb.from('current_stock').update({qty_bags:Number(s.qty_bags)+Number(e.qty_bags),updated_at:new Date().toISOString()}).eq('id',s.id);
    setEntries(p=>p.filter(x=>x.id!==e.id));
    logActivity('Private Dispatch','delete',`${e.party_name} deleted`);
  };

  if(loading) return <Loading/>;
  const total=entries.reduce((s,e)=>s+Number(e.qty_bags),0);

  return(<div className="page">
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:24,flexWrap:'wrap',gap:12}}>
      <div className="page-header" style={{marginBottom:0}}>
        <div className="page-label">Sales</div>
        <div className="page-title">Private dispatch — this month: {fmt(total)} bags</div>
      </div>
      <button className="btn btn-green" onClick={()=>setShowForm(v=>!v)}>+ Log dispatch</button>
    </div>

    {showForm&&(
      <FormCard title="Log private dispatch" col="var(--green)" onSave={save} onCancel={()=>setShowForm(false)} saving={saving}>
        <div className="form-grid">
          <Field label="Date"><input type="date" className="form-input" value={form.date} max={today} onChange={e=>f('date',e.target.value)}/></Field>
          <Field label="Party name ★"><input className="form-input" value={form.party_name} onChange={e=>f('party_name',e.target.value)}/></Field>
          <Field label="Product">
            <select className="form-input" value={form.product_id} onChange={e=>f('product_id',e.target.value)}>
              <option value="">-- Select product --</option>
              {finishedProducts.map(p=><option key={p.id} value={p.id}>{p.product_name}</option>)}
            </select>
          </Field>
          <Field label="Bags dispatched ★"><input type="number" className="form-input" style={{fontWeight:600}} value={form.qty_bags} onChange={e=>f('qty_bags',e.target.value)}/></Field>
          <Field label="Vehicle no."><input className="form-input" value={form.vehicle_no} onChange={e=>f('vehicle_no',e.target.value)}/></Field>
          <Field label="Invoice no."><input className="form-input" value={form.invoice_no} onChange={e=>f('invoice_no',e.target.value)}/></Field>
          <Field label="Notes"><input className="form-input" value={form.notes} onChange={e=>f('notes',e.target.value)}/></Field>
        </div>
      </FormCard>
    )}

    <TableWrap><table>
      <thead><tr><th>Date</th><th>Party</th><th>Product</th><th>Bags</th><th>Vehicle</th><th></th></tr></thead>
      <tbody>
        {entries.length===0&&<tr><td colSpan={6}><Empty msg="No private dispatches this month."/></td></tr>}
        {entries.map(e=>(<tr key={e.id}>
          <td className="mono dim">{e.date}</td>
          <td><strong>{e.party_name}</strong></td>
          <td>{e.product?.product_name||'—'}</td>
          <td><strong style={{color:'var(--green)',fontFamily:'var(--mono)'}}>{fmt(e.qty_bags)}</strong></td>
          <td className="dim">{e.vehicle_no||'—'}</td>
          <td><button className="btn btn-red btn-sm" onClick={()=>del(e)}>✕</button></td>
        </tr>))}
      </tbody>
    </table></TableWrap>
  </div>);
}

// ══════════════════════════════════════════════════════════
// ALL STOCK (unified)
// ══════════════════════════════════════════════════════════
function AllStock(){
  const [products,setProducts]=useState([]);
  const [currentStock,setCurrentStock]=useState([]);
  const [rawStock,setRawStock]=useState([]);
  const [schemeStock,setSchemeStock]=useState([]);
  const [loading,setLoading]=useState(true);
  const [filterCat,setFilterCat]=useState('All');

  useEffect(()=>{
    Promise.all([
      sb.from('product_master').select('*').eq('is_active',true),
      sb.from('current_stock').select('*'),
      sb.from('raw_material_stock').select('*'),
      sb.from('raw_material_scheme_stock').select('*'),
    ]).then(([{data:p},{data:cs},{data:rs},{data:sss}])=>{
      setProducts(p||[]); setCurrentStock(cs||[]); setRawStock(rs||[]); setSchemeStock(sss||[]); setLoading(false);
    });
  },[]);

  if(loading) return <Loading/>;

  const rows=products.map(p=>{
    if(p.is_raw_material){
      if(p.has_schemes){
        const rows=schemeStock.filter(s=>s.product_id===p.id);
        const total=rows.reduce((s,r)=>s+Number(r.qty_kg),0);
        return{product:p,qtyLabel:fmtMT(total),detail:rows,statusVal:total};
      } else {
        const row=rawStock.find(r=>r.product_id===p.id);
        return{product:p,qtyLabel:fmtMT(row?.qty_kg||0),statusVal:row?.qty_kg||0};
      }
    } else {
      const bagSize=packSizeOf(p);
      if(bagSize>0){
        const row=currentStock.find(r=>r.product_id===p.id);
        const isLow=p.min_stock_alert>0&&(row?.qty_bags||0)<p.min_stock_alert;
        return{product:p,qtyLabel:fmt(row?.qty_bags||0)+' bags',statusVal:row?.qty_bags||0,isLow,minAlert:p.min_stock_alert};
      } else {
        const row=rawStock.find(r=>r.product_id===p.id);
        return{product:p,qtyLabel:fmtMT(row?.qty_kg||0),statusVal:row?.qty_kg||0};
      }
    }
  });

  const categories=['All',...Array.from(new Set(products.map(p=>p.category)))];
  const filtered=filterCat==='All'?rows:rows.filter(r=>r.product.category===filterCat);

  return(<div className="page">
    <div className="page-header">
      <div className="page-label">Inventory</div>
      <div className="page-title">All stock — unified view</div>
    </div>

    <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:16}}>
      {categories.map(c=><button key={c} className={`btn btn-sm ${filterCat===c?'btn-amber':'btn-ghost'}`} onClick={()=>setFilterCat(c)}>{c}</button>)}
    </div>

    <TableWrap><table>
      <thead><tr><th>Product</th><th>Category</th><th>Current Stock</th><th>Details</th></tr></thead>
      <tbody>
        {filtered.length===0&&<tr><td colSpan={4}><Empty msg="No products yet."/></td></tr>}
        {filtered.map((r,i)=>{
          const col=r.isLow?'var(--red)':r.statusVal<0?'var(--red)':'var(--green)';
          return(<tr key={i}>
            <td><strong>{r.product.product_name}</strong></td>
            <td><span className="badge badge-blue">{r.product.category}</span></td>
            <td><strong style={{color:col,fontFamily:'var(--mono)',fontSize:14}}>{r.qtyLabel}</strong></td>
            <td>
              {r.detail?(
                <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                  {r.detail.map(s=>(
                    <span key={s.id} className="badge" style={{background:Number(s.qty_kg)<0?'var(--red)15':'var(--border)',color:Number(s.qty_kg)<0?'var(--red)':'var(--muted)'}}>{s.scheme}: {fmtMT(s.qty_kg)}</span>
                  ))}
                </div>
              ):r.isLow?(<span style={{color:'var(--red)'}}>Below min. alert ({fmt(r.minAlert)})</span>):(<span className="dim">—</span>)}
            </td>
          </tr>);
        })}
      </tbody>
    </table></TableWrap>
  </div>);
}
