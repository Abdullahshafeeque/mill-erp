          <div style={{display:'flex',gap:10,alignItems:'flex-end'}}>
            <Field label="Start date">
              <input type="date" className="form-input" style={{width:180}} value={firstDate} max={today} onChange={e=>setFirstDate(e.target.value)}/>
            </Field>
            <button className="btn btn-amber" onClick={save}>Save</button>
          </div>
          {saved&&<div style={{marginTop:10,fontSize:12,color:'var(--green)'}}>Saved. Go to Production to begin.</div>}
        </>
      )}
    </div>

    <div className="card" style={{maxWidth:500,marginTop:20,borderLeft:'3px solid var(--blue)'}}>
      <div className="section-label" style={{marginBottom:12}}>Freeze past records</div>
      <div style={{fontSize:13,color:'var(--muted)',marginBottom:12}}>
        Production entries on or before this date can no longer be edited or deleted. Set this once your books for a period are finalized (e.g. 31 March each year).
      </div>
      <div style={{display:'flex',gap:10,alignItems:'flex-end',flexWrap:'wrap'}}>
        <Field label="Freeze up to and including">
          <input type="date" className="form-input" style={{width:180}} value={freezeDate} max={today} onChange={e=>setFreezeDate(e.target.value)}/>
        </Field>
        <button className="btn btn-blue" onClick={saveFreeze}>Save</button>
        {freezeDate&&<button className="btn btn-ghost" onClick={()=>{setFreezeDate('');localStorage.removeItem('productionFreezeDate');}}>Clear</button>}
      </div>
      {freezeSaved&&<div style={{marginTop:10,fontSize:12,color:'var(--green)'}}>Saved.</div>}
      {freezeDate&&<div style={{marginTop:10,fontSize:12,color:'var(--blue)'}}>Currently frozen: all days on or before {freezeDate}.</div>}
    </div>

    <div className="card" style={{maxWidth:500,marginTop:20,borderLeft:'3px solid var(--red)'}}>
      <div className="section-label" style={{marginBottom:12,color:'var(--red)'}}>Danger zone</div>
      <div style={{fontSize:13,color:'var(--muted)',marginBottom:12}}>
        Truncate all stock — sets every raw material, scheme stock, finished-goods, and store item quantity to zero. This does not delete transaction history, only resets current balances. Requires a password.
      </div>
      <button className="btn btn-red" onClick={truncateStock} disabled={truncating}>{truncating?'Truncating…':'Truncate all stock to zero'}</button>
    </div>
  </div>);
}

// WORK ORDER DEADLINES — settings, calculations, alerts
// ══════════════════════════════════════════════════════════
const WOA_SETTING_KEY='workorder_alert_settings';
const WOA_DEFAULTS={
  enabled:true,
  default_deadline_days:30, require_deadline:false,
  remind_days:10, manager_days:4, director_days:3,
  person_id:'', manager_id:'', notify_director:true,
  extra_ids:[], extra_from_stage:2,
  min_balance_pkts:0, tolerance_pct:1,
  alert_overdue:true, overdue_to_director:true,
  pace_enabled:true, pace_lag_pct:15,
  buffer_days:1, off_days:[0],
  bags_per_truck:200, daily_capacity_bags:0, risk_alert:true,
  shortfall_alert:true, shortfall_days:7, production_capacity_bags:0,
  show_dashboard:true, show_tasks:true
};
const WOA_STAGE_LABEL=['No alert','Person in charge alerted','Escalated to manager','Escalated to Director'];

async function loadWoaSettings(){
  const {data}=await sb.from('erp_settings').select('value').eq('key',WOA_SETTING_KEY).maybeSingle();
  let saved={};
  try{ saved=data&&data.value?JSON.parse(data.value):{}; }catch(e){ saved={}; }
  return {...WOA_DEFAULTS,...saved};
}

// Raw facts for every work order that has a deadline: bags dispatched, packets per bag, finished stock.
async function loadWoaBase(){
  const {data:w,error}=await sb.from('work_orders').select('*');
  if(error) throw new Error(error.message);
  const wos=(w||[]).filter(x=>x.deadline);
  if(!wos.length) return [];
  const minDate=wos.map(x=>x.work_order_date).filter(Boolean).sort()[0]||'2000-01-01';
  const [disp,{data:fp},{data:cs}]=await Promise.all([
    fetchAllRows((a,b)=>sb.from('supplyco_dispatches').select('id,work_order_id,qty_bags').gte('date',minDate).order('id').range(a,b)),
    sb.from('product_master').select('*').eq('is_raw_material',false).eq('is_active',true),
    sb.from('current_stock').select('*'),
  ]);
  const sent={};
  disp.forEach(d=>{ if(d.work_order_id) sent[d.work_order_id]=(sent[d.work_order_id]||0)+Number(d.qty_bags); });
  return wos.map(wo=>{
    const sch=String(wo.scheme||'').toUpperCase();
    const prod=sch?(fp||[]).find(p=>p.product_name.toUpperCase().includes(sch)):null;
    const stockRow=prod?(cs||[]).find(r=>r.product_id===prod.id):null;
    return {wo,ctx:{sentBags:sent[wo.id]||0,ppb:prod?.packets_per_bag||1,stockBags:Number(stockRow?.qty_bags)||0,productName:prod?.product_name||''}};
  });
}

// Everything is worked out live from the order + settings. Nothing about alert state is stored.
const woaInfo=(wo,S,ctx)=>{
  const ppb=Number(ctx.ppb)||1;
  const total=Number(wo.total_pkts)||0;
  const sentPkts=(Number(ctx.sentBags)||0)*ppb;
  const balPkts=Math.max(0,total-sentPkts);
  const balBags=balPkts/ppb;
  const stockBags=Number(ctx.stockBags)||0;
  const shortBags=Math.max(0,balBags-stockBags);
  const info={total,sentPkts,balPkts,balBags,ppb,stockBags,shortBags,pct:total>0?sentPkts/total*100:0,daysLeft:null,stage:0,reasons:[],complete:false,bagsPerDay:0,pktsPerDay:0,trucksPerDay:0,prodPerDay:0,workDays:0,atRisk:false,prodRisk:false};
  if(total>0&&balPkts<=total*(Number(S.tolerance_pct)||0)/100){ info.complete=true; return info; }
  if(total<=0||!wo.deadline) return info;
  const daysLeft=daysUntil(wo.deadline);
  info.daysLeft=daysLeft;
  const target=licShift(wo.deadline,-(Number(S.buffer_days)||0));
  info.workDays=liftWorkingDays(today,target,S.off_days);
  const wd=Math.max(1,info.workDays);
  info.bagsPerDay=balBags/wd;
  info.pktsPerDay=balPkts/wd;
  info.trucksPerDay=Number(S.bags_per_truck)>0?Math.ceil(info.bagsPerDay/Number(S.bags_per_truck)):0;
  info.prodPerDay=shortBags/wd;
  if(Number(S.daily_capacity_bags)>0&&info.bagsPerDay>Number(S.daily_capacity_bags)) info.atRisk=true;
  if(Number(S.production_capacity_bags)>0&&info.prodPerDay>Number(S.production_capacity_bags)) info.prodRisk=true;
  if(!S.enabled) return info;
  if(balPkts<(Number(S.min_balance_pkts)||0)) return info;

  const r=Number(S.remind_days)||0, m=Number(S.manager_days)||0, d=Number(S.director_days)||0;
  let stage=0;
  if(daysLeft<=r){ stage=1; info.reasons.push(`Within ${r} days of the deadline`); }
  if(daysLeft<=r-m) stage=2;
  if(daysLeft<=r-m-d) stage=3;
  if(daysLeft<0){
    if(S.alert_overdue){ stage=Math.max(stage,S.overdue_to_director?3:2); info.reasons.push('Deadline has passed'); }
    else stage=0;
  }
  if(S.pace_enabled&&wo.work_order_date&&wo.deadline>wo.work_order_date&&daysLeft>=0){
    const totalDays=daysUntil(wo.deadline)-daysUntil(wo.work_order_date);
    const elapsed=-daysUntil(wo.work_order_date);
    const timePct=totalDays>0?Math.min(100,Math.max(0,elapsed/totalDays*100)):0;
    if(info.pct<timePct-(Number(S.pace_lag_pct)||0)){
      stage=Math.max(stage,1);
      info.reasons.push(`Behind pace: ${info.pct.toFixed(0)}% dispatched, ${timePct.toFixed(0)}% of time used`);
    }
  }
  if(S.risk_alert&&info.atRisk&&daysLeft>=0){
    stage=Math.max(stage,1);
    info.reasons.push(`Needs ${fmt(Math.ceil(info.bagsPerDay))} bags/day dispatched, above capacity`);
  }
  if(S.shortfall_alert&&shortBags>0&&daysLeft>=0&&daysLeft<=(Number(S.shortfall_days)||0)){
    stage=Math.max(stage,1);
    info.reasons.push(`Stock has ${fmt(stockBags)} of ${fmt(Math.ceil(balBags))} pending bags — ${fmt(Math.ceil(shortBags))} bags still to produce`);
  }
  if(S.shortfall_alert&&info.prodRisk&&daysLeft>=0){
    stage=Math.max(stage,1);
    info.reasons.push(`Needs ${fmt(Math.ceil(info.prodPerDay))} bags/day produced, above production capacity`);
  }
  info.stage=stage;
  return info;
};

const woaBoard=(base,S)=>base.map(b=>({wo:b.wo,...woaInfo(b.wo,S,b.ctx)}));

// Which work orders should this person see in My Tasks?
const woaAlertsFor=(board,S,employeeId,role)=>{
  if(!S.enabled||!S.show_tasks) return [];
  const me=(employeeId===null||employeeId===undefined)?'':String(employeeId);
  const extras=(S.extra_ids||[]).map(String);
  const out=[];
  board.forEach(x=>{
    if(x.stage<1) return;
    let as=null;
    if(me&&String(S.person_id||'')===me) as='assignee';
    else if(x.stage>=2&&me&&String(S.manager_id||'')===me) as='manager';
    else if(me&&extras.includes(me)&&x.stage>=Number(S.extra_from_stage||1)) as='extra';
    else if(x.stage>=3&&S.notify_director&&role==='director') as='director';
    if(as) out.push({...x,as});
  });
  return out.sort((a,b)=>a.daysLeft-b.daysLeft);
};

// Shown at the top of My Tasks.
function WoaAlerts({employeeId,role}){
  const [list,setList]=useState([]);
  useEffect(()=>{(async()=>{
    try{
      const S=await loadWoaSettings();
      if(!S.enabled||!S.show_tasks) return;
      const base=await loadWoaBase();
      setList(woaAlertsFor(woaBoard(base,S),S,employeeId,role));
    }catch(e){ console.error('Work order alerts failed:',e.message); }
  })();},[employeeId,role]);
  if(list.length===0) return null;
  return(<div style={{marginBottom:24}}>
    <div className="section-label">Work orders needing action ({list.length})</div>
    {list.map(a=>{
      const wo=a.wo; const col=LIFT_STAGE_COL[a.stage];
      const who=a.as==='assignee'?'You are the person in charge of dispatching this work order.'
        :a.as==='manager'?'Escalated to you as manager — the person in charge has not finished dispatching.'
        :a.as==='extra'?'You are on the extra notification list for work orders.'
        :'Escalated to the Director.';
      return(<div key={wo.id} className="card" style={{marginBottom:12,borderLeft:`4px solid ${col}`}}>
        <div style={{fontSize:15,fontWeight:600}}>📊 Dispatch work order {wo.work_order_no}</div>
        <div style={{fontSize:12,color:'var(--muted)',marginTop:2}}>{[wo.scheme,wo.batch_no&&('Batch '+wo.batch_no)].filter(Boolean).join(' · ')}</div>
        <div style={{fontSize:13,marginTop:6,color:col,fontWeight:500}}>{fmt(a.balPkts)} packets ({fmt(Math.ceil(a.balBags))} bags) still to dispatch · {licDaysText(a.daysLeft)} (deadline {wo.deadline})</div>
        <div style={{fontSize:12,marginTop:4}}>Needs about {fmt(Math.ceil(a.bagsPerDay))} bags/day{a.trucksPerDay?` (${a.trucksPerDay} truck${a.trucksPerDay===1?'':'s'}/day)`:''} over {a.workDays} working day{a.workDays===1?'':'s'}.</div>
        {a.reasons.length>0&&<div style={{fontSize:12,marginTop:4,color:'var(--muted)'}}>{a.reasons.join(' · ')}</div>}
        <div style={{fontSize:12,marginTop:4}}>{who}</div>
      </div>);
    })}
  </div>);
}

// Settings page
function WorkOrderAlertSettings(){
  const [S,setS]=useState(WOA_DEFAULTS);
  const [emps,setEmps]=useState([]);
  const [base,setBase]=useState([]);
  const [loading,setLoading]=useState(true);

    const [cfg,{data:e}]=await Promise.all([
      loadWoaSettings(),
      sb.from(EMP_TABLE).select('*').range(0,4999),
    ]);
    setS(cfg);
    setEmps((e||[]).filter(empIsActive).sort((a,b)=>empName(a).localeCompare(empName(b))));

    if(m+d>r&&!confirm(`Manager and Director days add up to more than ${r}, so the Director alert would only start AFTER the deadline. Continue?`)) return;
    if(S.enabled&&!S.person_id&&!confirm('No person in charge is selected, so only the manager, extra people and Director will be alerted. Continue?')) return;
    const num=(v)=>Number(v)||0;
    const clean={...S,
      default_deadline_days:num(S.default_deadline_days),remind_days:r,manager_days:m,director_days:d,
      extra_from_stage:num(S.extra_from_stage)||1,min_balance_pkts:num(S.min_balance_pkts),tolerance_pct:num(S.tolerance_pct),
      pace_lag_pct:num(S.pace_lag_pct),buffer_days:num(S.buffer_days),bags_per_truck:num(S.bags_per_truck),
      daily_capacity_bags:num(S.daily_capacity_bags),shortfall_days:num(S.shortfall_days),production_capacity_bags:num(S.production_capacity_bags)};
    setSaving(true);
    const {error}=await sb.from('erp_settings').upsert({key:WOA_SETTING_KEY,value:JSON.stringify(clean)},{onConflict:'key'});
    setSaving(false);
    if(error) return alert(error.message);
    setS(clean);
    logActivity('Settings','update','Work order alert settings updated');
    setMsg('Saved.'); setTimeout(()=>setMsg(''),3000);
  };

  const reset=()=>{ if(confirm('Reset every field on this page to the defaults? (Nothing is saved until you press Save.)')) setS(WOA_DEFAULTS); };

  const num=(k,label,props)=>(<Field label={label}><input type="number" className="form-input" value={S[k]} onChange={e=>s(k,e.target.value)} {...(props||{})}/></Field>);
  const chk=(k,label)=>(<label style={{display:'flex',alignItems:'center',gap:8,fontSize:13,marginBottom:8}}><input type="checkbox" checked={!!S[k]} onChange={e=>s(k,e.target.checked)}/>{label}</label>);
  const empSel=(k,label)=>(<Field label={label}>
    <select className="form-input" value={S[k]||''} onChange={e=>s(k,e.target.value)}>
      <option value="">-- Select person --</option>
      {emps.map(e=><option key={e.id} value={String(e.id)}>{empLabel(e)}</option>)}
    </select>
  </Field>);
  const toggleOff=(i)=>s('off_days',(S.off_days||[]).includes(i)?(S.off_days||[]).filter(x=>x!==i):[...(S.off_days||[]),i]);

  if(loading) return <Loading/>;

  const r=Number(S.remind_days)||0, m=Number(S.manager_days)||0, d=Number(S.director_days)||0;
  const preview=woaBoard(base,S).filter(x=>!x.complete).sort((a,b)=>a.daysLeft-b.daysLeft);
  const previewRows=preview.map(x=>[
    <strong>{x.wo.work_order_no}</strong>,
    x.wo.scheme||'—',
    fmt(x.balPkts),
    x.wo.deadline,
    licDaysText(x.daysLeft),
    `${fmt(Math.ceil(x.bagsPerDay))} bags/day`,
    `${fmt(x.stockBags)} / ${fmt(Math.ceil(x.balBags))} bags`,
    <span style={{color:LIFT_STAGE_COL[x.stage],fontWeight:600}}>{WOA_STAGE_LABEL[x.stage]}</span>,
    x.reasons.join('; ')||'—',
  ]);

  return(<div className="page">
    <div className="page-header">
      <div className="page-label">System Settings</div>
      <div className="page-title">Work order alerts</div>
    </div>

    <div className="card" style={{marginBottom:16,borderLeft:`3px solid ${S.enabled?'var(--green)':'var(--red)'}`}}>
      {chk('enabled','Work order deadline alerts are ON (untick to switch every alert off; deadlines and planning figures still show)')}
    </div>

    <div className="card" style={{marginBottom:16}}>
      <div className="section-label">1. Deadline entry</div>
      <div className="form-grid">
        {num('default_deadline_days','Default deadline (days after work order date)',{min:0})}
      </div>
      <div style={{marginTop:10}}>{chk('require_deadline','Deadline is compulsory when creating a work order')}</div>
      <div className="dim" style={{fontSize:12}}>The default is pre-filled when a new work order form is opened. Set 0 for no pre-fill. The deadline can still be changed on each work order.</div>
    </div>

    <div className="card" style={{marginBottom:16}}>
      <div className="section-label">2. When to alert (days before the deadline)</div>
      <div className="form-grid">
        {num('remind_days','Alert person in charge (days before deadline)',{min:1})}

      <div style={{marginTop:10,fontSize:12,color:'var(--blue)'}}>

      </div>
      <div style={{marginTop:10}}>
        {chk('alert_overdue','Keep alerting after the deadline passes, until the work order is fully dispatched')}

    <div className="card" style={{marginBottom:16}}>

      <div className="form-grid" style={{marginTop:10}}>

          <select multiple size={6} className="form-input" value={(S.extra_ids||[]).map(String)} onChange={e=>s('extra_ids',Array.from(e.target.selectedOptions).map(o=>o.value))}>

        <Field label="Additional people start getting alerts from">
          <select className="form-input" value={S.extra_from_stage} onChange={e=>s('extra_from_stage',Number(e.target.value))}>

            <option value={3}>Director stage</option>
          </select>
        </Field>
      </div>
      <div className="dim" style={{fontSize:12,marginTop:8}}>A person only sees alerts if their login is linked to their employee profile in the HR portal.</div>
    </div>

    <div className="card" style={{marginBottom:16}}>
      <div className="section-label">4. Quantity rules</div>
      <div className="form-grid">
        {num('min_balance_pkts','Only alert if pending quantity is at least (packets)',{min:0})}
        {num('tolerance_pct','Treat work order as complete when pending is within (% of allotted)',{min:0,step:'0.1'})}
        {num('pace_lag_pct','Early warning if dispatched % is behind time used by more than (% points)',{min:0})}
      </div>
      <div style={{marginTop:10}}>{chk('pace_enabled','Behind-pace early warning: alert before the normal window if dispatch is slower than the time used since the work order date')}</div>
      <div className="dim" style={{fontSize:12}}>Example: tolerance 1% means a 10,000 packet work order with 80 packets left is treated as done and stops alerting.</div>
    </div>

    <div className="card" style={{marginBottom:16}}>
      <div className="section-label">5. Dispatch planning</div>
      <div className="form-grid">
        {num('buffer_days','Safety buffer (finish dispatch this many days before the deadline)',{min:0})}
        {num('bags_per_truck','Average bags per truck',{min:0})}
        {num('daily_capacity_bags','Maximum you can dispatch per day (bags, 0 = no limit)',{min:0})}
      </div>
      <div style={{marginTop:12}}>
        <div className="form-label" style={{marginBottom:6}}>Weekly off days (not counted as dispatch days)</div>
        <div style={{display:'flex',gap:14,flexWrap:'wrap'}}>
          {LIFT_WEEKDAYS.map((n,i)=>(<label key={i} style={{display:'flex',alignItems:'center',gap:6,fontSize:13}}>
            <input type="checkbox" checked={(S.off_days||[]).includes(i)} onChange={()=>toggleOff(i)}/>{n}
          </label>))}
        </div>
      </div>
      <div style={{marginTop:12}}>{chk('risk_alert','Alert the person in charge early if the required daily dispatch is above your daily capacity')}</div>
    </div>

    <div className="card" style={{marginBottom:16}}>
      <div className="section-label">6. Production and stock cover</div>
      <div style={{marginBottom:10}}>{chk('shortfall_alert','Alert when finished stock cannot cover the pending bags (and when the daily production needed is above capacity)')}</div>
      <div className="form-grid">
        {num('shortfall_days','Start the stock-shortfall alert when this many days are left',{min:0})}
        {num('production_capacity_bags','Maximum you can produce per day for this scheme (bags, 0 = no limit)',{min:0})}
      </div>
      <div className="dim" style={{fontSize:12,marginTop:8}}>Pending bags = pending packets ÷ packets per bag. Stock cover compares them with finished stock of the product for that scheme; the gap is what still has to be produced.</div>
    </div>

    <div className="card" style={{marginBottom:16}}>
      <div className="section-label">7. Where alerts appear</div>
      {chk('show_tasks','In My Tasks and the badge on the sidebar')}
      {chk('show_dashboard','On the Dashboard alerts list (visible to everyone who opens the Dashboard)')}
    </div>

    <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:24,flexWrap:'wrap'}}>
      <button className="btn btn-green" onClick={save} disabled={saving}>{saving?'Saving…':'Save settings'}</button>
      <button className="btn btn-ghost" onClick={reset}>Reset to defaults</button>
      {msg&&<span style={{fontSize:12,color:'var(--green)'}}>{msg}</span>}
    </div>

    <div className="section-label">Live preview — your work orders with a deadline under these settings (unsaved changes included)</div>
    <RTable head={['Work order','Scheme','Pending (pkts)','Deadline','Time left','Needed','Stock cover','Alert stage','Why']} rows={previewRows} empty="No open work orders with a deadline yet."/>
  </div>);
}

// TIMELINE CALENDAR
// ══════════════════════════════════════════════════════════
const TL_TYPES={
  lifting:{label:'Lifting orders',icon:'🚛',col:'var(--amber)',page:'lifting-orders'},
  workorder:{label:'Work orders',icon:'📊',col:'var(--blue)',page:'work-order-tracker'},
  license:{label:'Licenses',icon:'📑',col:'var(--purple)',page:'licenses'},
  job:{label:'Job cards',icon:'🛠️',col:'var(--green)',page:'job-cards'},
  shutdown:{label:'Shutdowns',icon:'🔧',col:'var(--red)',page:'shutdowns'},
};
const tlDaysText=(it)=>it.done?'Complete':it.daysLeft<0?`Overdue by ${-it.daysLeft} day${-it.daysLeft===1?'':'s'}`:it.daysLeft===0?'Due today':`${it.daysLeft} day${it.daysLeft===1?'':'s'} left`;
const tlColor=(it)=>it.done?'var(--green)':it.daysLeft<0?'var(--red)':it.stage>=1?LIFT_STAGE_COL[it.stage]:TL_TYPES[it.type].col;
const tlKey=(y,m,d)=>`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

async function loadTimelineItems(){
  const [LS,WS]=await Promise.all([loadLiftSettings(),loadWoaSettings()]);
  const [lo,lic,jobs]=await Promise.all([
    sb.from('lifting_orders').select('*, material:material_id(*)').then(repMust),
    sb.from('licenses').select('*').eq('status','Active').then(repMust),
    sb.from('job_cards').select('*').neq('status','Done').then(repMust),
  ]);
  const items=[];

  lo.forEach(o=>{
    if(!o.deadline) return;
    const x=liftInfo(o,LS);
    items.push({key:'L'+o.id,type:'lifting',date:o.deadline,daysLeft:daysUntil(o.deadline),stage:x.stage,done:x.complete,
      title:`Lifting ${o.order_no}`,
      sub:[o.material?.product_name,o.scheme].filter(Boolean).join(' · ')+(x.complete?' · fully lifted':` · ${fmtMT(x.balance)} still to lift`),
      extra:x.complete?'':`Needs ${fmtMT(x.reqPerDay)}/day${x.trucksPerDay?` · ${x.trucksPerDay} truck${x.trucksPerDay===1?'':'s'}/day`:''}`});
  });

  let board=[];
  try{ board=woaBoard(await loadWoaBase(),WS); }catch(e){ console.error('Timeline: work orders failed:',e.message); }
  board.forEach(x=>{
    items.push({key:'W'+x.wo.id,type:'workorder',date:x.wo.deadline,daysLeft:daysUntil(x.wo.deadline),stage:x.stage,done:x.complete,
      title:`Work order ${x.wo.work_order_no}`,
      sub:[x.wo.scheme,x.wo.batch_no&&('Batch '+x.wo.batch_no)].filter(Boolean).join(' · ')+(x.complete?' · fully dispatched':` · ${fmt(x.balPkts)} packets pending`),
      extra:x.complete?'':`Needs ${fmt(Math.ceil(x.bagsPerDay))} bags/day${x.shortBags>0?` · ${fmt(Math.ceil(x.shortBags))} bags still to produce`:''}`});
  });

  lic.forEach(l=>{
    if(!l.expiry_date) return;
    const x=licInfo(l);
    items.push({key:'C'+l.id,type:'license',date:l.expiry_date,daysLeft:x.daysLeft,stage:x.stage,done:false,
      title:`Renew ${l.name}`,
      sub:[l.category,l.license_no,l.assigned_to_name&&('In charge: '+l.assigned_to_name)].filter(Boolean).join(' · '),extra:''});
  });

  jobs.forEach(j=>{
    if(!j.deadline) return;
    const dl=daysUntil(j.deadline);
    items.push({key:'J'+j.id,type:'job',date:j.deadline,daysLeft:dl,stage:dl<=3?1:0,done:false,
      title:j.title,
      sub:[j.priority,j.status,j.assigned_to&&('Assigned: '+j.assigned_to),j.location].filter(Boolean).join(' · '),extra:''});
  });

  try{
    const {data:sds}=await sb.from('shutdowns').select('*').in('status',['Proposed','Approved']);
    (sds||[]).forEach(s=>{
      const n=Math.min(120,Number(s.est_days)||1);
      for(let i=0;i<n;i++){
        const d=licShift(s.start_date,i), dl=daysUntil(d);
        items.push({key:'S'+s.id+d,type:'shutdown',date:d,daysLeft:dl,stage:0,done:dl<0,
          title:`${s.title}${n>1?` · day ${i+1}/${n}`:''}`,
          sub:(s.status==='Proposed'?'Awaiting approval':'Approved')+' · mill shutdown',extra:i===0?(s.work_scope||''):''});
      }
    });
  }catch(e){}
  return {items,off:LS.off_days||[]};
}

function TimelineCalendar({onGo}){
  const [ty,tm]=today.split('-').map(Number);
  const [cur,setCur]=useState({y:ty,m:tm});
  const [view,setView]=useState('calendar');
  const [items,setItems]=useState([]);
  const [off,setOff]=useState([]);
  const [loading,setLoading]=useState(true);
  const [err,setErr]=useState('');
  const [sel,setSel]=useState(today);
  const [show,setShow]=useState({lifting:true,workorder:true,license:true,job:true,shutdown:true,done:false});

  const load=useCallback(async()=>{
    setLoading(true); setErr('');
    try{ const r=await loadTimelineItems(); setItems(r.items); setOff(r.off); }
    catch(e){ setErr(e.message||String(e)); }
    setLoading(false);
  },[]);
  useEffect(()=>{load();},[load]);

  const move=(n)=>setCur(p=>{ let m=p.m+n,y=p.y; if(m<1){m=12;y--;} if(m>12){m=1;y++;} return {y,m}; });
  const goToday=()=>{ setCur({y:ty,m:tm}); setSel(today); };

  if(loading) return <Loading/>;

  const vis=items.filter(i=>show[i.type]&&(show.done||!i.done));
  const byDate={};
  vis.forEach(i=>{ (byDate[i.date]=byDate[i.date]||[]).push(i); });
  const open=vis.filter(i=>!i.done);
  const overdueList=open.filter(i=>i.daysLeft<0).sort((a,b)=>a.date.localeCompare(b.date));
  const upList=open.filter(i=>i.daysLeft>=0).sort((a,b)=>a.date.localeCompare(b.date));
  const upDates=Array.from(new Set(upList.map(i=>i.date)));
  const wk=upList.filter(i=>i.daysLeft<=7).length;
  const mo=upList.filter(i=>i.daysLeft<=30).length;

  const first=new Date(cur.y,cur.m-1,1).getDay();
  const daysInMonth=new Date(cur.y,cur.m,0).getDate();
  const cells=[];
  for(let i=0;i<first;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(d);
  while(cells.length%7!==0) cells.push(null);

  const row=(it,showDate)=>{
    const c=tlColor(it); const T=TL_TYPES[it.type];
    return(<div key={it.key} style={{display:'flex',justifyContent:'space-between',gap:12,flexWrap:'wrap',padding:'10px 12px',marginBottom:8,border:'1px solid var(--border)',borderLeft:`4px solid ${c}`,borderRadius:6,background:'var(--surface)'}}>
      <div style={{flex:1,minWidth:200}}>
        <div style={{fontWeight:600,fontSize:14}}>{T.icon} {it.title}</div>
        <div className="dim" style={{fontSize:12,marginTop:2}}>{it.sub}</div>
        {it.extra&&<div style={{fontSize:12,marginTop:2}}>{it.extra}</div>}
      </div>
      <div style={{textAlign:'right'}}>
        <span className="badge" style={{background:`color-mix(in srgb, ${c} 18%, transparent)`,color:c}}>{tlDaysText(it)}</span>
        {showDate&&<div className="mono dim" style={{fontSize:11,marginTop:4}}>{it.date}</div>}
        <div style={{marginTop:4}}><button className="btn btn-ghost btn-sm" onClick={()=>onGo&&onGo(T.page)}>Open ↗</button></div>
      </div>
    </div>);
  };

  return(<div className="page">
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:24,flexWrap:'wrap',gap:12}}>
      <div className="page-header" style={{marginBottom:0}}>
        <div className="page-label">Planning</div>
        <div className="page-title">Timeline calendar</div>
      </div>
      <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
        <button className={`btn btn-sm ${view==='calendar'?'btn-amber':'btn-ghost'}`} onClick={()=>setView('calendar')}>Calendar</button>
        <button className={`btn btn-sm ${view==='agenda'?'btn-amber':'btn-ghost'}`} onClick={()=>setView('agenda')}>Agenda list</button>
        <button className="btn btn-ghost btn-sm" onClick={load}>↻ Refresh</button>
      </div>
    </div>

    {err&&<Alert type="red" icon="⚠" title="Could not load the calendar" sub={err}/>}

    <div className="stat-grid">
      <StatCard label="Overdue" value={overdueList.length} col={overdueList.length>0?'var(--red)':'var(--green)'}/>
      <StatCard label="Due in 7 days" value={wk} col={wk>0?'var(--amber)':'var(--green)'}/>
      <StatCard label="Due in 30 days" value={mo} col="var(--blue)"/>
      <StatCard label="Open items" value={open.length} col="var(--purple)"/>
    </div>

    <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:16,alignItems:'center'}}>
      {Object.entries(TL_TYPES).map(([k,T])=>(
        <button key={k} className={`btn btn-sm ${show[k]?'btn-amber':'btn-ghost'}`} onClick={()=>setShow(p=>({...p,[k]:!p[k]}))}>{T.icon} {T.label}</button>
      ))}
      <button className={`btn btn-sm ${show.done?'btn-amber':'btn-ghost'}`} onClick={()=>setShow(p=>({...p,done:!p.done}))}>✓ Show completed</button>
    </div>

    {view==='calendar'&&(<>
      <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:12,flexWrap:'wrap'}}>
        <button className="btn btn-ghost btn-sm" onClick={()=>move(-1)}>◀</button>
        <div style={{fontSize:16,fontWeight:600,minWidth:160,textAlign:'center'}}>{MONTH_NAMES[cur.m-1]} {cur.y}</div>
        <button className="btn btn-ghost btn-sm" onClick={()=>move(1)}>▶</button>
        <button className="btn btn-ghost btn-sm" onClick={goToday}>Today</button>
      </div>

      <div className="card" style={{padding:0,overflow:'hidden',marginBottom:16}}>
        <div style={{display:'grid',gridTemplateColumns:'repeat(7,minmax(0,1fr))',gap:1,background:'var(--border)'}}>
          {LIFT_WEEKDAYS.map(n=>(
            <div key={n} style={{background:'var(--surface2)',padding:'6px 4px',textAlign:'center',fontFamily:'var(--mono)',fontSize:10,letterSpacing:'.08em',color:'var(--muted)',textTransform:'uppercase'}}>{n}</div>
          ))}
          {cells.map((d,i)=>{
            if(d===null) return <div key={'b'+i} style={{background:'var(--surface2)',minHeight:92}}/>;
            const key=tlKey(cur.y,cur.m,d);
            const list=byDate[key]||[];
            const isToday=key===today, isSel=key===sel;
            const isOff=off.includes(new Date(cur.y,cur.m-1,d).getDay());
            return(<div key={key} onClick={()=>setSel(key)} style={{background:isOff?'var(--surface2)':'var(--surface)',minHeight:92,padding:4,cursor:'pointer',outline:isSel?'2px solid var(--blue)':'none',outlineOffset:-2,overflow:'hidden'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:3}}>
                <span style={isToday?{background:'var(--amber)',color:'#fff',borderRadius:10,padding:'0 6px',fontSize:12,fontWeight:700}:{fontSize:12,color:'var(--muted)'}}>{d}</span>
                {list.length>0&&<span className="mono" style={{fontSize:10,color:'var(--muted)'}}>{list.length}</span>}
              </div>
              {list.slice(0,3).map(it=>{
                const c=tlColor(it), T=TL_TYPES[it.type];
                return <div key={it.key} title={`${it.title} — ${tlDaysText(it)}`} style={{fontSize:10,lineHeight:'15px',padding:'0 4px',marginBottom:2,borderRadius:3,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',background:`color-mix(in srgb, ${T.col} 14%, transparent)`,borderLeft:`3px solid ${c}`,opacity:it.done?0.6:1}}>{T.icon} {it.title}</div>;
              })}
              {list.length>3&&<div style={{fontSize:10,color:'var(--muted)'}}>+{list.length-3} more</div>}
            </div>);
          })}
        </div>
      </div>

      <div className="section-label">{cashDayLabel(sel)}{sel===today?' · today':''}</div>
      {(byDate[sel]||[]).length===0
        ?<div className="card"><Empty msg="Nothing due on this day."/></div>
        :(byDate[sel]||[]).map(it=>row(it,false))}
    </>)}

    {view==='agenda'&&(<>
      {overdueList.length>0&&(<>
        <div className="section-label" style={{color:'var(--red)'}}>Overdue ({overdueList.length})</div>
        {overdueList.map(it=>row(it,true))}
      </>)}
      <div className="section-label" style={{marginTop:16}}>Upcoming ({upList.length})</div>
      {upList.length===0&&<div className="card"><Empty msg="Nothing upcoming."/></div>}
      {upDates.map(dt=>(<div key={dt}>
        <div className="mono" style={{fontSize:12,color:'var(--amber)',margin:'10px 0 6px'}}>{cashDayLabel(dt)}{dt===today?' · today':''}</div>
        {upList.filter(i=>i.date===dt).map(it=>row(it,false))}
      </div>))}
    </>)}

    <div className="dim" style={{fontSize:12,marginTop:20,maxWidth:760}}>
      Left bar colour: green = complete, red = overdue, amber/orange = an alert is active, otherwise the item's own colour. Shaded days are the weekly off days from Settings → Lifting Alerts. Items without a deadline are not shown.
    </div>
  </div>);
}

// WHATSAPP ALERTS — settings, contacts, test sending
// ══════════════════════════════════════════════════════════
const NOTIFY_KEY='notify_settings';
const NOTIFY_DEFAULTS={enabled:false,send_hour:8,template_name:'daily_mill_alerts',template_lang:'en',include_lifting:true,include_workorder:true,include_license:true,include_job:true,job_days:3,send_when_empty:false,max_chars:600};
const normPhone=(v)=>{
  let d=String(v||'').replace(/\D/g,'');
  if(d.length===10) d='91'+d;
  if(d.length===11&&d.startsWith('0')) d='91'+d.slice(1);
  return d;
};

function WhatsAppSettings(){
  const [S,setS]=useState(NOTIFY_DEFAULTS);
  const [contacts,setContacts]=useState([]);
  const [log,setLog]=useState([]);
  const [emps,setEmps]=useState([]);
  const [loading,setLoading]=useState(true);
  const [saving,setSaving]=useState(false);
  const [busy,setBusy]=useState('');
  const [msg,setMsg]=useState('');
  const blank={name:'',phone:'',employee_id:'',is_director:false,enabled:true};
  const [form,setForm]=useState(blank);
  const [editingId,setEditingId]=useState(null);
  const [showForm,setShowForm]=useState(false);
  const s=(k,v)=>setS(p=>({...p,[k]:v}));
  const f=(k,v)=>setForm(p=>({...p,[k]:v}));

  const load=useCallback(async()=>{
    const [{data:st},{data:c,error:ce},{data:lg},{data:e}]=await Promise.all([
      sb.from('erp_settings').select('value').eq('key',NOTIFY_KEY).maybeSingle(),
      sb.from('notify_contacts').select('*').order('name'),
      sb.from('notify_log').select('*').order('sent_at',{ascending:false}).limit(40),
      sb.from(EMP_TABLE).select('*').range(0,4999),
    ]);
    let saved={}; try{ saved=st&&st.value?JSON.parse(st.value):{}; }catch(_){ saved={}; }
    setS({...NOTIFY_DEFAULTS,...saved});
    setContacts(c||[]); setLog(lg||[]);
    setEmps((e||[]).filter(empIsActive).sort((a,b)=>empName(a).localeCompare(empName(b))));
    setMsg(ce?'Could not load contacts (Directors only): '+ce.message:'');
    setLoading(false);
  },[]);
  useEffect(()=>{load();},[load]);

  const saveSettings=async()=>{
    const h=Number(S.send_hour), mc=Number(S.max_chars), jd=Number(S.job_days);
    if(!Number.isInteger(h)||h<0||h>23) return alert('Send hour must be a whole number from 0 to 23.');
    if(!String(S.template_name||'').trim()) return alert('Template name is required.');
    if(!Number.isInteger(mc)||mc<100||mc>900) return alert('Maximum message length must be between 100 and 900 characters.');
    if(!Number.isInteger(jd)||jd<0) return alert('Job reminder days must be a whole number, 0 or more.');
    const clean={...S,send_hour:h,max_chars:mc,job_days:jd,template_name:String(S.template_name).trim(),template_lang:String(S.template_lang||'en').trim()};
    setSaving(true);
    const {error}=await sb.from('erp_settings').upsert({key:NOTIFY_KEY,value:JSON.stringify(clean)},{onConflict:'key'});
    setSaving(false);
    if(error) return alert(error.message);
    setS(clean);
    logActivity('Settings','update','WhatsApp alert settings updated');
    setMsg('Saved.'); setTimeout(()=>setMsg(''),3000);
  };

  const closeForm=()=>{ setForm(blank); setEditingId(null); setShowForm(false); };
  const startEdit=(c)=>{ setEditingId(c.id); setForm({name:c.name||'',phone:c.phone||'',employee_id:c.employee_id||'',is_director:!!c.is_director,enabled:c.enabled!==false}); setShowForm(true); };

  const saveContact=async()=>{
    if(!form.name.trim()) return alert('Name is required.');
    const phone=normPhone(form.phone);
    if(phone.length<11||phone.length>15) return alert('Enter the WhatsApp number with country code, for example 919847012345. A plain 10-digit Indian number is also fine.');
    if(!form.employee_id&&!form.is_director&&!confirm('No employee is linked and Director alerts are off, so this person will receive nothing. Save anyway?')) return;
    if(contacts.some(c=>c.id!==editingId&&c.phone===phone)&&!confirm('Another contact already has this number. Save anyway?')) return;
    setSaving(true);
    const payload={name:form.name.trim(),phone,employee_id:form.employee_id?String(form.employee_id):null,is_director:!!form.is_director,enabled:!!form.enabled};
    const {error}=editingId?await sb.from('notify_contacts').update(payload).eq('id',editingId):await sb.from('notify_contacts').insert(payload);
    setSaving(false);
    if(error) return alert(error.message);
    logActivity('Settings',editingId?'update':'create',`WhatsApp contact — ${payload.name}`);
    closeForm(); load();
  };

  const delContact=async(c)=>{
    if(!confirm(`Remove ${c.name} from WhatsApp alerts?`)) return;
    const {error}=await sb.from('notify_contacts').delete().eq('id',c.id);
    if(error) return alert(error.message);
    logActivity('Settings','delete',`WhatsApp contact removed — ${c.name}`);
    load();
  };

  const invoke=async(action,contactId)=>{
    if(action==='run_now'&&!confirm('Send today\'s alerts to everyone now? People with nothing pending are skipped.')) return;
    setBusy(action+(contactId||''));
    const {data,error}=await sb.functions.invoke('daily-alerts',{body:{action,contact_id:contactId||null}});
    setBusy('');
    if(error){
      let m=error.message||String(error);
      try{ const j=await error.context.json(); if(j&&j.error) m=j.error; }catch(_){}
      alert('Could not send: '+m); return;
    }
    if(data&&data.error){ alert(data.error); return; }
    const r=data||{};
    alert(`Done. Sent: ${r.sent||0}, failed: ${r.failed||0}, skipped: ${r.skipped||0}.${r.note?'\n'+r.note:''}${r.failed?'\nSee the log below for the reason.':''}`);
    load();
  };

  if(loading) return <Loading/>;

  const chk=(k,label)=>(<label style={{display:'flex',alignItems:'center',gap:8,fontSize:13,marginBottom:8}}><input type="checkbox" checked={!!S[k]} onChange={e=>s(k,e.target.checked)}/>{label}</label>);
  const empById=(id)=>emps.find(e=>String(e.id)===String(id));

  return(<div className="page">
    <div className="page-header">
      <div className="page-label">System Settings</div>
      <div className="page-title">WhatsApp alerts</div>
    </div>

    {msg&&<div style={{marginBottom:12,fontSize:12,color:msg==='Saved.'?'var(--green)':'var(--red)'}}>{msg}</div>}

    <div className="card" style={{marginBottom:16,borderLeft:`3px solid ${S.enabled?'var(--green)':'var(--red)'}`}}>
      {chk('enabled','Daily WhatsApp alerts are ON (untick to stop the automatic morning messages; manual test sends still work)')}
      <div className="form-grid" style={{marginTop:10}}>
        <Field label="Send time (India time, hour 0–23)"><input type="number" min="0" max="23" className="form-input" value={S.send_hour} onChange={e=>s('send_hour',e.target.value)}/></Field>
        <Field label="Approved template name"><input className="form-input" value={S.template_name} onChange={e=>s('template_name',e.target.value)}/></Field>
        <Field label="Template language code"><input className="form-input" value={S.template_lang} onChange={e=>s('template_lang',e.target.value)}/></Field>
        <Field label="Remind about jobs due within (days)"><input type="number" min="0" className="form-input" value={S.job_days} onChange={e=>s('job_days',e.target.value)}/></Field>
        <Field label="Maximum digest length (characters)"><input type="number" min="100" max="900" className="form-input" value={S.max_chars} onChange={e=>s('max_chars',e.target.value)}/></Field>
      </div>
      <div style={{marginTop:10}}>
        <div className="form-label" style={{marginBottom:6}}>Include in the daily message</div>
        {chk('include_lifting','🚛 Lifting orders')}
        {chk('include_workorder','📊 Work orders')}
        {chk('include_license','📑 Licenses and renewals')}
        {chk('include_job','🛠️ Job cards assigned to the person')}
        {chk('send_when_empty','Also send "No pending alerts today" when someone has nothing (costs a message each day)')}
      </div>
      <div className="dim" style={{fontSize:12,marginTop:4}}>Who is alerted, and when it escalates, still comes from the Lifting Alerts, Work Order Alerts and License settings. This page only controls delivery.</div>
      <div className="form-actions"><button className="btn btn-green" onClick={saveSettings} disabled={saving}>{saving?'Saving…':'Save settings'}</button></div>
    </div>

    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',margin:'24px 0 12px',flexWrap:'wrap',gap:8}}>
      <div className="section-label" style={{marginBottom:0}}>People who receive WhatsApp alerts</div>
      <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
        <button className="btn btn-ghost btn-sm" onClick={()=>invoke('run_now')} disabled={!!busy}>{busy==='run_now'?'Sending…':'Send today\'s alerts now'}</button>
        <button className="btn btn-amber btn-sm" onClick={()=>{ setEditingId(null); setForm(blank); setShowForm(true); }}>+ Add person</button>
      </div>
    </div>

    {showForm&&(
      <FormCard title={editingId?'Edit person':'Add person'} col="var(--amber)" onSave={saveContact} onCancel={closeForm} saving={saving}>
        <div className="form-grid">
          <Field label="Name ★"><input className="form-input" value={form.name} onChange={e=>f('name',e.target.value)}/></Field>
          <Field label="WhatsApp number ★ (with country code)"><input className="form-input" value={form.phone} onChange={e=>f('phone',e.target.value)} placeholder="919847012345"/></Field>
          <Field label="Linked employee (for their own alerts and jobs)">
            <select className="form-input" value={form.employee_id} onChange={e=>f('employee_id',e.target.value)}>
              <option value="">-- None --</option>
              {emps.map(e=><option key={e.id} value={String(e.id)}>{empLabel(e)}</option>)}
            </select>
          </Field>
        </div>
        <div style={{marginTop:10}}>
          <label style={{display:'flex',alignItems:'center',gap:8,fontSize:13,marginBottom:8}}><input type="checkbox" checked={form.is_director} onChange={e=>f('is_director',e.target.checked)}/>Receives Director-level escalations</label>
          <label style={{display:'flex',alignItems:'center',gap:8,fontSize:13}}><input type="checkbox" checked={form.enabled} onChange={e=>f('enabled',e.target.checked)}/>Enabled</label>
        </div>
      </FormCard>
    )}

    <TableWrap><table>
      <thead><tr><th>Name</th><th>WhatsApp</th><th>Linked employee</th><th>Director</th><th>Status</th><th></th></tr></thead>
      <tbody>
        {contacts.length===0&&<tr><td colSpan={6}><Empty msg="No one added yet."/></td></tr>}
        {contacts.map(c=>{ const em=empById(c.employee_id); return(<tr key={c.id}>
          <td><strong>{c.name}</strong></td>
          <td className="mono">{c.phone}</td>
          <td className="dim">{em?empLabel(em):'—'}</td>
          <td>{c.is_director?<span className="badge badge-blue">Yes</span>:<span className="dim">—</span>}</td>
          <td>{c.enabled?<span className="badge badge-green">On</span>:<span className="badge badge-muted">Off</span>}</td>
          <td><div style={{display:'flex',gap:6}}>
            <button className="btn btn-green btn-sm" onClick={()=>invoke('test',c.id)} disabled={!!busy}>{busy==='test'+c.id?'Sending…':'Send test'}</button>
            <button className="btn btn-blue btn-sm" onClick={()=>startEdit(c)}>Edit</button>
            <button className="btn btn-red btn-sm" onClick={()=>delContact(c)}>✕</button>
          </div></td>
        </tr>); })}
      </tbody>
    </table></TableWrap>

    <div className="section-label" style={{marginTop:24}}>Recent sends</div>
    <TableWrap><table>
      <thead><tr><th>Time</th><th>Name</th><th>Status</th><th>Detail</th></tr></thead>
      <tbody>
        {log.length===0&&<tr><td colSpan={4}><Empty msg="Nothing sent yet."/></td></tr>}
        {log.map(l=>(<tr key={l.id}>
          <td className="mono dim">{new Date(l.sent_at).toLocaleString('en-IN')}</td>
          <td>{l.name||'—'}</td>
          <td><span className={`badge ${l.status==='sent'?'badge-green':l.status==='failed'?'badge-red':'badge-muted'}`}>{l.status}</span></td>
          <td className="dim" style={{fontSize:12}}>{l.detail||'—'}</td>
        </tr>))}
      </tbody>
    </table></TableWrap>
  </div>);
}

function WorkOrderTracker(){
  const [workOrders,setWorkOrders]=useState([]);
  const [dispatches,setDispatches]=useState([]);
  const [finishedProducts,setFinishedProducts]=useState([]);
  const [depots,setDepots]=useState([]);
  const [wheatMaterial,setWheatMaterial]=useState(null);
  const [loading,setLoading]=useState(true);
  const [editingId,setEditingId]=useState(null);
  const [saving,setSaving]=useState(false);
  const [showCreate,setShowCreate]=useState(false);
  const [depotAllotments,setDepotAllotments]=useState({});
  const now=new Date();
  const [filterMonth,setFilterMonth]=useState(now.getMonth()+1);
  const [S,setS]=useState(WOA_DEFAULTS);
  const [board,setBoard]=useState({});
  const [eAllot,setEAllot]=useState({});
  const [filterYear,setFilterYear]=useState(now.getFullYear());
  const eBlank={work_order_no:'',work_order_date:today,scheme:'',batch_no:'',deadline:'',period_month:now.getMonth()+1,period_year:now.getFullYear()};
  const cBlank={work_order_no:'',work_order_date:today,scheme:'',batch_no:'',deadline:'',period_month:now.getMonth()+1,period_year:now.getFullYear()};
  const [cForm,setCForm]=useState(cBlank);
  const cf=(k,v)=>setCForm(p=>({...p,[k]:v}));
  const [eForm,setEForm]=useState(eBlank);
  const ef=(k,v)=>setEForm(p=>({...p,[k]:v}));

  const load=useCallback(async()=>{
    setLoading(true);
    const [{data:w},{data:d},{data:fp},{data:dep},{data:wm}]=await Promise.all([
      sb.from('work_orders').select('*, allotments:work_order_allotments(*, depot:depot_id(*))').order('work_order_date',{ascending:false}),
      sb.from('supplyco_dispatches').select('*'),
      sb.from('product_master').select('*').eq('is_raw_material',false).eq('is_active',true).order('product_name'),
      sb.from('depots').select('*').order('name'),
      sb.from('product_master').select('*').eq('is_raw_material',true).eq('has_schemes',true).limit(1),
    ]);
    setWorkOrders(w||[]); setDispatches(d||[]); setFinishedProducts(fp||[]); setDepots(dep||[]);
    const WS=await loadWoaSettings(); setS(WS);
    try{ const base=await loadWoaBase(); const b=woaBoard(base,WS); setBoard(Object.fromEntries(b.map(x=>[x.wo.id,x]))); }catch(e){ console.error('Work order deadline data failed:',e.message); }
    setWheatMaterial((wm&&wm[0])||null); setLoading(false);
  },[]);
  useEffect(()=>{load();},[load]);

  const productForScheme=(scheme)=>finishedProducts.find(p=>p.product_name.toUpperCase().includes(scheme));
  const schemeOptions=(wheatMaterial?.scheme_list?wheatMaterial.scheme_list.split(',').map(s=>s.trim()):['NPS','PHH','AAY']).filter(s=>s.toLowerCase()!=='private');

  const saveCreate=async()=>{
    if(!cForm.work_order_no) return alert('Work order number required.');
    if(S.require_deadline&&!cForm.deadline) return alert('Deadline is required.');
    if(cForm.deadline&&cForm.deadline<cForm.work_order_date) return alert('The deadline cannot be before the work order date.');
    setSaving(true);
    const totalPkts=Object.values(depotAllotments).reduce((s,v)=>s+(Number(v)||0),0);
    const {data,error}=await sb.from('work_orders').insert({...cForm, deadline:cForm.deadline||null, total_pkts:totalPkts}).select().single();
    if(error){alert(error.message);setSaving(false);return;}

    const allotRows=Object.entries(depotAllotments).filter(([,v])=>Number(v)>0).map(([depotId,v])=>({work_order_id:data.id, depot_id:depotId, allotted_pkts:Number(v)}));
    if(allotRows.length){
      const {error:aErr}=await sb.from('work_order_allotments').insert(allotRows);
      if(aErr) alert('Work order saved, but allotments failed: '+aErr.message);
    }

    setCForm(cBlank); setDepotAllotments({}); setShowCreate(false); setSaving(false);
    logActivity('Work Order Tracker','create',`Work order ${cForm.work_order_no} registered`);
    load();
  };

  const setDeadline=async(wo)=>{
    const v=prompt('Deadline for '+wo.work_order_no+' (YYYY-MM-DD). Leave empty to clear:',wo.deadline||'');
    if(v===null) return;
    const dd=v.trim();
    if(dd&&!/^\d{4}-\d{2}-\d{2}$/.test(dd)) return alert('Use the format YYYY-MM-DD, for example 2026-11-30.');
    const {error}=await sb.from('work_orders').update({deadline:dd||null}).eq('id',wo.id);
    if(error) return alert(error.message);
    logActivity('Work Order Tracker','update',`${wo.work_order_no} deadline → ${dd||'cleared'}`);
    load();
  };

  const deleteWorkOrder=async(wo)=>{
  if(!allow('record.delete')) return alert('Your role cannot delete records.');
  const {count,error:ce}=await sb.from('supplyco_dispatches').select('id',{count:'exact',head:true}).eq('work_order_id',wo.id);
  if(ce) return alert('Could not check dispatches: '+ce.message);
  const n=count||0;
  if(n>0) return alert(`Work order ${wo.work_order_no} cannot be deleted.\n\n${n} dispatch entr${n===1?'y is':'ies are'} already recorded against it. Delete those dispatches in Supplyco Dispatch first (or edit them to point at a different work order), then try again.`);
  if(!confirm(`Delete work order ${wo.work_order_no} and its depot allotments? This cannot be undone.`)) return;
  setSaving(true);
  const {error:ae}=await sb.from('work_order_allotments').delete().eq('work_order_id',wo.id);
  if(ae){ alert('Could not delete allotments: '+ae.message); setSaving(false); return; }
  const {error}=await sb.from('work_orders').delete().eq('id',wo.id);
  setSaving(false);
  if(error) return alert('Could not delete: '+error.message);
  logActivity('Work Order Tracker','delete',`Deleted work order ${wo.work_order_no} (${wo.scheme||'—'}, ${fmt(wo.total_pkts)} packets)`);
  load();
};

  const startEdit=(wo)=>{
    setEditingId(wo.id);
    setEAllot(Object.fromEntries((wo.allots||[]).map(a=>[String(a.depot_id),String(a.allotted_pkts)])));
    setEForm({
      work_order_no:wo.work_order_no, work_order_date:wo.work_order_date, scheme:wo.scheme, batch_no:wo.batch_no||'', deadline:wo.deadline||'',
      period_month: wo.period_month||now.getMonth()+1, period_year: wo.period_year||now.getFullYear()
    });
  };

  const saveEdit=async()=>{
    if(S.require_deadline&&!eForm.deadline) return alert('Deadline is required.');
    if(eForm.deadline&&eForm.deadline<eForm.work_order_date) return alert('The deadline cannot be before the work order date.');
    for(const v of Object.values(eAllot)){
      if(v!==''&&(isNaN(Number(v))||Number(v)<0)) return alert('Every allotted quantity must be a number, zero or more.');
    }
    const want={};
    Object.entries(eAllot).forEach(([k,v])=>{ if(Number(v)>0) want[k]=Number(v); });
    const newTotal=Object.values(want).reduce((s,v)=>s+v,0);
    if(newTotal<=0) return alert('Allot at least one packet to a depot.');

    // Warn if a depot's new allotment is lower than what has already been dispatched to it.
    const ppb=productForScheme(eForm.scheme)?.packets_per_bag||1;
    const sentBy={};
    dispatches.filter(d=>d.work_order_id===editingId).forEach(d=>{ sentBy[d.depot_name]=(sentBy[d.depot_name]||0)+Number(d.qty_bags)*ppb; });
    const below=[];
    depots.forEach(d=>{
      const sent=sentBy[d.name]||0, w=want[String(d.id)]||0;
      if(sent>w) below.push(`${d.name}: ${fmt(w)} allotted, but ${fmt(sent)} packets already dispatched`);
    });
    if(below.length&&!confirm('Dispatched quantity is already higher than the new allotment for:\n\n'+below.join('\n')+'\n\nSave anyway?')) return;

    setSaving(true);
    const wo0=workOrders.find(w=>w.id===editingId);
    const oldAllots=(wo0&&wo0.allotments)||[];
    const {error}=await sb.from('work_orders').update({
      work_order_no:eForm.work_order_no, work_order_date:eForm.work_order_date, scheme:eForm.scheme, batch_no:eForm.batch_no, deadline:eForm.deadline||null,
      period_month:Number(eForm.period_month), period_year:Number(eForm.period_year), total_pkts:newTotal
    }).eq('id',editingId);
    if(error){alert(error.message);setSaving(false);return;}

    const errs=[];
    for(const a of oldAllots){
      const k=String(a.depot_id);
      if(want[k]){
        if(Number(a.allotted_pkts)!==want[k]){
          const {error:e}=await sb.from('work_order_allotments').update({allotted_pkts:want[k]}).eq('id',a.id);
          if(e) errs.push(e.message);
        }
      } else {
        const {error:e}=await sb.from('work_order_allotments').delete().eq('id',a.id);
        if(e) errs.push(e.message);
      }
    }
    const have=new Set(oldAllots.map(a=>String(a.depot_id)));
    const toAdd=Object.entries(want).filter(([k])=>!have.has(k)).map(([k,v])=>{
      const dep=depots.find(x=>String(x.id)===k);
      return {work_order_id:editingId,depot_id:dep?dep.id:k,allotted_pkts:v};
    });
    if(toAdd.length){
      const {error:e}=await sb.from('work_order_allotments').insert(toAdd);
      if(e) errs.push(e.message);
    }
    if(errs.length) alert('Work order saved, but some depot allotments could not be updated:\n'+errs.join('\n'));
    logActivity('Work Order Tracker','update',`Edited ${eForm.work_order_no} — total ${fmt(newTotal)} packets across ${Object.keys(want).length} depot${Object.keys(want).length===1?'':'s'}`);
    setEditingId(null); setSaving(false);
    load();
  };

  if(loading) return <Loading/>;

  const filtered=workOrders.filter(wo=>(wo.period_month||new Date(wo.work_order_date).getMonth()+1)===Number(filterMonth) && (wo.period_year||new Date(wo.work_order_date).getFullYear())===Number(filterYear));

  const woBalances=filtered.map(wo=>{
    const prod=productForScheme(wo.scheme);
    const pktsPerBag=prod?.packets_per_bag||1;
    const sentBags=dispatches.filter(d=>d.work_order_id===wo.id).reduce((s,d)=>s+Number(d.qty_bags),0);
    const sentPkts=sentBags*pktsPerBag;
    return{...wo, sentPkts, balance:(wo.total_pkts||0)-sentPkts, allots:wo.allotments||[], pktsPerBag};
  });

  return(<div className="page">
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:24,flexWrap:'wrap',gap:12}}>
      <div className="page-header" style={{marginBottom:0}}>
        <div className="page-label">Supplyco Operations</div>
        <div className="page-title">Work order tracker</div>
      </div>
      <div style={{display:'flex',gap:8}}>
        <select style={{width:130}} value={filterMonth} onChange={e=>setFilterMonth(Number(e.target.value))}>
          {[...Array(12)].map((_,i)=><option key={i+1} value={i+1}>{new Date(2000,i,1).toLocaleString('en-IN',{month:'long'})}</option>)}
        </select>
        <select style={{width:90}} value={filterYear} onChange={e=>setFilterYear(Number(e.target.value))}>{[2024,2025,2026,2027].map(y=><option key={y}>{y}</option>)}</select>
        <button className="btn btn-amber" onClick={()=>{ if(!showCreate&&Number(S.default_deadline_days)>0) setCForm(p=>({...p,deadline:p.deadline||licShift(p.work_order_date||today,Number(S.default_deadline_days))})); setShowCreate(v=>!v); }}>+ Work order</button>
      </div>
    </div>

    {showCreate&&(
      <FormCard title="Register work order" col="var(--amber)" onSave={saveCreate} onCancel={()=>setShowCreate(false)} saving={saving}>
        <div className="form-grid">
          <Field label="Work order no. ★"><input className="form-input" value={cForm.work_order_no} onChange={e=>cf('work_order_no',e.target.value)}/></Field>
          <Field label="Date"><input type="date" className="form-input" value={cForm.work_order_date} onChange={e=>cf('work_order_date',e.target.value)}/></Field>
          <Field label="Scheme"><select className="form-input" value={cForm.scheme} onChange={e=>cf('scheme',e.target.value)}><option value="">-- Select --</option>{schemeOptions.map(s=><option key={s}>{s}</option>)}</select></Field>
          <Field label="Batch no."><input className="form-input" value={cForm.batch_no} onChange={e=>cf('batch_no',e.target.value.toUpperCase())}/></Field>
          <Field label={S.require_deadline?'Dispatch deadline ★':'Dispatch deadline'}><input type="date" className="form-input" min={cForm.work_order_date} value={cForm.deadline} onChange={e=>cf('deadline',e.target.value)}/></Field>
          <Field label="Assigned month">
            <select className="form-input" value={cForm.period_month} onChange={e=>cf('period_month',Number(e.target.value))}>
              {[...Array(12)].map((_,i)=><option key={i+1} value={i+1}>{new Date(2000,i,1).toLocaleString('en-IN',{month:'long'})}</option>)}
            </select>
          </Field>
          <Field label="Assigned year">
            <select className="form-input" value={cForm.period_year} onChange={e=>cf('period_year',Number(e.target.value))}>{[2024,2025,2026,2027].map(y=><option key={y}>{y}</option>)}</select>
          </Field>
        </div>
        <div style={{marginTop:12}}>
          <div className="section-label" style={{marginBottom:8}}>Depot allotments (packets)</div>
          {depots.length===0 ? (
            <div style={{fontSize:12,color:'var(--muted)'}}>No depots configured yet — add them under Settings → Depots first.</div>
          ) : (
            <div className="form-grid">
              {depots.map(d=>(
                <Field key={d.id} label={d.name}>
                  <input type="number" className="form-input" value={depotAllotments[d.id]||''} onChange={e=>setDepotAllotments(p=>({...p,[d.id]:e.target.value}))}/>
                </Field>
              ))}
            </div>
          )}
        </div>
      </FormCard>
    )}

    {woBalances.length===0 && <Empty msg={`No work orders assigned to ${new Date(filterYear,filterMonth-1,1).toLocaleString('en-IN',{month:'long',year:'numeric'})}.`}/>}

    {woBalances.map(wo=>(
      <div key={wo.id} className="card" style={{marginBottom:20,padding:0,overflow:'hidden'}}>
        {editingId===wo.id ? (
          <div style={{padding:18}}>
            <div className="section-label" style={{marginBottom:12}}>Edit work order</div>
            <div className="form-grid">
              <Field label="Work order no."><input className="form-input" value={eForm.work_order_no} onChange={e=>ef('work_order_no',e.target.value)}/></Field>
              <Field label="Date"><input type="date" className="form-input" value={eForm.work_order_date} onChange={e=>ef('work_order_date',e.target.value)}/></Field>
              <Field label="Scheme"><input className="form-input" value={eForm.scheme} onChange={e=>ef('scheme',e.target.value)}/></Field>
              <Field label="Batch no."><input className="form-input" value={eForm.batch_no} onChange={e=>ef('batch_no',e.target.value)}/></Field>
              <Field label={S.require_deadline?'Dispatch deadline ★':'Dispatch deadline'}><input type="date" className="form-input" min={eForm.work_order_date} value={eForm.deadline} onChange={e=>ef('deadline',e.target.value)}/></Field>
              <Field label="Assigned month">
                <select className="form-input" value={eForm.period_month} onChange={e=>ef('period_month',e.target.value)}>
                  {[...Array(12)].map((_,i)=><option key={i+1} value={i+1}>{new Date(2000,i,1).toLocaleString('en-IN',{month:'long'})}</option>)}
                </select>
              </Field>
              <Field label="Assigned year">
                <select className="form-input" value={eForm.period_year} onChange={e=>ef('period_year',e.target.value)}>{[2024,2025,2026,2027].map(y=><option key={y}>{y}</option>)}</select>
              </Field>
            </div>
            {(()=>{
              const ppb=productForScheme(eForm.scheme)?.packets_per_bag||1;
              const sentBy={};
              dispatches.filter(d=>d.work_order_id===editingId).forEach(d=>{ sentBy[d.depot_name]=(sentBy[d.depot_name]||0)+Number(d.qty_bags)*ppb; });
              const known=new Set(depots.map(d=>String(d.id)));
              const orphans=Object.keys(eAllot).filter(k=>!known.has(k));
              const total=Object.values(eAllot).reduce((s,v)=>s+(Number(v)||0),0);
              return(<div style={{marginTop:14}}>
                <div className="section-label" style={{marginBottom:8}}>Depot allotments (packets)</div>
                {depots.length===0&&<div style={{fontSize:12,color:'var(--muted)'}}>No depots configured yet — add them under Settings → Depots first.</div>}
                <div className="form-grid">
                  {depots.map(d=>(
                    <Field key={d.id} label={`${d.name}${sentBy[d.name]?` · dispatched ${fmt(sentBy[d.name])}`:''}`}>
                      <input type="number" min="0" className="form-input" value={eAllot[String(d.id)]??''} onChange={e=>setEAllot(p=>({...p,[String(d.id)]:e.target.value}))}/>
                    </Field>
                  ))}
                  {orphans.map(k=>(
                    <Field key={k} label="(removed depot)">
                      <input type="number" min="0" className="form-input" value={eAllot[k]??''} onChange={e=>setEAllot(p=>({...p,[k]:e.target.value}))}/>
                    </Field>
                  ))}
                </div>
                <div style={{marginTop:8,fontSize:12,color:'var(--blue)'}}>
                  Total allotted: <strong>{fmt(total)}</strong> packets ({fmt(Math.ceil(total/ppb))} bags). Leave a depot empty or 0 to remove it from this work order.
                </div>
              </div>);
            })()}
            <div className="form-actions">
              <button className="btn btn-green" onClick={saveEdit} disabled={saving}>{saving?'Saving…':'Save'}</button>
              <button className="btn btn-ghost" onClick={()=>setEditingId(null)}>Cancel</button>
            </div>
          </div>
        ):(<>
          <div style={{padding:'14px 18px',borderBottom:'1px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:8}}>
            <div>
              <strong className="mono" style={{fontSize:14}}>{wo.work_order_no}</strong>
              <span className="badge badge-blue" style={{marginLeft:8}}>{wo.scheme}</span>
              <span className="dim" style={{marginLeft:8,fontSize:12}}>{wo.work_order_date}</span>
              <button className="btn btn-ghost btn-sm" style={{marginLeft:10}} onClick={()=>startEdit(wo)}>Edit</button>
{allow('record.delete')&&<button className="btn btn-red btn-sm" style={{marginLeft:6}} onClick={()=>deleteWorkOrder(wo)} disabled={saving}>Delete</button>}
              {(()=>{
                const bi=board[wo.id];
                const col=bi&&bi.daysLeft!==null&&bi.daysLeft<0?'var(--red)':bi?LIFT_STAGE_COL[bi.stage]:'var(--muted)';
                return(<>
                  {bi&&bi.complete?<span className="badge badge-green" style={{marginLeft:8}}>Complete</span>
                    :wo.deadline&&bi?<span className="badge" style={{marginLeft:8,background:`color-mix(in srgb, ${col} 18%, transparent)`,color:col}}>⏰ {wo.deadline} · {licDaysText(bi.daysLeft)}</span>
                    :<span className="dim" style={{marginLeft:8,fontSize:12}}>{wo.deadline?`⏰ ${wo.deadline}`:'No deadline'}</span>}
                  <button className="btn btn-ghost btn-sm" style={{marginLeft:6}} onClick={()=>setDeadline(wo)}>✎ deadline</button>
                  {bi&&!bi.complete&&wo.deadline&&(<div style={{fontSize:12,marginTop:6,color:'var(--muted)'}}>
                    Needs about {fmt(Math.ceil(bi.bagsPerDay))} bags/day{bi.trucksPerDay?` · ${bi.trucksPerDay} truck${bi.trucksPerDay===1?'':'s'}/day`:''} over {bi.workDays} working day{bi.workDays===1?'':'s'}.
                    {' '}Stock: {fmt(bi.stockBags)} of {fmt(Math.ceil(bi.balBags))} pending bags{bi.shortBags>0?<strong style={{color:'var(--red)'}}> — {fmt(Math.ceil(bi.shortBags))} still to produce</strong>:' ✓ covered'}
                    {bi.atRisk&&<strong style={{color:'var(--red)'}}> · ⚠ above daily dispatch capacity</strong>}
                  </div>)}
                </>);
              })()}
            </div>
            <div style={{display:'flex',gap:16,fontFamily:'var(--mono)',fontSize:13}}>
              <span>Allotted: <strong>{fmt(wo.total_pkts)} pkts</strong></span>
              <span style={{color:'var(--green)'}}>Dispatched: <strong>{fmt(wo.sentPkts)} pkts</strong></span>
              <span style={{color:wo.balance>0?'var(--red)':'var(--green)'}}>Balance: <strong>{fmt(wo.balance)} pkts</strong></span>
            </div>
          </div>
          <table>
            <thead><tr><th>#</th><th>Depot</th><th>Allotted</th><th>Dispatched</th><th>Pending</th></tr></thead>
            <tbody>
              {wo.allots.map((a,i)=>{
                const depotName=a.depot?.name||'—';
                const dispatched=dispatches.filter(d=>d.work_order_id===wo.id && d.depot_name===depotName).reduce((s,d)=>s+Number(d.qty_bags),0)*wo.pktsPerBag;
                const pending=Number(a.allotted_pkts)-dispatched;
                return(<tr key={a.id}>
                  <td className="dim">{i+1}</td>
                  <td>{depotName}</td>
                  <td className="mono">{fmt(a.allotted_pkts)}</td>
                  <td className="mono" style={{color:'var(--green)'}}>{fmt(dispatched)}</td>
                  <td className="mono" style={{color:pending>0?'var(--red)':'var(--green)',fontWeight:600}}>{fmt(pending)}</td>
                </tr>);
              })}
              {wo.allots.length===0&&<tr><td colSpan={5}><Empty msg="No depot allotments for this work order."/></td></tr>}
            </tbody>
          </table>
        </>)}
      </div>
    ))}
  </div>);
}
