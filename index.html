// DAILY CASH BOOK
// ══════════════════════════════════════════════════════════
const cashR2=(n)=>Math.round((Number(n)||0)*100)/100;
const cashAddDays=(dateStr,n)=>{
  const [y,m,d]=dateStr.split('-').map(Number);
  const dt=new Date(y,m-1,d);
  dt.setDate(dt.getDate()+n);
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
};
const cashDayLabel=(dateStr)=>{
  const [y,m,d]=dateStr.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString('en-IN',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
};

async function cashSetting(key){
  const {data}=await sb.from('erp_settings').select('value').eq('key',key).maybeSingle();
  return data?data.value:null;
}
async function cashBaseOpening(){
  const v=await cashSetting('cashbook_opening_balance');
  const n=Number(v);
  return isNaN(n)?0:n;
}
async function cashAllDays(){
  let all=[],from=0;
  for(;;){
    const {data,error}=await sb.from('cash_book_days').select('*').order('date').range(from,from+999);
    if(error) return {error:error.message,data:[]};
    all=all.concat(data||[]);
    if(!data||data.length<1000) break;
    from+=1000;
  }
  return {data:all};
}

// Recalculate one day from its entries, then walk forward through every later day ONE BY ONE,
// rewriting each day's stored opening and closing. Returns an error message, or null if all went well.
async function cashRecalcFrom(date){
  const {data:ents,error:e0}=await sb.from('daily_ledger').select('direction,amount').eq('date',date);
  if(e0) return e0.message;
  let tin=0,tout=0;
  (ents||[]).forEach(e=>{ if(e.direction==='in') tin+=Number(e.amount); else tout+=Number(e.amount); });
  const {data:prev,error:e1}=await sb.from('cash_book_days').select('closing_balance').lt('date',date).order('date',{ascending:false}).limit(1).maybeSingle();
  if(e1) return e1.message;
  let running=prev?Number(prev.closing_balance):await cashBaseOpening();

  if((ents||[]).length===0){
    const {error}=await sb.from('cash_book_days').delete().eq('date',date);
    if(error) return error.message;
  } else {
    const closing=cashR2(running+tin-tout);
    const {error}=await sb.from('cash_book_days').upsert({date,opening_balance:running,total_in:cashR2(tin),total_out:cashR2(tout),closing_balance:closing,updated_at:new Date().toISOString()},{onConflict:'date'});
    if(error) return error.message;
    running=closing;
  }

  let cursor=date;
  for(;;){
    const {data:next,error:e2}=await sb.from('cash_book_days').select('*').gt('date',cursor).order('date').limit(1).maybeSingle();
    if(e2) return e2.message;
    if(!next) break;
    const closing=cashR2(running+Number(next.total_in)-Number(next.total_out));
    const {error:e3}=await sb.from('cash_book_days').update({opening_balance:running,closing_balance:closing,updated_at:new Date().toISOString()}).eq('date',next.date);
    if(e3) return e3.message;
    running=closing;
    cursor=next.date;
  }
  return null;
}

// Rebuild the whole chain from scratch out of daily_ledger. Used the first time, and when the opening balance changes.
async function cashRebuildAll(){
  const base=await cashBaseOpening();
  let all=[],from=0;
  for(;;){
    const {data,error}=await sb.from('daily_ledger').select('date,direction,amount').order('date').order('id').range(from,from+999);
    if(error) return error.message;
    all=all.concat(data||[]);
    if(!data||data.length<1000) break;
    from+=1000;
  }
  const by={};
  all.forEach(e=>{
    const o=by[e.date]=by[e.date]||{in:0,out:0};
    if(e.direction==='in') o.in+=Number(e.amount); else o.out+=Number(e.amount);
  });
  const existing=await cashAllDays();
  for(const d of existing.data){
    if(!by[d.date]) await sb.from('cash_book_days').delete().eq('date',d.date);
  }
  let running=base;
  for(const date of Object.keys(by).sort()){
    const o=by[date];
    const closing=cashR2(running+o.in-o.out);
    const {error}=await sb.from('cash_book_days').upsert({date,opening_balance:running,total_in:cashR2(o.in),total_out:cashR2(o.out),closing_balance:closing,updated_at:new Date().toISOString()},{onConflict:'date'});
    if(error) return error.message;
    running=closing;
  }
  return null;
}

function Ledger({role,userEmail}){
  const isDirector=role==='director';
  const SEALED='var(--purple)';
  const [txnTypes,setTxnTypes]=useState([]);
  const [recentTypes,setRecentTypes]=useState({in:[],out:[]});
  const typeNames=(side)=>txnTypes.filter(t=>t.direction===side).map(t=>t.name);
  // Last 5 used types first, then the rest A–Z. Keeps an old entry's own type visible when editing it.
  const typeOptions=(side,current)=>{
    const all=typeNames(side);
    const recent=(recentTypes[side]||[]).filter(n=>all.includes(n)).slice(0,5);
    const rest=all.filter(n=>!recent.includes(n)).sort((a,b)=>a.localeCompare(b));
    const extra=current&&!all.includes(current)?[current]:[];
    return {recent,rest:[...extra,...rest]};
  };
  const [entries,setEntries]=useState([]);
  const [days,setDays]=useState([]);
  const [baseOpen,setBaseOpen]=useState(0);
  const [freezeDate,setFreezeDate]=useState('');
  const [selDate,setSelDate]=useState(today);
  const [showForm,setShowForm]=useState(false);
  const [formSide,setFormSide]=useState('in');
  const [editingId,setEditingId]=useState(null);
  const [saving,setSaving]=useState(false);
  const [loading,setLoading]=useState(true);
  const blank={date:today,txn_type:'Sales Receipt',amount:'',party_name:'',description:'',payment_mode:'Cash',reference_no:''};
  const [form,setForm]=useState(blank);
  const f=(k,v)=>setForm(p=>({...p,[k]:v}));
  const isFrozenDate=(d)=>!!freezeDate&&d<=freezeDate;

  // Returns a reason string if the date cannot be changed, or '' if it can.
  const lockReason=(d)=>{
    if(isFrozenDate(d)) return `${d} is on or before the freeze date (${freezeDate}) and cannot be changed.`;
    const own=days.find(x=>x.date===d);
    if(own&&own.submitted) return `${d} has been submitted and is locked. Only a Director can reopen it.`;
    const later=days.find(x=>x.date>d&&x.submitted);
    if(later) return `${later.date} has already been submitted, so ${d} cannot be changed. A Director must reopen ${later.date} first.`;
    return '';
  };

  const load=useCallback(async(d)=>{
    const [{data:e},dd,fr,base,{data:tt},{data:rc}]=await Promise.all([
      sb.from('daily_ledger').select('*').eq('date',d).order('created_at'),
      cashAllDays(),
      cashSetting('cashbook_freeze_date'),
      cashBaseOpening(),
      sb.from('cash_txn_types').select('*').order('name'),
      sb.from('daily_ledger').select('txn_type,direction').order('created_at',{ascending:false}).limit(300),
    ]);
    let daysData=dd.data;
    if(daysData.length===0){
      const {count}=await sb.from('daily_ledger').select('id',{count:'exact',head:true});
      if((count||0)>0){
        await cashRebuildAll();
        daysData=(await cashAllDays()).data;
      }
    }
    const rec={in:[],out:[]};
    (rc||[]).forEach(r=>{ const s=r.direction==='in'?'in':'out'; if(rec[s].length<5&&!rec[s].includes(r.txn_type)) rec[s].push(r.txn_type); });
    setTxnTypes(tt||[]); setRecentTypes(rec);
    setEntries(e||[]); setDays(daysData); setFreezeDate(fr||''); setBaseOpen(base); setLoading(false);
  },[]);
  useEffect(()=>{load(selDate);},[selDate,load]);

  const addNewType=async()=>{
    const name=(prompt(`New ${formSide==='in'?'receipt':'payment'} type name:`)||'').trim();
    if(!name) return;
    if(typeNames(formSide).some(n=>n.toLowerCase()===name.toLowerCase())) return alert('That type already exists.');
    const {data,error}=await sb.from('cash_txn_types').insert({name,direction:formSide}).select().single();
    if(error) return alert(error.message);
    setTxnTypes(p=>[...p,data]);
    f('txn_type',data.name);
    logActivity('Ledger','create',`New cash book type — ${name} (${formSide==='in'?'receipt':'payment'})`);
  };

  const startAdd=(side)=>{
    setEditingId(null); setFormSide(side);
    setForm({...blank,date:selDate,txn_type:typeOptions(side,'').recent[0]||typeOptions(side,'').rest[0]||''});
    setShowForm(true);
  };
  const startEdit=(e)=>{
    setEditingId(e.id); setFormSide(e.direction==='in'?'in':'out');
    setForm({date:e.date,txn_type:e.txn_type,amount:e.amount,party_name:e.party_name||'',description:e.description||'',payment_mode:e.payment_mode||'Cash',reference_no:e.reference_no||''});
    setShowForm(true);
  };
  const closeForm=()=>{ setForm(blank); setEditingId(null); setShowForm(false); };

  const save=async()=>{
    if(!form.amount||Number(form.amount)<=0) return alert('Enter amount.');
    if(!form.txn_type) return alert('Select a transaction type.');
    const m1=lockReason(form.date);
    if(m1) return alert(m1);
    const orig=editingId?entries.find(x=>x.id===editingId):null;
    if(orig){ const m2=lockReason(orig.date); if(m2) return alert(m2); }
    setSaving(true);
    const isIn=formSide==='in';
    const row={...form,amount:Number(form.amount),direction:isIn?'in':'out'};
    if(editingId){
      const {error}=await sb.from('daily_ledger').update(row).eq('id',editingId);
      if(error){alert(error.message);setSaving(false);return;}
    } else {
      const {error}=await sb.from('daily_ledger').insert(row);
      if(error){alert(error.message);setSaving(false);return;}
    }
    // Recalculate the affected day(s), earliest first; each one then cascades forward.
    const dates=Array.from(new Set([form.date,orig?orig.date:form.date])).sort();
    for(const d of dates){
      const err=await cashRecalcFrom(d);
      if(err){ alert('Entry saved, but balances could not be fully updated: '+err+'. Use "Rebuild balances" in Cash Book Settings.'); break; }
    }
    logActivity('Ledger',editingId?'update':'create',`${form.txn_type} — ₹${form.amount} on ${form.date}${editingId?' (edited; later days recalculated)':''}`);
    const target=form.date;
    closeForm(); setSaving(false);
    if(target!==selDate) setSelDate(target); else await load(selDate);
  };

  const del=async(e)=>{
    const m=lockReason(e.date);
    if(m) return alert(m);
    if(!confirm('Delete this entry? Later days will be recalculated.')) return;
    setSaving(true);
    const {error}=await sb.from('daily_ledger').delete().eq('id',e.id);
    if(error){alert(error.message);setSaving(false);return;}
    const err=await cashRecalcFrom(e.date);
    if(err) alert('Entry deleted, but balances could not be fully updated: '+err+'. Use "Rebuild balances" in Cash Book Settings.');
    logActivity('Ledger','delete',`${e.txn_type} — ₹${e.amount} on ${e.date} deleted; later days recalculated`);
    setSaving(false);
    await load(selDate);
  };

  const submitDay=async()=>{
    if(entries.length===0) return alert('Nothing to submit — this day has no entries.');
    if(outOfSync) return alert('Balances for this day are out of sync. Rebuild them in Cash Book Settings before submitting.');
    const m=lockReason(selDate);
    if(m) return alert(m);
    if(!confirm(`Submit the cash book for ${selDate}?\n\nClosing balance: ₹${fmt(closing,2)}\n\nAfter submitting, nothing on this day can be changed unless a Director reopens it.`)) return;
    setSaving(true);
    const {error}=await sb.from('cash_book_days').update({submitted:true,submitted_by:userEmail||null,submitted_at:new Date().toISOString()}).eq('date',selDate);
    if(error){alert(error.message);setSaving(false);return;}
    logActivity('Ledger','update',`Cash book for ${selDate} submitted and locked (closing ₹${fmt(closing,2)})`);
    setSaving(false);
    await load(selDate);
  };

  const reopenDay=async()=>{
    if(!isDirector) return alert('Only a Director can reopen a submitted day.');
    if(isFrozenDate(selDate)) return alert(`${selDate} is on or before the freeze date (${freezeDate}). Clear the freeze date in Cash Book Settings first.`);
    if(!confirm(`Reopen the cash book for ${selDate}? Entries on this day can be changed again until it is re-submitted.`)) return;
    setSaving(true);
    const {error}=await sb.from('cash_book_days').update({submitted:false,submitted_by:null,submitted_at:null}).eq('date',selDate);
    if(error){alert(error.message);setSaving(false);return;}
    logActivity('Ledger','update',`Cash book for ${selDate} reopened by ${userEmail||'Director'}`);
    setSaving(false);
    await load(selDate);
  };

  if(loading) return <Loading/>;

  const frozen=isFrozenDate(selDate);
  const dayRow=days.find(d=>d.date===selDate);
  const submitted=!!(dayRow&&dayRow.submitted);
  const lockMsg=lockReason(selDate);
  const canWrite=allow('ledger.write');
  const locked=!!lockMsg||!canWrite;
  const prior=days.filter(d=>d.date<selDate).pop();
  const opening=dayRow?Number(dayRow.opening_balance):(prior?Number(prior.closing_balance):baseOpen);
  const inEntries=entries.filter(e=>e.direction==='in');
  const outEntries=entries.filter(e=>e.direction!=='in');
  const sumIn=inEntries.reduce((s,e)=>s+Number(e.amount),0);
  const sumOut=outEntries.reduce((s,e)=>s+Number(e.amount),0);
  const closing=dayRow?Number(dayRow.closing_balance):opening;
  const outOfSync=entries.length>0&&(!dayRow||Math.abs(cashR2(opening+sumIn-sumOut)-closing)>0.005);

  const oPos=Math.max(opening,0), oNeg=Math.max(-opening,0);
  const cPos=Math.max(closing,0), cNeg=Math.max(-closing,0);
  const leftTotal=oPos+sumIn+cNeg;
  const rightTotal=sumOut+oNeg+cPos;

  // Submitted days use a purple "sealed" theme so they stand out from open days.
  const cIn=submitted?SEALED:'var(--green)';
  const cOut=submitted?SEALED:'var(--red)';
  const tint=submitted?{background:'color-mix(in srgb, var(--purple) 6%, var(--surface))',borderColor:'color-mix(in srgb, var(--purple) 40%, var(--border))'}:undefined;

  const renderEntry=(e)=>(<tr key={e.id}>
    <td>
      <strong>{e.txn_type}</strong>
      <div className="dim" style={{fontSize:11}}>{[e.party_name,e.description,e.reference_no?('Ref '+e.reference_no):'',e.payment_mode].filter(Boolean).join(' · ')}</div>
    </td>
    <td className="mono" style={{textAlign:'right',fontWeight:600}}>{fmt(e.amount,2)}</td>
    <td style={{whiteSpace:'nowrap'}}>{!locked&&(<>
      <button className="btn btn-blue btn-sm" onClick={()=>startEdit(e)} disabled={saving}>✎</button>{' '}
      <button className="btn btn-red btn-sm" onClick={()=>del(e)} disabled={saving}>✕</button>
    </>)}</td>
  </tr>);
  const addRow=(side)=>locked?null:(<tr key={'add-'+side}>
    <td colSpan={3}>
      <button className={`btn btn-sm ${side==='in'?'btn-green':'btn-red'}`} style={{width:'100%'}} onClick={()=>startAdd(side)} disabled={saving}>{side==='in'?'+ Add receipt':'+ Add payment'}</button>
    </td>
  </tr>);
  const balRow=(label,amt)=>(<tr key={label} style={{background:submitted?'color-mix(in srgb, var(--purple) 12%, transparent)':'var(--surface2)'}}>
    <td><em>{label}</em></td>
    <td className="mono" style={{textAlign:'right'}}>{fmt(amt,2)}</td>
    <td></td>
  </tr>);
  const totalRow=(amt)=>(<tr style={{borderTop:`2px solid ${submitted?SEALED:'var(--text)'}`}}>
    <td><strong>TOTAL</strong></td>
    <td className="mono" style={{textAlign:'right',fontWeight:700}}>{fmt(amt,2)}</td>
    <td></td>
  </tr>);

  return(<div className="page">
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:24,flexWrap:'wrap',gap:12}}>
      <div className="page-header" style={{marginBottom:0}}>
        <div className="page-label" style={submitted?{color:SEALED}:undefined}>Finance</div>
        <div className="page-title" style={submitted?{color:SEALED}:undefined}>Daily cash book</div>
        <div style={{fontSize:13,color:'var(--muted)',marginTop:2}}>{cashDayLabel(selDate)}</div>
      </div>
      {submitted
        ?<span className="badge" style={{background:'color-mix(in srgb, var(--purple) 18%, transparent)',color:SEALED}}>🔒 Submitted</span>
        :frozen
          ?<span className="badge badge-muted">🔒 Frozen</span>
          :<span className="badge badge-amber">Open</span>}
    </div>

    <div className="card" style={{marginBottom:16,display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
      <button className="btn btn-ghost btn-sm" onClick={()=>setSelDate(cashAddDays(selDate,-1))}>◀ Previous day</button>
      <input type="date" value={selDate} max={today} style={{width:160}} onChange={e=>{ if(e.target.value) setSelDate(e.target.value); }}/>
      <button className="btn btn-ghost btn-sm" disabled={selDate>=today} onClick={()=>setSelDate(cashAddDays(selDate,1))}>Next day ▶</button>
      <button className="btn btn-ghost btn-sm" disabled={selDate===today} onClick={()=>setSelDate(today)}>Today</button>
    </div>

    {submitted&&(
      <div className="alert" style={{background:'color-mix(in srgb, var(--purple) 10%, transparent)',border:'1px solid color-mix(in srgb, var(--purple) 30%, transparent)',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap'}}>
        <div style={{display:'flex',gap:10,alignItems:'flex-start'}}>
          <span style={{fontSize:15}}>🔒</span>
          <div>
            <div className="alert-title" style={{color:SEALED}}>Day submitted — locked</div>
            <div className="alert-sub">Submitted by {dayRow.submitted_by||'—'}{dayRow.submitted_at?` on ${new Date(dayRow.submitted_at).toLocaleString('en-IN')}`:''}. No changes can be made{isDirector?'':'; only a Director can reopen it'}{frozen?'. This date is also behind the freeze date':''}.</div>
          </div>
        </div>
        {isDirector&&!frozen&&<button className="btn btn-sm" style={{background:'color-mix(in srgb, var(--purple) 15%, transparent)',color:SEALED,borderColor:'color-mix(in srgb, var(--purple) 30%, transparent)'}} onClick={reopenDay} disabled={saving}>Reopen day (Director)</button>}
      </div>
    )}
    {lockMsg&&!submitted&&<Alert type="amber" icon="🔒" title="This day is locked" sub={lockMsg}/>}
    {!canWrite&&<Alert type="amber" icon="👁" title="View only" sub="Your role can view the cash book but not change it."/>}
    {outOfSync&&<Alert type="red" icon="⚠" title="Balances for this day are out of sync" sub="Open Settings → Cash Book Settings and click “Rebuild balances”."/>}

    <div className="stat-grid" style={{gridTemplateColumns:'repeat(auto-fit,minmax(130px,1fr))'}}>
      <StatCard label="Opening balance" value={'₹'+fmt(opening,2)} col={submitted?SEALED:'var(--blue)'}/>
      <StatCard label="Receipts" value={'₹'+fmt(sumIn,2)} col={cIn}/>
      <StatCard label="Payments" value={'₹'+fmt(sumOut,2)} col={cOut}/>
      <StatCard label="Closing balance" value={'₹'+fmt(closing,2)} col={submitted?SEALED:(closing>=0?'var(--amber)':'var(--red)')}/>
    </div>

    {showForm&&(
      <div className="modal-overlay">
        <div style={{maxWidth:640,width:'100%',maxHeight:'92vh',overflowY:'auto'}}>
          <FormCard title={editingId?(formSide==='in'?'Edit receipt':'Edit payment'):(formSide==='in'?'New receipt':'New payment')} col={formSide==='in'?'var(--green)':'var(--red)'} onSave={save} onCancel={closeForm} saving={saving}>
            <div className="form-grid">
              <Field label="Date"><input type="date" className="form-input" value={form.date} max={today} onChange={e=>f('date',e.target.value)}/></Field>
              <Field label="Transaction type">
                {(()=>{const o=typeOptions(formSide,form.txn_type); return(
                <select className="form-input" value={form.txn_type} onChange={e=>{ if(e.target.value==='__new__') addNewType(); else f('txn_type',e.target.value); }}>
                  {o.recent.length>0&&<optgroup label="Recently used">{o.recent.map(t=><option key={'r-'+t} value={t}>{t}</option>)}</optgroup>}
                  {o.rest.length>0&&<optgroup label={o.recent.length>0?'Other types':'All types'}>{o.rest.map(t=><option key={t} value={t}>{t}</option>)}</optgroup>}
                  <option value="__new__">+ Add new type…</option>
                </select>);})()}
              </Field>
              <Field label="Amount (₹) ★"><input type="number" className="form-input" style={{fontWeight:600}} value={form.amount} onChange={e=>f('amount',e.target.value)}/></Field>
              <Field label="Party name"><input className="form-input" value={form.party_name} onChange={e=>f('party_name',e.target.value)}/></Field>
              <Field label="Description"><input className="form-input" value={form.description} onChange={e=>f('description',e.target.value)}/></Field>
              <Field label="Payment mode">
                <select className="form-input" value={form.payment_mode} onChange={e=>f('payment_mode',e.target.value)}>
                  <option>Cash</option><option>Bank Transfer</option><option>Cheque</option><option>UPI</option><option>Other</option>
                </select>
              </Field>
              <Field label="Reference no."><input className="form-input" value={form.reference_no} onChange={e=>f('reference_no',e.target.value)}/></Field>
            </div>
          </FormCard>
        </div>
      </div>
    )}

    <div className="two-col" style={{alignItems:'start'}}>
      <div className="table-wrap" style={tint}>
        <table>
          <thead>
            <tr><th colSpan={3} style={{color:cIn}}>Receipts (Dr)</th></tr>
            <tr><th>Particulars</th><th style={{textAlign:'right'}}>Amount ₹</th><th></th></tr>
          </thead>
          <tbody>
            {oNeg===0&&balRow('To Opening Balance b/d',oPos)}
            {inEntries.map(renderEntry)}
            {addRow('in')}
            {cNeg>0&&balRow('To Closing Deficit c/d',cNeg)}
            {totalRow(leftTotal)}
          </tbody>
        </table>
      </div>
      <div className="table-wrap" style={tint}>
        <table>
          <thead>
            <tr><th colSpan={3} style={{color:cOut}}>Payments (Cr)</th></tr>
            <tr><th>Particulars</th><th style={{textAlign:'right'}}>Amount ₹</th><th></th></tr>
          </thead>
          <tbody>
            {oNeg>0&&balRow('By Opening Deficit b/d',oNeg)}
            {outEntries.map(renderEntry)}
            {addRow('out')}
            {cNeg===0&&balRow('By Closing Balance c/d',cPos)}
            {totalRow(rightTotal)}
          </tbody>
        </table>
      </div>
    </div>
    {entries.length===0&&<div style={{marginTop:12,fontSize:12,color:'var(--muted)'}}>No entries on this day. The balance simply carries forward.</div>}

    {!locked&&(
      <div className="card" style={{marginTop:20,display:'flex',justifyContent:'space-between',alignItems:'center',gap:12,flexWrap:'wrap',borderLeft:'3px solid var(--amber)'}}>
        <div style={{fontSize:13,color:'var(--muted)',maxWidth:560}}>
          When all entries for this day are made, submit it. A submitted day cannot be changed — only a Director can reopen it.
        </div>
        <button className="btn btn-amber" onClick={submitDay} disabled={saving||entries.length===0}>Submit day</button>
      </div>
    )}
  </div>);
}

function CashBookSettings(){
  const [opening,setOpening]=useState('');
  const [freezeDate,setFreezeDate]=useState('');
  const [loading,setLoading]=useState(true);
  const [busy,setBusy]=useState(false);
    const [msg,setMsg]=useState('');
  const [types,setTypes]=useState([]);
  const loadTypes=async()=>{
    const {data}=await sb.from('cash_txn_types').select('*').order('name');
    setTypes(data||[]);
  };
  const delType=async(t)=>{
    if(!confirm(`Delete the ${t.direction==='in'?'receipt':'payment'} type "${t.name}"?\n\nExisting entries keep this label; it just won't be offered for new entries.`)) return;
    const {error}=await sb.from('cash_txn_types').delete().eq('id',t.id);
    if(error) return alert(error.message);
    logActivity('Settings','delete',`Cash book type deleted — ${t.name} (${t.direction==='in'?'receipt':'payment'})`);
    loadTypes();
  };

  useEffect(()=>{
    (async()=>{
      const [o,fz]=await Promise.all([cashSetting('cashbook_opening_balance'),cashSetting('cashbook_freeze_date')]);
      setOpening(o??''); setFreezeDate(fz||''); await loadTypes(); setLoading(false);
    })();
  },[]);

  const saveSetting=async(key,value)=>{
    const {error}=await sb.from('erp_settings').upsert({key,value:String(value)},{onConflict:'key'});
    return error?error.message:null;
  };
  const flash=(t)=>{ setMsg(t); setTimeout(()=>setMsg(''),3000); };

  const saveOpening=async()=>{
        if(freezeDate) return alert('Clear the freeze date first — changing the opening balance recalculates every day.');
    const {count:subN}=await sb.from('cash_book_days').select('date',{count:'exact',head:true}).eq('submitted',true);
    if((subN||0)>0) return alert('Some days are submitted. A Director must reopen them before the opening balance can be changed.');
    const n=Number(opening);
    if(opening===''||isNaN(n)) return alert('Enter a valid opening balance.');
    setBusy(true);
    const err=await saveSetting('cashbook_opening_balance',n);
    if(err){ alert(err); setBusy(false); return; }
    const rerr=await cashRebuildAll();
    if(rerr) alert('Saved, but rebuilding balances failed: '+rerr);
    logActivity('Settings','update',`Cash book opening balance set to ₹${n}; balances rebuilt`);
    setBusy(false); flash('Saved and all days recalculated.');
  };

  const saveFreeze=async(value)=>{
    setBusy(true);
    const err=await saveSetting('cashbook_freeze_date',value);
    if(err){ alert(err); setBusy(false); return; }
    setFreezeDate(value);
    logActivity('Settings','update',value?`Cash book frozen up to ${value}`:'Cash book freeze cleared');
    setBusy(false); flash('Saved.');
  };

  const rebuild=async()=>{
    if(freezeDate) return alert('Clear the freeze date first — a rebuild recalculates every day.');
    if(!confirm('Recalculate every day of the cash book from its entries?')) return;
    setBusy(true);
    const err=await cashRebuildAll();
    if(err) alert('Rebuild failed: '+err);
    else logActivity('Settings','update','Cash book balances rebuilt');
    setBusy(false); if(!err) flash('Balances rebuilt.');
  };

  if(loading) return <Loading/>;

  return(<div className="page">
    <div className="page-header">
      <div className="page-label">System Settings</div>
      <div className="page-title">Cash book settings</div>
    </div>

    <div className="card" style={{maxWidth:500}}>
      <div className="section-label" style={{marginBottom:12}}>Opening balance</div>
      <div style={{fontSize:13,color:'var(--muted)',marginBottom:12}}>
        Cash in hand before the very first cash book entry. Saving this recalculates every day.
      </div>
      <div style={{display:'flex',gap:10,alignItems:'flex-end',flexWrap:'wrap'}}>
        <Field label="Opening balance (₹)">
          <input type="number" className="form-input" style={{width:180}} value={opening} onChange={e=>setOpening(e.target.value)}/>
        </Field>
        <button className="btn btn-amber" onClick={saveOpening} disabled={busy}>Save</button>
      </div>
    </div>

    <div className="card" style={{maxWidth:500,marginTop:20,borderLeft:'3px solid var(--blue)'}}>
      <div className="section-label" style={{marginBottom:12}}>Freeze past records</div>
      <div style={{fontSize:13,color:'var(--muted)',marginBottom:12}}>
        Cash book entries on or before this date can no longer be added, edited or deleted. Set this once your books for a period are finalized (e.g. 31 March each year).
      </div>
      <div style={{display:'flex',gap:10,alignItems:'flex-end',flexWrap:'wrap'}}>
        <Field label="Freeze up to and including">
          <input type="date" className="form-input" style={{width:180}} value={freezeDate} max={today} onChange={e=>setFreezeDate(e.target.value)}/>
        </Field>
        <button className="btn btn-blue" onClick={()=>saveFreeze(freezeDate)} disabled={busy}>Save</button>
        {freezeDate&&<button className="btn btn-ghost" onClick={()=>saveFreeze('')} disabled={busy}>Clear</button>}
      </div>
      {freezeDate&&<div style={{marginTop:10,fontSize:12,color:'var(--blue)'}}>Currently frozen: all days on or before {freezeDate}.</div>}
    </div>

    <div className="card" style={{maxWidth:500,marginTop:20}}>
      <div className="section-label" style={{marginBottom:12}}>Rebuild balances</div>
      <div style={{fontSize:13,color:'var(--muted)',marginBottom:12}}>
        Recalculates every day's opening and closing balance from the entries. Only needed if a day ever shows “out of sync”.
      </div>
      <button className="btn btn-ghost" onClick={rebuild} disabled={busy}>{busy?'Working…':'Rebuild balances'}</button>
    </div>

        <div className="card" style={{maxWidth:500,marginTop:20}}>
      <div className="section-label" style={{marginBottom:12}}>Transaction types</div>
      <div style={{fontSize:13,color:'var(--muted)',marginBottom:12}}>
        New types are added from the cash book itself (choose “+ Add new type…” in the list). Delete the ones you no longer want here. Existing entries keep their label.
      </div>
      {[['in','Receipts (money in)','var(--green)'],['out','Payments (money out)','var(--red)']].map(([side,label,col])=>(
        <div key={side} style={{marginBottom:14}}>
          <div className="form-label" style={{color:col,marginBottom:6}}>{label}</div>
          {types.filter(t=>t.direction===side).length===0&&<div className="dim" style={{fontSize:12}}>No types.</div>}
          {types.filter(t=>t.direction===side).map(t=>(
            <div key={t.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'6px 0',borderBottom:'1px solid var(--border)'}}>
              <span style={{fontSize:13}}>{t.name}</span>
              <button className="btn btn-red btn-sm" onClick={()=>delType(t)}>✕</button>
            </div>
          ))}
        </div>
      ))}
    </div>

    {msg&&<div style={{marginTop:14,fontSize:12,color:'var(--green)'}}>{msg}</div>}
  </div>);
}

function Reconciliation(){
  const now=new Date();
  const [month,setMonth]=useState(now.getMonth()+1);
  const [year,setYear]=useState(now.getFullYear());
  const [data,setData]=useState(null);
  const [loading,setLoading]=useState(false);
  const [finishedProducts,setFinishedProducts]=useState([]);

  useEffect(()=>{
    sb.from('product_master').select('*').eq('is_raw_material',false).eq('is_active',true).then(({data})=>setFinishedProducts(data||[]));
  },[]);

  const generate=async()=>{
    setLoading(true);
    const ms=String(month).padStart(2,'0');
    const start=`${year}-${ms}-01`;
    const endDt=new Date(year,month,0);
    const end=`${year}-${ms}-${String(endDt.getDate()).padStart(2,'0')}`;
    const [{data:prod},{data:disp},{data:wheat}]=await Promise.all([
      sb.from('daily_production_log').select('*, product:product_id(*)').gte('date',start).lte('date',end),
      sb.from('supplyco_dispatches').select('*, product:product_id(*)').gte('date',start).lte('date',end),
      sb.from('fci_inwards').select('*, material:material_id(*)').gte('date',start).lte('date',end),
    ]);

    const schemes=Array.from(new Set([...(prod||[]).map(p=>schemeFromName(p.product?.product_name)),...(disp||[]).map(d=>d.scheme)].filter(Boolean)));
    const bySchemeStats=schemes.map(scheme=>{
      const prodRows=(prod||[]).filter(p=>schemeFromName(p.product?.product_name)===scheme);
      const prodBags=prodRows.reduce((s,r)=>s+Number(r.production_bags),0);
      const dispRows=(disp||[]).filter(d=>d.scheme===scheme);
      const dispBags=dispRows.reduce((s,r)=>s+Number(r.qty_bags),0);
      const productName=prodRows[0]?.product?.product_name||dispRows[0]?.product?.product_name||scheme;
      return{scheme,productName,prodBags,dispBags,balanceBags:prodBags-dispBags};
    });

    const wheatRec=(wheat||[]).reduce((s,r)=>s+Number(r.received_kg),0);

    setData({bySchemeStats,wheatRec});
    setLoading(false);
  };

  const monthName=new Date(year,month-1,1).toLocaleString('en-IN',{month:'long',year:'numeric'});

  return(<div className="page">
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:24,flexWrap:'wrap',gap:12}}>
      <div className="page-header" style={{marginBottom:0}}>
        <div className="page-label">Compliance</div>
        <div className="page-title">Monthly reconciliation</div>
      </div>
      <div style={{display:'flex',gap:8,alignItems:'flex-end',flexWrap:'wrap'}}>
        <select style={{width:130}} value={month} onChange={e=>setMonth(Number(e.target.value))}>
          {[...Array(12)].map((_,i)=><option key={i+1} value={i+1}>{new Date(2000,i,1).toLocaleString('en-IN',{month:'long'})}</option>)}
        </select>
        <select style={{width:90}} value={year} onChange={e=>setYear(Number(e.target.value))}>{[2024,2025,2026,2027].map(y=><option key={y}>{y}</option>)}</select>
        <button className="btn btn-blue" onClick={generate} disabled={loading}>{loading?'Calculating…':'Generate'}</button>
      </div>
    </div>

    {!data&&<div className="card" style={{textAlign:'center',padding:40,color:'var(--muted)'}}>Select month and year, then click Generate.</div>}

    {data&&(<>
      <div style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--muted)',marginBottom:16}}>RECONCILIATION — {monthName.toUpperCase()}</div>
      <div className="card" style={{marginBottom:16,borderLeft:'3px solid var(--amber)'}}>
        <div className="section-label">Wheat received this month</div>
        <div style={{fontSize:24,fontWeight:600,color:'var(--blue)'}}>{fmtMT(data.wheatRec)}</div>
      </div>
      {data.bySchemeStats.map(s=>(
        <div key={s.scheme} className="card" style={{marginBottom:14,borderLeft:'3px solid var(--blue)'}}>
          <div style={{display:'flex',justifyContent:'space-between',flexWrap:'wrap',gap:8}}>
            <div className="section-label" style={{marginBottom:0}}>{s.scheme} — {s.productName}</div>
            <div style={{display:'flex',gap:10,fontFamily:'var(--mono)',fontSize:12}}>
              <span>Produced: {fmt(s.prodBags)} bags</span><span>·</span>
              <span style={{color:'var(--green)'}}>Dispatched: {fmt(s.dispBags)} bags</span><span>·</span>
              <span style={{color:s.balanceBags>0?'var(--red)':'var(--green)'}}>Balance: {fmt(s.balanceBags)}</span>
            </div>
          </div>
        </div>
      ))}
      {data.bySchemeStats.length===0&&<Empty msg="No scheme activity this month."/>}
    </>)}
  </div>);
}

function ActivityLog(){

  useEffect(()=>{
    sb.from('activity_log').select('*').order('created_at',{ascending:false}).limit(500).then(({data})=>{setLogs(data||[]);setLoading(false);});

  if(loading) return <Loading/>;
  const sections=['All',...Array.from(new Set(logs.map(l=>l.section)))];
  const filtered=filterSection==='All'?logs:logs.filter(l=>l.section===filterSection);
  const actionCol=(a)=>a==='create'?'var(--green)':a==='delete'?'var(--red)':'var(--amber)';

  return(<div className="page">

      <thead><tr><th>Time</th><th>User</th><th>Section</th><th>Action</th><th>Details</th></tr></thead>

          <td className="dim">{l.user_email}</td>

    </table></TableWrap>
  </div>);
}

function Dashboard({name}){
  const [products,setProducts]=useState([]);
  const [currentStock,setCurrentStock]=useState([]);
  const [prod,setProd]=useState([]);
  const [disp,setDisp]=useState([]);
  const [ledger,setLedger]=useState([]);
  const [storeItems,setStoreItems]=useState([]);
  const [loading,setLoading]=useState(true);

  useEffect(()=>{
    Promise.all([
      sb.from('product_master').select('*').eq('is_active',true),
      sb.from('current_stock').select('*'),
      sb.from('daily_production_log').select('*, product:product_id(*)').gte('date',monthStart),
      sb.from('supplyco_dispatches').select('*').gte('date',monthStart),
      sb.from('daily_ledger').select('*').gte('date',monthStart),
      sb.from('store_stock').select('*'),
    ]).then(([{data:p},{data:cs},{data:pr},{data:d},{data:l},{data:st}])=>{
      setProducts(p||[]); setCurrentStock(cs||[]); setProd(pr||[]); setDisp(d||[]); setLedger(l||[]);
      setStoreItems((st||[]).filter(x=>x.min_qty>0 && x.qty<x.min_qty));
      setLoading(false);
    });
  },[]);

  if(loading) return <Loading/>;

  const prodMT=prod.reduce((s,r)=>s+(Number(r.production_bags)*packSizeOf(r.product)),0)/1000;
  const dispBags=disp.reduce((s,r)=>s+Number(r.qty_bags),0);
  const cashIn=ledger.filter(r=>r.direction==='in').reduce((s,r)=>s+Number(r.amount),0);
  const cashOut=ledger.filter(r=>r.direction!=='in').reduce((s,r)=>s+Number(r.amount),0);

  const stockWithLevels=products.filter(p=>!p.is_raw_material).map(p=>{
    const row=currentStock.find(r=>r.product_id===p.id);
    return{product:p,qty:row?.qty_bags||0};
  });
  const stockAlerts=stockWithLevels.filter(r=>r.product.min_stock_alert>0 && r.product.max_stock_alert>0 && r.qty>r.product.min_stock_alert && r.qty<r.product.max_stock_alert);

  return(<div className="page">
    <div className="page-header">
      <div className="page-label">Mill Operations · {today}</div>
      <div className="page-title">{(()=>{const h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening';})()}{name?`, ${name}`:''} 👋</div>
      <div style={{fontSize:13,color:'var(--muted)',marginTop:2}}>Here's your mill today.</div>
    </div>

    <div className="stat-grid">
      <StatCard label="Produced this month" value={prodMT.toFixed(3)+' MT'} sub="all products" col="var(--amber)"/>
      <StatCard label="Dispatched this month" value={fmt(dispBags)+' bags'} sub="to Supplyco" col="var(--green)"/>
      {allow('ledger.view')&&<StatCard label="Cash in (month)" value={'₹'+fmt(cashIn)} col="var(--green)"/>}
      {allow('ledger.view')&&<StatCard label="Cash out (month)" value={'₹'+fmt(cashOut)} col="var(--red)"/>}
    </div>

    <div style={{marginBottom:24}}>
      <div className="section-label">Alerts</div>
      <LiftingDashboardAlerts/>
      <WoaDashboardAlerts/>
      {stockAlerts.map(r=>(
        <Alert key={r.product.id} type="amber" icon="⚠" title={`${r.product.product_name} — ${fmt(r.qty)} bags, within watch range`} sub={`Between min (${fmt(r.product.min_stock_alert)}) and max (${fmt(r.product.max_stock_alert)})`}/>
      ))}
      {storeItems.map(r=>(
        <Alert key={r.id} type="amber" icon="⚠" title={`${r.item_name} — only ${r.qty} ${r.unit} left`} sub={`Minimum: ${r.min_qty} ${r.unit}`}/>
      ))}
      {stockAlerts.length===0&&storeItems.length===0&&<Alert type="green" icon="✓" title="No urgent alerts today."/>}
    </div>

    <div className="card">
      <div className="section-label">Finished stock position</div>
      {stockWithLevels.filter(r=>r.qty>0).map(r=>{
        const max=Math.max(...stockWithLevels.map(x=>x.qty),1);
        const col=r.product.min_stock_alert>0&&r.qty<r.product.min_stock_alert?'var(--amber)':'var(--green)';
        return(<div key={r.product.id} style={{marginBottom:12}}>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:13}}>
            <span>{r.product.product_name}</span><span style={{color:col,fontWeight:600}}>{fmt(r.qty)} bags</span>
          </div>
          <div style={{height:4,background:'var(--border)',borderRadius:2,marginTop:4}}>
            <div style={{height:4,width:Math.min(100,(r.qty/max)*100)+'%',background:col,borderRadius:2}}/>
          </div>
        </div>);
      })}
      {stockWithLevels.filter(r=>r.qty>0).length===0&&<Empty msg="No finished-goods stock yet."/>}
    </div>
  </div>);
}

// WORK ORDER DEADLINES — settings, calculations, alerts
// ══════════════════════════════════════════════════════════
const WOA_SETTING_KEY='workorder_alert_settings';
const WOA_DEFAULTS={
  enabled:true,
  default_deadline_days:30, require_deadline:false,
  remind_days:10, manager_days:4, director_days:3,
  person_id:'', manager_id:'', notify_director:true,
  extra_ids:[], extra_from_stage:2,
  min_balance_pkts:0, tolerance_pct:1,
  alert_overdue:true, overdue_to_director:true,
  pace_enabled:true, pace_lag_pct:15,
  buffer_days:1, off_days:[0],
  bags_per_truck:200, daily_capacity_bags:0, risk_alert:true,
  shortfall_alert:true, shortfall_days:7, production_capacity_bags:0,
  show_dashboard:true, show_tasks:true
};
const WOA_STAGE_LABEL=['No alert','Person in charge alerted','Escalated to manager','Escalated to Director'];

async function loadWoaSettings(){
  const {data}=await sb.from('erp_settings').select('value').eq('key',WOA_SETTING_KEY).maybeSingle();
  let saved={};
  try{ saved=data&&data.value?JSON.parse(data.value):{}; }catch(e){ saved={}; }
  return {...WOA_DEFAULTS,...saved};
}

// Raw facts for every work order that has a deadline: bags dispatched, packets per bag, finished stock.
async function loadWoaBase(){
  const {data:w,error}=await sb.from('work_orders').select('*');
  if(error) throw new Error(error.message);
  const wos=(w||[]).filter(x=>x.deadline);
  if(!wos.length) return [];
  const minDate=wos.map(x=>x.work_order_date).filter(Boolean).sort()[0]||'2000-01-01';
  const [disp,{data:fp},{data:cs}]=await Promise.all([
    fetchAllRows((a,b)=>sb.from('supplyco_dispatches').select('id,work_order_id,qty_bags').gte('date',minDate).order('id').range(a,b)),
    sb.from('product_master').select('*').eq('is_raw_material',false).eq('is_active',true),
    sb.from('current_stock').select('*'),
  ]);
  const sent={};
  disp.forEach(d=>{ if(d.work_order_id) sent[d.work_order_id]=(sent[d.work_order_id]||0)+Number(d.qty_bags); });
  return wos.map(wo=>{
    const sch=String(wo.scheme||'').toUpperCase();
    const prod=sch?(fp||[]).find(p=>p.product_name.toUpperCase().includes(sch)):null;
    const stockRow=prod?(cs||[]).find(r=>r.product_id===prod.id):null;
    return {wo,ctx:{sentBags:sent[wo.id]||0,ppb:prod?.packets_per_bag||1,stockBags:Number(stockRow?.qty_bags)||0,productName:prod?.product_name||''}};
  });
}

// Everything is worked out live from the order + settings. Nothing about alert state is stored.
const woaInfo=(wo,S,ctx)=>{
  const ppb=Number(ctx.ppb)||1;
  const total=Number(wo.total_pkts)||0;
  const sentPkts=(Number(ctx.sentBags)||0)*ppb;
  const balPkts=Math.max(0,total-sentPkts);
  const balBags=balPkts/ppb;
  const stockBags=Number(ctx.stockBags)||0;
  const shortBags=Math.max(0,balBags-stockBags);
  const info={total,sentPkts,balPkts,balBags,ppb,stockBags,shortBags,pct:total>0?sentPkts/total*100:0,daysLeft:null,stage:0,reasons:[],complete:false,bagsPerDay:0,pktsPerDay:0,trucksPerDay:0,prodPerDay:0,workDays:0,atRisk:false,prodRisk:false};
  if(total>0&&balPkts<=total*(Number(S.tolerance_pct)||0)/100){ info.complete=true; return info; }
  if(total<=0||!wo.deadline) return info;
  const daysLeft=daysUntil(wo.deadline);
  info.daysLeft=daysLeft;
  const target=licShift(wo.deadline,-(Number(S.buffer_days)||0));
  info.workDays=liftWorkingDays(today,target,S.off_days);
  const wd=Math.max(1,info.workDays);
  info.bagsPerDay=balBags/wd;
  info.pktsPerDay=balPkts/wd;
  info.trucksPerDay=Number(S.bags_per_truck)>0?Math.ceil(info.bagsPerDay/Number(S.bags_per_truck)):0;
  info.prodPerDay=shortBags/wd;
  if(Number(S.daily_capacity_bags)>0&&info.bagsPerDay>Number(S.daily_capacity_bags)) info.atRisk=true;
  if(Number(S.production_capacity_bags)>0&&info.prodPerDay>Number(S.production_capacity_bags)) info.prodRisk=true;
  if(!S.enabled) return info;
  if(balPkts<(Number(S.min_balance_pkts)||0)) return info;

  const r=Number(S.remind_days)||0, m=Number(S.manager_days)||0, d=Number(S.director_days)||0;
  let stage=0;
  if(daysLeft<=r){ stage=1; info.reasons.push(`Within ${r} days of the deadline`); }
  if(daysLeft<=r-m) stage=2;
  if(daysLeft<=r-m-d) stage=3;
  if(daysLeft<0){
    if(S.alert_overdue){ stage=Math.max(stage,S.overdue_to_director?3:2); info.reasons.push('Deadline has passed'); }
    else stage=0;
  }
  if(S.pace_enabled&&wo.work_order_date&&wo.deadline>wo.work_order_date&&daysLeft>=0){
    const totalDays=daysUntil(wo.deadline)-daysUntil(wo.work_order_date);
    const elapsed=-daysUntil(wo.work_order_date);
    const timePct=totalDays>0?Math.min(100,Math.max(0,elapsed/totalDays*100)):0;
    if(info.pct<timePct-(Number(S.pace_lag_pct)||0)){
      stage=Math.max(stage,1);
      info.reasons.push(`Behind pace: ${info.pct.toFixed(0)}% dispatched, ${timePct.toFixed(0)}% of time used`);
    }
  }
  if(S.risk_alert&&info.atRisk&&daysLeft>=0){
    stage=Math.max(stage,1);
    info.reasons.push(`Needs ${fmt(Math.ceil(info.bagsPerDay))} bags/day dispatched, above capacity`);
  }
  if(S.shortfall_alert&&shortBags>0&&daysLeft>=0&&daysLeft<=(Number(S.shortfall_days)||0)){
    stage=Math.max(stage,1);
    info.reasons.push(`Stock has ${fmt(stockBags)} of ${fmt(Math.ceil(balBags))} pending bags — ${fmt(Math.ceil(shortBags))} bags still to produce`);
  }
  if(S.shortfall_alert&&info.prodRisk&&daysLeft>=0){
    stage=Math.max(stage,1);
    info.reasons.push(`Needs ${fmt(Math.ceil(info.prodPerDay))} bags/day produced, above production capacity`);
  }
  info.stage=stage;
  return info;
};

const woaBoard=(base,S)=>base.map(b=>({wo:b.wo,...woaInfo(b.wo,S,b.ctx)}));

// Which work orders should this person see in My Tasks?
const woaAlertsFor=(board,S,employeeId,role)=>{
  if(!S.enabled||!S.show_tasks) return [];
  const me=(employeeId===null||employeeId===undefined)?'':String(employeeId);
  const extras=(S.extra_ids||[]).map(String);
  const out=[];
  board.forEach(x=>{
    if(x.stage<1) return;
    let as=null;
    if(me&&String(S.person_id||'')===me) as='assignee';
    else if(x.stage>=2&&me&&String(S.manager_id||'')===me) as='manager';
    else if(me&&extras.includes(me)&&x.stage>=Number(S.extra_from_stage||1)) as='extra';
    else if(x.stage>=3&&S.notify_director&&role==='director') as='director';
    if(as) out.push({...x,as});
  });
  return out.sort((a,b)=>a.daysLeft-b.daysLeft);
};

// Shown at the top of My Tasks.
function WoaAlerts({employeeId,role}){
  const [list,setList]=useState([]);
  useEffect(()=>{(async()=>{
    try{
      const S=await loadWoaSettings();
      if(!S.enabled||!S.show_tasks) return;
      const base=await loadWoaBase();
      setList(woaAlertsFor(woaBoard(base,S),S,employeeId,role));
    }catch(e){ console.error('Work order alerts failed:',e.message); }
  })();},[employeeId,role]);
  if(list.length===0) return null;
  return(<div style={{marginBottom:24}}>
    <div className="section-label">Work orders needing action ({list.length})</div>
    {list.map(a=>{
      const wo=a.wo; const col=LIFT_STAGE_COL[a.stage];
      const who=a.as==='assignee'?'You are the person in charge of dispatching this work order.'
        :a.as==='manager'?'Escalated to you as manager — the person in charge has not finished dispatching.'
        :a.as==='extra'?'You are on the extra notification list for work orders.'
        :'Escalated to the Director.';
      return(<div key={wo.id} className="card" style={{marginBottom:12,borderLeft:`4px solid ${col}`}}>
        <div style={{fontSize:15,fontWeight:600}}>📊 Dispatch work order {wo.work_order_no}</div>
        <div style={{fontSize:12,color:'var(--muted)',marginTop:2}}>{[wo.scheme,wo.batch_no&&('Batch '+wo.batch_no)].filter(Boolean).join(' · ')}</div>
        <div style={{fontSize:13,marginTop:6,color:col,fontWeight:500}}>{fmt(a.balPkts)} packets ({fmt(Math.ceil(a.balBags))} bags) still to dispatch · {licDaysText(a.daysLeft)} (deadline {wo.deadline})</div>
        <div style={{fontSize:12,marginTop:4}}>Needs about {fmt(Math.ceil(a.bagsPerDay))} bags/day{a.trucksPerDay?` (${a.trucksPerDay} truck${a.trucksPerDay===1?'':'s'}/day)`:''} over {a.workDays} working day{a.workDays===1?'':'s'}.</div>
        {a.reasons.length>0&&<div style={{fontSize:12,marginTop:4,color:'var(--muted)'}}>{a.reasons.join(' · ')}</div>}

      </div>);
    })}
  </div>);
}

    logActivity('Settings','update','Work order alert settings updated');

      <div className="dim" style={{fontSize:12}}>The default is pre-filled when a new work order form is opened. Set 0 for no pre-fill. The deadline can still be changed on each work order.</div>
    </div>

    <div className="card" style={{marginBottom:16}}>
      <div className="section-label">2. When to alert (days before the deadline)</div>
      <div className="form-grid">
        {num('remind_days','Alert person in charge (days before deadline)',{min:1})}
        {num('manager_days','Escalate to manager after (more days)',{min:0})}
        {num('director_days','Escalate to Director after (more days)',{min:0})}
      </div>
      <div style={{marginTop:10,fontSize:12,color:'var(--blue)'}}>

        {num('bags_per_truck','Average bags per truck',{min:0})}
        {num('daily_capacity_bags','Maximum you can dispatch per day (bags, 0 = no limit)',{min:0})}
      </div>
      <div style={{marginTop:12}}>
        <div className="form-label" style={{marginBottom:6}}>Weekly off days (not counted as dispatch days)</div>
        <div style={{display:'flex',gap:14,flexWrap:'wrap'}}>
          {LIFT_WEEKDAYS.map((n,i)=>(<label key={i} style={{display:'flex',alignItems:'center',gap:6,fontSize:13}}>
            <input type="checkbox" checked={(S.off_days||[]).includes(i)} onChange={()=>toggleOff(i)}/>{n}
          </label>))}
        </div>
      </div>
      <div style={{marginTop:12}}>{chk('risk_alert','Alert the person in charge early if the required daily dispatch is above your daily capacity')}</div>
    </div>

    <div className="card" style={{marginBottom:16}}>
      <div className="section-label">6. Production and stock cover</div>
      <div style={{marginBottom:10}}>{chk('shortfall_alert','Alert when finished stock cannot cover the pending bags (and when the daily production needed is above capacity)')}</div>
      <div className="form-grid">
        {num('shortfall_days','Start the stock-shortfall alert when this many days are left',{min:0})}
        {num('production_capacity_bags','Maximum you can produce per day for this scheme (bags, 0 = no limit)',{min:0})}
      </div>
      <div className="dim" style={{fontSize:12,marginTop:8}}>Pending bags = pending packets ÷ packets per bag. Stock cover compares them with finished stock of the product for that scheme; the gap is what still has to be produced.</div>
    </div>

    <div className="card" style={{marginBottom:16}}>
      <div className="section-label">7. Where alerts appear</div>
      {chk('show_tasks','In My Tasks and the badge on the sidebar')}
      {chk('show_dashboard','On the Dashboard alerts list (visible to everyone who opens the Dashboard)')}
    </div>

    <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:24,flexWrap:'wrap'}}>
      <button className="btn btn-green" onClick={save} disabled={saving}>{saving?'Saving…':'Save settings'}</button>
      <button className="btn btn-ghost" onClick={reset}>Reset to defaults</button>
      {msg&&<span style={{fontSize:12,color:'var(--green)'}}>{msg}</span>}
    </div>

    <div className="section-label">Live preview — your work orders with a deadline under these settings (unsaved changes included)</div>
    <RTable head={['Work order','Scheme','Pending (pkts)','Deadline','Time left','Needed','Stock cover','Alert stage','Why']} rows={previewRows} empty="No open work orders with a deadline yet."/>
  </div>);
}

// TIMELINE CALENDAR
// ══════════════════════════════════════════════════════════
const TL_TYPES={
  lifting:{label:'Lifting orders',icon:'🚛',col:'var(--amber)',page:'lifting-orders'},
  workorder:{label:'Work orders',icon:'📊',col:'var(--blue)',page:'work-order-tracker'},
  license:{label:'Licenses',icon:'📑',col:'var(--purple)',page:'licenses'},
  job:{label:'Job cards',icon:'🛠️',col:'var(--green)',page:'job-cards'},
};
const tlDaysText=(it)=>it.done?'Complete':it.daysLeft<0?`Overdue by ${-it.daysLeft} day${-it.daysLeft===1?'':'s'}`:it.daysLeft===0?'Due today':`${it.daysLeft} day${it.daysLeft===1?'':'s'} left`;
const tlColor=(it)=>it.done?'var(--green)':it.daysLeft<0?'var(--red)':it.stage>=1?LIFT_STAGE_COL[it.stage]:TL_TYPES[it.type].col;
const tlKey=(y,m,d)=>`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

async function loadTimelineItems(){
  const [LS,WS]=await Promise.all([loadLiftSettings(),loadWoaSettings()]);
  const [lo,lic,jobs]=await Promise.all([
    sb.from('lifting_orders').select('*, material:material_id(*)').then(repMust),
    sb.from('licenses').select('*').eq('status','Active').then(repMust),
    sb.from('job_cards').select('*').neq('status','Done').then(repMust),
  ]);
  const items=[];

  lo.forEach(o=>{
    if(!o.deadline) return;
    const x=liftInfo(o,LS);
    items.push({key:'L'+o.id,type:'lifting',date:o.deadline,daysLeft:daysUntil(o.deadline),stage:x.stage,done:x.complete,
      title:`Lifting ${o.order_no}`,
      sub:[o.material?.product_name,o.scheme].filter(Boolean).join(' · ')+(x.complete?' · fully lifted':` · ${fmtMT(x.balance)} still to lift`),
      extra:x.complete?'':`Needs ${fmtMT(x.reqPerDay)}/day${x.trucksPerDay?` · ${x.trucksPerDay} truck${x.trucksPerDay===1?'':'s'}/day`:''}`});
  });

  let board=[];
  try{ board=woaBoard(await loadWoaBase(),WS); }catch(e){ console.error('Timeline: work orders failed:',e.message); }
  board.forEach(x=>{
    items.push({key:'W'+x.wo.id,type:'workorder',date:x.wo.deadline,daysLeft:daysUntil(x.wo.deadline),stage:x.stage,done:x.complete,
      title:`Work order ${x.wo.work_order_no}`,
      sub:[x.wo.scheme,x.wo.batch_no&&('Batch '+x.wo.batch_no)].filter(Boolean).join(' · ')+(x.complete?' · fully dispatched':` · ${fmt(x.balPkts)} packets pending`),
      extra:x.complete?'':`Needs ${fmt(Math.ceil(x.bagsPerDay))} bags/day${x.shortBags>0?` · ${fmt(Math.ceil(x.shortBags))} bags still to produce`:''}`});
  });

  lic.forEach(l=>{
    if(!l.expiry_date) return;
    const x=licInfo(l);
    items.push({key:'C'+l.id,type:'license',date:l.expiry_date,daysLeft:x.daysLeft,stage:x.stage,done:false,
      title:`Renew ${l.name}`,
      sub:[l.category,l.license_no,l.assigned_to_name&&('In charge: '+l.assigned_to_name)].filter(Boolean).join(' · '),extra:''});
  });

  jobs.forEach(j=>{
    if(!j.deadline) return;
    const dl=daysUntil(j.deadline);
    items.push({key:'J'+j.id,type:'job',date:j.deadline,daysLeft:dl,stage:dl<=3?1:0,done:false,
      title:j.title,
      sub:[j.priority,j.status,j.assigned_to&&('Assigned: '+j.assigned_to),j.location].filter(Boolean).join(' · '),extra:''});
  });

  return {items,off:LS.off_days||[]};
}

function TimelineCalendar({onGo}){
  const [ty,tm]=today.split('-').map(Number);
  const [cur,setCur]=useState({y:ty,m:tm});
  const [view,setView]=useState('calendar');
  const [items,setItems]=useState([]);
  const [off,setOff]=useState([]);
  const [loading,setLoading]=useState(true);
  const [err,setErr]=useState('');
  const [sel,setSel]=useState(today);
  const [show,setShow]=useState({lifting:true,workorder:true,license:true,job:true,done:false});

  const load=useCallback(async()=>{
    setLoading(true); setErr('');
    try{ const r=await loadTimelineItems(); setItems(r.items); setOff(r.off); }
    catch(e){ setErr(e.message||String(e)); }
    setLoading(false);
  },[]);
  useEffect(()=>{load();},[load]);

  const move=(n)=>setCur(p=>{ let m=p.m+n,y=p.y; if(m<1){m=12;y--;} if(m>12){m=1;y++;} return {y,m}; });
  const goToday=()=>{ setCur({y:ty,m:tm}); setSel(today); };

  if(loading) return <Loading/>;

  const vis=items.filter(i=>show[i.type]&&(show.done||!i.done));
  const byDate={};
  vis.forEach(i=>{ (byDate[i.date]=byDate[i.date]||[]).push(i); });
  const open=vis.filter(i=>!i.done);
  const overdueList=open.filter(i=>i.daysLeft<0).sort((a,b)=>a.date.localeCompare(b.date));
  const upList=open.filter(i=>i.daysLeft>=0).sort((a,b)=>a.date.localeCompare(b.date));
  const upDates=Array.from(new Set(upList.map(i=>i.date)));
  const wk=upList.filter(i=>i.daysLeft<=7).length;
  const mo=upList.filter(i=>i.daysLeft<=30).length;

  const first=new Date(cur.y,cur.m-1,1).getDay();
  const daysInMonth=new Date(cur.y,cur.m,0).getDate();
  const cells=[];
  for(let i=0;i<first;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(d);
  while(cells.length%7!==0) cells.push(null);

  const row=(it,showDate)=>{
    const c=tlColor(it); const T=TL_TYPES[it.type];
    return(<div key={it.key} style={{display:'flex',justifyContent:'space-between',gap:12,flexWrap:'wrap',padding:'10px 12px',marginBottom:8,border:'1px solid var(--border)',borderLeft:`4px solid ${c}`,borderRadius:6,background:'var(--surface)'}}>
      <div style={{flex:1,minWidth:200}}>
        <div style={{fontWeight:600,fontSize:14}}>{T.icon} {it.title}</div>
        <div className="dim" style={{fontSize:12,marginTop:2}}>{it.sub}</div>
        {it.extra&&<div style={{fontSize:12,marginTop:2}}>{it.extra}</div>}
      </div>
      <div style={{textAlign:'right'}}>
        <span className="badge" style={{background:`color-mix(in srgb, ${c} 18%, transparent)`,color:c}}>{tlDaysText(it)}</span>
        {showDate&&<div className="mono dim" style={{fontSize:11,marginTop:4}}>{it.date}</div>}
        <div style={{marginTop:4}}><button className="btn btn-ghost btn-sm" onClick={()=>onGo&&onGo(T.page)}>Open ↗</button></div>
      </div>
    </div>);
  };

  return(<div className="page">
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:24,flexWrap:'wrap',gap:12}}>
      <div className="page-header" style={{marginBottom:0}}>
        <div className="page-label">Planning</div>
        <div className="page-title">Timeline calendar</div>
      </div>
      <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
        <button className={`btn btn-sm ${view==='calendar'?'btn-amber':'btn-ghost'}`} onClick={()=>setView('calendar')}>Calendar</button>
        <button className={`btn btn-sm ${view==='agenda'?'btn-amber':'btn-ghost'}`} onClick={()=>setView('agenda')}>Agenda list</button>
        <button className="btn btn-ghost btn-sm" onClick={load}>↻ Refresh</button>
      </div>
    </div>

    {err&&<Alert type="red" icon="⚠" title="Could not load the calendar" sub={err}/>}

    <div className="stat-grid">
      <StatCard label="Overdue" value={overdueList.length} col={overdueList.length>0?'var(--red)':'var(--green)'}/>
      <StatCard label="Due in 7 days" value={wk} col={wk>0?'var(--amber)':'var(--green)'}/>
      <StatCard label="Due in 30 days" value={mo} col="var(--blue)"/>
      <StatCard label="Open items" value={open.length} col="var(--purple)"/>
    </div>

    <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:16,alignItems:'center'}}>
      {Object.entries(TL_TYPES).map(([k,T])=>(
        <button key={k} className={`btn btn-sm ${show[k]?'btn-amber':'btn-ghost'}`} onClick={()=>setShow(p=>({...p,[k]:!p[k]}))}>{T.icon} {T.label}</button>
      ))}
      <button className={`btn btn-sm ${show.done?'btn-amber':'btn-ghost'}`} onClick={()=>setShow(p=>({...p,done:!p.done}))}>✓ Show completed</button>
    </div>

    {view==='calendar'&&(<>
      <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:12,flexWrap:'wrap'}}>
        <button className="btn btn-ghost btn-sm" onClick={()=>move(-1)}>◀</button>
        <div style={{fontSize:16,fontWeight:600,minWidth:160,textAlign:'center'}}>{MONTH_NAMES[cur.m-1]} {cur.y}</div>
        <button className="btn btn-ghost btn-sm" onClick={()=>move(1)}>▶</button>
        <button className="btn btn-ghost btn-sm" onClick={goToday}>Today</button>
      </div>

      <div className="card" style={{padding:0,overflow:'hidden',marginBottom:16}}>
        <div style={{display:'grid',gridTemplateColumns:'repeat(7,minmax(0,1fr))',gap:1,background:'var(--border)'}}>
          {LIFT_WEEKDAYS.map(n=>(
            <div key={n} style={{background:'var(--surface2)',padding:'6px 4px',textAlign:'center',fontFamily:'var(--mono)',fontSize:10,letterSpacing:'.08em',color:'var(--muted)',textTransform:'uppercase'}}>{n}</div>
          ))}
          {cells.map((d,i)=>{
            if(d===null) return <div key={'b'+i} style={{background:'var(--surface2)',minHeight:92}}/>;
            const key=tlKey(cur.y,cur.m,d);
            const list=byDate[key]||[];
            const isToday=key===today, isSel=key===sel;
            const isOff=off.includes(new Date(cur.y,cur.m-1,d).getDay());
            return(<div key={key} onClick={()=>setSel(key)} style={{background:isOff?'var(--surface2)':'var(--surface)',minHeight:92,padding:4,cursor:'pointer',outline:isSel?'2px solid var(--blue)':'none',outlineOffset:-2,overflow:'hidden'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:3}}>
                <span style={isToday?{background:'var(--amber)',color:'#fff',borderRadius:10,padding:'0 6px',fontSize:12,fontWeight:700}:{fontSize:12,color:'var(--muted)'}}>{d}</span>
                {list.length>0&&<span className="mono" style={{fontSize:10,color:'var(--muted)'}}>{list.length}</span>}
              </div>
              {list.slice(0,3).map(it=>{
                const c=tlColor(it), T=TL_TYPES[it.type];
                return <div key={it.key} title={`${it.title} — ${tlDaysText(it)}`} style={{fontSize:10,lineHeight:'15px',padding:'0 4px',marginBottom:2,borderRadius:3,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',background:`color-mix(in srgb, ${T.col} 14%, transparent)`,borderLeft:`3px solid ${c}`,opacity:it.done?0.6:1}}>{T.icon} {it.title}</div>;
              })}
              {list.length>3&&<div style={{fontSize:10,color:'var(--muted)'}}>+{list.length-3} more</div>}
            </div>);
          })}
        </div>
      </div>

      <div className="section-label">{cashDayLabel(sel)}{sel===today?' · today':''}</div>
      {(byDate[sel]||[]).length===0
        ?<div className="card"><Empty msg="Nothing due on this day."/></div>
        :(byDate[sel]||[]).map(it=>row(it,false))}
    </>)}

    {view==='agenda'&&(<>
      {overdueList.length>0&&(<>
        <div className="section-label" style={{color:'var(--red)'}}>Overdue ({overdueList.length})</div>
        {overdueList.map(it=>row(it,true))}
      </>)}
      <div className="section-label" style={{marginTop:16}}>Upcoming ({upList.length})</div>
      {upList.length===0&&<div className="card"><Empty msg="Nothing upcoming."/></div>}
      {upDates.map(dt=>(<div key={dt}>
        <div className="mono" style={{fontSize:12,color:'var(--amber)',margin:'10px 0 6px'}}>{cashDayLabel(dt)}{dt===today?' · today':''}</div>
        {upList.filter(i=>i.date===dt).map(it=>row(it,false))}
      </div>))}
    </>)}

    <div className="dim" style={{fontSize:12,marginTop:20,maxWidth:760}}>
      Left bar colour: green = complete, red = overdue, amber/orange = an alert is active, otherwise the item's own colour. Shaded days are the weekly off days from Settings → Lifting Alerts. Items without a deadline are not shown.
    </div>
  </div>);
}
